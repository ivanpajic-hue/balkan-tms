const kljucTeksta = s => bezKvacica(s).replace(/\(.*?\)/g, ' ').replace(/[^a-z0-9]+/g, ' ').trim();
const kljucReg = s => String(s || '').toUpperCase().replace(/[\s-]/g, '');
const kljucPib = s => String(s || '').toLowerCase().replace(/\s/g, '');
function uvozDatum(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') { const d = new Date(Math.round((v - 25569) * 864e5)); return Number.isNaN(d.getTime()) ? undefined : d.toISOString().slice(0, 10); }
  if (v instanceof Date) return Number.isNaN(v.getTime()) ? undefined : `${v.getFullYear()}-${String(v.getMonth() + 1).padStart(2, '0')}-${String(v.getDate()).padStart(2, '0')}`;
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})\.?$/))) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  return undefined;
}
function uvozBroj(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return v;
  let s = String(v).trim().replace(/\s/g, '').replace(/[€%]|eur|rsd/gi, '');
  if (s.includes(',') && s.includes('.')) s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else s = s.replace(',', '.');

  return Number.isFinite(n) ? n : undefined;
}
const uvozTekst = v => (v === null || v === undefined ? null : String(v).trim() || null);
const uvozDa = v => /^(da|d|x|1|true|yes)$/i.test(String(v ?? '').trim());
function sifIzUvoza(grupa, v) {
  if (v === null || v === undefined || String(v).trim() === '') return null;
  const k = kljucTeksta(v);
  return (S.sif[grupa] || []).find(x => kljucTeksta(x.kod) === k || kljucTeksta(x.naziv) === k)?.kod ?? undefined;
}
const firmaIzUvoza = v => (v ? S.firme.find(f => kljucTeksta(f.kod) === kljucTeksta(v) || kljucTeksta(f.naziv) === kljucTeksta(v)) : undefined);

// Čitanje radne knjige: list → redovi sa vrednostima po ključevima kolona
function citajUvoz(knjiga) {
  const L = {}, nepoznato = [];
  const listovi = Object.fromEntries(knjiga.SheetNames.map(n => [kljucTeksta(n), n]));
  for (const [kljuc, def] of Object.entries(UVOZ_LISTOVI)) {
    const ime = listovi[kljucTeksta(def.ime)];
    L[kljuc] = [];
    if (!ime) continue;
    const matrica = window.XLSX.utils.sheet_to_json(knjiga.Sheets[ime], { header: 1, raw: true, defval: null, blankrows: false });
    if (!matrica.length) continue;
    const zaglavlje = matrica[0].map(h => kljucTeksta(h));
    const mapa = {};
    for (const [k, naslov] of Object.entries(def.kolone)) {
      const i = zaglavlje.findIndex(h => h && h === kljucTeksta(naslov));
      if (i >= 0) mapa[k] = i;
    }
    zaglavlje.forEach((h, i) => { if (h && !Object.values(mapa).includes(i)) nepoznato.push(`${def.ime}: kolona „${matrica[0][i]}“ nije prepoznata i preskače se`); });
    matrica.slice(1).forEach((red, i) => {
      if (red.some(c => typeof c === 'string' && /^\s*PRIMER/i.test(c))) return;   // red sa primerom
      if (!red.some(c => c !== null && String(c).trim() !== '')) return;
      const v = {};
      for (const [k, idx] of Object.entries(mapa)) v[k] = red[idx];
      L[kljuc].push({ red: i + 2, v });
    });
  }
  return { L, nepoznato };
}

async function obradiUvoz(L, izvrsi, javi = () => {}) {
  const R = Object.fromEntries(Object.keys(UVOZ_LISTOVI).map(k => [k, { redova: L[k].length, novo: 0, postoji: 0, greske: [] }]));
  R.partneriAuto = 0;
  const gr = (k, red, msg) => R[k].greske.push(`${UVOZ_LISTOVI[k].ime}, red ${red}: ${msg}`);
  const [ture, nalozi, ulazni, rokovi] = await Promise.all([Store.lista('ture'), Store.lista('nalozi'), Store.lista('ulazni_racuni'), Store.lista('rokovi')]);
  const plan = { partneri: new Map(), vozila: new Map(), vozaci: new Map(), ture: new Map() };
  const imeVozaca = v => kljucTeksta(`${v.ime} ${v.prezime}`), imeVozacaObrnuto = v => kljucTeksta(`${v.prezime} ${v.ime}`);
  const nadjiPartnera = (naziv, pib) => {
    if (pib) { const p = S.partneri.find(x => x.pib && kljucPib(x.pib) === kljucPib(pib)); if (p) return p.id; }
    if (naziv) { const p = S.partneri.find(x => kljucTeksta(x.naziv) === kljucTeksta(naziv)); if (p) return p.id; }
    const pk = pib ? `pib:${kljucPib(pib)}` : `naz:${kljucTeksta(naziv)}`;
    return plan.partneri.has(pk) ? plan.partneri.get(pk) : (plan.partneri.get(`naz:${kljucTeksta(naziv)}`) ?? null);
  };
  const obezbediPartnera = async (naziv, pib, dodatno = {}) => {
    const id = nadjiPartnera(naziv, pib);
    if (id) return id;
    const pk = pib ? `pib:${kljucPib(pib)}` : `naz:${kljucTeksta(naziv)}`;
    R.partneriAuto++;
    if (!izvrsi) { plan.partneri.set(pk, 'plan'); plan.partneri.set(`naz:${kljucTeksta(naziv)}`, 'plan'); return 'plan'; }
    const p = await Store.dodaj('partneri', { naziv: String(naziv).trim(), pib: pib ? String(pib).trim() : null, tip: 'PRAVNO', ...dodatno });
    S.partneri.push(p); return p.id;
  };
  const datumOk = (k, red, v, naziv) => { const d = uvozDatum(v); if (d === undefined) { gr(k, red, `neispravan datum u koloni „${naziv}“ (${v}); koristite dd.mm.gggg`); return null; } return d; };
  const brojOk = (k, red, v, naziv) => { const n = uvozBroj(v); if (n === undefined) { gr(k, red, `neispravan broj u koloni „${naziv}“ (${v})`); return null; } return n; };
  const sifOk = (k, red, grupa, v, naziv) => { const s = sifIzUvoza(grupa, v); if (s === undefined) { gr(k, red, `nepoznata vrednost „${v}“ u koloni „${naziv}“ (vidi list Šifre)`); return null; } return s; };
  const rokoviOk = (k, v, red) => {
    const pre = R[k].greske.length;

  };
  const dodajRokove = async (entitet, entitetId, v, k, red) => {
    const novi = [];
    for (const [kol, vr] of Object.entries(v)) {
      if (!kol.startsWith('r_') || vr === null || vr === '') continue;
      const d = datumOk(k, red, vr, UVOZ_LISTOVI[k].kolone[kol]); if (!d) continue;
      const vrsta = kol.slice(2);
      if (entitetId !== 'plan' && rokovi.some(r => r.entitet === entitet && r.entitet_id === entitetId && r.vrsta === vrsta)) continue;
      novi.push({ entitet, entitet_id: entitetId, vrsta, datum_isteka: d });
    }
    if (izvrsi && novi.length) { const u = await Store.dodajVise('rokovi', novi); rokovi.push(...u); }
    return novi.length;
  };

  // 1. Partneri
  javi('Partneri…');
  for (const { red, v } of L.partneri) {
    const naziv = uvozTekst(v.naziv);
    if (!naziv) { gr('partneri', red, 'nedostaje naziv'); continue; }
    if (nadjiPartnera(naziv, uvozTekst(v.pib))) { R.partneri.postoji++; continue; }
    const preP = R.partneri.greske.length;
    const rok = brojOk('partneri', red, v.rok, 'Rok plaćanja'), valuta = v.valuta ? sifOk('partneri', red, 'VALUTA', v.valuta, 'Valuta') : null;
    if (R.partneri.greske.length > preP) continue;
    const podaci = { tip: /fiz/i.test(String(v.vrsta || '')) ? 'FIZICKO' : 'PRAVNO', maticni_broj: uvozTekst(v.mb), adresa: uvozTekst(v.adresa), postanski_broj: uvozTekst(v.pb),
      mesto: uvozTekst(v.mesto), drzava: uvozTekst(v.drzava), email: uvozTekst(v.email), email_fakture: uvozTekst(v.email_fakture), telefon: uvozTekst(v.telefon),

    if (rok !== null) podaci.rok_placanja = Math.round(rok);

    try {
      R.vozila.novo++;
      if (!izvrsi) { plan.vozila.set(kljucReg(reg), 'plan'); await dodajRokove('VOZILO', 'plan', v, 'vozila', red); continue; }
      const nv = await Store.dodaj('vozila', { registracija: reg.toUpperCase(), firma_id: fi.id, tip, marka: uvozTekst(v.marka), model: uvozTekst(v.model),
        godiste: godiste === null ? null : Math.round(godiste), vin: uvozTekst(v.vin)?.toUpperCase() || null, kapacitet: kap === null ? null : Math.round(kap), napomena: uvozTekst(v.napomena) });
      S.vozila.push(nv);
      await dodajRokove('VOZILO', nv.id, v, 'vozila', red);
    } catch (e) { R.vozila.novo--; gr('vozila', red, prevediGresku(e)); }
  }
  // 3. Vozači
  javi('Vozači…');
  for (const { red, v } of L.vozaci) {
    const ime = uvozTekst(v.ime), prezime = uvozTekst(v.prezime);
    if (!ime || !prezime) { gr('vozaci', red, 'nedostaje ime ili prezime'); continue; }
    const fi = firmaIzUvoza(v.firma);
    if (!fi) { gr('vozaci', red, v.firma ? `nepoznata firma „${v.firma}“` : 'nedostaje firma'); continue; }
    const kl = kljucTeksta(`${ime} ${prezime}`);
    if (!rokoviOk('vozaci', v, red)) continue;
    const postoji = S.vozaci.find(x => imeVozaca(x) === kl) || (plan.vozaci.has(kl) && { id: 'plan' });
    if (postoji) { R.vozaci.postoji++; try { await dodajRokove('VOZAC', postoji.id, v, 'vozaci', red); } catch (e) { gr('vozaci', red, prevediGresku(e)); } continue; }
    const preZ = R.vozaci.greske.length;
    const zap = v.zaposlen ? datumOk('vozaci', red, v.zaposlen, 'Datum zaposlenja') : null;
    if (R.vozaci.greske.length > preZ) continue;
    try {
      R.vozaci.novo++;
      if (!izvrsi) { plan.vozaci.set(kl, 'plan'); await dodajRokove('VOZAC', 'plan', v, 'vozaci', red); continue; }
      const nv = await Store.dodaj('vozaci', { ime, prezime, firma_id: fi.id, telefon: uvozTekst(v.telefon), email: uvozTekst(v.email), datum_zaposlenja: zap, napomena: uvozTekst(v.napomena) });
      S.vozaci.push(nv);
      await dodajRokove('VOZAC', nv.id, v, 'vozaci', red);
    } catch (e) { R.vozaci.novo--; gr('vozaci', red, prevediGresku(e)); }
  }
  const voziloId = (k, red, v, naziv) => {
    if (!v) return null;
    const x = S.vozila.find(z => kljucReg(z.registracija) === kljucReg(v));
    if (x) return x.id;
    if (plan.vozila.has(kljucReg(v))) return 'plan';
    gr(k, red, `vozilo „${v}“ (${naziv}) ne postoji ni u programu ni na listu Vozila`); return undefined;
  };
  const vozacId = (k, red, v) => {
    if (!v) return null;
    const kl = kljucTeksta(v), x = S.vozaci.find(z => imeVozaca(z) === kl || imeVozacaObrnuto(z) === kl);
    if (x) return x.id;
    if (plan.vozaci.has(kl) || [...plan.vozaci.keys()].some(p => p.split(' ').reverse().join(' ') === kl)) return 'plan';
    gr(k, red, `vozač „${v}“ ne postoji ni u programu ni na listu Vozači`); return undefined;
  };
  // 4. Ture (firma: iz kolone ili firma vozila)
  javi('Ture…');
  const firmaVozila = new Map(S.vozila.map(x => [kljucReg(x.registracija), x.firma_id]));
  L.vozila.forEach(({ v }) => { const fv = firmaIzUvoza(v.firma); if (uvozTekst(v.registracija) && fv && !firmaVozila.has(kljucReg(v.registracija))) firmaVozila.set(kljucReg(v.registracija), fv.id); });
  for (const { red, v } of L.ture) {
    const oznaka = uvozTekst(v.oznaka);
    if (!oznaka) { gr('ture', red, 'nedostaje oznaka ture (broj iz starog programa)'); continue; }
    const ok = kljucTeksta(oznaka);
    const post = ture.find(t => kljucTeksta(t.stari_broj) === ok || kljucTeksta(t.broj) === ok);
    if (post) { R.ture.postoji++; plan.ture.set(ok, post.id); continue; }
    if (plan.ture.has(ok)) { gr('ture', red, `oznaka „${oznaka}“ se ponavlja u fajlu`); continue; }
    const regV = uvozTekst(v.vozilo);
    const fi = firmaIzUvoza(v.firma) || (!v.firma && regV ? S.firme.find(f => f.id === firmaVozila.get(kljucReg(regV))) : undefined);
    if (!fi) { gr('ture', red, v.firma ? `nepoznata firma „${v.firma}“` : 'nedostaje firma (upišite firmu ili vozilo iz programa / lista Vozila)'); continue; }
    const pre = R.ture.greske.length;
    const t = { firma_id: fi.id, stari_broj: oznaka, datum_od: v.polazak ? datumOk('ture', red, v.polazak, 'Polazak') : null,
      datum_do: v.povratak ? datumOk('ture', red, v.povratak, 'Povratak') : null, vozilo_id: voziloId('ture', red, uvozTekst(v.vozilo), 'Vozilo'),
      prikolica_id: voziloId('ture', red, uvozTekst(v.prikolica), 'Prikolica'), vozac_id: vozacId('ture', red, uvozTekst(v.vozac)), vozac2_id: vozacId('ture', red, uvozTekst(v.vozac2)),
      km_pocetak: v.km_od ? brojOk('ture', red, v.km_od, 'Km polazak') : null, km_kraj: v.km_do ? brojOk('ture', red, v.km_do, 'Km povratak') : null,
      status: (v.status ? sifOk('ture', red, 'STATUS_TURE', v.status, 'Status') : null) || 'ZAVRSENA', relacija: uvozTekst(v.relacija), napomena: uvozTekst(v.napomena) };
    if (R.ture.greske.length > pre) continue;
    R.ture.novo++;
    if (!izvrsi) { plan.ture.set(ok, 'plan'); continue; }
    try {
      for (const p of ['km_pocetak', 'km_kraj']) if (t[p] !== null) t[p] = Math.round(t[p]);
      const nt = await Store.dodaj('ture', t); ture.push(nt); plan.ture.set(ok, nt.id);
    } catch (e) { R.ture.novo--; gr('ture', red, prevediGresku(e)); }
  }
  // 5. Nalozi (više redova sa istom oznakom = više stavki istog naloga)
  javi('Nalozi…');
  const grupe = new Map();
  for (const r of L.nalozi) { const o = uvozTekst(r.v.oznaka); if (!o) { gr('nalozi', r.red, 'nedostaje oznaka naloga'); continue; } const k = kljucTeksta(o); (grupe.get(k) || grupe.set(k, []).get(k)).push(r); }
  for (const [ok, redovi] of grupe) {
    const { red, v } = redovi[0], oznaka = uvozTekst(v.oznaka);
    if (nalozi.some(n => kljucTeksta(n.stari_broj) === ok || kljucTeksta(n.broj) === ok)) { R.nalozi.postoji++; continue; }
    if (!uvozTekst(v.nalogodavac)) { gr('nalozi', red, 'nedostaje nalogodavac'); continue; }
    let turaId = null;
    if (uvozTekst(v.tura)) {
      const kt = kljucTeksta(v.tura);
      turaId = plan.ture.get(kt) ?? ture.find(t => kljucTeksta(t.stari_broj) === kt || kljucTeksta(t.broj) === kt)?.id;
      if (!turaId) { gr('nalozi', red, `tura „${v.tura}“ ne postoji ni u programu ni na listu Ture`); continue; }
    }
    const pre = R.nalozi.greske.length;
    const status = (v.status ? sifOk('nalozi', red, 'STATUS_NALOGA', v.status, 'Status') : null) || 'ISPORUCEN';
    const d_u = v.d_utovar ? datumOk('nalozi', red, v.d_utovar, 'Datum utovara') : null, d_i = v.d_istovar ? datumOk('nalozi', red, v.d_istovar, 'Datum istovara') : null;
    const stavke = [];
    for (const r of redovi) {
      if (r.v.opis === null && r.v.cena === null) continue;
      const cena = brojOk('nalozi', r.red, r.v.cena, 'Cena bez PDV');
      if (cena === null) { gr('nalozi', r.red, 'stavka nema cenu'); continue; }
      stavke.push({ r, cena, kolicina: r.v.kolicina !== null ? brojOk('nalozi', r.red, r.v.kolicina, 'Količina') : 1,
        jedinica: r.v.jedinica ? sifOk('nalozi', r.red, 'JEDINICA', r.v.jedinica, 'Jedinica') : null,
        valuta: r.v.valuta ? sifOk('nalozi', r.red, 'VALUTA', r.v.valuta, 'Valuta') : null });
    }
    if (R.nalozi.greske.length > pre) continue;
    R.nalozi.novo++;
    if (!izvrsi) {
      await obezbediPartnera(uvozTekst(v.nalogodavac), uvozTekst(v.pib_n));
      if (uvozTekst(v.klijent)) await obezbediPartnera(uvozTekst(v.klijent), uvozTekst(v.pib_k));
      continue;
    }
    try {
      const nalogodavac = await obezbediPartnera(uvozTekst(v.nalogodavac), uvozTekst(v.pib_n));
      const klijent = uvozTekst(v.klijent) ? await obezbediPartnera(uvozTekst(v.klijent), uvozTekst(v.pib_k)) : nalogodavac;
      const n = await Store.dodaj('nalozi', { tura_id: turaId, fakturisano_ranije: uvozDa(v.fakt) || !!uvozTekst(v.fakt_broj), stari_broj_fakture: uvozTekst(v.fakt_broj), nalogodavac_id: nalogodavac, klijent_id: klijent, stari_broj: oznaka, ref_klijenta: uvozTekst(v.ref),
        datum_utovara: d_u, mesto_utovara: uvozTekst(v.m_utovar), datum_istovara: d_i, mesto_istovara: uvozTekst(v.m_istovar), status, napomena: uvozTekst(v.napomena) });
      nalozi.push(n);
      const st = stavke.map((s, i) => {
        const valuta = s.valuta || 'EUR';
        return { nalog_id: n.id, rb: i + 1, opis: uvozTekst(s.r.v.opis) || 'Usluga prevoza', kolicina: s.kolicina ?? 1, jedinica: s.jedinica, cena: s.cena,
          valuta, kurs: valutaKurs(valuta), teret: uvozTekst(s.r.v.teret) };
      });
      if (st.length) {
        const ust = await Store.dodajVise('nalog_stavke', st);
        if (!n.fakturisano_ranije) {
          const pl = ust.flatMap(s => predlogPlana(stavkaUEur(s), klijent, false).map((f, j) => ({ nalog_id: n.id, nalog_stavka_id: s.id, rb: j + 1,
            firma_id: f.firma_id, tip: f.tip, valuta: f.valuta, kurs: f.kurs, cena: f.cena, pdv_kod: f.pdv_kod || null })));
          if (pl.length) await Store.dodajVise('nalog_fakture', pl);
        }
      }
    } catch (e) { R.nalozi.novo--; gr('nalozi', red, prevediGresku(e)); }
  }
  // 6. Ulazni računi
  javi('Ulazni računi…');
  const vecUneti = new Set(ulazni.map(u => `${u.dobavljac_id}|${kljucTeksta(u.broj_fakture)}`));
  const uFajlu = new Set();
  for (const { red, v } of L.ulazni) {
    const fi = firmaIzUvoza(v.firma);
    if (!fi) { gr('ulazni', red, v.firma ? `nepoznata firma „${v.firma}“` : 'nedostaje firma'); continue; }
    const dob = uvozTekst(v.dobavljac), broj = uvozTekst(v.broj);
    if (!dob || !broj) { gr('ulazni', red, 'nedostaje dobavljač ili broj računa'); continue; }
    const pid = nadjiPartnera(dob, uvozTekst(v.pib));
    const kljuc = `${kljucPib(uvozTekst(v.pib)) || kljucTeksta(dob)}|${kljucTeksta(broj)}`;
    if ((pid && pid !== 'plan' && vecUneti.has(`${pid}|${kljucTeksta(broj)}`)) || uFajlu.has(kljuc)) { R.ulazni.postoji++; continue; }
    const pre = R.ulazni.greske.length;
    const datum = v.datum ? datumOk('ulazni', red, v.datum, 'Datum') : null;
    if (!v.datum) gr('ulazni', red, 'nedostaje datum');
    const kat = sifOk('ulazni', red, 'VRSTA_TROSKA', v.kategorija, 'Kategorija');
    if (!v.kategorija) gr('ulazni', red, 'nedostaje kategorija');
    const bez = brojOk('ulazni', red, v.bez, 'Iznos bez PDV');
    if (v.bez === null) gr('ulazni', red, 'nedostaje iznos bez PDV');
    const valuta = (v.valuta ? sifOk('ulazni', red, 'VALUTA', v.valuta, 'Valuta') : null) || valutaZaFirmu(fi);
    const stopa = v.pdv !== null ? brojOk('ulazni', red, v.pdv, 'PDV stopa') : stopaZaFirmu(fi);
    const uk = v.ukupno !== null ? brojOk('ulazni', red, v.ukupno, 'Ukupno') : (bez !== null ? Math.round(bez * (100 + (stopa || 0))) / 100 : null);
    const placeno = v.placeno !== null ? brojOk('ulazni', red, v.placeno, 'Plaćeno') : null;
    const dPlac = v.d_plac ? datumOk('ulazni', red, v.d_plac, 'Datum plaćanja') : null;
    if (R.ulazni.greske.length > pre) continue;
    uFajlu.add(kljuc);
    R.ulazni.novo++;
    if (!izvrsi) { await obezbediPartnera(dob, uvozTekst(v.pib)); continue; }
    try {
      const dobId = await obezbediPartnera(dob, uvozTekst(v.pib));
      const u = await Store.dodaj('ulazni_racuni', { firma_id: fi.id, dobavljac_id: dobId, broj_fakture: broj, datum, datum_dospeca: v.dospece ? uvozDatum(v.dospece) || null : null,
        kategorija: kat, opis: uvozTekst(v.opis), valuta, kurs: valutaKurs(valuta), pdv_stopa: stopa, iznos_bez_pdv: bez, iznos_ukupno: uk });
      if (placeno || dPlac) await Store.dodaj('ulazni_placanja', { ulazni_racun_id: u.id, datum: dPlac || datum, iznos: placeno ?? uk });
    } catch (e) { R.ulazni.novo--; gr('ulazni', red, prevediGresku(e)); }
  }
  javi('');
  return R;
}

async function proveriUvoz(knjiga, ime) {
  Object.assign(UVOZ, citajUvoz(knjiga), { knjiga, ime });
  await Promise.all([ucitajPartnere(), ucitajVozni()]);
  const R = await obradiUvoz(UVOZ.L, false);
  crtajPregledUvoza(R, false);
}
function crtajPregledUvoza(R, gotovo) {

    <div class="tabela-okvir zbir" style="max-width:820px">${tabelaHTML([
      { l: 'List', f: k => esc(UVOZ_LISTOVI[k].ime) },
      { l: 'Redova', f: k => R[k].redova, broj: true },
      { l: gotovo ? 'Uvezeno' : 'Biće uvezeno', f: k => `<b>${R[k].novo}</b>`, broj: true },
      { l: 'Već postoji (preskače se)', f: k => R[k].postoji, broj: true },
      { l: 'Greške', f: k => (R[k].greske.length ? `<span class="minus">${R[k].greske.length}</span>` : '0'), broj: true }
    ], Object.keys(UVOZ_LISTOVI), false)}</div>
    ${R.partneriAuto ? `<p>${gotovo ? 'Napravljeno' : 'Biće napravljeno'} novih partnera iz naloga i ulaznih računa: <b>${R.partneriAuto}</b> (naziv i PIB; ostale podatke dopunite u Partnerima).</p>` : ''}
    ${UVOZ.nepoznato.length ? `<div class="napomena">${UVOZ.nepoznato.map(esc).join('<br>')}</div>` : ''}
    ${greske.length ? `<div class="napomena upozorenje"><b>${greske.length} ${mnozina(greske.length, 'red ima grešku', 'reda imaju grešku', 'redova ima grešku')} i ${gotovo ? 'nisu uvezeni' : 'neće biti uvezeni'}:</b><br>${greske.slice(0, 60).map(esc).join('<br>')}${greske.length > 60 ? `<br>… i još ${greske.length - 60}` : ''}</div>` : ''}
    ${gotovo ? '' : `<div class="dugmad" style="justify-content:flex-start"><button class="dugme glavno" id="uvoz-izvrsi"${ukNovo || R.partneriAuto ? '' : ' disabled'}>Uvezi${ukNovo ? ` (${ukNovo})` : ''}</button>
      <span class="tekst-2" id="uvoz-status" role="status"></span></div>`}`;
  if ($('#uvoz-izvrsi')) $('#uvoz-izvrsi').onclick = async () => {
    if (greske.length && !confirm(`${greske.length} redova sa greškom biće preskočeno. Nastaviti?`)) return;
    const b = $('#uvoz-izvrsi'); b.disabled = true;
    try {
      const Rz = await obradiUvoz(UVOZ.L, true, t => { if ($('#uvoz-status')) $('#uvoz-status').textContent = t ? `Uvoz: ${t}` : ''; });
      await Promise.all([ucitajPartnere(), ucitajVozni(), ucitajAlarme()]); crtajMeni();
      crtajPregledUvoza(Rz, true);
      poruka('Uvoz je završen.');
    } catch (e) { b.disabled = false; poruka(prevediGresku(e), true); }
  };
}

// =====================================================================
// 2.8 – KASA I KARTICE
// Kasa: gotovina po firmi u RSD i EUR; stanje nikad u minusu (proverava baza i po danima unazad).
// Svaka promena u kasi ide na karticu: vozač, partner, kategorija troška, prihod ili ostala kartica.
// Kartice: sve promene iz obračuna vozača, troškova tura, faktura i uplata, ulaznih računa i plaćanja,
// kase i ručnih naloga (pregled v_kartice_stavke). Ulaz = odobrenje kartice, izlaz = zaduženje; saldo = ulaz − izlaz.
// =====================================================================
const KV = { VOZAC: 'Vozač', PARTNER: 'Partner', TROSAK: 'Trošak', PRIHOD: 'Prihod', OSTALO: 'Ostalo' };
const KV_GRUPA = { TROSAK: 'VRSTA_TROSKA', PRIHOD: 'VRSTA_PRIHODA', OSTALO: 'KARTICA_OSTALO' };
const KV_RED = ['VOZAC', 'PARTNER', 'TROSAK', 'PRIHOD', 'OSTALO'];
const KARTICE_SISTEM = { 'TROSAK:OBRACUN_VOZACA': 'Troškovi vozača (obračun)', 'TROSAK:INTERNI': 'Interni troškovi (fakture u grupi)' };
const IZVORI = { KASA: 'Kasa', RUCNI: 'Ručni nalog', OBRACUN: 'Obračun vozača', TURA_TROSAK: 'Trošak ture', FAKTURA: 'Faktura',
  NAPLATA: 'Uplata na fakturu', ULAZNI: 'Ulazni račun', ULAZNO_PLACANJE: 'Plaćanje računa' };
const FILTER_KARTICA = [['', 'Sve kartice'], ['VOZAC', 'Vozači'], ['KUPAC', 'Kupci'], ['NALOGODAVAC', 'Nalogodavci'], ['DOBAVLJAC', 'Dobavljači'],
  ['PARTNER_OSTALO', 'Ostali partneri'], ['TROSAK', 'Troškovi'], ['PRIHOD', 'Prihodi'], ['OSTALO', 'Ostale kartice']];
const ulogaNaziv = kod => sifNaziv('ULOGA_PARTNERA', kod);
const ulogeTekst = p => (p?.uloge || []).map(ulogaNaziv).join(', ');
const kljucKartice = (v, r) => `${v}:${r}`;
function karticaNaziv(v, r) {

function brojSlovima(n) {

  const sto = ['', 'sto', 'dvesta', 'trista', 'četiristo', 'petsto', 'šeststo', 'sedamsto', 'osamsto', 'devetsto'];

function dijalogKonverzije(posle) {

      <label class="polje"><span id="kv-l-u">Ulazi RSD <i>*</i></span><input type="number" name="u_iznos" step="0.01" min="0"><small class="tekst-2" id="kv-kurs"></small></label>
      <label class="polje puno"><span>Opis</span><input type="text" name="opis" autocomplete="off" placeholder="npr. Zamena u menjačnici"></label>
    </div></form>
    <footer><div class="desno"><button class="dugme" id="kv-otkazi" type="button">Otkaži</button><button class="dugme glavno" id="kv-sacuvaj" type="button">Sačuvaj konverziju</button></div></footer></aside>`;
  document.body.appendChild(z);
  document.addEventListener('keydown', escFioka);
  const f = $('#kv-forma'), pol = n => f.querySelector(`[name="${n}"]`), broj = n => Number(String(pol(n).value).replace(',', '.'));
  const osvezi = e => {
    const iz = pol('iz').value, u = iz === 'EUR' ? 'RSD' : 'EUR';
    $('#kv-l-iz').innerHTML = `Izlazi ${iz} <i>*</i>`; $('#kv-l-u').innerHTML = `Ulazi ${u} <i>*</i>`;
    if (e?.target?.name === 'iz_iznos' && broj('iz_iznos') > 0 && kurs && !pol('u_iznos').dataset.rucno) pol('u_iznos').value = (iz === 'EUR' ? broj('iz_iznos') * kurs : broj('iz_iznos') / kurs).toFixed(2);
    const eur = iz === 'EUR' ? broj('iz_iznos') : broj('u_iznos'), rsd = iz === 'EUR' ? broj('u_iznos') : broj('iz_iznos');
    $('#kv-kurs').textContent = eur > 0 && rsd > 0 ? `Kurs zamene: 1 EUR = ${fmtBroj(rsd / eur, 4)} RSD${kurs ? ` (Šifarnik: ${fmtBroj(kurs, 4)})` : ''}` : '';
  };
  f.addEventListener('input', e => { if (e.target.name === 'u_iznos') pol('u_iznos').dataset.rucno = '1'; osvezi(e); });
  f.addEventListener('change', e => { if (e.target.name === 'iz') { pol('u_iznos').value = ''; delete pol('u_iznos').dataset.rucno; } osvezi(e); });
  osvezi();
  pol('iz_iznos').focus();
  $('#kv-otkazi').onclick = () => zatvoriFioku();
  $('#kv-sacuvaj').onclick = async () => {
    if (!(broj('iz_iznos') > 0) || !(broj('u_iznos') > 0)) return poruka('Upišite oba iznosa: koliko izlazi i koliko ulazi u kasu.', true);
    const b = $('#kv-sacuvaj'); b.disabled = true;

}

const KAR = { tab: 'pregled', period: 'OVA_GODINA', od: '', do: '', vrsta: '', firma: '', trazi: '', izvor: '', kartica: '', bezPrometa: false, kol: {} };
[KAR.od, KAR.do] = opsegPerioda(KAR.period);

const predznak = r => (r.smer === 'ULAZ' ? 1 : -1);
const redKartice = (a, b) => String(a.datum).localeCompare(String(b.datum)) || String(a.created_at).localeCompare(String(b.created_at)) || String(a.id).localeCompare(String(b.id));
const razdvojKljuc = k => { const i = String(k).indexOf(':'); return [k.slice(0, i), k.slice(i + 1)]; };

// Tabela analitičke kartice: ulaz i izlaz po valutama, saldo po valutama (od prenosa), zbir prometa
function tabelaKartice(redovi, prenos = {}, o = {}) {
  const { saSaldom = false, tekstKolone = [], st = null, zaStampu = false, prenosDatum = null } = o;
  const valute = sortValute([...redovi.map(r => r.valuta), ...Object.entries(prenos).filter(([, x]) => Math.abs(x) > 0.004).map(([v]) => v)]);
  if (!valute.length) valute.push('EUR');
  const c = zaStampu ? 'b' : 'broj', sal = zaStampu ? saldTekst : sald, nKol = 2 + tekstKolone.length;
  const s = Object.fromEntries(valute.map(v => [v, Number(prenos[v] || 0)])), ul = Object.fromEntries(valute.map(v => [v, 0])), iz = { ...ul };
  const th = l => `<th class="${c}">${esc(l)}</th>`;
  let html = `<table class="${zaStampu ? 't' : 'kartica-tabela'}"><thead><tr><th>Datum</th>${tekstKolone.map(k => (st && !zaStampu ? kfTh(k, st.kol) : `<th>${esc(k.l)}</th>`)).join('')}<th>Opis</th>
    ${valute.map(v => th(`Ulaz ${v}`)).join('')}${valute.map(v => th(`Izlaz ${v}`)).join('')}${saSaldom ? valute.map(v => th(`Saldo ${v}`)).join('') : ''}</tr></thead><tbody>`;
  if (saSaldom && prenosDatum) html += `<tr class="prenos"><td colspan="${nKol}">Prenos – saldo na dan ${fmtDatum(prenosDatum)}</td>${valute.map(() => '<td></td><td></td>').join('')}${valute.map(v => `<td class="${c}">${sal(s[v])}</td>`).join('')}</tr>`;
  redovi.forEach((r, i) => {
    const x = Number(r.iznos), u = r.smer === 'ULAZ';
    if (!(r.valuta in s)) return;
    (u ? ul : iz)[r.valuta] += x; s[r.valuta] = Math.round((s[r.valuta] + (u ? x : -x)) * 100) / 100;
    html += `<tr data-i="${i}"${zaStampu ? '' : ' class="klik" tabindex="0"'}><td class="nw">${fmtDatum(r.datum)}</td>${tekstKolone.map(k => `<td>${k.f(r)}</td>`).join('')}<td class="opis">${esc(r.opis || '')}</td>
      ${valute.map(v => `<td class="${c}">${u && r.valuta === v ? fmtBroj(x) : ''}</td>`).join('')}${valute.map(v => `<td class="${c}">${!u && r.valuta === v ? fmtBroj(x) : ''}</td>`).join('')}
      ${saSaldom ? valute.map(v => `<td class="${c}">${sal(s[v])}</td>`).join('') : ''}</tr>`;
  });
  html += `<tr class="${zaStampu ? 'uk' : 'ukupno'}"><td colspan="${nKol}">Promet (${redovi.length})</td>${valute.map(v => `<td class="${c}">${fmtBroj(ul[v])}</td>`).join('')}${valute.map(v => `<td class="${c}">${fmtBroj(iz[v])}</td>`).join('')}
    ${saSaldom ? valute.map(v => `<td class="${c}"><b>${sal(s[v])}</b></td>`).join('') : ''}</tr></tbody></table>`;
  return { html, saldo: s, valute };
}
const kolDokument = { l: 'Dokument', f: r => `<span class="nw">${esc(r.dokument || '')}</span>` };
const kolIzvor = { l: 'Izvor', f: r => esc(IZVORI[r.izvor] || r.izvor) };

  fv: r => karticaNaziv(r.kartica_vrsta, r.kartica_ref) };

// Otvara dokument iz kog je nastala promena na kartici
async function otvoriIzvor(st, posle) {
  try {
    if (st.izvor === 'KASA') { KASA.firma = st.firma_id; KASA.otvori = st.izvor_id; zatvoriFioku(); location.hash = '#/kasa'; if (S.ruta === 'kasa') ruter(); return; }
    if (st.izvor === 'RUCNI') return dijalogRucnogNaloga({ id: st.izvor_id, posle });
    if (st.izvor === 'OBRACUN' && !st.tura_id) { const o = await Store.jedan('obracun_vozaca', st.izvor_id); if (o) return dijalogStavkeVozaca({ stavka: o, posle }); }
    if (['OBRACUN', 'TURA_TROSAK'].includes(st.izvor) && st.tura_id) {
      const t = await Store.jedan('v_ture', st.tura_id); if (t) return otvoriFioku('ture', t, st.izvor === 'OBRACUN' ? 'obracun' : 'troskovi');
    }
    if (['FAKTURA', 'NAPLATA'].includes(st.izvor)) { const f = await Store.jedan('v_fakture', st.veza_id); if (f) return otvoriFioku('fakture', f, st.izvor === 'NAPLATA' ? 'uplate' : 'podaci'); }
    if (['ULAZNI', 'ULAZNO_PLACANJE'].includes(st.izvor)) { const u = await Store.jedan('v_ulazni_racuni', st.veza_id); if (u) return otvoriFioku('ulazni', u, st.izvor === 'ULAZNO_PLACANJE' ? 'placanja' : 'podaci'); }
    poruka('Dokument nije pronađen (možda je obrisan).', true);
  } catch (e) { poruka(prevediGresku(e), true); }
}

      if (KAR.od && r.datum < KAR.od) x.prenos += e;
      else { x.n++; if (r.smer === 'ULAZ') x.ulaz += Number(r.iznos_eur); else x.izlaz += Number(r.iznos_eur); }
      x.saldo += e; x.poValuti[r.valuta] = (x.poValuti[r.valuta] || 0) + predznak(r) * Number(r.iznos);
      m.set(k, x);
    }
    if (KAR.bezPrometa) for (const k of sveKartice()) if (uFilteruKartica(k.v, k.r, KAR.vrsta) && !m.has(kljucKartice(k.v, k.r))) m.set(kljucKartice(k.v, k.r), novi(k.v, k.r));
    const q = bezKvacica(KAR.trazi.trim());
    const osnovni = [...m.values()].filter(x => (KAR.bezPrometa || x.n || Math.abs(x.saldo) > 0.004) && (!q || bezKvacica(x.naziv).includes(q)))
      .sort((a, b) => KV_RED.indexOf(a.v) - KV_RED.indexOf(b.v) || a.naziv.localeCompare(b.naziv, 'sr'));
    return { osnovni, vid: osnovni.filter(x => kfProlazi(kolPregled, KAR.kol, x)) };
  };
  const pregledHTML = (vid, zaStampu) => {
    const c = zaStampu ? 'b' : 'broj';
    const uk = vid.reduce((s, x) => ({ n: s.n + x.n, p: s.p + x.prenos, u: s.u + x.ulaz, i: s.i + x.izlaz, s: s.s + x.saldo }), { n: 0, p: 0, u: 0, i: 0, s: 0 });
    const th = zaStampu ? kolPregled.map(k => `<th${k.broj ? ` class="${c}"` : ''}>${esc(k.l)}</th>`).join('') : kolPregled.map(k => kfTh(k, KAR.kol)).join('');
    const cel = (k, x) => (zaStampu && k.l === 'Saldo EUR' ? `${saldTekst(x.saldo)}${znacenjeSalda(x.v, x.saldo) ? `<div class="sit">${znacenjeSalda(x.v, x.saldo)}</div>` : ''}` : k.f(x));
    return `<table class="${zaStampu ? 't' : ''}"><thead><tr>${th}</tr></thead><tbody>
      ${vid.map((x, i) => `<tr data-i="${i}"${zaStampu ? '' : ' class="klik" tabindex="0"'}>${kolPregled.map(k => `<td${k.broj ? ` class="${c}"` : ''}>${cel(k, x)}</td>`).join('')}</tr>`).join('')}
      ${KAR.vrsta ? `<tr class="${zaStampu ? 'uk' : 'ukupno'}"><td colspan="2">Ukupno ${esc((FILTER_KARTICA.find(x => x[0] === KAR.vrsta) || [, ''])[1].toLowerCase())} (${vid.length})</td><td class="${c}">${uk.n}</td><td class="${c}">${fmtBroj(uk.p)}</td><td class="${c}">${fmtBroj(uk.u)}</td>
        <td class="${c}">${fmtBroj(uk.i)}</td><td class="${c}">${zaStampu ? saldTekst(uk.s) : sald(uk.s)}</td><td></td></tr>` : ''}</tbody></table>`;
  };

  // ---------- promene ----------
  const promene = () => {
    const jedna = KAR.kartica ? razdvojKljuc(KAR.kartica) : null;
    const tekstKolone = jedna ? [kolDokument, kolIzvor] : [kolKartica, kolDokument, kolIzvor];
    const osnova = svi.filter(r => firmaOk(r) && uFilteruKartica(r.kartica_vrsta, r.kartica_ref, KAR.vrsta)
      && (!jedna || (r.kartica_vrsta === jedna[0] && r.kartica_ref === jedna[1])));
    const prenos = {}; let prenosEur = 0;
    if (jedna && KAR.od) osnova.filter(r => r.datum < KAR.od).forEach(r => { prenos[r.valuta] = (prenos[r.valuta] || 0) + predznak(r) * Number(r.iznos); prenosEur += predznak(r) * Number(r.iznos_eur); });
    const osnovni = osnova.filter(r => uPer(r) && (!KAR.izvor || r.izvor === KAR.izvor) && qOk(r)).sort(redKartice);
    const vid = osnovni.filter(r => kfProlazi(tekstKolone, KAR.kol, r));
    const saSaldom = !!jedna && !KAR.izvor && !KAR.trazi.trim() && !Object.keys(KAR.kol).length;
    const saldoEur = prenosEur + vid.reduce((s, r) => s + predznak(r) * Number(r.iznos_eur), 0);
    return { jedna, tekstKolone, osnovni, vid, prenos, saSaldom, saldoEur };
  };
  const glavaKartice = (jedna, saldoEur, saSaldom, zaStampu) => {
    const [v, ref] = jedna, p = v === 'PARTNER' ? S.partneri.find(x => x.id === ref) : null;
    const pod = [karticaVrstaTekst(v, ref), p?.pib && `PIB ${p.pib}`, p?.mesto].filter(Boolean).join(' · ');
    const naDan = KAR.do && KAR.do < danas() ? KAR.do : danas();
    const sal = saSaldom ? `Saldo na dan ${fmtDatum(naDan)} preračunat u EUR: <b>${esc(saldoEurTekst(v, saldoEur))}</b>` : 'Uključeni su dodatni filteri – saldo se ne prikazuje.';
    if (zaStampu) return `<p><b>${esc(karticaNaziv(v, ref))}</b> · ${esc(pod)}<br>${sal}</p>`;
    return `<div class="kartica-glava"><div><button class="nazad" id="kr-nazad" type="button">← Sve kartice</button><h2>${esc(karticaNaziv(v, ref))}</h2><div class="tekst-2">${esc(pod)}</div></div>
      <div class="tekst-2" style="text-align:right">${sal}${moze && v !== 'VOZAC' ? '<br><button class="dugme malo" id="kr-rucni-k" type="button" style="margin-top:6px">Ručni nalog na ovu karticu</button>' : ''}
      ${moze && v === 'VOZAC' ? '<br><button class="dugme malo" id="kr-rucni-k" type="button" style="margin-top:6px">Dodatak / zaduženje vozača</button>' : ''}</div></div>`;
  };

  const crtaj = () => {
    $('#kr-glava').innerHTML = ''; $('#kr-dno').innerHTML = '';
    if (KAR.tab === 'pregled') {
      const { osnovni, vid } = pregled();
      kfCipovi($('#kf-cipovi'), kolPregled, KAR, crtaj);
      $('#kr-dno').innerHTML = `<p class="tekst-2" style="max-width:90ch;margin-top:10px">Period ${perTekst(KAR.od, KAR.do)}. Prenos = saldo pre početka perioda; saldo = stanje na kraju perioda. „Dugujemo“ = obaveza firme (npr. prema vozaču ili dobavljaču), „duguje nama“ = potraživanje. Kliknite na karticu za sve njene promene.</p>`;
      if (!vid.length) { $('#kr-tabela').innerHTML = `<div class="prazno"><b>Nema kartica za izabrane filtere</b>${svi.length ? 'Promenite period ili filtere, ili uključite „I kartice bez prometa“.' : 'Kartice nastaju čim postoji obračun vozača, trošak, faktura, ulazni račun ili promena u kasi.'}</div>`; return; }
      $('#kr-tabela').innerHTML = pregledHTML(vid);
      kfVeziZaglavlje($('#kr-tabela'), kolPregled, osnovni, KAR, crtaj);
      veziKlikove($('#kr-tabela'), vid, x => { KAR.kartica = x.kljuc; KAR.tab = 'promene'; KAR.kol = {}; $$('#kr-tab button').forEach(b => b.classList.toggle('aktivan', b.dataset.v === 'promene')); crtajFiltere(); crtaj(); });
      return;
    }
    const p = promene();
    kfCipovi($('#kf-cipovi'), p.tekstKolone, KAR, crtaj);
    if (p.jedna) {
      $('#kr-glava').innerHTML = glavaKartice(p.jedna, p.saldoEur, p.saSaldom);
      $('#kr-nazad').onclick = () => { KAR.kartica = ''; KAR.kol = {}; KAR.tab = 'pregled'; $$('#kr-tab button').forEach(b => b.classList.toggle('aktivan', b.dataset.v === 'pregled')); crtajFiltere(); crtaj(); };
      if ($('#kr-rucni-k')) $('#kr-rucni-k').onclick = () => (p.jedna[0] === 'VOZAC'
        ? dijalogStavkeVozaca({ vozacId: p.jedna[1], posle: async () => { await osveziListu(); } })
        : dijalogRucnogNaloga({ pocetne: { kartica_vrsta: p.jedna[0], kartica: p.jedna[1], firma_id: KAR.firma }, posle: async () => { await osveziListu(); } }));
    }
    if (!p.vid.length && !(p.saSaldom && Object.keys(p.prenos).length)) {
      $('#kr-tabela').innerHTML = `<div class="prazno"><b>Nema promena za izabrane filtere</b>Promenite period ili filtere.</div>`;
      return;
    }
    const t = tabelaKartice(p.vid, p.saSaldom ? p.prenos : {}, { saSaldom: p.saSaldom, tekstKolone: p.tekstKolone, st: KAR, prenosDatum: p.jedna && KAR.od ? prenosDatum() : null });
    $('#kr-tabela').innerHTML = t.html;
    $('#kr-dno').innerHTML = `<p class="tekst-2" style="max-width:90ch;margin-top:10px">Period ${perTekst(KAR.od, KAR.do)}. ${p.jedna ? '' : 'Za saldo izaberite jednu karticu (filter „Kartica“ ili klik u Pregledu kartica). '}Kliknite na promenu da otvorite dokument iz kog je nastala.</p>`;
    kfVeziZaglavlje($('#kr-tabela'), p.tekstKolone, p.osnovni, KAR, crtaj);
    veziKlikove($('#kr-tabela'), p.vid, r => otvoriIzvor(r, async () => { await osveziListu(); }));
  };
  const ucitaj = async (sila = false) => {
    const doo = KAR.do || '';
    if (sila || !KAR_KES.redovi || KAR_KES.do !== doo) {
      KAR_KES.redovi = await Store.lista('v_kartice_stavke', { filteri: doo ? [['lte', 'datum', doo]] : [], red: 'datum' });
      KAR_KES.do = doo;
    }
    svi = KAR_KES.redovi;
  };
  osveziListu = async () => {
    if (S.ruta !== 'kartice') return;
    try { await ucitaj(true); crtajFiltere(); crtaj(); }
    catch (e) { $('#kr-tabela').innerHTML = `<div class="prazno"><b>Podaci nisu učitani</b>${esc(prevediGresku(e))}</div>`; }
  };
  $('#kr-csv').onclick = () => {
    if (KAR.tab === 'pregled') {
      const { vid } = pregled(); if (!vid.length) return poruka('Nema podataka za izvoz.', true);
      const val = sortValute(vid.flatMap(x => Object.keys(x.poValuti)));
      return izvozCSV(`kartice_${KAR.od || 'pocetak'}_${KAR.do || danas()}.csv`, [['Kartica', 'naziv'], ['Vrsta', 'vrstaTekst'], ['Promena', 'n'], ['Prenos EUR', x => csvBroj(x.prenos)],
        ['Ulaz EUR', x => csvBroj(x.ulaz)], ['Izlaz EUR', x => csvBroj(x.izlaz)], ['Saldo EUR', x => csvBroj(x.saldo)], ['Značenje', x => znacenjeSalda(x.v, x.saldo)],
        ...val.map(v => [`Saldo ${v}`, x => csvBroj(x.poValuti[v] || 0)])], vid);
    }
    const p = promene(); if (!p.vid.length) return poruka('Nema podataka za izvoz.', true);
    const s = {}; Object.assign(s, p.saSaldom ? p.prenos : {});
    const saldo = r => { s[r.valuta] = (s[r.valuta] || 0) + predznak(r) * Number(r.iznos); return csvBroj(s[r.valuta]); };
    izvozCSV(`kartica_${p.jedna ? bezbednoIme(karticaNaziv(...p.jedna)).replace(/\./g, '_') : 'promene'}_${KAR.od || 'pocetak'}_${KAR.do || danas()}.csv`, [['Datum', r => fmtDatum(r.datum)], ['Firma', r => firmaKod(r.firma_id)],
      ['Kartica', r => karticaNaziv(r.kartica_vrsta, r.kartica_ref)], ['Vrsta kartice', r => karticaVrstaTekst(r.kartica_vrsta, r.kartica_ref)], ['Dokument', 'dokument'],
      ['Izvor', r => IZVORI[r.izvor] || r.izvor], ['Opis', 'opis'], ['Valuta', 'valuta'], ['Ulaz', r => (r.smer === 'ULAZ' ? csvBroj(r.iznos) : '')], ['Izlaz', r => (r.smer === 'IZLAZ' ? csvBroj(r.iznos) : '')],
      ['Kurs', r => csvBroj(r.kurs, 4)], ['Ulaz EUR', r => (r.smer === 'ULAZ' ? csvBroj(r.iznos_eur) : '')], ['Izlaz EUR', r => (r.smer === 'IZLAZ' ? csvBroj(r.iznos_eur) : '')],
      ...(p.saSaldom ? [['Saldo u valuti', saldo]] : [])], p.vid);
  };
  $('#kr-stampa').onclick = () => {
    const fi = KAR.firma, per = `Period ${perTekst(KAR.od, KAR.do)}`;
    if (KAR.tab === 'pregled') {
      const { vid } = pregled(); const vrsta = FILTER_KARTICA.find(x => x[0] === KAR.vrsta)?.[1] || 'Sve kartice';
      return stampajIzvestaj('Pregled kartica', zaglavljeIzvestaja('Pregled kartica', fi, `${per} · ${esc(vrsta)}`) + pregledHTML(vid, true));
    }
    const p = promene();
    const t = tabelaKartice(p.vid, p.saSaldom ? p.prenos : {}, { saSaldom: p.saSaldom, tekstKolone: p.tekstKolone, zaStampu: true, prenosDatum: p.jedna && KAR.od ? prenosDatum() : null });
    stampajIzvestaj(p.jedna ? `Kartica ${karticaNaziv(...p.jedna)}` : 'Promene na karticama',
      zaglavljeIzvestaja(p.jedna ? 'Kartica' : 'Promene na karticama', fi, per) + (p.jedna ? glavaKartice(p.jedna, p.saldoEur, p.saSaldom, true) : '') + t.html
      + (p.jedna && ['VOZAC', 'PARTNER'].includes(p.jedna[0]) ? `<div class="potpisi"><div>Sastavio</div><div>${p.jedna[0] === 'VOZAC' ? 'Vozač' : 'Partner'}</div></div>` : ''));
  };
  if ($('#kr-rucni')) $('#kr-rucni').onclick = () => dijalogRucnogNaloga({ pocetne: KAR.kartica ? { kartica_vrsta: razdvojKljuc(KAR.kartica)[0], kartica: razdvojKljuc(KAR.kartica)[1], firma_id: KAR.firma } : { firma_id: KAR.firma }, posle: async () => { await osveziListu(); } });
  crtajFiltere();
  await osveziListu();
}

// Ručni nalog na karticu. Za vozača se upisuje u obračun vozača (Dodatak = ulaz, Zaduženje vozača = izlaz).

  let r = null;
  if (id) { try { r = await Store.jedan('kartica_nalozi', id); } catch (e) { return poruka(prevediGresku(e), true); } if (!r) return poruka('Ručni nalog ne postoji (možda je obrisan).', true); }

    partner_id: pocetne.kartica_vrsta === 'PARTNER' ? pocetne.kartica : null, kartica_kod: !['PARTNER', 'VOZAC'].includes(pocetne.kartica_vrsta) ? pocetne.kartica : null,

  if (!v0.firma_id) v0.firma_id = S.firme[0]?.id;

  const opcK = (v, sad) => {
    if (!v) return '';

    else if (v === 'PARTNER') l = S.partneri.filter(x => x.aktivan !== false || x.id === sad).map(x => [x.id, `${x.naziv}${x.uloge?.length ? ` (${ulogeTekst(x)})` : ''}`]);
    else l = (S.sif[KV_GRUPA[v]] || []).filter(x => x.aktivan || x.kod === sad).map(x => [x.kod, x.naziv]);
    l.sort((a, b) => a[1].localeCompare(b[1], 'sr'));
    return `<option value=""${sad ? '' : ' selected'} disabled>Izaberite…</option>${l.map(([k, t]) => `<option value="${esc(k)}"${k === sad ? ' selected' : ''}>${esc(t)}</option>`).join('')}`;
  };
  const vrste = r ? ['PARTNER', 'TROSAK', 'PRIHOD', 'OSTALO'] : KV_RED;
  zatvoriFioku();
  const z = document.createElement('div');
  z.className = 'zavesa'; z.id = 'fioka';
  z.innerHTML = `<aside class="fioka" role="dialog" aria-modal="true" aria-labelledby="rn-naslov" style="width:min(640px,100%)">
    <header><h2 id="rn-naslov">${r ? `Ručni nalog ${esc(r.broj)}` : 'Ručni nalog na karticu'}</h2>
      <div class="pod">Za kompenzaciju, otpis, preknjiženje, početno stanje partnera… Protivna kartica nije obavezna – kad je izaberete, ista promena ide na nju u suprotnom smeru.</div></header>
    <form class="telo" id="rn-forma" novalidate><div class="forma">
      <label class="polje" id="rn-firma-p"><span>Firma <i>*</i></span><select name="firma_id">${S.firme.map(f => `<option value="${f.id}"${f.id === v0.firma_id ? ' selected' : ''}>${esc(f.kod)} – ${esc(f.naziv)}</option>`).join('')}</select></label>
      <label class="polje"><span>Datum <i>*</i></span><input type="date" name="datum" value="${esc(v0.datum)}"></label>
      <label class="polje puno"><span>Smer na kartici <i>*</i></span><select name="smer">
        <option value="IZLAZ"${v0.smer === 'IZLAZ' ? ' selected' : ''}>Izlaz – zaduženje kartice (npr. zaduženje kupca ili vozača, trošak)</option>
        <option value="ULAZ"${v0.smer === 'ULAZ' ? ' selected' : ''}>Ulaz – odobrenje kartice (npr. odobrenje kupcu, dodatak vozaču, prihod)</option></select></label>
      <label class="polje"><span>Kartica – vrsta <i>*</i></span><select name="kartica_vrsta">${vrste.map(x => `<option value="${x}"${x === v0.kartica_vrsta ? ' selected' : ''}>${KV[x]}</option>`).join('')}</select></label>
      <label class="polje"><span>Kartica <i>*</i></span><select name="kartica">${opcK(v0.kartica_vrsta, v0.vozac_id || v0.partner_id || v0.kartica_kod)}</select></label>
      <div class="napomena puno" id="rn-vozac" hidden style="grid-column:1/-1;margin:0">Za vozača se upisuje u obračun vozača: ulaz kao „Dodatak“, izlaz kao „Zaduženje vozača“. Ulazi u obračunski list i u trošak vozača, pa protivna kartica nije potrebna.</div>
      <label class="polje" id="rn-pv-p"><span>Protivna kartica – vrsta</span><select name="protiv_vrsta"><option value="">— bez protivne kartice —</option>${['PARTNER', 'TROSAK', 'PRIHOD', 'OSTALO'].map(x => `<option value="${x}"${x === v0.protiv_vrsta ? ' selected' : ''}>${KV[x]}</option>`).join('')}</select></label>
      <label class="polje" id="rn-pk-p"><span>Protivna kartica</span><select name="protiv">${opcK(v0.protiv_vrsta, v0.protiv_partner_id || v0.protiv_kod)}</select></label>
      <label class="polje"><span>Valuta <i>*</i></span><select name="valuta">${sifOpcije('VALUTA').map(o => `<option${o.v === v0.valuta ? ' selected' : ''}>${esc(o.v)}</option>`).join('')}</select></label>
      <label class="polje"><span>Kurs (1 EUR = …)</span><input type="number" name="kurs" step="0.0001" value="${esc(v0.kurs)}"></label>
      <label class="polje"><span>Iznos <i>*</i></span><input type="number" name="iznos" step="0.01" min="0" value="${esc(v0.iznos)}"></label>

  document.body.appendChild(z);
  document.addEventListener('keydown', escFioka);

  $('#rn-otkazi').onclick = () => zatvoriFioku(true);
  $('#rn-sacuvaj').onclick = async () => {
    const kv = pol('kartica_vrsta').value, k = pol('kartica').value, pv = $('#rn-pv-p').hidden ? '' : pol('protiv_vrsta').value, pk = pol('protiv').value;
    const valuta = pol('valuta').value, kurs = valuta === 'EUR' ? 1 : Number(String(pol('kurs').value).replace(',', '.'));
    const iznos = Number(String(pol('iznos').value).replace(',', '.')), opis = pol('opis').value.trim(), datum = pol('datum').value, smer = pol('smer').value;
    if (!k) return poruka('Izaberite karticu.', true);

    if (pv && pv === kv && pk === k) return poruka('Protivna kartica mora biti različita od kartice naloga.', true);

// 3.0 – AMORTIZACIJA VOZILA
// Proporcionalna (linearna) metoda, posebno za svako vozilo:
//   osnovica = (nabavna − preostala vrednost) / kurs nabavke (EUR)
//   mesečno  = osnovica × godišnja stopa / 100 / 12

// sa mesecom prodaje / rashoda. Deo meseca se računa srazmerno danima (zbir delova = ceo mesec).
// U Bilansu uspeha se računa najkasnije do današnjeg dana.

// Datumi kao tekst GGGG-MM-DD (bez vremenskih zona)
const isoD = (g, m, d) => `${g}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

function stopaAmortizacije(a) {

// Parametri amortizacije jednog vozila (iznosi u EUR) ili { greska }
function amortParametri(a) {
  if (!a) return { greska: 'vrednost nije upisana' };
  const V = Number(a.nabavna_vrednost), kurs = a.valuta === 'EUR' ? 1 : Number(a.kurs), R = Number(a.rezidualna_vrednost) || 0;
  if (!(V > 0)) return { greska: 'nabavna vrednost nije upisana' };
  if (!(kurs > 0)) return { greska: 'kurs nije upisan' };
  if (!a.datum_nabavke) return { greska: 'datum nabavke nije upisan' };
  const stopa = stopaAmortizacije(a);
  if (!(stopa > 0)) return { greska: 'stopa nije određena (grupa ili posebna stopa)' };
  const B = (V - R) / kurs;

// Otpisano zaključno sa danom t (EUR)
function amortDo(p, t) {

    try { await Store.obrisi('vozila_amortizacija', a.id); await posle('Vrednost vozila je obrisana.'); }
    catch (e) { poruka(prevediGresku(e), true); }

};

// =====================================================================
// 3.0 – BILANS USPEHA (Finansije → Bilans uspeha)
// Prihodi − troškovi = rezultat pre amortizacije (ista pravila kao Izveštaji → Rezultat po mesecima)
// − amortizacija vozila = poslovni rezultat. Period, firma, prikaz ukupno ili po mesecima,
// poređenje sa prethodnim periodom ili istim periodom prošle godine; klik na stavku → dokumenti.
// =====================================================================
const BIL = { tab: 'bilans', period: 'OVA_GODINA', od: '', do: '', firma: '', prikaz: 'UKUPNO', poredjenje: '', bezVrednosti: false };
[BIL.od, BIL.do] = opsegPerioda(BIL.period);
const BIL_PERIODI = [['OVAJ_MESEC', 'Ovaj mesec'], ['PROSLI_MESEC', 'Prošli mesec'], ['OVAJ_KVARTAL', 'Ovaj kvartal'], ['PROSLI_KVARTAL', 'Prošli kvartal'],
  ['OVA_GODINA', 'Ova godina'], ['PROSLA_GODINA', 'Prošla godina'], ['', 'Ceo period'], ['RUCNO', 'Od – do']];
const BIL_POREDJENJE = [['', 'Bez poređenja'], ['PRETHODNI', 'Prethodni period'], ['GODINA', 'Isti period prošle godine']];
const BIL_SEKCIJE = [
  { k: 'PRIHOD', n: 'Poslovni prihodi', uk: 'Ukupno poslovni prihodi', prazno: 'Nema prihoda u periodu.' },
  { k: 'TROSAK', n: 'Troškovi poslovanja', uk: 'Ukupno troškovi poslovanja' },
  { k: 'VOZACI', n: 'Troškovi vozača', uk: 'Ukupno troškovi vozača' },
  { k: 'INTERNI', n: 'Interni troškovi', uk: 'Ukupno interni troškovi' },
  { k: 'AMORT', n: 'Amortizacija vozila', uk: 'Ukupno amortizacija', prazno: 'Nema amortizacije u periodu.' }
];
const BIL_NAPOMENA = 'Iznosi u EUR bez PDV-a, preračunati po kursu sa dokumenta. Prihodi: osnovica izdatih faktura iz naloga i ručnih faktura po datumu prometa (stornirane fakture i zaduženja – početna stanja se ne računaju) i ostali prihodi iz kase i ručnih naloga. Troškovi: ulazni računi, troškovi tura (trošak povezan sa ulaznim računom računa se samo jednom), troškovi plaćeni iz kase i ručni nalozi na kartice troškova, obračun vozača (zarada, dnevnice, bonusi, odbici; akontacije i isplate nisu trošak). Za sve firme zajedno interne fakture se ne računaju; za jednu firmu interna faktura je prihod firme koja je izdaje i trošak firme koja je prima. Amortizacija: linearno po vozilu, od 1. dana meseca posle nabavke, najkasnije do danas. Rezultat pre amortizacije jednak je rezultatu u Izveštaji → Rezultat po mesecima. Nisu obuhvaćeni kamate, kursne razlike ni porez na dobit. Upravljački pregled – nije zamena za zvanični bilans knjigovođe.';
const bBroj = (n, dec = 2) => `${Number(n) < -0.0049 ? '−' : ''}${fmtBroj(Math.abs(Number(n) || 0), dec)}`;
const bRazlika = (n, dec = 2) => `${Number(n) > 0.0049 ? '+' : ''}${bBroj(n, dec)}`;
const zaokruzi = n => Math.round(n * 100) / 100;
const nVozila = n => `${n} ${mnozina(n, 'vozilo', 'vozila', 'vozila')}`;
const dodajDane = (d, n) => { const x = new Date(`${d}T12:00:00Z`); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };

async function bilansPodaci() {
  const [fak, ul, tr, ob, ture, ka, rn] = await Promise.all([
    Store.lista('v_fakture', { filteri: [['in', 'izvor', ['NALOG', 'RUCNA']], ['eq', 'status', 'IZDATA']] }),
    Store.lista('v_ulazni_racuni'), Store.lista('tura_troskovi'), Store.lista('obracun_vozaca'), Store.lista('ture'),
    Store.lista('kasa').catch(() => []), Store.lista('kartica_nalozi').catch(() => []), ucitajVozni(), ucitajAmortizaciju()]);
  return { fak, ul, tr, ob, ture, ka, rn, am: AMORT.redovi || [], amGreska: AMORT.greska, kes: {} };
}

// Sve stavke bilansa (dokumenti) za izabranu firmu, sa datumom i iznosom u EUR (+ povećava prihod, odnosno trošak)
function stavkeBilansa(P, firma) {
  const kk = firma || '*';
  if (P.kes[kk]) return P.kes[kk];
  const L = [], ok = f => !firma || f === firma, dan = d => String(d || '').slice(0, 10);
  const tura = new Map(P.ture.map(t => [t.id, t]));
  const vozacFirma = new Map((S.vozaci || []).map(v => [v.id, v.firma_id]));
  const interni = new Set(S.partneri.filter(p => p.interna_firma_id).map(p => p.id));
  const dodaj = (sek, kljuc, naziv, x) => L.push({ sek, kljuc: `${sek}:${kljuc}`, naziv, ...x });
  for (const f of P.fak) {
    const dok = { datum: dan(f.datum_prometa || f.datum_izdavanja), dokument: f.broj, opis: f.klijent_naziv || partnerNaziv(f.klijent_id),
      izvor: 'FAKTURA', veza_id: f.id, eur: Number(f.osnovica) / (f.valuta === 'EUR' ? 1 : Number(f.kurs)) };
    if (f.tip === 'INTERNA') {
      if (!firma) continue;
      const prima = S.partneri.find(p => p.id === f.klijent_id)?.interna_firma_id;
      if (prima === firma) dodaj('INTERNI', 'INTERNA', 'Interne fakture primljene od firme u grupi', { ...dok, firma_id: prima });
      if (f.firma_id === firma) dodaj('PRIHOD', 'INTERNA', 'Interne fakture izdate firmi u grupi', { ...dok, firma_id: f.firma_id });
      continue;
    }
    if (!ok(f.firma_id)) continue;
    dodaj('PRIHOD', `${f.izvor}:${f.tip}`, `${f.izvor === 'RUCNA' ? 'Ručne fakture' : 'Prevoz po nalozima'} – ${sifNaziv('TIP_FAKTURE', f.tip) || 'faktura'}`, { ...dok, firma_id: f.firma_id });
  }
  for (const u of P.ul) {
    if ((!firma && interni.has(u.dobavljac_id)) || !ok(u.firma_id)) continue;
    dodaj('TROSAK', u.kategorija || 'BEZ', u.kategorija ? sifNaziv('VRSTA_TROSKA', u.kategorija) : 'Bez kategorije', { datum: dan(u.datum), firma_id: u.firma_id,
      eur: Number(u.bez_pdv_eur) || 0, dokument: u.broj_fakture, opis: [u.dobavljac_naziv || partnerNaziv(u.dobavljac_id), u.opis].filter(Boolean).join(' – '), izvor: 'ULAZNI', veza_id: u.id });
  }
  for (const t of P.tr) {
    if (t.ulazni_racun_id) continue;
    const tu = tura.get(t.tura_id), fi = tu?.firma_id;
    if (firma && fi !== firma) continue;
    dodaj('TROSAK', t.vrsta || 'BEZ', t.vrsta ? sifNaziv('VRSTA_TROSKA', t.vrsta) : 'Bez kategorije', { datum: dan(t.datum), firma_id: fi, eur: Number(t.iznos_eur) || 0,
      dokument: tu ? `Tura ${tu.broj}` : 'Tura', opis: t.opis, izvor: 'TURA_TROSAK', tura_id: t.tura_id });
  }
  for (const o of P.ob) {
    if (!o.u_trosak) continue;
    const tu = o.tura_id ? tura.get(o.tura_id) : null, fi = o.tura_id ? tu?.firma_id : vozacFirma.get(o.vozac_id);
    if (firma && fi !== firma) continue;
    dodaj('VOZACI', o.vrsta || 'BEZ', sifNaziv('VRSTA_OBRACUNA', o.vrsta) || 'Ostalo', { datum: dan(o.datum), firma_id: fi, eur: (o.znak || 1) * (Number(o.iznos_eur) || 0),
      dokument: tu ? `Tura ${tu.broj}` : 'Obračun vozača', opis: [vozacIme(o.vozac_id), o.opis].filter(Boolean).join(' – '), izvor: 'OBRACUN', izvor_id: o.id, tura_id: o.tura_id || null });
  }
  // kasa i ručni nalozi na kartice prihoda i troškova (isto pravilo kao ostaloRezultata)
  const ostalo = (izvor, id, datum, firma_id, v, kod, smer, iznosEur, dokument, opis) => {
    if ((v !== 'TROSAK' && v !== 'PRIHOD') || !ok(firma_id)) return;
    const x = { datum: dan(datum), firma_id, eur: (smer === (v === 'PRIHOD' ? 'ULAZ' : 'IZLAZ') ? 1 : -1) * (Number(iznosEur) || 0), dokument, opis, izvor, izvor_id: id };
    if (v === 'PRIHOD') dodaj('PRIHOD', `OST:${kod}`, karticaNaziv('PRIHOD', kod), x);
    else dodaj('TROSAK', kod || 'BEZ', karticaNaziv('TROSAK', kod), x);
  };
  for (const k of P.ka) if (!(k.kartica_vrsta === 'TROSAK' && k.tura_id)) ostalo('KASA', k.id, k.datum, k.firma_id, k.kartica_vrsta, k.kartica_kod, k.smer, k.iznos_eur, k.broj, k.opis);
  for (const r of P.rn) {
    ostalo('RUCNI', r.id, r.datum, r.firma_id, r.kartica_vrsta, r.kartica_kod, r.smer, r.iznos_eur, r.broj, r.opis);
    if (r.protiv_vrsta) ostalo('RUCNI', r.id, r.datum, r.firma_id, r.protiv_vrsta, r.protiv_kod, r.smer === 'ULAZ' ? 'IZLAZ' : 'ULAZ', r.iznos_eur, r.broj, r.opis);
  }
  P.kes[kk] = L;
  return L;
}

// Amortizacija vozila izabrane firme za period (najkasnije do danas)
function amortBilansa(P, firma, od, doo) {
  const kraj = !doo || doo > danas() ? danas() : doo, vozila = [], greske = [];
  for (const a of P.am) {
    const v = (S.vozila || []).find(x => x.id === a.vozilo_id);
    if (!v || (firma && v.firma_id !== firma)) continue;
    const p = amortParametri(a);
    if (p.greska) { greske.push({ v, a, greska: p.greska }); continue; }
    vozila.push({ v, a, p, eur: od && od > kraj ? 0 : amortU(p, od, kraj) });
  }
  return { vozila, greske, kraj };
}

function racunajBilans(P, firma, od, doo) {
  const m = new Map(), red = (sek, kljuc, naziv) => m.get(kljuc) || m.set(kljuc, { sek, kljuc, naziv, iznos: 0, n: 0, stavke: [] }).get(kljuc);
  for (const x of stavkeBilansa(P, firma)) {
    if ((od && x.datum < od) || (doo && x.datum > doo)) continue;
    const r = red(x.sek, x.kljuc, x.naziv); r.iznos += x.eur; r.n++; r.stavke.push(x);
  }
  const am = amortBilansa(P, firma, od, doo);
  for (const x of am.vozila) {
    if (x.eur < 0.005) continue;
    const g = x.a.amort_grupa, r = red('AMORT', `AMORT:${g || 'POSEBNA'}`, g ? sifNaziv('AMORT_GRUPA', g) : 'Vozila sa posebnom stopom');
    r.iznos += x.eur; r.n++; r.stavke.push({ ...x, sek: 'AMORT' });
  }
  const sek = {}, zb = {};
  for (const s of BIL_SEKCIJE) {
    sek[s.k] = [...m.values()].filter(r => r.sek === s.k).map(r => ({ ...r, iznos: zaokruzi(r.iznos) }))
      .sort((a, b) => b.iznos - a.iznos || a.naziv.localeCompare(b.naziv, 'sr'));
    zb[s.k] = zaokruzi(sek[s.k].reduce((s2, r) => s2 + r.iznos, 0));
  }
  const T = zaokruzi(zb.TROSAK + zb.VOZACI + zb.INTERNI);
  return { sek, zb, P: zb.PRIHOD, T, A: zb.AMORT, R1: zaokruzi(zb.PRIHOD - T), R2: zaokruzi(zb.PRIHOD - T - zb.AMORT), am, od, do: doo };
}

// Uporedni period: „prethodni“ (celi meseci → isto toliko meseci ranije; inače isti broj dana neposredno pre)
// ili „isti period prošle godine“. Period u toku poredi se do istog dana (npr. 1.–29. oktobar sa 1.–29. septembrom).
function uporedniPeriod(od, doo, vrsta) {
  if (!od || !vrsta) return null;
  const kraj = !doo || doo > danas() ? danas() : doo;
  if (kraj < od) return null;
  if (vrsta === 'GODINA') return [dodajMesece(od, -12), dodajMesece(kraj, -12)];
  if (od.slice(8) === '01' && doo && doo === krajMeseca(doo)) {
    const n = (+doo.slice(0, 4) - +od.slice(0, 4)) * 12 + (+doo.slice(5, 7) - +od.slice(5, 7)) + 1;
    return [dodajMesece(od, -n), kraj === doo ? krajMeseca(dodajMesece(doo, -n)) : dodajMesece(kraj, -n)];
  }
  const d2 = danPre(od);
  return [dodajDane(d2, -danaIzmedju(od, kraj)), d2];
}
function meseciPerioda(P, od, doo) {
  const b = doo || danas();
  const a = od || stavkeBilansa(P, BIL.firma).map(x => x.datum).filter(Boolean).sort()[0] || pocetakMeseca(danas());
  const l = [];
  for (let m = pocetakMeseca(a); m <= b && l.length < 61; m = dodajMesece(m, 1)) l.push([m < a ? a : m, krajMeseca(m) > b ? b : krajMeseca(m), m]);
  return l;
}

// Redovi izveštaja (isti za ekran, CSV i štampu); v = iznos po koloni (rezultati u nizu kol)
function redoviBilansa(kol, Bt, poZbiru) {
  const R = [], nadji = (B, s, k) => B.sek[s].find(r => r.kljuc === k), zbir = v => v.reduce((s, x) => s + x, 0);
  for (const s of BIL_SEKCIJE) {
    if (s.k === 'AMORT') R.push({ tip: 'uk2', naziv: 'Ukupni troškovi (bez amortizacije)', v: kol.map(B => B.T) }, { tip: 'rez', naziv: 'Rezultat pre amortizacije', v: kol.map(B => B.R1) });
    const kljucevi = [...new Set(kol.flatMap(B => B.sek[s.k].map(r => r.kljuc)))];
    if (!kljucevi.length && !s.prazno) continue;
    const redovi = kljucevi.map(k => {
      const prvi = kol.map(B => nadji(B, s.k, k)).find(Boolean);
      return { tip: 'stavka', sek: s.k, kljuc: k, naziv: prvi.naziv, v: kol.map(B => nadji(B, s.k, k)?.iznos || 0), red: nadji(Bt, s.k, k) || { ...prvi, iznos: 0, n: 0, stavke: [] } };
    }).sort((a, b) => (poZbiru ? zbir(b.v) - zbir(a.v) : b.v[0] - a.v[0]) || a.naziv.localeCompare(b.naziv, 'sr'));
    R.push({ tip: 'sek', naziv: s.n }, ...redovi, redovi.length ? { tip: 'uk', naziv: s.uk, v: kol.map(B => B.zb[s.k]) } : { tip: 'prazno', naziv: s.prazno });
  }
  R.push({ tip: 'rez', naziv: 'Poslovni rezultat (posle amortizacije)', v: kol.map(B => B.R2) });
  return R;
}
const klasaReda = (r, zaStampu) => (r.tip === 'sek' ? 'sekcija' : r.tip === 'stavka' ? (zaStampu ? '' : 'klik') : r.tip === 'prazno' ? 'prazno-red' : zaStampu ? 'uk' : r.tip === 'rez' ? 'ukupno rez' : 'ukupno');
function tabelaUkupno(R, B, U, up, zaStampu) {
  const c = zaStampu ? 'b' : 'broj', n = U ? 6 : 3;
  const izn = (r, x) => (r.tip === 'rez' && !zaStampu ? (x < -0.0049 ? `<span class="minus">${bBroj(x)}</span>` : bBroj(x)) : bBroj(x));
  const pct = x => (B.P ? fmtBroj(x / B.P * 100, 1).replace('-', '−') : '');
  return `<table class="${zaStampu ? 't' : 'bilans'}"><thead><tr><th>Stavka</th><th class="${c}">Iznos EUR</th><th class="${c}">% prihoda</th>
      ${U ? `<th class="${c}">Uporedno EUR<br><small>${esc(perTekst(up[0], up[1]))}</small></th><th class="${c}">Razlika EUR</th><th class="${c}">Razlika %</th>` : ''}</tr></thead><tbody>
    ${R.map((r, i) => {
      const kl = klasaReda(r, zaStampu), atr = `${kl ? ` class="${kl}"` : ''}${r.tip === 'stavka' && !zaStampu ? ` data-i="${i}" tabindex="0"` : ''}`;
      if (r.tip === 'sek' || r.tip === 'prazno') return `<tr${atr}><td colspan="${n}">${esc(r.naziv)}</td></tr>`;
      const naziv = r.tip === 'rez' || r.tip === 'uk2' ? `<b>${esc(r.naziv)}</b>` : esc(r.naziv);
      const raz = U ? r.v[0] - r.v[1] : 0;
      return `<tr${atr}><td>${naziv}</td><td class="${c}">${izn(r, r.v[0])}</td><td class="${c}">${pct(r.v[0])}</td>
        ${U ? `<td class="${c}">${bBroj(r.v[1])}</td><td class="${c}">${bRazlika(raz)}</td><td class="${c}">${Math.abs(r.v[1]) > 0.0049 ? bRazlika(raz / Math.abs(r.v[1]) * 100, 1) : ''}</td>` : ''}</tr>`;
    }).join('')}</tbody></table>`;
}
function tabelaMeseci(R, mes, zaStampu) {
  const c = zaStampu ? 'b' : 'broj', n = mes.length + 2, zbir = v => zaokruzi(v.reduce((s, x) => s + x, 0));
  const izn = (r, x) => (r.tip === 'rez' && !zaStampu && x < -0.0049 ? `<span class="minus">${bBroj(x)}</span>` : (Math.abs(x) < 0.005 && r.tip === 'stavka' ? '' : bBroj(x)));
  return `<table class="${zaStampu ? 't' : 'bilans bilans-meseci'}"${zaStampu && mes.length > 6 ? ' style="font-size:7pt"' : ''}><thead><tr><th>Stavka</th>
      ${mes.map(m => `<th class="${c}">${esc(mesecKratko(m[2]))}</th>`).join('')}<th class="${c}">Ukupno</th></tr></thead><tbody>
    ${R.map((r, i) => {
      const kl = klasaReda(r, zaStampu), atr = `${kl ? ` class="${kl}"` : ''}${r.tip === 'stavka' && !zaStampu ? ` data-i="${i}" tabindex="0"` : ''}`;
      if (r.tip === 'sek' || r.tip === 'prazno') return `<tr${atr}><td colspan="${n}">${esc(r.naziv)}</td></tr>`;
      return `<tr${atr}><td>${r.tip === 'rez' || r.tip === 'uk2' ? `<b>${esc(r.naziv)}</b>` : esc(r.naziv)}</td>${r.v.map(x => `<td class="${c}">${izn(r, x)}</td>`).join('')}<td class="${c}"><b>${izn(r, zbir(r.v))}</b></td></tr>`;
    }).join('')}</tbody></table>`;
}

// Dokumenti (ili vozila) iz kojih je nastala jedna stavka bilansa
function dijalogStavkeBilansa(red, per) {

  const uk = zaokruzi(st.reduce((s, x) => s + x.eur, 0));
