      ? `<table><thead><tr><th>Vozilo</th><th>Firma</th><th class="broj">Stopa %</th><th class="broj">Mesečno EUR</th><th class="broj">U periodu EUR</th></tr></thead><tbody>
        ${st.map((x, i) => `<tr data-i="${i}" class="klik" tabindex="0"><td>${tablica(x.v.registracija)} ${esc([x.v.marka, x.v.model].filter(Boolean).join(' '))}</td><td>${esc(firmaKod(x.v.firma_id))}</td>
          <td class="broj">${fmtBroj(x.p.stopa)}</td><td class="broj">${fmtBroj(x.p.M)}</td><td class="broj">${fmtBroj(x.eur)}</td></tr>`).join('')}
        <tr class="ukupno"><td colspan="4">Ukupno (${st.length})</td><td class="broj">${bBroj(uk)}</td></tr></tbody></table>`
      : `<table><thead><tr><th>Datum</th><th>Dokument</th><th>Izvor</th><th>Opis</th><th>Firma</th><th class="broj">Iznos EUR</th></tr></thead><tbody>
        ${st.map((x, i) => `<tr data-i="${i}" class="klik" tabindex="0"><td class="nw">${fmtDatum(x.datum)}</td><td class="nw">${esc(x.dokument || '')}</td><td>${esc(IZVORI[x.izvor] || x.izvor)}</td>
          <td class="opis">${esc(x.opis || '')}</td><td>${esc(firmaKod(x.firma_id))}</td><td class="broj">${bBroj(x.eur)}</td></tr>`).join('')}
        <tr class="ukupno"><td colspan="5">Ukupno (${st.length})</td><td class="broj">${bBroj(uk)}</td></tr></tbody></table>`}</div></div>
    <footer><button class="dugme" id="bs-csv" type="button">Izvoz u Excel (CSV)</button><div class="desno"><button class="dugme" id="bs-zatvori" type="button">Zatvori</button></div></footer></aside>`;
  document.body.appendChild(z);
  z.addEventListener('mousedown', e => { if (e.target === z) zatvoriFioku(); });
  document.addEventListener('keydown', escFioka);
  $('#bs-zatvori').onclick = () => zatvoriFioku();
  $('#bs-csv').onclick = () => izvozCSV(`bilans_${bezbednoIme(red.naziv).replace(/\./g, '_')}_${BIL.od || 'pocetak'}_${BIL.do || danas()}.csv`, amort
    ? [['Vozilo', x => x.v.registracija], ['Firma', x => firmaKod(x.v.firma_id)], ['Stopa %', x => csvBroj(x.p.stopa)], ['Mesečno EUR', x => csvBroj(x.p.M)], ['U periodu EUR', x => csvBroj(x.eur)]]
    : [['Datum', x => fmtDatum(x.datum)], ['Dokument', 'dokument'], ['Izvor', x => IZVORI[x.izvor] || x.izvor], ['Opis', 'opis'], ['Firma', x => firmaKod(x.firma_id)], ['Iznos EUR', x => csvBroj(x.eur)]], st);
  veziKlikove(z, st, x => (amort ? otvoriFioku('vozila', x.v, 'amortizacija') : otvoriIzvor(x, async () => { await osveziListu(); })));
  z.querySelector('tr.klik')?.focus();
}

async function prikaziBilans() {
  ugasiGrafikone();
  const tabovi = [['bilans', 'Bilans uspeha'], ['amortizacija', 'Amortizacija vozila']];
  postaviSadrzaj(`
    <div class="zaglavlje"><div><h1>Bilans uspeha</h1>
      <p>Prihodi, troškovi i rezultat za izabrani period, sa amortizacijom vozila. Iznosi u EUR bez PDV-a. Klik na stavku pokazuje dokumente iz kojih je nastala.</p></div>
      <div class="alati no-print" style="margin:0"><button class="dugme" id="bu-csv">Izvoz u Excel (CSV)</button><button class="dugme" id="bu-stampa">Štampaj</button></div></div>
    <div class="alati"><div class="segmenti" id="bu-tab">${tabovi.map(([v, t]) => `<button data-v="${v}" class="${BIL.tab === v ? 'aktivan' : ''}">${t}</button>`).join('')}</div></div>
    <div class="filteri" id="bu-filteri"></div>
    <div id="bu-upozorenje"></div>
    <div id="bu-kpi"></div>
    <div id="bu-graf"></div>
    <div class="tabela-okvir" id="bu-tabela"><div class="prazno">Učitavanje…</div></div>
    <div id="bu-dno"></div>`);
  let P = null, zadnji = null;
  const kpi = (n, v, d, kl = '') => `<div class="kpi"><span>${n}</span><b class="${kl}">${v}</b><small>${d}</small></div>`;
  const eur0 = x => `${bBroj(x, 0)} €`;
  const krajAm = () => (!BIL.do || BIL.do > danas() ? danas() : BIL.do);

  const crtajFiltere = () => {
    const am = BIL.tab === 'amortizacija', bezPor = BIL.prikaz === 'MESECI' || !BIL.od;
    $('#bu-filteri').innerHTML = `
      <label>Period<select id="bu-period">${BIL_PERIODI.map(([v, t]) => `<option value="${v}"${v === BIL.period ? ' selected' : ''}>${t}</option>`).join('')}</select></label>
      <label>Od<input type="date" id="bu-od" value="${esc(BIL.od)}"></label><label>Do<input type="date" id="bu-do" value="${esc(BIL.do)}"></label>
      ${S.firme.length > 1 ? `<label>Firma<select id="bu-firma"><option value="">${am ? 'Sve firme' : 'Sve (bez internih faktura)'}</option>${S.firme.map(f => `<option value="${f.id}"${f.id === BIL.firma ? ' selected' : ''}>${esc(f.kod)}</option>`).join('')}</select></label>` : ''}
      ${am ? `<label class="prekidac"><input type="checkbox" id="bu-bez"${BIL.bezVrednosti ? ' checked' : ''}> I vozila bez upisane vrednosti</label>`
        : `<label>Prikaz<select id="bu-prikaz">${[['UKUPNO', 'Ukupno za period'], ['MESECI', 'Po mesecima']].map(([v, t]) => `<option value="${v}"${v === BIL.prikaz ? ' selected' : ''}>${t}</option>`).join('')}</select></label>
        <label>Poređenje<select id="bu-poredjenje"${bezPor ? ' disabled title="Poređenje radi uz prikaz „Ukupno za period“ i period sa početnim datumom."' : ''}>${BIL_POREDJENJE.map(([v, t]) => `<option value="${v}"${v === BIL.poredjenje && !bezPor ? ' selected' : ''}>${t}</option>`).join('')}</select></label>`}
      <button class="dugme malo" id="bu-ponisti" type="button">Poništi filtere</button>`;
    const ponovo = () => { crtajFiltere(); crtaj(); };
    $('#bu-period').onchange = e => { BIL.period = e.target.value; if (BIL.period !== 'RUCNO') [BIL.od, BIL.do] = opsegPerioda(BIL.period); ponovo(); };
    $('#bu-od').onchange = e => { BIL.od = e.target.value; BIL.period = 'RUCNO'; ponovo(); };
    $('#bu-do').onchange = e => { BIL.do = e.target.value; BIL.period = 'RUCNO'; ponovo(); };
    if ($('#bu-firma')) $('#bu-firma').onchange = e => { BIL.firma = e.target.value; crtaj(); };
    if ($('#bu-bez')) $('#bu-bez').onchange = e => { BIL.bezVrednosti = e.target.checked; crtaj(); };
    if ($('#bu-prikaz')) $('#bu-prikaz').onchange = e => { BIL.prikaz = e.target.value; ponovo(); };
    if ($('#bu-poredjenje')) $('#bu-poredjenje').onchange = e => { BIL.poredjenje = e.target.value; crtaj(); };
    $('#bu-ponisti').onclick = () => { Object.assign(BIL, { period: 'OVA_GODINA', firma: '', prikaz: 'UKUPNO', poredjenje: '', bezVrednosti: false }); [BIL.od, BIL.do] = opsegPerioda(BIL.period); ponovo(); };
  };

  const upozorenja = B => {
    const l = [];
    if (P.amGreska) l.push(`<div class="napomena upozorenje">${esc(P.amGreska)}</div>`);
    else {
      if (B.am.greske.length) l.push(`<div class="napomena upozorenje">Amortizacija se ne računa za vozila sa nepotpunim podacima: ${B.am.greske.map(x => `${esc(x.v.registracija)} (${esc(x.greska)})`).join(', ')}. Dopunite u Vozila → vozilo → Vrednost i amortizacija.</div>`);
      const bez = (S.vozila || []).filter(v => v.aktivno !== false && (!BIL.firma || v.firma_id === BIL.firma) && !P.am.some(a => a.vozilo_id === v.id));
      if (bez.length) l.push(`<div class="napomena">${P.am.length ? `Vozila u upotrebi bez upisane vrednosti: ${bez.length} – njihova amortizacija nije u bilansu.` : 'Vrednost vozila još nije upisana, pa amortizacija nije u bilansu.'} Upisuje se u Vozila → vozilo → Vrednost i amortizacija (administrator).
        <button class="dugme malo" type="button" id="bu-bez-link" style="margin-left:6px">Prikaži vozila</button></div>`);
    }
    $('#bu-upozorenje').innerHTML = l.join('');
    if ($('#bu-bez-link')) $('#bu-bez-link').onclick = () => { BIL.tab = 'amortizacija'; BIL.bezVrednosti = true; $$('#bu-tab button').forEach(x => x.classList.toggle('aktivan', x.dataset.v === 'amortizacija')); crtajFiltere(); crtaj(); };
  };

  const crtajBilans = () => {
    const od = BIL.od, doo = BIL.do, f = BIL.firma;
    $('#bu-graf').innerHTML = ''; zadnji = null;
    if (od && doo && od > doo) {
      $('#bu-upozorenje').innerHTML = ''; $('#bu-kpi').innerHTML = ''; $('#bu-dno').innerHTML = '';
      $('#bu-tabela').innerHTML = '<div class="prazno"><b>Proverite period</b>Datum „Od“ je posle datuma „Do“.</div>';
      return;
    }
    const B = racunajBilans(P, f, od, doo);
    const up = BIL.prikaz === 'UKUPNO' ? uporedniPeriod(od, doo, BIL.poredjenje) : null, U = up ? racunajBilans(P, f, up[0], up[1]) : null;
    upozorenja(B);
    const pr = (a, b) => `uporedno ${eur0(b)}${Math.abs(b) > 0.005 ? ` (${bRazlika((a - b) / Math.abs(b) * 100, 1)} %)` : ''}`;
    const marza = r => (B.P ? `marža ${bBroj(r / B.P * 100, 1)} %` : '—');
    $('#bu-kpi').innerHTML = `<div class="kpi-traka">
      ${kpi('Prihodi', eur0(B.P), U ? pr(B.P, U.P) : 'fakturisano, bez PDV-a')}
      ${kpi('Troškovi bez amortizacije', eur0(B.T), U ? pr(B.T, U.T) : (B.P ? `${bBroj(B.T / B.P * 100, 1)} % prihoda` : '—'))}
      ${kpi('Rezultat pre amortizacije', eur0(B.R1), U ? pr(B.R1, U.R1) : marza(B.R1), B.R1 < -0.005 ? 'minus' : '')}
      ${kpi('Amortizacija vozila', eur0(B.A), U ? pr(B.A, U.A) : nVozila(B.am.vozila.filter(x => x.eur >= 0.005).length))}
      ${kpi('Poslovni rezultat', eur0(B.R2), U ? pr(B.R2, U.R2) : marza(B.R2), B.R2 < -0.005 ? 'minus' : '')}</div>`;
    let R;
    if (BIL.prikaz === 'MESECI') {
      const mes = meseciPerioda(P, od, doo);
      if (mes.length > 24) {
        $('#bu-tabela').innerHTML = `<div class="prazno"><b>Period je predug za prikaz po mesecima (${mes.length > 60 ? 'više od 60' : mes.length} meseci)</b>Izaberite period do 24 meseca ili prikaz „Ukupno za period“.</div>`;
        $('#bu-dno').innerHTML = '';
        return;
      }
      const kol = mes.map(([a, b]) => racunajBilans(P, f, a, b));
      R = redoviBilansa(kol, B, true);
      $('#bu-tabela').innerHTML = tabelaMeseci(R, mes, false);
      zadnji = { R, B, mes };
      if (kol.length > 1) {
        const buduci = i => mes[i][2] > danas();
        $('#bu-graf').innerHTML = `<div class="grafici" style="margin-bottom:16px">${panel('g-bilans', 'Prihodi, troškovi i rezultat po mesecima', `Poslovni rezultat za period: ${eur0(B.R2)}. Troškovi uključuju amortizaciju vozila.`, true)}</div>`;
        grafikon($('#g-bilans'), { data: { labels: mes.map(m => mesecKratko(m[2])), datasets: [
          { type: 'bar', label: 'Prihodi', data: kol.map((x, i) => (buduci(i) ? null : x.P)), backgroundColor: BOJE.petrol, borderRadius: 3, order: 2 },
          { type: 'bar', label: 'Troškovi sa amortizacijom', data: kol.map((x, i) => (buduci(i) ? null : zaokruzi(x.T + x.A))), backgroundColor: BOJE.sivaSv, borderRadius: 3, order: 3 },
          { type: 'line', label: 'Poslovni rezultat', data: kol.map((x, i) => (buduci(i) ? null : x.R2)), borderColor: BOJE.signal, backgroundColor: BOJE.signal, tension: 0.25, pointRadius: 3, order: 1 }] },
          options: { scales: { y: osaEur, x: bezMreze } } });
      }
    } else {
      R = redoviBilansa(U ? [B, U] : [B], B, false);
      $('#bu-tabela').innerHTML = tabelaUkupno(R, B, U, up, false);
      zadnji = { R, B, U, up };
    }
    veziKlikove($('#bu-tabela'), R, r => dijalogStavkeBilansa(r.red, `Period ${perTekst(od, doo)}`));
    $('#bu-dno').innerHTML = `<p class="tekst-2" style="max-width:95ch;margin-top:12px">Period ${perTekst(od, doo)}${f ? `, firma ${esc(firmaKod(f))}` : ', sve firme'}${up ? `; uporedno ${perTekst(up[0], up[1])}` : ''}. ${esc(BIL_NAPOMENA)}</p>`;
  };

  // Amortizacija vozila: pregled po vozilu za period (stanje na kraju perioda, najkasnije danas)
  const amortRedovi = () => {
    const kraj = krajAm(), od = BIL.od;
    return (S.vozila || []).filter(v => !BIL.firma || v.firma_id === BIL.firma).map(v => {
      const a = P.am.find(x => x.vozilo_id === v.id) || null, p = a ? amortParametri(a) : { greska: 'vrednost nije upisana' };
      const otp = p.greska ? 0 : amortDo(p, kraj);
      return { v, a, p, eur: p.greska || (od && od > kraj) ? 0 : amortU(p, od, kraj), otp, sad: p.greska ? 0 : p.V - otp };
    }).filter(x => x.a || (BIL.bezVrednosti && x.v.aktivno !== false))
      .sort((x, y) => (!!y.a - !!x.a) || String(x.v.registracija).localeCompare(String(y.v.registracija), 'sr'));
  };
  const amortHTML = (redovi, zaStampu) => {
    const c = zaStampu ? 'b' : 'broj', kraj = krajAm(), ok = x => !x.p.greska;
    const tekuce = x => ok(x) && kraj >= x.p.pocetak && kraj <= x.p.kraj;    // u amortizaciji na kraju perioda
    const uk = f => zaokruzi(redovi.filter(ok).reduce((s, x) => s + f(x), 0));
    const grupa = x => (!x.a ? '' : `${esc(x.a.amort_grupa ? sifNaziv('AMORT_GRUPA', x.a.amort_grupa) : 'Posebna stopa')}${ok(x) ? (zaStampu ? `, ${fmtBroj(x.p.stopa)} %` : `<div class="tekst-2">${fmtBroj(x.p.stopa)} % godišnje</div>`) : ''}`);
    return `<table class="${zaStampu ? 't' : 'amort-tabela'}"><thead><tr><th>Vozilo</th>${zaStampu ? '<th>Firma</th>' : ''}<th>Grupa i stopa</th><th class="${c}">Nabavna vrednost EUR${zaStampu ? '' : '<br><small>datum nabavke</small>'}</th>${zaStampu ? '<th>Nabavljeno</th>' : ''}
        <th class="${c}">Mesečno EUR</th><th class="${c}">U periodu EUR</th><th class="${c}">Otpisano EUR<br><small>do ${fmtDatum(kraj)}</small></th><th class="${c}">Sadašnja vrednost EUR</th><th>Status</th></tr></thead><tbody>
      ${redovi.map((x, i) => `<tr${zaStampu ? '' : ` data-i="${i}" class="klik" tabindex="0"`}><td>${zaStampu ? esc(x.v.registracija) : tablica(x.v.registracija)}<div class="tekst-2">${esc([sifNaziv('TIP_VOZILA', x.v.tip), zaStampu ? '' : firmaKod(x.v.firma_id)].filter(Boolean).join(', '))}</div></td>${zaStampu ? `<td>${esc(firmaKod(x.v.firma_id))}</td>` : ''}
        <td>${grupa(x)}</td><td class="${c}">${ok(x) ? fmtBroj(x.p.V) : x.a ? `${fmtBroj(x.a.nabavna_vrednost)} ${esc(x.a.valuta)}` : ''}${zaStampu ? `</td><td class="nw">${fmtDatum(x.a?.datum_nabavke)}` : x.a ? `<div class="tekst-2">${fmtDatum(x.a.datum_nabavke)}</div>` : ''}</td>
        <td class="${c}">${tekuce(x) ? fmtBroj(x.p.M) : ''}</td><td class="${c}">${ok(x) ? fmtBroj(x.eur) : ''}</td><td class="${c}">${ok(x) ? fmtBroj(x.otp) : ''}</td><td class="${c}">${ok(x) ? fmtBroj(x.sad) : ''}</td>
        <td>${zaStampu ? esc(statusAmortTekst(x.a, x.p, kraj)) : statusAmortizacije(x.a, x.p, kraj)}</td></tr>`).join('')}
      <tr class="${zaStampu ? 'uk' : 'ukupno'}"><td colspan="${zaStampu ? 3 : 2}">Ukupno (${nVozila(redovi.filter(ok).length)} sa amortizacijom)</td><td class="${c}">${fmtBroj(uk(x => x.p.V))}</td>${zaStampu ? '<td></td>' : ''}<td class="${c}">${fmtBroj(uk(x => (tekuce(x) ? x.p.M : 0)))}</td>
        <td class="${c}">${fmtBroj(uk(x => x.eur))}</td><td class="${c}">${fmtBroj(uk(x => x.otp))}</td><td class="${c}">${fmtBroj(uk(x => x.sad))}</td><td></td></tr></tbody></table>`;
  };
  const crtajAmort = () => {
    zadnji = null; $('#bu-graf').innerHTML = '';
    $('#bu-upozorenje').innerHTML = P.amGreska ? `<div class="napomena upozorenje">${esc(P.amGreska)}</div>` : '';
    if (P.amGreska) { $('#bu-kpi').innerHTML = ''; $('#bu-tabela').innerHTML = ''; $('#bu-dno').innerHTML = ''; return; }
    const redovi = amortRedovi(), ok = redovi.filter(x => !x.p.greska), kraj = krajAm();
    const zb = k => ok.reduce((s, x) => s + (k === 'V' ? x.p.V : x[k]), 0);
    $('#bu-kpi').innerHTML = ok.length ? `<div class="kpi-traka">${kpi('Vozila sa amortizacijom', String(ok.length), `od ukupno ${nVozila((S.vozila || []).filter(v => !BIL.firma || v.firma_id === BIL.firma).length)}`)}
      ${kpi('Nabavna vrednost', eur0(zb('V')), 'bez PDV-a')}${kpi('Amortizacija u periodu', eur0(zb('eur')), perTekst(BIL.od, BIL.do))}
      ${kpi('Sadašnja vrednost', eur0(zb('sad')), `na dan ${fmtDatum(kraj)}`)}</div>` : '';
    if (!redovi.length) {
      $('#bu-tabela').innerHTML = `<div class="prazno"><b>Nijedno vozilo nema upisanu vrednost</b>${ima(['ADMIN']) ? 'Vozila → vozilo → kartica „Vrednost i amortizacija“: nabavna vrednost, datum nabavke i amortizaciona grupa.' : 'Vrednost vozila upisuje administrator.'}
        ${BIL.bezVrednosti ? '' : '<br><button class="dugme malo" type="button" id="bu-bez2" style="margin-top:10px">Prikaži vozila bez vrednosti</button>'}</div>`;
      if ($('#bu-bez2')) $('#bu-bez2').onclick = () => { BIL.bezVrednosti = true; crtajFiltere(); crtaj(); };
      $('#bu-dno').innerHTML = '';
      return;
    }
    $('#bu-tabela').innerHTML = amortHTML(redovi, false);
    veziKlikove($('#bu-tabela'), redovi, x => otvoriFioku('vozila', x.v, 'amortizacija'));
    $('#bu-dno').innerHTML = `<p class="tekst-2" style="max-width:95ch;margin-top:12px">Amortizacija u periodu ${perTekst(BIL.od, BIL.do)} ista je kao u bilansu uspeha; računa se najkasnije do danas. Linearna metoda po vozilu: (nabavna − preostala vrednost) / kurs × stopa / 12 mesečno, od 1. dana meseca posle nabavke, zaključno sa mesecom prodaje. Stope: Šifarnici → Amortizacione grupe; promena stope menja amortizaciju i za prošle periode. Klik na vozilo otvara njegovu vrednost i plan amortizacije.</p>`;
  };

  const crtaj = () => {
    if (!P) return;
    ugasiGrafikone();
    if (BIL.tab === 'amortizacija') crtajAmort(); else crtajBilans();
  };
  $$('#bu-tab button').forEach(b => b.onclick = () => { BIL.tab = b.dataset.v; $$('#bu-tab button').forEach(x => x.classList.toggle('aktivan', x === b)); crtajFiltere(); crtaj(); });
  $('#bu-csv').onclick = () => {
    const per = `${BIL.od || 'pocetak'}_${BIL.do || danas()}${BIL.firma ? `_${firmaKod(BIL.firma)}` : ''}`;
    if (BIL.tab === 'amortizacija') {
      if (!P || P.amGreska) return poruka('Nema podataka za izvoz.', true);
      const r = amortRedovi(); if (!r.length) return poruka('Nema podataka za izvoz.', true);
      const ok = x => !x.p.greska, kraj = krajAm();
      return izvozCSV(`amortizacija_vozila_${per}.csv`, [['Vozilo', x => x.v.registracija], ['Tip', x => sifNaziv('TIP_VOZILA', x.v.tip)], ['Firma', x => firmaKod(x.v.firma_id)],
        ['Grupa', x => (x.a?.amort_grupa ? sifNaziv('AMORT_GRUPA', x.a.amort_grupa) : '')], ['Stopa %', x => (ok(x) ? csvBroj(x.p.stopa) : '')], ['Nabavna vrednost', x => (x.a ? csvBroj(x.a.nabavna_vrednost) : '')],
        ['Valuta', x => x.a?.valuta || ''], ['Kurs', x => (x.a ? csvBroj(x.a.kurs, 4) : '')], ['Nabavna vrednost EUR', x => (ok(x) ? csvBroj(x.p.V) : '')], ['Datum nabavke', x => fmtDatum(x.a?.datum_nabavke)],
        ['Mesečno EUR', x => (ok(x) ? csvBroj(x.p.M) : '')], ['U periodu EUR', x => (ok(x) ? csvBroj(x.eur) : '')], [`Otpisano do ${fmtDatum(kraj)} EUR`, x => (ok(x) ? csvBroj(x.otp) : '')],
        ['Sadašnja vrednost EUR', x => (ok(x) ? csvBroj(x.sad) : '')], ['Status', x => statusAmortTekst(x.a, x.p, kraj)]], r);
    }
    if (!zadnji) return poruka('Nema podataka za izvoz.', true);
    let grupa = '';
    const redovi = zadnji.R.map(r => { if (r.tip === 'sek') grupa = r.naziv; return { ...r, grupa: r.tip === 'stavka' ? grupa : '' }; }).filter(r => r.tip !== 'sek' && r.tip !== 'prazno');
    const z = zadnji, zbir = v => zaokruzi(v.reduce((s, x) => s + x, 0));
    izvozCSV(`bilans_uspeha_${per}.csv`, [['Grupa', 'grupa'], ['Stavka', 'naziv'], ...(z.mes
      ? [...z.mes.map((m, i) => [mesecKratko(m[2]), r => csvBroj(r.v[i])]), ['Ukupno EUR', r => csvBroj(zbir(r.v))]]
      : [['Iznos EUR', r => csvBroj(r.v[0])], ['% prihoda', r => (z.B.P ? csvBroj(r.v[0] / z.B.P * 100, 1) : '')], ...(z.U ? [[`Uporedno ${perTekst(z.up[0], z.up[1])} EUR`, r => csvBroj(r.v[1])],
        ['Razlika EUR', r => csvBroj(r.v[0] - r.v[1])], ['Razlika %', r => (Math.abs(r.v[1]) > 0.0049 ? csvBroj((r.v[0] - r.v[1]) / Math.abs(r.v[1]) * 100, 1) : '')]] : [])])], redovi);
  };
  $('#bu-stampa').onclick = () => {
    if (!P) return;
    const fi = BIL.firma, per = `Period ${perTekst(BIL.od, BIL.do)}`;
    if (BIL.tab === 'amortizacija') {
      const r = amortRedovi(); if (P.amGreska || !r.length) return poruka('Nema podataka za štampu.', true);
      return stampajIzvestaj('Amortizacija vozila', zaglavljeIzvestaja('Amortizacija vozila', fi, `${per} · stanje na dan ${fmtDatum(krajAm())}`) + amortHTML(r, true)
        + '<p class="nap">Linearna metoda po vozilu, od 1. dana meseca posle nabavke, zaključno sa mesecom prodaje; najkasnije do danas. Iznosi u EUR po kursu na dan nabavke.</p>');
    }
    if (!zadnji) return poruka('Nema podataka za štampu.', true);
    const z = zadnji;
    stampajIzvestaj('Bilans uspeha', zaglavljeIzvestaja('Bilans uspeha', fi, `${per}${z.up ? ` · uporedno ${perTekst(z.up[0], z.up[1])}` : ''}${fi ? '' : ' · bez internih faktura'}`)
      + (z.mes ? tabelaMeseci(z.R, z.mes, true) : tabelaUkupno(z.R, z.B, z.U, z.up, true)) + `<p class="nap">${esc(BIL_NAPOMENA)}</p>`
      + '<div class="potpisi"><div>Sastavio</div><div>Odobrio</div></div>');
  };
  osveziListu = async () => {
    if (S.ruta !== 'bilans') return;
    try { P = await bilansPodaci(); if (S.ruta !== 'bilans') return; crtajFiltere(); crtaj(); }
    catch (e) { $('#bu-tabela').innerHTML = `<div class="prazno"><b>Podaci nisu učitani</b>${esc(prevediGresku(e))}</div>`; }
  };
  crtajFiltere();
  await osveziListu();
}

// ============ MENI I RUTIRANJE ============
const STRANE = {
  pregled:   { naslov: 'Rokovi i alarmi', uloge: SVI,       prikaz: prikaziPregled },
  ture:      { naslov: 'Ture',            uloge: SVI,       prikaz: () => prikaziListuF('ture') },
  nalozi:    { naslov: 'Nalozi',          uloge: SVI,       prikaz: () => prikaziListuF('nalozi') },
  vozila:    { naslov: 'Vozila',          uloge: SVI,       prikaz: () => prikaziListu('vozila') },
  vozaci:    { naslov: 'Vozači',          uloge: SVI,       prikaz: () => prikaziListu('vozaci') },
  partneri:  { naslov: 'Partneri',        uloge: SVI,       prikaz: () => prikaziListu('partneri') },
  kasa:      { naslov: 'Kasa',            uloge: FIN_ULOGE, prikaz: prikaziKasu },
  kartice:   { naslov: 'Kartice',         uloge: FIN_ULOGE, prikaz: prikaziKartice },
  bilans:    { naslov: 'Bilans uspeha',   uloge: FIN_ULOGE, prikaz: prikaziBilans },
  potrazivanja: { naslov: 'Potraživanja', uloge: FIN_ULOGE, prikaz: () => prikaziListuF('potrazivanja') },
  ulazni:    { naslov: 'Ulazni računi',   uloge: FIN_ULOGE, prikaz: () => prikaziListuF('ulazni') },
  dopisi:    { naslov: 'Opomene i IOS',   uloge: FIN_ULOGE, prikaz: prikaziDopise },
  izvestaji: { naslov: 'Izveštaji',       uloge: FIN_ULOGE, prikaz: prikaziIzvestaje },
  firme:     { naslov: 'Naše firme',      uloge: ['ADMIN'], prikaz: () => prikaziListu('firme') },
  sifarnici: { naslov: 'Šifarnici',       uloge: ['ADMIN'], prikaz: prikaziSifarnike },
  korisnici: { naslov: 'Korisnici',       uloge: ['ADMIN'], prikaz: prikaziKorisnike },
  uvoz:      { naslov: 'Uvoz iz Excela',  uloge: ['ADMIN'], prikaz: prikaziUvoz }
};
const MENI = [
  { grupa: null,             stavke: ['pregled'] },
  { grupa: 'Operativa',      stavke: ['ture', 'nalozi', 'partneri'] },
  { grupa: 'Vozni park',     stavke: ['vozila', 'vozaci'] },
  { grupa: 'Finansije',      stavke: ['kasa', 'kartice', 'potrazivanja', 'ulazni', 'dopisi', 'bilans', 'izvestaji'] },
  { grupa: 'Administracija', stavke: ['firme', 'sifarnici', 'korisnici', 'uvoz'] }
];

function crtajMeni() {
  const nav = $('#meni-nav'); if (!nav) return;
  const aktivni = S.alarmi.filter(a => a.aktivan);
  const ist = aktivni.filter(a => a.status === 'ISTEKAO').length, usk = aktivni.filter(a => a.status === 'USKORO').length;
  nav.innerHTML = MENI.map(g => {
    const st = g.stavke.filter(s => ima(STRANE[s].uloge));
    if (!st.length) return '';
    return (g.grupa ? `<div class="grupa">${esc(g.grupa)}</div>` : '') + st.map(s => `<a href="#/${s}" class="${S.ruta === s ? 'aktivan' : ''}"${S.ruta === s ? ' aria-current="page"' : ''}>
      <span>${esc(STRANE[s].naslov)}</span>${s === 'pregled' && (ist || usk) ? `<span class="brojaci">${ist ? `<span class="brojac crveni" title="Istekli rokovi">${ist}</span>` : ''}${usk ? `<span class="brojac zuti" title="Ističu uskoro">${usk}</span>` : ''}</span>` : ''}</a>`).join('');
  }).join('');
}

function ruter() {
  ugasiGrafikone();
  const r = location.hash.replace(/^#\/?/, '') || 'pregled';
  const s = STRANE[r] && ima(STRANE[r].uloge) ? r : 'pregled';
  zatvoriFioku();
  S.ruta = s;
  osveziListu = () => {};
  crtajMeni();
  document.title = `${STRANE[s].naslov} – BALKAN TMS`;
  STRANE[s].prikaz();
}

function crtajOkvir() {
  $('#app').innerHTML = `<div class="okvir">
    <aside class="meni"><div class="znak"><b>BALKAN TMS</b><span>${esc(VERZIJA)}</span></div>
      <nav id="meni-nav" aria-label="Glavni meni"></nav>
      <div class="dno"><div class="ko">${esc(S.profil.ime || S.profil.email)}</div><div class="uloga">${esc(ULOGE[S.profil.uloga])}</div>
        <button id="dugme-lozinka">Promeni lozinku</button><button id="dugme-odjava">Odjava</button></div></aside>
    <main class="sadrzaj" id="sadrzaj"></main></div>`;
  $('#dugme-lozinka').onclick = promenaLozinke;
  $('#dugme-odjava').onclick = async () => { await Store.odjava(); prikaziPrijavu(); };
}

// ============ PRIJAVA I POKRETANJE ============
function prikaziPrijavu(tekst = '') {
  location.hash = '';
  $('#app').innerHTML = `<div class="ulaz"><form id="prijava" novalidate>
    <h1>BALKAN TMS</h1><div class="linija"></div>
    <p>Prijavite se e-mailom i lozinkom koje vam je dodelio administrator.</p>
    <label class="polje"><span>E-mail</span><input type="email" name="email" autocomplete="username" required></label>
    <label class="polje"><span>Lozinka</span><input type="password" name="lozinka" autocomplete="current-password" required></label>
    <button class="dugme glavno" type="submit">Prijava</button>
    <p class="tekst-2" id="prijava-poruka" role="alert">${esc(tekst)}</p></form></div>`;
  $('[name="email"]').focus();
  $('#prijava').onsubmit = async e => {
    e.preventDefault();
    const b = $('#prijava button'); b.disabled = true;
    try {
      S.sesija = await Store.prijava($('[name="email"]').value.trim(), $('[name="lozinka"]').value);
      await posle_prijave();
    } catch (er) { $('#prijava-poruka').textContent = prevediGresku(er); b.disabled = false; }
  };
}

function prikaziBezPristupa(tekst) {
  $('#app').innerHTML = `<div class="ulaz"><div class="kartica"><h1>BALKAN TMS</h1><div class="linija"></div>
    <p>${esc(tekst)}</p><button class="dugme" id="odjava2">Odjava</button></div></div>`;
  $('#odjava2').onclick = async () => { await Store.odjava(); prikaziPrijavu(); };
}

async function posle_prijave() {
  const id = S.sesija.user.id;
  S.profil = await Store.jedan('profili', id);
  if (!S.profil) return prikaziBezPristupa('Profil nije pronađen. Proverite da li je pokrenuta skripta 01_BAZA_TMS.sql.');
  if (!S.profil.aktivan) return prikaziBezPristupa('Vaš pristup je isključen. Obratite se administratoru.');
  if (!S.profil.uloga) return prikaziBezPristupa('Nalog je napravljen, ali još nema dodeljenu ulogu. Javite administratoru da vam dodeli ulogu, pa se ponovo prijavite.');
  await ucitajSifarnike();
  await Promise.all([ucitajAlarme(), ucitajPartnere(), ucitajVozni()]);
  crtajOkvir();
  ruter();
}

function citajKonfig() {
  const ugradjen = !/^UPISI_/.test(KONFIG.SUPABASE_URL) && !/^UPISI_/.test(KONFIG.SUPABASE_KLJUC);
  if (ugradjen) return { url: KONFIG.SUPABASE_URL.trim(), kljuc: KONFIG.SUPABASE_KLJUC.trim() };
  try { const x = JSON.parse(localStorage.getItem('tms_lite_konfig') || 'null'); if (x?.url && x?.kljuc) return x; } catch (e) { /* bez lokalnog podešavanja */ }
  return null;
}

function prikaziPodesavanje() {
  $('#app').innerHTML = `<div class="ulaz"><form id="konfig" novalidate>
    <h1>Povezivanje sa bazom</h1><div class="linija"></div>
    <p>Program još nije povezan sa Supabase bazom. Za probu na ovom računaru nalepite podatke ispod. Za sve korisnike ih upišite u fajl index.html (POCNI_OVDE.md, korak 4).</p>
    <label class="polje"><span>Project URL</span><input type="url" name="url" placeholder="https://xxxx.supabase.co" required></label>
    <label class="polje"><span>Publishable / anon ključ</span><input type="text" name="kljuc" required autocomplete="off"></label>
    <button class="dugme glavno" type="submit">Sačuvaj i nastavi</button></form></div>`;
  $('#konfig').onsubmit = e => {
    e.preventDefault();
    const url = $('[name="url"]').value.trim().replace(/\/+$/, ''), kljuc = $('[name="kljuc"]').value.trim();
    if (!/^https:\/\/.+/.test(url) || kljuc.length < 20) return poruka('Proverite URL (počinje sa https://) i ključ.', true);
    localStorage.setItem('tms_lite_konfig', JSON.stringify({ url, kljuc }));
    start();
  };
}

async function start() {
  if (!window.supabase?.createClient) {
    $('#app').innerHTML = '<div class="ulaz"><div class="kartica"><h1>BALKAN TMS</h1><p>Biblioteka za povezivanje nije učitana. Proverite internet vezu i osvežite stranicu.</p></div></div>';
    return;
  }
  const k = citajKonfig();
  if (!k) return prikaziPodesavanje();
  try {
    Store.init(k.url, k.kljuc);
    Store.sb.auth.onAuthStateChange(dogadjaj => { if (dogadjaj === 'SIGNED_OUT' && S.profil) { S.profil = null; prikaziPrijavu('Odjavljeni ste.'); } });
    S.sesija = await Store.sesija();
    if (!S.sesija) return prikaziPrijavu();
    await posle_prijave();
  } catch (e) {
    prikaziPrijavu(prevediGresku(e));
  }
}

window.addEventListener('hashchange', () => { if (S.profil) ruter(); });
start();
</script>
</body>
</html>
