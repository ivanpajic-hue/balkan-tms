<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BALKAN TMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --asfalt:#1F2A36; --asfalt-2:#2B3846; --asfalt-3:#3A4858;
  --papir:#F4F6F8; --karton:#FFFFFF; --linija:#D8DEE5; --linija-2:#E9EDF1;
  --tekst:#1F2A36; --tekst-2:#5A6775; --tekst-3:#8592A0;
  --petrol:#0E5E78; --petrol-2:#0B4A5F; --petrol-3:#E3EFF3;
  --signal:#8F6200; --signal-bg:#FCF1D6; --signal-jak:#E3A21A;
  --crvena:#B3342A; --crvena-bg:#FBE8E5;
  --zelena:#2D7449; --zelena-bg:#E4F1E9;
  --plava-tablica:#1D4FA0;
  --r:6px;
  --font:'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);font-size:15px;line-height:1.45;color:var(--tekst);background:var(--papir);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--petrol);outline-offset:2px}
[hidden]{display:none !important}
.tekst-2{color:var(--tekst-2)}
.ucitavanje{padding:48px;color:var(--tekst-2)}

/* raspored */
.okvir{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.meni{background:var(--asfalt);color:#C9D2DC;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.meni .znak{padding:20px 20px 16px;border-bottom:1px solid var(--asfalt-2)}
.meni .znak b{display:block;color:#fff;font-size:20px;font-weight:700;letter-spacing:.03em}
.meni .znak span{font-size:13px;color:#93A1B0}
.meni nav{padding:8px;flex:1;overflow:auto}
.meni .grupa{font-size:13px;color:#7F8E9E;padding:14px 12px 4px}
.meni a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:var(--r);color:#D5DDE5;text-decoration:none}
.meni a:hover{background:var(--asfalt-2);color:#fff}
.meni a.aktivan{background:var(--petrol);color:#fff}
.meni .brojaci{display:flex;gap:4px}
.meni .dno{padding:14px 20px;border-top:1px solid var(--asfalt-2);font-size:14px}
.meni .dno .ko{color:#fff;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meni .dno .uloga{color:#93A1B0;margin-bottom:6px}
.meni .dno button{background:none;border:0;color:#B9C5D1;padding:2px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-right:14px}
.meni .dno button:hover{color:#fff}
.brojac{min-width:22px;padding:0 6px;border-radius:11px;font-size:12.5px;font-weight:600;text-align:center;line-height:20px}
.brojac.crveni{background:var(--crvena);color:#fff}
.brojac.zuti{background:var(--signal-jak);color:var(--asfalt)}

.sadrzaj{min-width:0;padding:28px 36px 56px;max-width:1400px}
.zaglavlje{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.zaglavlje h1{font-size:28px;font-weight:600;margin:0;letter-spacing:-.01em;line-height:1.15}
.zaglavlje p{margin:4px 0 0;color:var(--tekst-2);max-width:70ch}
.alati{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.alati input[type=search]{width:320px;max-width:100%}

/* kontrole */
.dugme{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linija);background:var(--karton);padding:7px 14px;border-radius:var(--r);cursor:pointer;font-weight:500;white-space:nowrap;min-height:36px}
.dugme:hover{border-color:var(--tekst-3)}
.dugme.glavno{background:var(--petrol);border-color:var(--petrol);color:#fff}
.dugme.glavno:hover{background:var(--petrol-2);border-color:var(--petrol-2)}
.dugme.opasno{color:var(--crvena);border-color:#E7BDB7}
.dugme.opasno:hover{background:var(--crvena-bg)}
.dugme.malo{padding:3px 10px;min-height:30px;font-size:14px}
.dugme:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=search],input[type=email],input[type=password],input[type=number],input[type=date],input[type=url],select,textarea{width:100%;border:1px solid var(--linija);border-radius:var(--r);padding:7px 10px;background:#fff;min-height:36px}
input:hover,select:hover,textarea:hover{border-color:var(--tekst-3)}
textarea{min-height:76px;resize:vertical}
input:disabled,select:disabled,textarea:disabled{background:var(--papir);color:var(--tekst-2);border-color:var(--linija-2)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--petrol);margin:0}
.prekidac{display:inline-flex;gap:8px;align-items:center;cursor:pointer;user-select:none}

/* tabele */
.tabela-okvir{background:var(--karton);border:1px solid var(--linija);border-radius:var(--r);overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:600;font-size:14px;color:var(--tekst-2);background:#F8FAFB;border-bottom:1px solid var(--linija);padding:9px 12px;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--linija-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.klik{cursor:pointer}
tbody tr.klik:hover td,tbody tr.klik:focus td{background:var(--petrol-3)}
tbody tr.klik:focus{outline:none}
td.broj,th.broj{text-align:right}
td.broj{white-space:nowrap}
.nw{white-space:nowrap}
td.uzan{width:1%;white-space:nowrap}
.prazno{padding:36px 16px;text-align:center;color:var(--tekst-2)}
.prazno b{display:block;color:var(--tekst);font-weight:600;margin-bottom:4px}

.oznaka{display:inline-block;padding:1px 9px;border-radius:10px;font-size:13.5px;font-weight:500;white-space:nowrap}
.oznaka.crvena{background:var(--crvena-bg);color:var(--crvena)}
.oznaka.zuta{background:var(--signal-bg);color:var(--signal)}
.oznaka.zelena{background:var(--zelena-bg);color:var(--zelena)}
.oznaka.siva{background:var(--linija-2);color:var(--tekst-2)}

/* registarska tablica – prepoznatljiv znak vozila u svim listama */
.tablica{display:inline-block;position:relative;font-weight:600;letter-spacing:.06em;background:#fff;border:1.5px solid var(--asfalt);border-radius:4px;padding:0 8px 0 13px;line-height:23px;font-size:14px;white-space:nowrap;text-transform:uppercase}
.tablica::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--plava-tablica);border-radius:2px 0 0 2px}

/* fioka (detalji zapisa) */
.zavesa{position:fixed;inset:0;background:rgba(20,28,37,.4);z-index:20;display:flex;justify-content:flex-end}
.fioka{background:var(--papir);width:min(660px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-10px 0 28px rgba(20,28,37,.2);animation:uvod .16s ease-out}
@keyframes uvod{from{transform:translateX(28px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.fioka{animation:none}}
.fioka header{background:var(--karton);padding:18px 24px 0;border-bottom:1px solid var(--linija)}
.fioka header h2{margin:0;font-size:22px;font-weight:600;line-height:1.2}
.fioka header .pod{color:var(--tekst-2);font-size:14.5px;margin:3px 0 10px;min-height:1em}
.tabovi{display:flex;gap:2px;overflow-x:auto}
.tabovi button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--tekst-2);font-weight:500;white-space:nowrap}
.tabovi button:hover:not(:disabled){color:var(--tekst)}
.tabovi button.aktivan{border-bottom-color:var(--petrol);color:var(--tekst)}
.tabovi button:disabled{opacity:.45;cursor:not-allowed}
.fioka .telo{flex:1;overflow:auto;padding:20px 24px}
.fioka footer{background:var(--karton);border-top:1px solid var(--linija);padding:12px 24px;display:flex;gap:10px;justify-content:space-between;align-items:center}
.fioka footer .desno{display:flex;gap:10px;margin-left:auto}
.forma{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.polje{display:flex;flex-direction:column;gap:4px;min-width:0}
.polje.puno{grid-column:1/-1}
.polje > span{font-size:14px;color:var(--tekst-2);font-weight:500}
.polje > span i{color:var(--crvena);font-style:normal}
.polje.prekidac{flex-direction:row;align-items:center;padding-top:22px;font-weight:500}
.napomena{background:var(--petrol-3);border-radius:var(--r);padding:11px 14px;color:var(--petrol-2);font-size:14.5px;margin-bottom:14px;max-width:80ch}
.pod-forma{background:var(--karton);border:1px solid var(--linija);border-left:3px solid var(--petrol);border-radius:var(--r);padding:16px;margin-bottom:14px}
.pod-forma h3{margin:0 0 12px;font-size:16px;font-weight:600}
.dugmad{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.dugmad .levo{margin-right:auto}

/* poruke */
#poruke{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:60}
.poruka{background:var(--asfalt);color:#fff;padding:11px 16px;border-radius:var(--r);max-width:440px;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.poruka.greska{background:var(--crvena)}

/* prijava i podešavanje */
.ulaz{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--asfalt)}
.ulaz form,.ulaz .kartica{background:var(--karton);border-radius:10px;padding:32px;width:min(400px,100%);display:flex;flex-direction:column;gap:14px}
.ulaz h1{margin:0;font-size:26px;letter-spacing:.02em}
.ulaz p{margin:0;color:var(--tekst-2)}
.ulaz .linija{height:3px;background:repeating-linear-gradient(90deg,var(--signal-jak) 0 22px,transparent 22px 36px);margin:-4px 0 4px}

/* filteri */
.segmenti{display:inline-flex;border:1px solid var(--linija);border-radius:var(--r);overflow:hidden;background:#fff;flex-wrap:wrap}
.segmenti button{border:0;background:none;padding:6px 13px;cursor:pointer;border-right:1px solid var(--linija);white-space:nowrap}
.segmenti button:last-child{border-right:0}
.segmenti button.aktivan{background:var(--asfalt);color:#fff}

/* finansije */
.filteri{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;background:var(--karton);border:1px solid var(--linija);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.filteri label{display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--tekst-2);font-weight:500;min-width:140px;max-width:240px;flex:0 1 auto}
.filteri label.siroko{flex:1 1 200px;max-width:none}
.filteri select,.filteri input{min-height:34px;padding:5px 8px;color:var(--tekst);font-weight:400}
.zbir{margin-top:12px;max-width:760px}
.zbir tr.ukupno td{border-top:1px solid var(--linija);font-weight:600}
dl.detalji{display:grid;grid-template-columns:minmax(150px,auto) 1fr;gap:7px 16px;margin:0 0 16px;background:var(--karton);border:1px solid var(--linija);border-radius:var(--r);padding:14px 16px}
dl.detalji dt{color:var(--tekst-2)}
dl.detalji dd{margin:0;font-variant-numeric:tabular-nums}
.polje small{font-size:13px}

/* ture, fakturisanje, izveštaji */
.nazad{background:none;border:0;padding:0 0 6px;color:var(--petrol);cursor:pointer;font-weight:500}
.nazad:hover{text-decoration:underline}
.napomena.upozorenje{background:var(--crvena-bg);color:var(--crvena)}
.minus{color:var(--crvena)}
.relacija{min-width:150px;max-width:260px}
.kpi-traka{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--karton);border:1px solid var(--linija);border-radius:var(--r);margin-bottom:16px}
.kpi{padding:12px 16px;border-right:1px solid var(--linija-2);min-width:0}
.kpi:last-child{border-right:0}
.kpi span{display:block;font-size:13.5px;color:var(--tekst-2)}
.kpi b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin:2px 0;white-space:nowrap}
.kpi small{color:var(--tekst-2);font-size:13px}
.grafici{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.graf-panel{background:var(--karton);border:1px solid var(--linija);border-radius:var(--r);padding:14px 16px;min-width:0}
.graf-panel.sirok{grid-column:1/-1}
.graf-panel h3{margin:0;font-size:16px;font-weight:600}
.graf-panel>p{margin:2px 0 10px;color:var(--tekst-2);font-size:14px}
.graf-okvir{position:relative;height:260px}
.graf-panel.sirok .graf-okvir{height:300px}
.fioka.siroka{width:min(1140px,100%)}
.sekcija-forme{grid-column:1/-1;font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tekst-2);border-bottom:1px solid var(--linija);padding:10px 0 4px}
.forma .sekcija-forme:first-child{padding-top:0}
.ns{margin-top:18px}
.ns-stavka{border:1px solid var(--linija);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;background:var(--karton)}
.ns-red{display:grid;grid-template-columns:minmax(220px,1fr) 100px 130px 130px 36px;gap:10px;align-items:end;margin-bottom:8px}
.ns-fak-naslov{font-size:13px;font-weight:600;color:var(--tekst-2);margin:10px 0 4px}
.ns-okvir{overflow-x:auto}
.ns-fakture{width:100%;border-collapse:collapse;font-size:14px;min-width:820px}
.ns-fakture th{text-align:left;font-weight:600;color:var(--tekst-2);font-size:12.5px;padding:4px 6px;border-bottom:1px solid var(--linija)}
.ns-fakture td{padding:4px 6px;vertical-align:middle}
.ns-fakture select,.ns-fakture input{width:100%;min-width:0}
.ns-fakture td:nth-child(5) input{max-width:90px}
.ns-fakture td:nth-child(1) select{min-width:74px}
.ns-fakture td:nth-child(4) select{min-width:82px}
.ns-fakture td:nth-child(2) select{min-width:150px}
.ns-fakture .b{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ns-fakture tr.zak td{background:var(--linija-2)}
.ns-akcije{display:flex;gap:8px;margin-top:8px}
@media (max-width:820px){.ns-red{grid-template-columns:1fr 1fr}}
.koraci-uvoza{background:var(--karton);border:1px solid var(--linija);border-radius:var(--r);padding:14px 16px 14px 36px;max-width:900px;line-height:1.7}
@media (max-width:900px){.grafici{grid-template-columns:1fr}}
@media print{.graf-panel{break-inside:avoid}}
table.unos td{vertical-align:top}
table.unos td:first-child{min-width:260px;width:42%}
table.unos input,table.unos select{min-height:32px;padding:4px 8px}
tr.ukupno td{font-weight:600;border-top:1px solid var(--linija);background:#F8FAFB}
tr.izabran td{background:var(--petrol-3)}
.potpis-red{display:flex;justify-content:space-between;gap:40px;margin-top:48px;max-width:640px}
.potpis-red div{flex:1;border-top:1px solid var(--tekst);padding-top:4px;text-align:center;color:var(--tekst-2)}

/* šifarnici */
.dvokolona{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
.lista-grupa{background:var(--karton);border:1px solid var(--linija);border-radius:var(--r);overflow:hidden}
.lista-grupa button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-bottom:1px solid var(--linija-2);cursor:pointer}
.lista-grupa button:last-child{border-bottom:0}
.lista-grupa button:hover{background:#F8FAFB}
.lista-grupa button.aktivan{background:var(--petrol-3);font-weight:600}
.lista-grupa button small{color:var(--tekst-3)}
td input[type=text],td input[type=number],td select{min-height:32px;padding:4px 8px}
td input.kod{width:150px;text-transform:uppercase}
td input[name="naziv"]{min-width:260px}
td input[type=number]{width:110px}

@media (max-width:900px){
  .okvir{grid-template-columns:1fr}
  .meni{position:static;height:auto}
  .meni nav{display:flex;flex-wrap:wrap;gap:4px}
  .meni .grupa{display:none}
  .sadrzaj{padding:18px 16px 40px}
  .forma{grid-template-columns:1fr}
  .polje.prekidac{padding-top:0}
  .dvokolona{grid-template-columns:1fr}
  .alati input[type=search]{width:100%}
}
@media print{.meni,.alati,.filteri,.segmenti,.no-print,#poruke,#fioka{display:none !important}.okvir{display:block}.sadrzaj{padding:0;max-width:none}.tabela-okvir{border:0;overflow:visible}body{background:#fff}}
</style>
</head>
<body>
<div id="app"><div class="ucitavanje">Učitavanje…</div></div>
<div id="poruke" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
'use strict';
/* =====================================================================
   BALKAN TMS LITE · index.html · 2.0 – vozni park i alarmi, partneri,
   ture, nalozi, troškovi, obračun vozača, fakturisanje i štampa,
   potraživanja i naplata, ulazni računi, izveštaji, rezervna kopija
   ===================================================================== */

// ============ PODEŠAVANJE – jedino mesto koje menjate (pogledajte POCNI_OVDE.md) ============
const KONFIG = {
  SUPABASE_URL:   'https://tfcjfjzdzpfjedvqdlau.supabase.co',    // npr. https://abcdefghijkl.supabase.co
  SUPABASE_KLJUC: 'sb_publishable_Yv5oRBZJdj0qPng3wglltA_wYEGxh75'   // Publishable key (sb_publishable_…) ili „anon public“ ključ
};
const VERZIJA = 'Lite 2.4';

// ============ POMOĆNE FUNKCIJE ============
const $  = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDatum = d => { if (!d) return ''; const [g, m, dan] = String(d).slice(0, 10).split('-'); return `${dan}.${m}.${g}`; };
const fmtBroj = (n, dec = 2) => (n === null || n === undefined || n === '') ? '' :
  Number(n).toLocaleString('de-DE', { minimumFractionDigits: dec, maximumFractionDigits: dec });
const danas = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const razlikaDana = datum => Math.round((Date.parse(String(datum).slice(0, 10)) - Date.parse(danas())) / 864e5);
const bezKvacica = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .replace(/đ/g, 'dj').replace(/Đ/g, 'Dj').toLowerCase();
const bezbednoIme = ime => {
  const tacka = ime.lastIndexOf('.');
  const osnova = (tacka > 0 ? ime.slice(0, tacka) : ime), ext = (tacka > 0 ? ime.slice(tacka + 1) : '');
  const cisto = s => bezKvacica(s).replace(/[^a-z0-9_-]+/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '');
  return (cisto(osnova).slice(0, 80) || 'fajl') + (ext ? '.' + cisto(ext).slice(0, 10) : '');
};
const velicinaFajla = b => b == null ? '' : b < 1024 * 1024 ? `${Math.max(1, Math.round(b / 1024))} KB` : `${fmtBroj(b / 1048576, 1)} MB`;

function poruka(tekst, greska = false) {
  const el = document.createElement('div');
  el.className = 'poruka' + (greska ? ' greska' : '');
  el.setAttribute('role', greska ? 'alert' : 'status');
  el.textContent = tekst;
  $('#poruke').appendChild(el);
  setTimeout(() => el.remove(), greska ? 8000 : 3500);
}

function prevediGresku(e) {
  const kod = e?.code, msg = e?.message || String(e);
  if (kod === '23505') {
    if (/partneri_pib/.test(msg)) return 'Partner sa ovim PIB-om već postoji. Potražite ga u listi partnera.';
    if (/vozila_reg/.test(msg)) return 'Vozilo sa ovom registracijom već postoji.';
    if (/rokovi/.test(msg)) return 'Ova vrsta roka je već uneta. Otvorite postojeći rok i promenite datum.';
    if (/sifarnici/.test(msg)) return 'Stavka sa ovim kodom već postoji u šifarniku.';
    if (/ulazni_racuni_broj/.test(msg)) return 'Ovaj dobavljač već ima unet račun sa tim brojem.';
    return 'Zapis sa istom vrednošću već postoji.';
  }
  if (kod === '23503' && /ulazni_placanja|naplate/.test(msg)) return 'Račun ima evidentirana plaćanja. Prvo obrišite plaćanja u kartici „Plaćanja“.';
  if (kod === '23503') return 'Zapis je povezan sa drugim podacima i ne može da se obriše. Umesto brisanja ga deaktivirajte.';
  if (kod === '23502') return 'Nije popunjeno obavezno polje.';
  if (kod === '23514' && /ulazni_iznosi/.test(msg)) return 'Ukupan iznos mora biti jednak ili veći od iznosa bez PDV-a.';
  if (kod === '23514') return 'Neka od unetih vrednosti nije dozvoljena. Proverite polja.';
  if (kod === '42501' || /row-level security|permission denied/i.test(msg)) return 'Nemate pravo za ovu radnju.';
  if (kod === 'PGRST116') return 'Zapis nije sačuvan – nemate pravo izmene ili je zapis u međuvremenu obrisan.';
  if (kod === 'P0001') return msg;
  if (/Failed to fetch|NetworkError|Load failed/i.test(msg)) return 'Nema veze sa serverom. Proverite internet i pokušajte ponovo.';
  if (/Invalid login credentials/i.test(msg)) return 'Pogrešan e-mail ili lozinka.';
  if (/Password should be at least/i.test(msg)) return 'Lozinka je prekratka.';
  if (/exceeded the maximum allowed size|Payload too large/i.test(msg)) return 'Fajl je veći od dozvoljenih 20 MB.';
  if (/JWT expired/i.test(msg)) return 'Sesija je istekla. Prijavite se ponovo.';
  return msg;
}

// ============ PRISTUP PODACIMA – jedino mesto koje razgovara sa Supabase-om ============
const Store = {
  sb: null,
  init(url, kljuc) {
    this.sb = window.supabase.createClient(url, kljuc, { auth: { persistSession: true, autoRefreshToken: true } });
  },
  async sesija() { const { data } = await this.sb.auth.getSession(); return data.session; },
  async prijava(email, lozinka) {
    const { data, error } = await this.sb.auth.signInWithPassword({ email, password: lozinka });
    if (error) throw error; return data.session;
  },
  async odjava() { await this.sb.auth.signOut(); },
  async promeniLozinku(nova) { const { error } = await this.sb.auth.updateUser({ password: nova }); if (error) throw error; },
  async lista(tabela, { filteri = [], red, opadajuce = false } = {}) {
    const sve = [], KORAK = 1000;
    for (let od = 0; ; od += KORAK) {
      let q = this.sb.from(tabela).select('*');
      for (const [op, kol, vr] of filteri) q = q[op](kol, vr);
      if (red) q = q.order(red, { ascending: !opadajuce });
      if (red !== 'id') q = q.order('id');   // stabilan redosled pri učitavanju po stranama
      const { data, error } = await q.range(od, od + KORAK - 1);
      if (error) throw error;
      sve.push(...data);
      if (data.length < KORAK) break;
    }
    return sve;
  },
  async jedan(tabela, id) {
    const { data, error } = await this.sb.from(tabela).select('*').eq('id', id).maybeSingle();
    if (error) throw error; return data;
  },
  async dodaj(tabela, red) {
    const { data, error } = await this.sb.from(tabela).insert(red).select().single();
    if (error) throw error; return data;
  },
  async dodajVise(tabela, redovi) {
    const sve = [];
    for (let i = 0; i < redovi.length; i += 200) {
      const { data, error } = await this.sb.from(tabela).insert(redovi.slice(i, i + 200)).select();
      if (error) throw error; sve.push(...data);
    }
    return sve;
  },
  async izmeniVise(tabela, ids, red) {
    let n = 0;
    for (let i = 0; i < ids.length; i += 200) {
      const { data, error } = await this.sb.from(tabela).update(red).in('id', ids.slice(i, i + 200)).select('id');
      if (error) throw error; n += (data || []).length;
    }
    return n;
  },
  async izmeni(tabela, id, red) {
    const { data, error } = await this.sb.from(tabela).update(red).eq('id', id).select().single();
    if (error) throw error; return data;
  },
  async obrisi(tabela, id) {
    const { error } = await this.sb.from(tabela).delete().eq('id', id);
    if (error) throw error;
  },
  async funkcija(akcija, podaci = {}) {
    const { data, error } = await this.sb.functions.invoke('tms-servis', { body: { akcija, ...podaci } });
    if (error) {
      let tekst = error.message || '';
      try { const j = await error.context?.json?.(); if (j?.greska) tekst = j.greska; } catch (e) { /* bez tela odgovora */ }
      if (/Failed to send a request|FunctionsFetchError|404/i.test(tekst)) tekst = 'Servisna funkcija nije postavljena ili nije dostupna (POCNI_OVDE.md, korak 9).';
      throw new Error(tekst);
    }
    if (data?.greska) throw new Error(data.greska);
    return data;
  },
  async rpc(fn, args) { const { data, error } = await this.sb.rpc(fn, args); if (error) throw error; return data; },
  async posaljiFajl(putanja, fajl) {
    const { error } = await this.sb.storage.from('dokumenti').upload(putanja, fajl, { upsert: false, contentType: fajl.type || undefined });
    if (error) throw error;
  },
  async linkFajla(putanja) {
    const { data, error } = await this.sb.storage.from('dokumenti').createSignedUrl(putanja, 300);
    if (error) throw error; return data.signedUrl;
  },
  async obrisiFajlove(putanje) {
    if (!putanje.length) return;
    const { error } = await this.sb.storage.from('dokumenti').remove(putanje);
    if (error) throw error;
  }
};

async function ucitajSifarnike() {
  const [sif, firme] = await Promise.all([Store.lista('sifarnici'), Store.lista('firme', { red: 'kod' })]);
  sif.sort((a, b) => a.redosled - b.redosled || a.naziv.localeCompare(b.naziv, 'sr'));
  S.sif = {};
  for (const r of sif) (S.sif[r.grupa] ||= []).push(r);
  S.firme = firme;
}
async function ucitajPartnere() {
  try { S.partneri = await Store.lista('partneri', { red: 'naziv' }); }
  catch (e) { S.partneri = []; console.warn('Partneri nisu učitani', e); }
}
async function ucitajAlarme() {
  try { S.alarmi = await Store.lista('v_alarmi', { red: 'datum_isteka' }); }
  catch (e) { S.alarmi = []; console.warn('Alarmi nisu učitani', e); }
}
const sifOpcije = (grupa, sviIneaktivni = false) =>
  (S.sif[grupa] || []).filter(x => sviIneaktivni || x.aktivan).map(x => ({ v: x.kod, t: x.naziv }));
const sifNaziv = (grupa, kod) => kod == null ? '' : ((S.sif[grupa] || []).find(x => x.kod === kod)?.naziv ?? kod);
const firmaKod = id => S.firme.find(f => f.id === id)?.kod ?? '';
const partnerNaziv = id => S.partneri.find(p => p.id === id)?.naziv ?? '';
const novac = (n, valuta) => n === null || n === undefined ? '' : `${fmtBroj(n)} ${esc(valuta || '')}`.trim();
function oznakaPlacanja(r) {
  if (r.status_placanja === 'STORNO') return '<span class="oznaka siva">stornirano</span>';
  if (r.status_placanja === 'PLACENA') return '<span class="oznaka zelena">plaćeno</span>';
  if (r.dana_kasnjenja > 0) return `<span class="oznaka crvena">kasni ${r.dana_kasnjenja} d.</span>`;
  return r.status_placanja === 'DELIMICNO' ? '<span class="oznaka zuta">delimično</span>' : '<span class="oznaka siva">neplaćeno</span>';
}
const tablica = reg => reg ? `<span class="tablica">${esc(reg)}</span>` : '';

function oznakaRoka(r) {
  const prag = (S.sif[r.entitet === 'VOZILO' ? 'ROK_VOZILO' : 'ROK_VOZAC'] || []).find(x => x.kod === r.vrsta)?.vrednost ?? 30;
  const d = razlikaDana(r.datum_isteka);
  if (d < 0) return `<span class="oznaka crvena">istekao pre ${-d} d.</span>`;
  if (d === 0) return `<span class="oznaka crvena">ističe danas</span>`;
  if (d <= prag) return `<span class="oznaka zuta">ističe za ${d} d.</span>`;
  return `<span class="oznaka zelena">važi</span>`;
}
function alarmZnak(entitet, id) {
  const moji = S.alarmi.filter(a => a.entitet === entitet && a.entitet_id === id);
  if (!moji.length) return '<span class="oznaka siva">nema rokova</span>';
  const ist = moji.filter(a => a.status === 'ISTEKAO').length, usk = moji.filter(a => a.status === 'USKORO').length;
  if (ist) return `<span class="oznaka crvena">${ist === 1 ? 'istekao rok' : `istekli rokovi (${ist})`}</span>`;
  if (usk) return `<span class="oznaka zuta">${usk === 1 ? 'ističe uskoro' : `ističe uskoro (${usk})`}</span>`;
  return '<span class="oznaka zelena">u redu</span>';
}

// ============ FORME ============
const grupaPolja = (p, ktx) => typeof p.grupa === 'function' ? p.grupa(ktx) : p.grupa;
function opcijePolja(p, ktx) {
  if (p.tip === 'sif') return sifOpcije(grupaPolja(p, ktx));
  if (p.tip === 'firma') return S.firme.filter(f => f.aktivna).map(f => ({ v: f.id, t: `${f.kod} – ${f.naziv}` }));
  if (p.tip === 'partner') {
    const akt = S.partneri.filter(x => x.aktivan);
    if (!p.dobavljaciPrvo) return akt.map(x => ({ v: x.id, t: x.naziv }));
    return [...akt.filter(x => x.dobavljac).map(x => ({ v: x.id, t: x.naziv, g: 'Dobavljači' })),
            ...akt.filter(x => !x.dobavljac).map(x => ({ v: x.id, t: x.naziv, g: 'Ostali partneri' }))];
  }
  return (typeof p.opcije === 'function' ? p.opcije(ktx) : p.opcije).map(([v, t]) => ({ v, t }));
}
function poljeHTML(p, vr, samoCitanje, ktx) {
  if (p.tip === 'naslov') return `<div class="sekcija-forme puno">${esc(p.l)}</div>`;
  const dis = samoCitanje ? ' disabled' : '', req = p.req ? ' required' : '';
  const samoZa = p.samoZa ? ` data-samoza="${p.samoZa}"` : '';
  const klasa = 'polje' + (p.puno ? ' puno' : '');
  if (p.tip === 'bool') {
    return `<label class="${klasa} prekidac"${samoZa}><input type="checkbox" name="${p.k}"${vr ? ' checked' : ''}${dis}> ${esc(p.l)}</label>`;
  }
  let ulaz;
  if (p.tip === 'textarea') ulaz = `<textarea name="${p.k}"${dis}>${esc(vr)}</textarea>`;
  else if (p.tip === 'date') ulaz = `<input type="date" name="${p.k}" value="${esc(vr ? String(vr).slice(0, 10) : '')}"${dis}${req}>`;
  else if (p.tip === 'int' || p.tip === 'num') ulaz = `<input type="number" name="${p.k}" value="${esc(vr ?? '')}" step="${p.tip === 'int' ? '1' : 'any'}"${dis}${req}>`;
  else if (p.tip === 'sif' || p.tip === 'firma' || p.tip === 'izbor' || p.tip === 'partner') {
    const opc = opcijePolja(p, ktx);
    if (vr != null && vr !== '' && !opc.some(o => String(o.v) === String(vr))) {
      const t = p.tip === 'sif' ? sifNaziv(grupaPolja(p, ktx), vr) : p.tip === 'firma' ? firmaKod(vr) : p.tip === 'partner' ? partnerNaziv(vr) : p.nazivVr ? p.nazivVr(vr) : vr;
      opc.unshift({ v: vr, t: `${t} (neaktivno)` });
    }
    const prazna = p.req ? ((vr == null || vr === '') ? '<option value="" disabled selected>Izaberite…</option>' : '') : '<option value="">—</option>';
    let html = '', grupa = null;
    for (const o of opc) {
      if (o.g !== grupa) { if (grupa) html += '</optgroup>'; if (o.g) html += `<optgroup label="${esc(o.g)}">`; grupa = o.g; }
      html += `<option value="${esc(o.v)}"${vr != null && String(o.v) === String(vr) ? ' selected' : ''}>${esc(o.t)}</option>`;
    }
    if (grupa) html += '</optgroup>';
    ulaz = `<select name="${p.k}"${dis}${req}>${prazna}${html}</select>`;
  } else {
    ulaz = `<input type="${p.tip === 'email' ? 'email' : 'text'}" name="${p.k}" value="${esc(vr)}"${dis}${req}${p.upper ? ' style="text-transform:uppercase"' : ''} autocomplete="off">`;
  }
  return `<label class="${klasa}"${samoZa}><span>${esc(p.l)}${p.req ? ' <i>*</i>' : ''}</span>${ulaz}${p.pomoc ? `<small class="tekst-2">${esc(p.pomoc)}</small>` : ''}</label>`;
}
function formaHTML(polja, red, samoCitanje, ktx) {
  return `<div class="forma">${polja.filter(p => !(red && p.samoNovo)).map(p => {
    let vr = red ? red[p.k] : undefined;
    if (!red && p.def !== undefined) vr = typeof p.def === 'function' ? p.def(ktx) : p.def;
    return poljeHTML(p, vr, samoCitanje || !!(red && (p.zakljucano || p.zakljucanoAko?.(red))), ktx);
  }).join('')}</div>`;
}
function citajFormu(el, polja) {
  const red = {};
  for (const p of polja) {
    const u = el.querySelector(`[name="${p.k}"]`);
    if (!u) continue;
    if (p.tip === 'bool') red[p.k] = u.checked;
    else if (p.tip === 'int' || p.tip === 'num' || p.broj) red[p.k] = u.value === '' ? null : Number(String(u.value).replace(',', '.'));
    else { let v = u.value.trim(); if (p.upper) v = v.toUpperCase(); red[p.k] = v === '' ? null : v; }
  }
  return red;
}
function proveriFormu(red, polja) {
  for (const p of polja) {
    const v = red[p.k];
    if (p.req && (v === null || v === undefined || v === '')) return `Polje „${p.l}“ je obavezno.`;
    if ((p.tip === 'int' || p.tip === 'num') && v !== null && Number.isNaN(v)) return `Polje „${p.l}“ mora biti broj.`;
    if (p.tip === 'email' && v && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return `Polje „${p.l}“ nije ispravna e-mail adresa.`;
  }
  return null;
}
function kursPoValuti(e, forma) {
  if (e.target.name !== 'valuta') return;
  const kurs = forma.querySelector('[name="kurs"]');
  if (!kurs || kurs.disabled) return;
  const v = e.target.value;
  kurs.value = v === 'EUR' ? 1 : ((S.sif.VALUTA || []).find(x => x.kod === v)?.vrednost ?? kurs.value);
  uskladiKurs(forma);
}
// Za EUR kurs je uvek 1 i ne može se menjati (iznos u evrima se nikad ne deli kursom)
function uskladiKurs(forma) {
  const kurs = forma.querySelector('[name="kurs"]'), val = forma.querySelector('[name="valuta"]');
  if (!kurs || !val || kurs.disabled) return;
  const eur = val.value === 'EUR';
  if (eur) kurs.value = 1;
  kurs.readOnly = eur;
  kurs.title = eur ? 'Za evre kurs je uvek 1.' : '';
}
function primeniVidljivost(el) {
  const tip = el.querySelector('[name="tip"]')?.value;
  $$('[data-samoza]', el).forEach(x => { x.hidden = x.dataset.samoza !== tip; });
}
function tabelaHTML(kolone, redovi, klik = true) {
  return `<table><thead><tr>${kolone.map(c => `<th${c.broj ? ' class="broj"' : ''}>${esc(c.l)}</th>`).join('')}</tr></thead>
    <tbody>${redovi.map((r, i) => `<tr data-i="${i}"${klik ? ' class="klik" tabindex="0"' : ''}>${kolone.map(c =>
      `<td${c.broj ? ' class="broj"' : ''}>${c.f ? c.f(r) : esc(r[c.k])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function veziKlikove(kontejner, redovi, fn) {
  $$('tbody tr.klik', kontejner).forEach(tr => {
    const r = redovi[+tr.dataset.i];
    tr.onclick = () => fn(r);
    tr.onkeydown = e => { if (e.key === 'Enter') fn(r); };
  });
}

// ============ LISTE ============
const postaviSadrzaj = html => { $('#sadrzaj').innerHTML = html; };
let osveziListu = () => {};

const LISTA_STANJE = {};
const kratakNaziv = l => String(l).replace(/\s*\(.*\)\s*$/, '');
async function prikaziListu(kljuc) {
  const k = ENT[kljuc], moze = ima(k.pisanje);
  const st = LISTA_STANJE[kljuc] ||= { f: {}, izabrani: new Set(), trazi: '', neaktivni: false };
  const fpolja = k.polja.filter(p => p.k && p.k !== k.aktivno && (p.filter ?? ['sif', 'firma', 'izbor', 'bool'].includes(p.tip)));
  const gpolja = moze ? k.polja.filter(p => p.k && !p.zakljucano && (p.grupno ?? ['sif', 'firma', 'izbor', 'bool', 'date', 'int', 'num'].includes(p.tip))) : [];
  postaviSadrzaj(`
    <div class="zaglavlje"><div><h1>${esc(k.naslov)}</h1><p>${esc(k.opis)}</p></div>
      ${moze ? `<button class="dugme glavno" id="novo">${esc(k.dugmeNovo)}</button>` : ''}</div>
    <div class="filteri" id="e-filteri"></div>
    <div class="alati" style="justify-content:space-between"><span class="tekst-2" id="ukupno"></span><div id="grupno"></div></div>
    <div class="tabela-okvir" id="tabela"><div class="prazno">Učitavanje…</div></div>`);
  let redovi = [];
  const opcF = p => (p.tip === 'bool' ? [['DA', 'Da'], ['NE', 'Ne']]
    : ['sif', 'firma', 'izbor'].includes(p.tip) ? opcijePolja(p, {}).map(o => [String(o.v), o.t])
    : [...new Set(redovi.map(r => r[p.k]).filter(v => v != null && v !== ''))].sort((a, b) => String(a).localeCompare(String(b), 'sr')).map(v => [String(v), String(v)]));
  const prolazi = r => Object.entries(st.f).every(([kk, v]) => {
    const p = fpolja.find(x => x.k === kk); if (!v || !p) return true;
    const x = r[kk];
    if (v === '__PRAZNO__') return x == null || x === '';
    if (p.tip === 'bool') return v === 'DA' ? !!x : !x;
    return String(x ?? '') === v;
  });
  const crtajFiltere = () => {
    $('#e-filteri').innerHTML = `<label class="siroko">Pretraga<input type="search" id="trazi" value="${esc(st.trazi)}" placeholder="${esc(k.pretragaTekst)}"></label>
      ${fpolja.map(p => `<label>${esc(kratakNaziv(p.l))}<select data-ef="${p.k}"><option value="">Sve</option>${p.tip !== 'bool' ? `<option value="__PRAZNO__"${st.f[p.k] === '__PRAZNO__' ? ' selected' : ''}>— nije upisano</option>` : ''}${opcF(p).map(([v, t]) => `<option value="${esc(v)}"${st.f[p.k] === v ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select></label>`).join('')}
      ${k.aktivno ? `<label class="prekidac" style="align-self:end"><input type="checkbox" id="neaktivni"${st.neaktivni ? ' checked' : ''}> Prikaži i neaktivne</label>` : ''}
      <button class="dugme malo" id="e-ponisti" type="button">Poništi filtere</button>`;
    $('#trazi').oninput = e => { st.trazi = e.target.value; crtaj(); };
    $$('[data-ef]').forEach(s => s.onchange = () => { st.f[s.dataset.ef] = s.value; crtaj(); });
    if ($('#neaktivni')) $('#neaktivni').onchange = e => { st.neaktivni = e.target.checked; crtaj(); };
    $('#e-ponisti').onclick = () => { delete LISTA_STANJE[kljuc]; prikaziListu(kljuc); };
  };
  const crtaj = () => {
    const q = bezKvacica(st.trazi.trim());
    const vid = redovi.filter(r => (st.neaktivni || !k.aktivno || r[k.aktivno] !== false) && prolazi(r)
      && (!q || k.pretraga.some(p => bezKvacica(r[p]).includes(q))));
    for (const id of [...st.izabrani]) if (!vid.some(r => r.id === id)) st.izabrani.delete(id);
    $('#ukupno').textContent = redovi.length ? `${vid.length} od ${redovi.length}` : '';
    const n = st.izabrani.size;
    $('#grupno').innerHTML = gpolja.length && n ? `<button class="dugme" id="grupna">Grupna izmena (${n})</button>` : '';
    if ($('#grupna')) $('#grupna').onclick = () => dijalogGrupneIzmene({ naslov: k.naslov, tabela: k.tabela, ids: [...st.izabrani], polja: gpolja,
      posle: async () => { st.izabrani.clear(); if (k.posleCuvanja) await k.posleCuvanja(); await osveziListu(); } });
    if (!vid.length) {
      $('#tabela').innerHTML = `<div class="prazno">${redovi.length ? '<b>Nema rezultata</b>Promenite pretragu ili filtere.' : esc(k.prazno)}</div>`;
      return;
    }
    const sel = gpolja.length > 0, svi = vid.every(r => st.izabrani.has(r.id));
    $('#tabela').innerHTML = `<table><thead><tr>${sel ? `<th class="uzan"><input type="checkbox" id="sel-svi" aria-label="Izaberi sve"${svi ? ' checked' : ''}></th>` : ''}
      ${k.kolone.map(c => `<th${c.broj ? ' class="broj"' : ''}>${esc(c.l)}</th>`).join('')}</tr></thead>
      <tbody>${vid.map((r, i) => `<tr data-i="${i}" class="klik" tabindex="0">${sel ? `<td class="uzan"><input type="checkbox" data-sel="${r.id}"${st.izabrani.has(r.id) ? ' checked' : ''} aria-label="Izaberi"></td>` : ''}${k.kolone.map(c =>
        `<td${c.broj ? ' class="broj"' : ''}>${c.f ? c.f(r) : esc(r[c.k])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    $$('#tabela [data-sel]').forEach(cb => {
      cb.onclick = e => e.stopPropagation();
      cb.onchange = () => { cb.checked ? st.izabrani.add(cb.dataset.sel) : st.izabrani.delete(cb.dataset.sel); crtaj(); };
    });
    if ($('#sel-svi')) $('#sel-svi').onchange = e => { vid.forEach(r => (e.target.checked ? st.izabrani.add(r.id) : st.izabrani.delete(r.id))); crtaj(); };
    veziKlikove($('#tabela'), vid, r => otvoriFioku(kljuc, r));
  };
  osveziListu = async () => {
    if (S.ruta !== kljuc) return;
    try { redovi = await Store.lista(k.tabela, { red: k.red }); crtajFiltere(); crtaj(); }
    catch (e) { $('#tabela').innerHTML = `<div class="prazno"><b>Podaci nisu učitani</b>${esc(prevediGresku(e))}</div>`; }
  };
  if ($('#novo')) $('#novo').onclick = () => otvoriFioku(kljuc, null);
  await osveziListu();
}

// Grupna izmena: jedno polje, ista vrednost za sve izabrane zapise
async function dijalogGrupneIzmene({ naslov, tabela, ids, polja, posle, pripremi }) {
  if (!polja.length) return;
  if (pripremi) { try { await pripremi(); } catch (e) { /* liste za izbor nisu ključne */ } }
  zatvoriFioku();
  const z = document.createElement('div');
  z.className = 'zavesa'; z.id = 'fioka';
  z.innerHTML = `<aside class="fioka" role="dialog" aria-modal="true" aria-labelledby="gi-naslov" style="width:min(520px,100%)">
    <header><h2 id="gi-naslov">Grupna izmena</h2><div class="pod">${esc(naslov)} – izabrano ${ids.length}</div></header>
    <form class="telo" id="gi-forma" novalidate><div class="forma" style="grid-template-columns:1fr">
      <label class="polje"><span>Podatak koji menjate</span><select id="gi-polje">${polja.map((p, i) => `<option value="${i}">${esc(p.l)}</option>`).join('')}</select></label>
      <div id="gi-vrednost"></div>
      <p class="tekst-2" style="margin:0">Nova vrednost se upisuje u sve izabrane zapise. Prazno polje briše postojeću vrednost.</p></div></form>
    <footer><div class="desno"><button class="dugme" id="gi-otkazi" type="button">Otkaži</button><button class="dugme glavno" id="gi-primeni" type="button">Primeni na ${ids.length}</button></div></footer></aside>`;
  document.body.appendChild(z);
  document.addEventListener('keydown', escFioka);
  const crtajVr = () => {
    const p = polja[+$('#gi-polje').value];
    $('#gi-vrednost').innerHTML = poljeHTML({ ...p, req: false, samoZa: null, pomoc: null, puno: false }, p.tip === 'bool' ? true : null, false, {});
  };
  $('#gi-polje').onchange = crtajVr; crtajVr();
  $('#gi-otkazi').onclick = () => zatvoriFioku();
  $('#gi-primeni').onclick = async () => {
    const p = polja[+$('#gi-polje').value], podaci = citajFormu($('#gi-forma'), [p]);
    if (p.req && (podaci[p.k] === null || podaci[p.k] === '')) return poruka(`Polje „${p.l}“ je obavezno – izaberite vrednost.`, true);
    if ((p.tip === 'int' || p.tip === 'num') && Number.isNaN(podaci[p.k])) return poruka('Upišite broj.', true);
    const b = $('#gi-primeni'); b.disabled = true;
    try {
      const n = await Store.izmeniVise(tabela, ids, podaci);
      zatvoriFioku();
      poruka(n === ids.length ? `Izmenjeno: ${n}.` : `Izmenjeno ${n} od ${ids.length} (za ostale nemate pravo).`);
      await posle();
    } catch (e) { b.disabled = false; poruka(prevediGresku(e), true); }
  };
}

// ============ FIOKA: detalji zapisa sa karticama ============
let fiokaIzmenjena = false;
function zatvoriFioku(pitaj = false) {
  if (pitaj && fiokaIzmenjena && !confirm('Imate nesačuvane izmene. Da li ipak zatvarate?')) return false;
  $('#fioka')?.remove();
  document.removeEventListener('keydown', escFioka);
  fiokaIzmenjena = false;
  return true;
}
function escFioka(e) { if (e.key === 'Escape') zatvoriFioku(true); }

let fiokaOpc = {};
const TABOVI = { rokovi: 'Rokovi', kontakti: 'Kontakti', dokumenti: 'Dokumenti', uplate: 'Uplate', placanja: 'Plaćanja',
  nalozi: 'Nalozi', troskovi: 'Troškovi', obracun: 'Obračun vozača', stavke: 'Stavke (prihod)', fakture: 'Fakture' };
const TAB_ULOGE = {};   // kartice vidljive samo nekim ulogama
const TAB_FN = {};      // kartice sa posebnim prikazom

function otvoriFioku(kljuc, red, tab = 'podaci', opc = {}) {
  const k = ENT[kljuc], novi = !red;
  zatvoriFioku();
  fiokaOpc = opc || {};
  const tabovi = (k.tabovi || []).filter(t => !TAB_ULOGE[t] || ima(TAB_ULOGE[t]));
  if (tab !== 'podaci' && !tabovi.includes(tab)) tab = 'podaci';
  const z = document.createElement('div');
  z.className = 'zavesa'; z.id = 'fioka';
  z.innerHTML = `<aside class="fioka" role="dialog" aria-modal="true" aria-labelledby="fioka-naslov">
    <header>
      ${fiokaOpc.nazad ? `<button class="nazad" id="fioka-nazad" type="button">← ${esc(fiokaOpc.nazad.naziv)}</button>` : ''}
      <h2 id="fioka-naslov">${novi ? esc(k.dugmeNovo) : esc(k.naziv(red))}</h2>
      <div class="pod">${novi ? 'Popunite podatke i sačuvajte.' : esc(k.podnaslov ? k.podnaslov(red) : '')}</div>
      <div class="tabovi" role="tablist">
        <button data-tab="podaci" role="tab">Podaci</button>
        ${tabovi.map(t => `<button data-tab="${t}" role="tab"${novi ? ' disabled title="Prvo sačuvajte podatke"' : ''}>${TABOVI[t]}</button>`).join('')}
      </div>
    </header>
    <div class="telo" id="fioka-telo"></div>
    <footer id="fioka-dno"></footer>
  </aside>`;
  document.body.appendChild(z);
  z.addEventListener('mousedown', e => { if (e.target === z) zatvoriFioku(true); });
  document.addEventListener('keydown', escFioka);
  if (fiokaOpc.nazad) $('#fioka-nazad').onclick = async () => {
    if (fiokaIzmenjena && !confirm('Podaci nisu sačuvani. Da li se ipak vraćate?')) return;
    fiokaIzmenjena = false;
    const n = fiokaOpc.nazad;
    try { const r = await Store.jedan(ENT[n.kljuc].pogled || ENT[n.kljuc].tabela, n.id); if (r) otvoriFioku(n.kljuc, r, n.tab || 'podaci', n.opc || {}); }
    catch (e) { poruka(prevediGresku(e), true); }
  };
  const prikazi = t => {
    if (t !== 'podaci' && fiokaIzmenjena && !confirm('Podaci nisu sačuvani. Da li prelazite na drugu karticu?')) return;
    fiokaIzmenjena = false;
    $$('.tabovi button', z).forEach(b => { b.classList.toggle('aktivan', b.dataset.tab === t); b.setAttribute('aria-selected', b.dataset.tab === t); });
    const telo = $('#fioka-telo'), dno = $('#fioka-dno');
    if (t === 'podaci') (k.podaciTab ? k.podaciTab(red, telo, dno, kljuc) : tabPodaci(kljuc, red, telo, dno));
    else if (t === 'dokumenti') tabDokumenti(k, red, telo, dno);
    else if (TAB_FN[t]) TAB_FN[t](k, red, telo, dno, kljuc);
    else tabDeca(t, k, red, telo, dno, kljuc);
  };
  $$('.tabovi button', z).forEach(b => b.onclick = () => !b.disabled && prikazi(b.dataset.tab));
  prikazi(tab);
}
// Vezu „nazad“ za podređenu fioku (npr. nalog otvoren iz ture)
const nazadNa = (kljuc, red, tab) => ({ nazad: { kljuc, id: red.id, tab, naziv: `${ENT[kljuc].naslov} ${ENT[kljuc].naziv(red)}` } });

async function tabPodaci(kljuc, red, telo, dno) {
  const k = ENT[kljuc], novi = !red, moze = ima(k.pisanje), opc = fiokaOpc;
  if (k.pripremi) {
    telo.innerHTML = '<div class="prazno">Učitavanje…</div>'; dno.innerHTML = '';
    try { await k.pripremi(red); } catch (e) { poruka(prevediGresku(e), true); }
    if (!document.body.contains(telo)) return;
  }
  if (red && k.normalizuj) red = k.normalizuj(red);
  const pocetne = novi && opc.pocetne ? opc.pocetne : null;
  const polja = k.polja.map(p => (pocetne && p.k in pocetne ? { ...p, def: pocetne[p.k] } : p));
  telo.innerHTML = (moze ? '' : '<div class="napomena">Možete samo da pregledate ove podatke. Izmene radi administrator.</div>')
    + (red && k.uvodPodaci ? k.uvodPodaci(red) : '')
    + `<form id="forma-podaci" novalidate>${formaHTML(polja, red, !moze, { red })}</form>`;
  const forma = $('#forma-podaci');
  primeniVidljivost(forma);
  uskladiKurs(forma);
  forma.addEventListener('input', e => { fiokaIzmenjena = true; if (k.naUnos) k.naUnos(e.target.name, forma); });
  forma.addEventListener('change', e => {
    fiokaIzmenjena = true;
    if (e.target.name === 'tip') primeniVidljivost(forma);
    kursPoValuti(e, forma);
    if (k.naPromenu) k.naPromenu(e.target.name, forma);
  });
  if (novi && k.posleOtvaranja && moze) k.posleOtvaranja(forma);
  forma.addEventListener('submit', e => { e.preventDefault(); sacuvaj(); });
  dno.innerHTML = `${!novi && ima(k.brisanje) ? '<button class="dugme opasno" id="obrisi">Obriši</button>' : ''}
    <div class="desno"><button class="dugme" id="zatvori">Zatvori</button>${moze ? '<button class="dugme glavno" id="sacuvaj">Sačuvaj</button>' : ''}</div>`;
  $('#zatvori').onclick = () => zatvoriFioku(true);
  if ($('#sacuvaj')) $('#sacuvaj').onclick = sacuvaj;
  if ($('#obrisi')) $('#obrisi').onclick = obrisi;
  forma.querySelector('input:not([disabled]),select:not([disabled])')?.focus();
  let dodatak = null;
  if (k.posleForme) dodatak = await k.posleForme(red, telo, forma, dno, opc);

  async function sacuvaj() {
    const skriveno = p => !!forma.querySelector(`[name="${p.k}"]`)?.closest('[hidden]');
    const vidljiva = k.polja.filter(p => !(red && (p.samoNovo || p.zakljucano || p.zakljucanoAko?.(red))));
    const podaci = citajFormu(forma, vidljiva);
    for (const p of vidljiva) if (skriveno(p)) podaci[p.k] = p.tip === 'bool' ? false : null;
    if (podaci.valuta === 'EUR' && 'kurs' in podaci) podaci.kurs = 1;
    const g = proveriFormu(podaci, vidljiva.filter(p => !skriveno(p))) || (k.provera ? k.provera(podaci, novi) : null);
    if (g) return poruka(g, true);
    const gd = dodatak?.provera?.();
    if (gd) return poruka(gd, true);
    const virt = {};
    for (const p of vidljiva) if (p.virt) { virt[p.k] = podaci[p.k]; delete podaci[p.k]; }
    const b = $('#sacuvaj'); b.disabled = true;
    try {
      if (k.predCuvanje) k.predCuvanje(podaci, novi);
      let sacuvan = novi ? (k.dodajFn ? await k.dodajFn(podaci) : await Store.dodaj(k.tabela, podaci))
                         : await Store.izmeni(k.tabela, red.id, podaci);
      fiokaIzmenjena = false;
      if (novi && k.posleDodavanja) await k.posleDodavanja(sacuvan, virt);
      if (dodatak?.sacuvaj) {
        try { await dodatak.sacuvaj(sacuvan); }
        catch (e2) {
          poruka(prevediGresku(e2), true);
          const r2 = k.pogled ? await Store.jedan(k.pogled, sacuvan.id) : sacuvan;
          otvoriFioku(kljuc, r2, 'podaci', { nazad: opc.nazad, nacrt: dodatak.nacrt?.() });
          return;
        }
      }
      if (k.pogled) sacuvan = await Store.jedan(k.pogled, sacuvan.id);
      if (k.posleCuvanja) await k.posleCuvanja();
      poruka(novi ? k.dodato : 'Izmene su sačuvane.');
      osveziListu();
      otvoriFioku(k.otvoriPosle || kljuc, sacuvan, novi ? (k.prviTab || k.tabovi[0] || 'podaci') : 'podaci', { nazad: opc.nazad });
    } catch (e) { poruka(prevediGresku(e), true); }
    finally { if (document.body.contains(b)) b.disabled = false; }
  }
  async function obrisi() {
    if (!confirm(`Obrisati „${k.naziv(red)}“? Brišu se i povezani rokovi, kontakti i dokumenti. Ovo se ne može poništiti.\n\nAko je zapis već korišćen, umesto brisanja ga deaktivirajte.`)) return;
    try {
      const dok = k.entitet ? await Store.lista('dokumenti', { filteri: [['eq', 'entitet', k.entitet], ['eq', 'entitet_id', red.id]] }) : [];
      if (k.obrisiFn) await k.obrisiFn(red); else await Store.obrisi(k.tabela, red.id);
      await Store.obrisiFajlove(dok.map(d => d.putanja)).catch(() => {});
      if (k.posleCuvanja) await k.posleCuvanja();
      await ucitajAlarme(); crtajMeni();
      zatvoriFioku(); poruka('Obrisano.'); osveziListu();
    } catch (e) { poruka(prevediGresku(e), true); }
  }
}

async function tabDeca(tkljuc, k, red, telo, dno, kljuc) {
  const d = DECA[tkljuc], ktx = { entitet: k.entitet, red, kljuc, tab: tkljuc, stavke: [] };
  const moze = ima(d.pisanje || k.pisanje) && (!d.dozvoljeno || d.dozvoljeno(ktx));
  const poljaD = () => (typeof d.polja === 'function' ? d.polja(ktx) : d.polja);
  dno.innerHTML = '<div class="desno"><button class="dugme" id="zatvori">Zatvori</button></div>';
  $('#zatvori').onclick = () => zatvoriFioku(true);
  let stavke = [];
  const crtaj = () => {
    const kolone = typeof d.kolone === 'function' ? d.kolone(ktx) : d.kolone;
    telo.innerHTML = `${d.uvod ? `<div class="napomena">${esc(typeof d.uvod === 'function' ? d.uvod(ktx) : d.uvod)}</div>` : ''}
      <div id="urednik"></div>
      ${moze ? `<div class="alati"><button class="dugme" id="dodaj-stavku">+ ${esc(d.dodaj)}</button></div>` : ''}
      <div class="tabela-okvir">${stavke.length ? tabelaHTML(kolone, stavke, moze) : `<div class="prazno">${esc(d.prazno)}</div>`}</div>
      ${d.zbir ? d.zbir(ktx, stavke) : ''}`;
    if (moze) {
      $('#dodaj-stavku').onclick = () => uredi(null);
      veziKlikove(telo, stavke, uredi);
      if (d.mozeUrediti) $$('tbody tr', telo).forEach(tr => {
        if (d.mozeUrediti(stavke[+tr.dataset.i])) return;
        tr.classList.remove('klik'); tr.removeAttribute('tabindex'); tr.onclick = null; tr.onkeydown = null;
        tr.title = d.zakljucanoTekst || '';
      });
    }
  };
  const ucitaj = async () => {
    try {
      if (d.pripremi && !ktx.pripremljeno) { await d.pripremi(ktx); ktx.pripremljeno = true; }
      stavke = await Store.lista(d.tabela, { filteri: d.filter(ktx), red: d.red });
      if (d.normalizuj) stavke = stavke.map(d.normalizuj);
      ktx.stavke = stavke; crtaj();
    }
    catch (e) { telo.innerHTML = `<div class="prazno"><b>Podaci nisu učitani</b>${esc(prevediGresku(e))}</div>`; }
  };
  const uredi = st => {
    const u = $('#urednik');
    u.innerHTML = `<form class="pod-forma" id="pod-forma" novalidate><h3>${st ? 'Izmena: ' : 'Novo: '}${esc(d.urediNaslov.toLowerCase())}</h3>
      ${formaHTML(poljaD(), st, false, ktx)}
      <div class="dugmad">${st ? '<button type="button" class="dugme opasno levo" id="pf-obrisi">Obriši</button>' : ''}
        <button type="button" class="dugme" id="pf-otkazi">Otkaži</button><button type="submit" class="dugme glavno">Sačuvaj</button></div></form>`;
    const f = $('#pod-forma');
    f.querySelector('select,input')?.focus();
    f.addEventListener('change', e => { kursPoValuti(e, f); if (d.naPromenu) d.naPromenu(e.target.name, f, ktx); });
    uskladiKurs(f);
    $('#pf-otkazi').onclick = () => { u.innerHTML = ''; };
    f.onsubmit = async e => {
      e.preventDefault();
      const pp = poljaD(), podaci = citajFormu(f, pp), g = proveriFormu(podaci, pp) || (d.provera ? d.provera(podaci) : null);
      if (g) return poruka(g, true);
      if (d.predCuvanje) d.predCuvanje(podaci, ktx);
      if (podaci.valuta === 'EUR' && 'kurs' in podaci) podaci.kurs = 1;
      try {
        if (st) await Store.izmeni(d.tabela, st.id, podaci);
        else await Store.dodaj(d.tabela, { ...d.novi(ktx), ...podaci });
        poruka('Sačuvano.');
        if (d.posle && await d.posle(ktx) === 'otvoreno') return;
        osveziListu(); await ucitaj();
      } catch (er) { poruka(prevediGresku(er), true); }
    };
    if (st) $('#pf-obrisi').onclick = async () => {
      if (!confirm('Obrisati ovu stavku?')) return;
      try {
        await Store.obrisi(d.tabela, st.id); poruka('Obrisano.');
        if (d.posle && await d.posle(ktx) === 'otvoreno') return;
        osveziListu(); await ucitaj();
      }
      catch (er) { poruka(prevediGresku(er), true); }
    };
  };
  telo.innerHTML = '<div class="prazno">Učitavanje…</div>';
  await ucitaj();
}

async function tabDokumenti(k, red, telo, dno) {
  const mozeBrisanje = ima(['ADMIN', 'FINANSIJE']), MAKS = 20 * 1024 * 1024;
  dno.innerHTML = '<div class="desno"><button class="dugme" id="zatvori">Zatvori</button></div>';
  $('#zatvori').onclick = () => zatvoriFioku(true);
  let docs = [];
  const crtaj = () => {
    telo.innerHTML = `<div class="pod-forma"><h3>Učitavanje dokumenata</h3>
        <div class="forma">
          <label class="polje"><span>Vrsta dokumenta</span><select id="dok-vrsta">${sifOpcije('VRSTA_DOKUMENTA').map(o => `<option value="${esc(o.v)}">${esc(o.t)}</option>`).join('')}</select></label>
          <label class="polje"><span>Fajlovi (PDF, slike…, do 20 MB po fajlu)</span><input type="file" id="dok-fajl" multiple></label>
          <label class="polje puno"><span>Napomena</span><input type="text" id="dok-napomena" autocomplete="off"></label>
        </div>
        <div class="dugmad"><button class="dugme glavno" id="dok-posalji">Učitaj</button></div></div>
      <div class="tabela-okvir">${docs.length ? `<table><thead><tr><th>Naziv</th><th>Vrsta</th><th>Učitano</th><th class="broj">Veličina</th><th></th></tr></thead><tbody>
        ${docs.map((x, i) => `<tr><td>${esc(x.naziv)}${x.napomena ? `<div class="tekst-2">${esc(x.napomena)}</div>` : ''}</td>
          <td>${esc(sifNaziv('VRSTA_DOKUMENTA', x.vrsta))}</td><td>${fmtDatum(x.created_at)}</td>
          <td class="broj">${velicinaFajla(x.velicina)}</td>
          <td class="uzan"><button class="dugme malo" data-otvori="${i}">Otvori</button>
          ${mozeBrisanje ? ` <button class="dugme malo opasno" data-brisi="${i}">Obriši</button>` : ''}</td></tr>`).join('')}
        </tbody></table>` : '<div class="prazno">Nema učitanih dokumenata.</div>'}</div>`;
    $('#dok-posalji').onclick = posalji;
    $$('[data-otvori]', telo).forEach(b => b.onclick = () => otvori(docs[+b.dataset.otvori]));
    $$('[data-brisi]', telo).forEach(b => b.onclick = () => brisi(docs[+b.dataset.brisi]));
  };
  const ucitaj = async () => {
    try {
      docs = await Store.lista('dokumenti', { filteri: [['eq', 'entitet', k.entitet], ['eq', 'entitet_id', red.id]], red: 'created_at', opadajuce: true });
      crtaj();
    } catch (e) { telo.innerHTML = `<div class="prazno"><b>Dokumenti nisu učitani</b>${esc(prevediGresku(e))}</div>`; }
  };
  async function posalji() {
    const fajlovi = [...($('#dok-fajl').files || [])];
    if (!fajlovi.length) return poruka('Izaberite bar jedan fajl.', true);
    const preveliki = fajlovi.filter(f => f.size > MAKS);
    if (preveliki.length) return poruka(`Fajl „${preveliki[0].name}“ je veći od 20 MB.`, true);
    const b = $('#dok-posalji'); b.disabled = true; b.textContent = 'Učitavanje…';
    let ok = 0;
    for (const f of fajlovi) {
      const putanja = `${k.entitet}/${red.id}/${Date.now()}_${bezbednoIme(f.name)}`;
      try {
        await Store.posaljiFajl(putanja, f);
        try {
          await Store.dodaj('dokumenti', { entitet: k.entitet, entitet_id: red.id, vrsta: $('#dok-vrsta').value || null,
            naziv: f.name, putanja, velicina: f.size, mime: f.type || null, napomena: $('#dok-napomena').value.trim() || null });
          ok++;
        } catch (e) { await Store.obrisiFajlove([putanja]).catch(() => {}); throw e; }
      } catch (e) { poruka(`${f.name}: ${prevediGresku(e)}`, true); }
    }
    if (ok) poruka(ok === 1 ? 'Dokument je učitan.' : `Učitano dokumenata: ${ok}.`);
    await ucitaj();
  }
  async function otvori(x) {
    const prozor = window.open('', '_blank');
    try {
      const url = await Store.linkFajla(x.putanja);
      if (prozor) { prozor.opener = null; prozor.location = url; } else window.location.assign(url);
    } catch (e) { prozor?.close(); poruka(prevediGresku(e), true); }
  }
  async function brisi(x) {
    if (!confirm(`Obrisati dokument „${x.naziv}“?`)) return;
    try { await Store.obrisi('dokumenti', x.id); await Store.obrisiFajlove([x.putanja]).catch(() => {}); poruka('Dokument je obrisan.'); await ucitaj(); }
    catch (e) { poruka(prevediGresku(e), true); }
  }
  telo.innerHTML = '<div class="prazno">Učitavanje…</div>';
  await ucitaj();
}

  postaviSadrzaj(`<div class="zaglavlje"><div><h1>Rokovi i alarmi</h1>
      <p>Istekli rokovi i rokovi koji uskoro ističu za vozila i vozače u upotrebi. Period upozorenja za svaku vrstu roka podešava se u Šifarnicima.</p></div></div>

    <div class="tabela-okvir" id="tabela"><div class="prazno">Učitavanje…</div></div>`);

  const broj = st => aktivni.filter(a => st === 'PAZNJA' ? a.status !== 'OK' : st === 'SVI' ? true : a.status === st).length;
  const STATUSI = [['PAZNJA', 'Traže pažnju'], ['ISTEKAO', 'Istekli'], ['USKORO', 'Ističu uskoro'], ['SVI', 'Svi rokovi']];
  const ENTITETI = [['SVE', 'Vozila i vozači'], ['VOZILO', 'Vozila'], ['VOZAC', 'Vozači']];

    $('#seg-status').innerHTML = STATUSI.map(([v, t]) => `<button data-v="${v}" class="${filterPregleda.status === v ? 'aktivan' : ''}">${t} (${broj(v)})</button>`).join('');
    $('#seg-entitet').innerHTML = ENTITETI.map(([v, t]) => `<button data-v="${v}" class="${filterPregleda.entitet === v ? 'aktivan' : ''}">${t}</button>`).join('');
    $$('#seg-status button').forEach(b => b.onclick = () => { filterPregleda.status = b.dataset.v; crtaj(); });
    $$('#seg-entitet button').forEach(b => b.onclick = () => { filterPregleda.entitet = b.dataset.v; crtaj(); });
    const vid = aktivni.filter(a =>
      (filterPregleda.status === 'SVI' || (filterPregleda.status === 'PAZNJA' ? a.status !== 'OK' : a.status === filterPregleda.status)) &&
      (filterPregleda.entitet === 'SVE' || a.entitet === filterPregleda.entitet));
    const kolone = [

      { l: 'Vozilo / vozač', f: a => a.entitet === 'VOZILO' ? tablica(a.naziv) : `<b>${esc(a.naziv)}</b>` },
      { l: 'Rok', k: 'vrsta_naziv' },
      { l: 'Ističe', f: a => fmtDatum(a.datum_isteka) },
      { l: 'Preostalo', f: a => a.dana_do_isteka < 0 ? `pre ${-a.dana_do_isteka} d.` : a.dana_do_isteka === 0 ? 'danas' : `još ${a.dana_do_isteka} d.`, broj: true },
      { l: 'Broj dokumenta', k: 'broj_dokumenta' }
    ];
    $('#tabela').innerHTML = vid.length ? tabelaHTML(kolone, vid)
      : `<div class="prazno">${S.alarmi.length ? '<b>Nema rokova u ovom prikazu</b>Sve je u redu za izabrani filter.' : '<b>Još nema unetih rokova</b>Rokove dodajete u kartici „Rokovi“ kod vozila i vozača.'}</div>`;
    veziKlikove($('#tabela'), vid, async a => {
      try {
        const kljuc = a.entitet === 'VOZILO' ? 'vozila' : 'vozaci';
        const red = await Store.jedan(ENT[kljuc].tabela, a.entitet_id);
        if (red) otvoriFioku(kljuc, red, 'rokovi');
      } catch (e) { poruka(prevediGresku(e), true); }
    });
  };
  crtaj();
}

          ${stavke.map(s => `<tr data-id="${s.id}"><td><b>${esc(s.kod)}</b></td><td><input type="text" name="naziv" value="${esc(s.naziv)}" autocomplete="off"></td>
            ${g.v ? `<td><input type="number" name="vrednost" step="any" value="${esc(s.vrednost ?? '')}"></td>` : ''}${g.o ? `<td><input type="text" name="oznaka" value="${esc(s.oznaka ?? '')}" autocomplete="off"></td>` : ''}
            ${(g.d || []).map(([k]) => `<td><input type="text" name="d_${k}" class="kod" value="${esc(s.dodatno?.[k] ?? '')}" autocomplete="off"></td>`).join('')}
            <td><input type="number" name="redosled" value="${s.redosled}"></td><td><input type="checkbox" name="aktivan"${s.aktivan ? ' checked' : ''}></td>
            <td class="uzan"><button class="dugme malo" data-akcija="sacuvaj" disabled>Sačuvaj</button></td></tr>`).join('')}
        </tbody></table></div>
      </div></div>`);
  $$('.lista-grupa button').forEach(b => b.onclick = () => { izabranaGrupa = b.dataset.g; prikaziSifarnike(); });
  $$('tr[data-id]').forEach(tr => tr.addEventListener('input', () => { $('[data-akcija="sacuvaj"]', tr).disabled = false; }));
  $$('tr[data-id]').forEach(tr => tr.addEventListener('change', () => { $('[data-akcija="sacuvaj"]', tr).disabled = false; }));
  const procitaj = tr => {
    const v = n => tr.querySelector(`[name="${n}"]`);
    const r = { naziv: v('naziv').value.trim(), redosled: Number(v('redosled').value || 100), aktivan: v('aktivan').checked };
    if (v('vrednost')) r.vrednost = v('vrednost').value === '' ? null : Number(v('vrednost').value);
    if (v('oznaka')) r.oznaka = v('oznaka').value.trim() || null;
    if (g.d) {
      const sad = stavke.find(s => s.id === tr.dataset.id)?.dodatno || {};
      r.dodatno = { ...sad };
      for (const [k] of g.d) { const x = v(`d_${k}`).value.trim().toUpperCase(); if (x) r.dodatno[k] = x; else delete r.dodatno[k]; }
    }
    return r;
  };
  $$('[data-akcija]').forEach(b => b.onclick = async () => {
    const tr = b.closest('tr'), r = procitaj(tr);
    if (!r.naziv) return poruka('Upišite naziv.', true);
    try {
      if (b.dataset.akcija === 'dodaj') {
        const kod = tr.querySelector('[name="kod"]').value.trim().toUpperCase().replace(/\s+/g, '_');
        if (!kod) return poruka('Upišite kod (npr. ADR_SERTIFIKAT).', true);
        await Store.dodaj('sifarnici', { grupa: izabranaGrupa, kod, ...r });
        poruka('Stavka je dodata.');
      } else {
        await Store.izmeni('sifarnici', tr.dataset.id, r);
        poruka('Izmena je sačuvana.');
      }
      await ucitajSifarnike(); prikaziSifarnike();
    } catch (e) { poruka(prevediGresku(e), true); }
  });
}

      <td><select name="uloga"><option value="">— bez pristupa —</option>${SVI.map(u => `<option value="${u}"${p.uloga === u ? ' selected' : ''}>${ULOGE[u]}</option>`).join('')}</select></td>
      <td><input type="checkbox" name="aktivan"${p.aktivan ? ' checked' : ''}></td>
      <td class="uzan"><button class="dugme malo" disabled>Sačuvaj</button></td></tr>`).join('')}</tbody></table>`;
  $$('#tabela tr[data-id]').forEach(tr => {
    const b = $('button', tr);
    tr.addEventListener('input', () => { b.disabled = false; });
    tr.addEventListener('change', () => { b.disabled = false; });
    b.onclick = async () => {
      const r = { ime: $('[name="ime"]', tr).value.trim() || null, uloga: $('[name="uloga"]', tr).value || null, aktivan: $('[name="aktivan"]', tr).checked };
      try {

        b.disabled = true;
      } catch (e) { poruka(prevediGresku(e), true); }

  });
}

// ============ FINANSIJE: zaduženja, potraživanja, ulazni računi ============
const FIN_ULOGE = ['ADMIN', 'FINANSIJE'];
const valutaKurs = v => v === 'EUR' ? 1 : ((S.sif.VALUTA || []).find(x => x.kod === v)?.vrednost ?? 1);
// Ulazni računi: podrazumevana valuta i PDV stopa prema državi naše firme (SI: EUR, 22 %; RS: RSD, 20 %)
const drzavaFirme = fi => { const d = bezKvacica(fi?.drzava || ''); return d.startsWith('sloven') ? 'SI' : d.startsWith('srb') ? 'RS' : ''; };
const valutaZaFirmu = fi => (drzavaFirme(fi) === 'RS' && (S.sif.VALUTA || []).some(x => x.kod === 'RSD') ? 'RSD' : 'EUR');
const stopaZaFirmu = fi => {
  const s = drzavaFirme(fi) === 'SI' ? 22 : drzavaFirme(fi) === 'RS' ? 20 : 0;
  return (S.sif.PDV_STOPA || []).some(x => x.aktivan && Number(x.vrednost) === s) ? s : 0;
};
const stopeUlaznih = drz => [...new Map((S.sif.PDV_STOPA || []).filter(x => x.aktivan && (!drz || !drzavaPdv(x) || drzavaPdv(x) === drz))
  .map(x => [String(Number(x.vrednost)), `${fmtStopa(x.vrednost)}`])).entries()].sort((a, b) => Number(b[0]) - Number(a[0]));
function preracunajBruto(f) {
  const bez = Number(String(f.querySelector('[name="iznos_bez_pdv"]').value).replace(',', '.'));
  const st = Number(f.querySelector('[name="pdv_stopa"]').value || 0);
  if (!f.querySelector('[name="iznos_bez_pdv"]').value || Number.isNaN(bez)) return;
  f.querySelector('[name="iznos_ukupno"]').value = (Math.round(bez * (100 + st)) / 100).toFixed(2);
}

      ${f.valuta !== 'EUR' ? red('Kurs / u EUR', `${fmtBroj(f.kurs, 4)} / ${novac(f.ukupno_eur, 'EUR')}`) : ''}
      ${red('Plaćeno', novac(f.placeno, f.valuta))}
      ${red('Preostalo', `<b>${novac(f.saldo, f.valuta)}</b> ${oznakaPlacanja(f)}`)}

const csvBroj = (n, dec = 2) => n === null || n === undefined || n === '' ? '' : Number(n).toFixed(dec).replace('.', ',');
function izvozCSV(ime, kolone, redovi) {
  const polje = v => { const s = v === null || v === undefined ? '' : String(v); return /[";\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const linije = [kolone.map(c => polje(c[0])).join(';'),
    ...redovi.map(r => kolone.map(([, f]) => polje(typeof f === 'function' ? f(r) : r[f])).join(';'))];
  const blob = new Blob(['\ufeff' + linije.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = ime;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function opsegPerioda(kod) {
  const d = new Date(), g = d.getFullYear(), m = d.getMonth();
  const iso = x => new Date(x.getTime() - x.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  if (kod === 'OVAJ_MESEC') return [iso(new Date(g, m, 1)), iso(new Date(g, m + 1, 0))];
  if (kod === 'PROSLI_MESEC') return [iso(new Date(g, m - 1, 1)), iso(new Date(g, m, 0))];
  if (kod === 'OVA_GODINA') return [`${g}-01-01`, `${g}-12-31`];
  if (kod === 'PROSLA_GODINA') return [`${g - 1}-01-01`, `${g - 1}-12-31`];
  return ['', ''];
}
const PERIODI = [['', 'Ceo period'], ['OVAJ_MESEC', 'Ovaj mesec'], ['PROSLI_MESEC', 'Prošli mesec'], ['OVA_GODINA', 'Ova godina'], ['PROSLA_GODINA', 'Prošla godina'], ['RUCNO', 'Od – do']];
const LISTE_STANJE = {};

async function prikaziListuF(kljuc) {

  const st = LISTE_STANJE[kljuc] ||= (() => { const [od, doo] = opsegPerioda(c.period); return { period: c.period, od, do: doo, status: c.status, partner: {}, dodatni: '', firma: '', grupa: '', trazi: '', izabrani: new Set() }; })();
  const akcija = c.akcija === undefined

  const izborni = c.izborni === undefined ? (r => ['NEPLACENA', 'DELIMICNO'].includes(r.status_placanja)) : c.izborni;

  const gi = c.grupnaIzmena && ima(c.grupnaIzmena.uloge || SVI) ? c.grupnaIzmena : null;
  const imaIzbor = mozeAkc || !!gi;
  const moguc = r => !!gi || (mozeAkc && izborni(r));
  const mere = resi(c.grupaMere) || [['Ukupno EUR', 'ukupno_eur'], ['Preostalo EUR', 'saldo_eur']];
  const mozeNovo = c.novo && ima(c.novo.uloge || SVI);
  postaviSadrzaj(`
    <div class="zaglavlje"><div><h1>${esc(c.naslov)}</h1><p>${esc(c.opis)}</p></div>
      <div class="alati" style="margin:0"><button class="dugme" id="izvoz">Izvoz u Excel (CSV)</button>
      ${(c.dodatnaDugmad || []).filter(d => ima(d.uloge || SVI)).map((d, i) => `<button class="dugme" data-dodatno="${i}">${esc(d.tekst)}</button>`).join('')}
      ${mozeNovo ? `<button class="dugme glavno" id="novo">${esc(c.novo.tekst)}</button>` : ''}</div></div>
    <div class="filteri" id="filteri"></div>
    <div class="alati" style="justify-content:space-between"><div class="segmenti" id="grupe"></div><div id="grupno"></div></div>

  let svi = [];
  const statusOk = r => (c.statusTest ? c.statusTest(r, st.status)
    : st.status === 'SVE' ? true
    : st.status === 'OTVORENO' ? ['NEPLACENA', 'DELIMICNO'].includes(r.status_placanja)
    : st.status === 'DOSPELO' ? r.dana_kasnjenja > 0
    : r.status_placanja === st.status);
  const filtriraj = () => {
    const q = bezKvacica(st.trazi.trim());
    return svi.filter(r => {
      const d = datumOf(r) || '';
      return statusOk(r)
        && (!st.od || d >= st.od) && (!st.do || d <= st.do)

    $('#f-do').onchange = e => { st.do = e.target.value; st.period = 'RUCNO'; $('#f-period').value = 'RUCNO'; crtaj(); };
    $('#f-status').onchange = e => { st.status = e.target.value; crtaj(); };

    $('#f-ponisti').onclick = () => { delete LISTE_STANJE[kljuc]; prikaziListuF(kljuc); };
  };
  const crtajZbir = vid => {
    if (c.zbirFn) { $('#zbir').innerHTML = vid.length ? c.zbirFn(vid) : ''; return; }
    const po = {};
    for (const r of vid) {
      if (r.status_placanja === 'STORNO') continue;
      const z = po[r.valuta] ||= { n: 0, bez: 0, uk: 0, pl: 0, sa: 0 };
      z.n++; z.uk += Number(r[c.iznos]); z.pl += Number(r.placeno); z.sa += Number(r.saldo);
      if (c.bezPdv) z.bez += Number(r[c.bezPdv]);
    }
    const eur = vid.filter(r => r.status_placanja !== 'STORNO').reduce((s, r) => ({ uk: s.uk + Number(r.ukupno_eur), sa: s.sa + Number(r.saldo_eur), bez: s.bez + Number(r.bez_pdv_eur || 0) }), { uk: 0, sa: 0, bez: 0 });

      </tbody></table></div>`;

  const crtajGrupe = vid => {

      : kl === 'tip' ? sifNaziv('TIP_FAKTURE', r.tip) : kl === 'kategorija' ? r.kategorija_naziv

function dijalogPlaceno(kljuc, ids, vid) {
  const c = LISTE[kljuc], izabrani = vid.filter(r => ids.includes(r.id));

  izabrani.forEach(r => { po[r.valuta] = (po[r.valuta] || 0) + Number(r.saldo); });
  zatvoriFioku();
  const z = document.createElement('div');
  z.className = 'zavesa'; z.id = 'fioka';
  z.innerHTML = `<aside class="fioka" role="dialog" aria-modal="true" aria-labelledby="dp-naslov" style="width:min(460px,100%)">
    <header><h2 id="dp-naslov">Označi plaćeno</h2><div class="pod">Izabrano: ${izabrani.length}; preostali iznos se upisuje kao uplata: ${Object.entries(po).map(([v, s]) => novac(s, v)).join(' + ')}</div></header>
    <form class="telo" id="dp-forma" novalidate><div class="forma" style="grid-template-columns:1fr">
      <label class="polje"><span>Datum uplate <i>*</i></span><input type="date" name="datum" value="${danas()}"></label>
      <label class="polje"><span>Napomena (npr. broj izvoda)</span><input type="text" name="napomena" autocomplete="off"></label>
      <p class="tekst-2" style="margin:0">Za delimičnu uplatu otvorite pojedinačni zapis i dodajte uplatu sa tačnim iznosom.</p></div></form>
    <footer><div class="desno"><button class="dugme" id="dp-otkazi">Otkaži</button><button class="dugme glavno" id="dp-potvrdi">Označi plaćeno</button></div></footer></aside>`;
  document.body.appendChild(z);
  document.addEventListener('keydown', escFioka);
  $('#dp-otkazi').onclick = () => zatvoriFioku();
  $('#dp-potvrdi').onclick = async () => {
    const datum = $('[name="datum"]', z).value;
    if (!datum) return poruka('Upišite datum uplate.', true);
    const b = $('#dp-potvrdi'); b.disabled = true;
    try {
      const n = await Store.rpc(c.rpc[0], { [c.rpc[1]]: ids, p_datum: datum, p_napomena: $('[name="napomena"]', z).value.trim() || null });

      poruka(`Označeno kao plaćeno: ${n}.`); osveziListu();
    } catch (e) { b.disabled = false; poruka(prevediGresku(e), true); }
  };
}

  catch (e) { S.vozila = S.vozila || []; S.vozaci = S.vozaci || []; console.warn('Vozni park nije učitan', e); }
}
const vozacIme = id => { const v = (S.vozaci || []).find(x => x.id === id); return v ? `${v.prezime} ${v.ime}` : ''; };
const voziloReg = id => (S.vozila || []).find(x => x.id === id)?.registracija ?? '';
const opcVozila = prikolica => (S.vozila || []).filter(v => v.aktivno && ((v.tip === 'PRIKOLICA') === prikolica))
  .map(v => [v.id, [v.registracija, [v.marka, v.model].filter(Boolean).join(' ')].filter(Boolean).join(' – ')]);
const opcVozaci = () => (S.vozaci || []).filter(v => v.aktivan).map(v => [v.id, `${v.prezime} ${v.ime}`]);
const drzavaPdv = x => (x?.dodatno?.drzava || '').toUpperCase();
// PDV stope koje važe za državu firme (stope bez države važe za obe)
const pdvOpcije = drz => (S.sif.PDV_STOPA || []).filter(x => x.aktivan && (!drz || !drzavaPdv(x) || drzavaPdv(x) === drz)).map(x => [x.kod, x.naziv]);
const drzavaFirmeId = id => drzavaFirme(S.firme.find(f => f.id === id));
function pdvRedZaDrzavu(kod, stopa, drz) {
  const sve = S.sif.PDV_STOPA || [];
  return sve.find(x => x.kod === kod && drzavaPdv(x) === drz) || sve.find(x => x.kod === kod && !drzavaPdv(x))
    || sve.find(x => Number(x.vrednost) === Number(stopa) && drzavaPdv(x) === drz) || (drz ? null : sve.find(x => x.kod === kod));
}
const pdvRed = kod => (S.sif.PDV_STOPA || []).find(x => x.kod === kod);
const kodPoStopi = (stopa, drz) => {
  const sve = (S.sif.PDV_STOPA || []).filter(x => x.aktivan !== false && Number(x.vrednost) === Number(stopa));
  return (sve.find(x => drz && drzavaPdv(x) === drz) || sve.find(x => !drzavaPdv(x)) || (drz ? sve.find(x => !drzavaPdv(x) || drzavaPdv(x) === drz) : sve[0]))?.kod ?? null;
};
const stopaKoda = kod => Number(pdvRed(kod)?.vrednost ?? 0);
const tipOpcije = () => (S.sif.TIP_FAKTURE || []).filter(x => x.aktivan && x.kod !== 'ZADUZENJE').map(x => [x.kod, x.naziv]);
const fmtStopa = s => `${String(Number(s)).replace('.', ',')} %`;
const mnozina = (n, jedan, dva, pet) => { const d = n % 10, s = n % 100; return d === 1 && s !== 11 ? jedan : d >= 2 && d <= 4 && (s < 12 || s > 14) ? dva : pet; };

function predlogTipa(n) {
  const kl = S.partneri.find(p => p.id === n.klijent_id), fi = S.firme.find(f => f.id === n.firma_id);

  if (kl?.drzava && fi?.drzava && bezKvacica(kl.drzava) !== bezKvacica(fi.drzava)) return 'INO';
  return 'DOMACA';
}
function predlogPdv(tip, n) {
  const drz = drzavaFirmeId(n.firma_id);
  if (tip !== 'DOMACA') return kodPoStopi(0, drz) ?? '0';
  return kodPoStopi(drz === 'SI' ? 22 : drz === 'RS' ? 20 : 0, drz) ?? kodPoStopi(0, drz) ?? '0';

async function faktureNaloga(id) {
  const fs = await Store.lista('faktura_stavke', { filteri: [['eq', 'nalog_id', id]] });
  const ids = [...new Set(fs.map(x => x.faktura_id))];
  return ids.length ? Store.lista('v_fakture', { filteri: [['in', 'id', ids]], red: 'created_at' }) : [];
}

// ---------------------------------------------------------------------
// Pravila interne fakture i preračun cena
// ---------------------------------------------------------------------
const podesavanje = kod => (S.sif.PODESAVANJE || []).find(x => x.kod === kod && x.aktivan !== false);
function pravilaInterne() {
  const za = podesavanje('INTERNA_ZA')?.oznaka, iz = podesavanje('INTERNA_IZDAVALAC')?.oznaka;
  const um = Number(podesavanje('INTERNA_UMANJENJE')?.vrednost ?? 0);
  const nadji = kod => S.firme.find(f => kod && String(f.kod).toUpperCase() === String(kod).trim().toUpperCase());
  const fZa = nadji(za), fIz = nadji(iz);
  return fZa && fIz && fZa.id !== fIz.id ? { za: fZa, iz: fIz, um } : null;
}
const stavkaUEur = s => Number(s.cena) / (s.valuta === 'EUR' || !s.valuta ? 1 : Number(s.kurs || valutaKurs(s.valuta)) || 1);
const izEura = (eur, valuta, kurs) => Math.round(eur * (valuta === 'EUR' ? 1 : kurs) * 100) / 100;
const cenaInterne = (cena, kurs, um) => Math.round(cena / kurs * 100) / 100 - um;
const opcHTML = (lista, izabran) => lista.map(([v, t]) => `<option value="${esc(v)}"${String(v) === String(izabran ?? '') ? ' selected' : ''}>${esc(t)}</option>`).join('');
const firmaZaKupca = kl => { const akt = S.firme.filter(f => f.aktivna !== false); return akt.find(f => kl?.drzava && f.drzava && bezKvacica(f.drzava) === bezKvacica(kl.drzava)) || akt[0]; };
// Predlog faktura za stavku: firma po državi kupca, valuta po firmi; uz dinarsku fakturu BT i interna BA → BT
function predlogPlana(cenaEur, klijentId, uvekInterna = true) {
  const kl = S.partneri.find(p => p.id === klijentId), fi = firmaZaKupca(kl);
  if (!fi) return [];
  const tip = predlogTipa({ klijent_id: klijentId, firma_id: fi.id }), valuta = valutaZaFirmu(fi), kurs = valuta === 'EUR' ? 1 : Number(valutaKurs(valuta)) || 1;
  const red = [{ firma_id: fi.id, tip, klijent_id: '', valuta, kurs, cena: izEura(cenaEur || 0, valuta, kurs), pdv_kod: predlogPdv(tip, { firma_id: fi.id }), auto: true }];
  const pr = pravilaInterne();
  if (pr && fi.id === pr.za.id && tip === 'DOMACA' && valuta === 'RSD') {
    const c = cenaInterne(red[0].cena, kurs, pr.um);
    if (uvekInterna || c > 0) red.push({ firma_id: pr.iz.id, tip: 'INTERNA', klijent_id: '', valuta: 'EUR', kurs: 1, cena: Math.max(0, c), pdv_kod: predlogPdv('INTERNA', { firma_id: pr.iz.id }), auto: true });
  }
  return red;
}
