<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BALKAN TMS — v3.0</title>
<link rel="stylesheet" href="./styles/app.css">
</head>
<body>
<div id="login">
  <div class="login-card">
    <div class="logo">BALKAN <span>TMS</span></div>
    <div class="sub">Transport management · auto-logistika · online</div>
    <form class="login-form" onsubmit="return false" autocomplete="on" style="text-align:left">
      <div class="lfield"><label>E-mail</label><input id="loginEmail" type="email" autocomplete="username" placeholder="ime@firma.rs"></div>
      <div class="lfield"><label>Lozinka</label><input id="loginPass" type="password" autocomplete="current-password"></div>
      <button class="btn pri" id="loginBtn" style="width:100%;justify-content:center">Prijava</button>
      <div id="loginErr" style="display:none;color:#B91C1C;font-size:12.5px;margin-top:8px"></div>
    </form>
    <div class="hint-inline" style="margin-top:16px">Online verzija — podaci su na zajedničkom serveru (Supabase). Naloge zaposlenima otvara administrator u modulu Administracija.</div>
  </div>
</div>
<div id="shell">
  <div class="layout">
    <aside class="sidebar"><div class="brand">BALKAN <span>TMS</span></div><nav class="nav" id="nav"></nav></aside>
    <div class="main">
      <header class="topbar">
        <div class="company-switch" id="companySwitch"></div>
        <div class="search"><span class="si">&#9906;</span><input id="globalSearch" placeholder="Globalna pretraga (nalozi, klijenti, vozila, ture)..."></div>
        <div class="quick" id="quickActions"></div>
        <div class="syncbadge ok" id="syncBadge" title="Sinhronizovano"></div>
        <div class="userchip" id="userChip"></div>
      </header>
      <div class="content" id="view"></div>
    </div>
  </div>
</div>
<div id="modalRoot"></div>
<div id="modalRoot2"></div>
<div id="toast" class="toast"></div>
<!-- Zavisnosti sa CDN-a: klasicne skripte, izvrsavaju se pre modula (moduli su odlozeni). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- Aplikacija: ES moduli. Zahteva http(s) posluzivanje (ne radi preko file://). -->
<script type="module" src="./src/main.js"></script>
</body>
</html>
