// Stavke naloga sa fakturama – na istom ekranu kao podaci naloga
// ---------------------------------------------------------------------
async function urednikStavki(nalog, telo, forma, dno, opc = {}) {
  const moze = ima(SVI) && !!forma.querySelector('select:not([disabled]),input:not([disabled])');
  const sek = document.createElement('section');
  sek.className = 'ns'; sek.id = 'ns';
  sek.innerHTML = '<div class="prazno">Učitavanje stavki…</div>';
  telo.appendChild(sek);
  telo.closest('.fioka')?.classList.add('siroka');
  let stavke = [], plan = [];
  const brojFakture = new Map();
  if (nalog) {
    try {
      [stavke, plan] = await Promise.all([Store.lista('nalog_stavke', { filteri: [['eq', 'nalog_id', nalog.id]], red: 'rb' }),
        Store.lista('nalog_fakture', { filteri: [['eq', 'nalog_id', nalog.id]], red: 'rb' })]);
      const fIds = [...new Set(plan.map(p => p.faktura_id).filter(Boolean))];
      if (fIds.length) (await Store.lista('fakture', { filteri: [['in', 'id', fIds]] })).forEach(f => brojFakture.set(f.id, f.broj));
    } catch (e) { sek.innerHTML = `<div class="prazno">${esc(prevediGresku(e))}</div>`; return null; }
  }
  if (!document.body.contains(sek)) return null;
  const M = opc.nacrt || stavke.map(s => {
    const fak = plan.filter(p => p.nalog_stavka_id === s.id);
    return { id: s.id, opis: s.opis, kolicina: Number(s.kolicina), jedinica: s.jedinica || '', cena: s.cena == null ? null : Number(s.cena), valuta: s.valuta || 'EUR', kurs: Number(s.kurs) || 1,
      teret: s.teret || '', zakljucana: !!s.faktura_id || fak.some(p => p.faktura_id),
      fakture: fak.map(p => ({ id: p.id, firma_id: p.firma_id, tip: p.tip, klijent_id: p.klijent_id || '', valuta: p.valuta, kurs: Number(p.kurs) || 1,
        cena: Number(p.cena), pdv_kod: p.pdv_kod || '', faktura_id: p.faktura_id || null, auto: false })) };
  });
  const pr = pravilaInterne();
  const klijentNaloga = () => forma.querySelector('[name="klijent_id"]')?.value || nalog?.klijent_id || '';
  const aktivne = S.firme.filter(f => f.aktivna !== false);
  const tipovi = (S.sif.TIP_FAKTURE || []).filter(x => x.aktivan !== false && x.kod !== 'ZADUZENJE').map(x => [x.kod, x.naziv]);
  const partneriOpc = S.partneri.filter(p => p.aktivan !== false).map(p => [p.id, p.naziv]);
  const eurStavke = s => (s.cena == null || Number.isNaN(Number(s.cena)) ? 0 : stavkaUEur(s));
  const iznosF = (s, f) => Math.round(Number(s.kolicina || 0) * Number(f.cena || 0) * 100) / 100;
  const preracunaj = s => {
    const baza = pr && s.fakture.find(f => f.firma_id === pr.za.id && f.tip === 'DOMACA' && f.valuta === 'RSD');
    s.fakture.forEach(f => {
      if (!f.auto || f.faktura_id) return;
      if (f.tip === 'INTERNA') { if (baza) f.cena = Math.max(0, cenaInterne(Number(baza.cena) || 0, Number(baza.kurs) || 1, pr.um)); }
      else f.cena = izEura(eurStavke(s), f.valuta, Number(f.kurs) || 1);
    });
  };
  const redF = (s, f, j) => {
    const dis = f.faktura_id || !moze ? ' disabled' : '', fi = S.firme.find(x => x.id === f.firma_id);
    return `<tr data-j="${j}"${f.faktura_id ? ' class="zak"' : ''}>
      <td><select data-f="firma_id" aria-label="Firma"${dis}>${opcHTML(aktivne.map(x => [x.id, x.kod]), f.firma_id)}</select></td>
      <td><select data-f="tip" aria-label="Vrsta fakture"${dis}>${opcHTML(tipovi.some(x => x[0] === f.tip) ? tipovi : [...tipovi, [f.tip, sifNaziv('TIP_FAKTURE', f.tip)]], f.tip)}</select></td>
      <td><select data-f="klijent_id" aria-label="Kupac"${dis}><option value="">${f.tip === 'INTERNA' ? 'naša druga firma' : 'kupac sa naloga'}</option>${opcHTML(partneriOpc, f.klijent_id)}</select></td>
      <td><select data-f="valuta" aria-label="Valuta"${dis}>${opcHTML(sifOpcije('VALUTA').map(o => [o.v, o.v]), f.valuta)}</select></td>
      <td><input data-f="kurs" type="number" step="0.0001" min="0" value="${esc(f.kurs)}" aria-label="Kurs"${f.valuta === 'EUR' ? ' readonly' : ''}${dis}></td>
      <td><input data-f="cena" type="number" step="0.01" value="${esc(f.cena ?? '')}" aria-label="Cena po jedinici"${dis}></td>
      <td><select data-f="pdv_kod" aria-label="PDV"${dis}>${opcHTML(pdvOpcije(drzavaFirme(fi)), f.pdv_kod)}</select></td>
      <td class="b" data-iznos>${novac(iznosF(s, f), f.valuta)}</td>
      <td>${f.faktura_id ? `<span class="oznaka zelena nw">${esc(brojFakture.get(f.faktura_id) || 'izdata')}</span>` : (moze ? '<button class="dugme malo" type="button" data-ukloni-f aria-label="Ukloni fakturu" title="Ukloni">×</button>' : '')}</td></tr>`;
  };
  const kartica = (s, i) => {
    const dis = s.zakljucana || !moze ? ' disabled' : '';
    return `<div class="ns-stavka" data-i="${i}">
      <div class="ns-red">
        <label class="polje"><span>Opis usluge <i>*</i></span><input type="text" data-s="opis" value="${esc(s.opis)}"${dis}></label>
        <label class="polje"><span>Količina <i>*</i></span><input data-s="kolicina" type="number" step="any" value="${esc(s.kolicina ?? '')}"${dis}></label>
        <label class="polje"><span>Jedinica</span><select data-s="jedinica"${dis}>${opcHTML([['', '—'], ...sifOpcije('JEDINICA').map(o => [o.v, o.t])], s.jedinica)}</select></label>
        <label class="polje"><span>Cena (${esc(s.valuta || 'EUR')})</span><input data-s="cena" type="number" step="0.01" value="${esc(s.cena ?? '')}"${dis}></label>
        ${moze && !s.zakljucana ? '<button class="dugme malo" type="button" data-ukloni-s aria-label="Ukloni stavku" title="Ukloni stavku">×</button>' : '<span></span>'}
      </div>
      <label class="polje"><span>Teret / VIN brojevi</span><input type="text" data-s="teret" value="${esc(s.teret)}"${dis}></label>
      <div class="ns-fak-naslov">Fakture za ovu stavku${s.zakljucana ? ' · stavka je fakturisana' : ''}</div>
      ${s.fakture.length ? `<div class="ns-okvir"><table class="ns-fakture"><thead><tr><th>Firma</th><th>Vrsta</th><th>Kupac</th><th>Valuta</th><th>Kurs</th><th>Cena / jed.</th><th>PDV</th><th class="b">Iznos</th><th></th></tr></thead>
        <tbody>${s.fakture.map((f, j) => redF(s, f, j)).join('')}</tbody></table></div>`
        : '<p class="tekst-2" style="margin:4px 0">Još nije definisano koje se fakture izdaju za ovu stavku.</p>'}
      ${moze ? '<div class="ns-akcije"><button class="dugme malo" type="button" data-dodaj-f>+ Dodaj fakturu</button><button class="dugme malo" type="button" data-predlog title="Predlog po državi kupca i pravilu interne fakture">Predlog</button></div>' : ''}
    </div>`;
  };
  const zbir = () => {
    let plan = 0, interne = 0, otvoreno = 0;
    M.forEach(s => s.fakture.forEach(f => {
      const e = iznosF(s, f) / (f.valuta === 'EUR' ? 1 : Number(f.kurs) || 1);
      if (f.tip === 'INTERNA') interne += e; else plan += e;
      if (!f.faktura_id) otvoreno++;
    }));
    const bez = M.filter(s => !s.fakture.length).length;
    return `<b>Plan prihoda ${fmtBroj(plan)} EUR</b> bez PDV (bez internih)${interne ? ` · interne ${fmtBroj(interne)} EUR` : ''} · za izdavanje ${otvoreno} ${mnozina(otvoreno, 'linija', 'linije', 'linija')}${bez ? ` · <span class="minus">${bez} ${mnozina(bez, 'stavka nema', 'stavke nemaju', 'stavki nema')} definisane fakture</span>` : ''}`;
  };
  const crtaj = () => {
    sek.innerHTML = `<div class="sekcija-forme">Stavke i fakture</div>
      <p class="tekst-2" style="margin:6px 0 10px">Uz svaku stavku navedite koje se fakture izdaju – firma, vrsta, kupac i cena po jedinici. Opis, količina i teret prelaze na fakturu. Fakture se izdaju komandom „Fakturiši“ (u listi naloga ili ovde, posle čuvanja).</p>
      <div id="ns-lista">${M.map(kartica).join('') || '<div class="prazno" style="padding:16px">Nalog još nema stavke.</div>'}</div>
      ${moze ? '<button class="dugme" type="button" id="ns-dodaj">+ Dodaj stavku</button>' : ''}
      <div class="napomena" id="ns-zbir" style="margin-top:12px">${zbir()}</div>`;
  };
  const zameniKarticu = i => { const el = sek.querySelector(`.ns-stavka[data-i="${i}"]`); if (el) el.outerHTML = kartica(M[i], i); $('#ns-zbir').innerHTML = zbir(); };
  const osveziBrojeve = i => {
    const s = M[i], el = sek.querySelector(`.ns-stavka[data-i="${i}"]`); if (!el) return;
    s.fakture.forEach((f, j) => {
      const tr = el.querySelector(`tr[data-j="${j}"]`); if (!tr) return;
      const c = tr.querySelector('[data-f="cena"]');
      if (f.auto && document.activeElement !== c) c.value = f.cena;
      tr.querySelector('[data-iznos]').innerHTML = novac(iznosF(s, f), f.valuta);
    });
    $('#ns-zbir').innerHTML = zbir();
  };
  sek.addEventListener('input', e => {
    const card = e.target.closest('.ns-stavka'); if (!card) return;
    fiokaIzmenjena = true;
    const i = +card.dataset.i, s = M[i], ks = e.target.dataset.s, kf = e.target.dataset.f;
    if (ks) {
      s[ks] = ['kolicina', 'cena'].includes(ks) ? (e.target.value === '' ? null : Number(e.target.value)) : e.target.value;
      if (ks === 'cena') preracunaj(s);
      osveziBrojeve(i); return;
    }
    const tr = e.target.closest('tr[data-j]'); if (!tr || !kf || e.target.tagName !== 'INPUT') return;
    const f = s.fakture[+tr.dataset.j];
    if (kf === 'cena') { f.cena = e.target.value === '' ? null : Number(e.target.value); f.auto = false; }
    if (kf === 'kurs') f.kurs = Number(e.target.value) || 0;
    preracunaj(s); osveziBrojeve(i);
  });
  sek.addEventListener('change', e => {
    const card = e.target.closest('.ns-stavka'); if (!card || e.target.tagName !== 'SELECT') return;
    fiokaIzmenjena = true;
    const i = +card.dataset.i, s = M[i];
    if (e.target.dataset.s) { s[e.target.dataset.s] = e.target.value; return; }
    const tr = e.target.closest('tr[data-j]'), k = e.target.dataset.f; if (!tr || !k) return;
    const f = s.fakture[+tr.dataset.j];
    f[k] = e.target.value;
    if (k === 'firma_id') {
      const fi = S.firme.find(x => x.id === f.firma_id);
      f.valuta = valutaZaFirmu(fi); f.kurs = f.valuta === 'EUR' ? 1 : Number(valutaKurs(f.valuta)) || 1; f.auto = true;
      if (!['INTERNA', 'GOTOVINSKA'].includes(f.tip)) f.tip = predlogTipa({ klijent_id: f.klijent_id || klijentNaloga(), firma_id: f.firma_id });
      f.pdv_kod = predlogPdv(f.tip, { firma_id: f.firma_id });
    }
    if (k === 'tip') { f.pdv_kod = predlogPdv(f.tip, { firma_id: f.firma_id }); if (f.tip === 'INTERNA') { f.klijent_id = ''; f.valuta = 'EUR'; f.kurs = 1; f.auto = true; } }
    if (k === 'valuta') { f.kurs = f.valuta === 'EUR' ? 1 : Number(valutaKurs(f.valuta)) || 1; f.auto = true; }
    preracunaj(s); zameniKarticu(i);
  });
  sek.addEventListener('click', e => {
    if (e.target.id === 'ns-dodaj') {
      M.push({ opis: 'Usluga prevoza', kolicina: 1, jedinica: '', cena: null, valuta: 'EUR', kurs: 1, teret: '', fakture: predlogPlana(0, klijentNaloga()) });
      fiokaIzmenjena = true; crtaj();
      sek.querySelector(`.ns-stavka[data-i="${M.length - 1}"] [data-s="opis"]`)?.focus();
      return;
    }
    const card = e.target.closest('.ns-stavka'); if (!card) return;
    const i = +card.dataset.i, s = M[i];
    if (e.target.matches('[data-ukloni-s]')) { M.splice(i, 1); fiokaIzmenjena = true; crtaj(); }
    else if (e.target.matches('[data-ukloni-f]')) { s.fakture.splice(+e.target.closest('tr').dataset.j, 1); fiokaIzmenjena = true; preracunaj(s); zameniKarticu(i); }
    else if (e.target.matches('[data-dodaj-f]')) {
      s.fakture.push(predlogPlana(eurStavke(s), klijentNaloga())[0] || { firma_id: aktivne[0]?.id, tip: 'DOMACA', klijent_id: '', valuta: 'EUR', kurs: 1, cena: null, pdv_kod: '', auto: true });
      preracunaj(s); fiokaIzmenjena = true; zameniKarticu(i);
    } else if (e.target.matches('[data-predlog]')) {
      s.fakture = s.fakture.filter(f => f.faktura_id).concat(predlogPlana(eurStavke(s), klijentNaloga()));
      preracunaj(s); fiokaIzmenjena = true; zameniKarticu(i);
    }
  });
  crtaj();
  if (nalog && ima(FIN_ULOGE) && (nalog.fakture_plan || 0) > (nalog.fakture_plan_izdato || 0)) {
    const desno = dno.querySelector('.desno'), b = document.createElement('button');
    b.className = 'dugme'; b.id = 'fakturisi-nalog'; b.type = 'button'; b.textContent = 'Fakturiši';
    desno?.insertBefore(b, desno.querySelector('#sacuvaj'));
    b.onclick = () => {
      if (fiokaIzmenjena) return poruka('Prvo sačuvajte izmene naloga.', true);
      dijalogIzdavanja([nalog.id], { posle: async () => otvoriFioku('nalozi', await Store.jedan('v_nalozi', nalog.id), 'podaci') });
    };
  }
  return {
    provera: () => {
      for (const [i, s] of M.entries()) {
        if (!String(s.opis || '').trim()) return `Stavka ${i + 1}: upišite opis.`;
        if (!Number(s.kolicina)) return `Stavka „${s.opis}“: količina ne može biti 0.`;
        for (const f of s.fakture) {
          if (f.faktura_id) continue;
          if (!f.firma_id || !f.tip) return `Stavka „${s.opis}“: izaberite firmu i vrstu fakture.`;
          if (f.cena == null || Number.isNaN(Number(f.cena))) return `Stavka „${s.opis}“: upišite cenu na fakturi.`;
          if (f.tip === 'INTERNA' && Number(f.cena) <= 0) return `Stavka „${s.opis}“: cena interne fakture mora biti veća od 0.`;
          if (f.valuta !== 'EUR' && !(Number(f.kurs) > 0)) return `Stavka „${s.opis}“: upišite kurs.`;
        }
      }
      return null;
    },
    sacuvaj: n => Store.rpc('sacuvaj_stavke_naloga', { p_nalog: n.id, p_stavke: M.map((s, i) => ({
      id: s.id || null, rb: i + 1, opis: String(s.opis).trim(), kolicina: Number(s.kolicina), jedinica: s.jedinica || null, cena: s.cena ?? 0,
      valuta: s.valuta || 'EUR', kurs: s.kurs || 1, teret: s.teret || null,
      fakture: s.fakture.map((f, j) => ({ id: f.id || null, rb: j + 1, firma_id: f.firma_id, tip: f.tip, klijent_id: f.klijent_id || null,
        valuta: f.valuta, kurs: f.valuta === 'EUR' ? 1 : Number(f.kurs), cena: Number(f.cena), pdv_kod: f.pdv_kod || null })) })) }),
    nacrt: () => M
  };
}

// ---------------------------------------------------------------------
// Fakturiši – izdaje fakture definisane uz stavke izabranih naloga
// ---------------------------------------------------------------------
async function dijalogIzdavanja(ids, op = {}) {
  let nal, plan, stv;
  try {
    [nal, plan, stv] = await Promise.all([Store.lista('v_nalozi', { filteri: [['in', 'id', ids]] }),
      Store.lista('nalog_fakture', { filteri: [['in', 'nalog_id', ids], ['is', 'faktura_id', null]] }),
      Store.lista('nalog_stavke', { filteri: [['in', 'nalog_id', ids]] })]);
  } catch (e) { return poruka(prevediGresku(e), true); }
  if (!plan.length) return poruka('Izabrani nalozi nemaju fakture za izdavanje. U nalogu uz stavke dodajte fakture (firma, vrsta, cena).', true);
  const nm = new Map(nal.map(n => [n.id, n])), sm = new Map(stv.map(s => [s.id, s]));
  const bezPlana = nal.filter(n => n.fakturisano !== 'DA' && !plan.some(p => p.nalog_id === n.id));
  const imaDevize = plan.some(p => p.valuta !== 'EUR');
  const stanje = { datum: danas(), prometa: '', kurs: '', grupno: false };
  const interniKupac = p => S.partneri.find(x => x.interna_firma_id && x.interna_firma_id !== p.firma_id);
  const grupe = () => {
    const m = new Map();
    for (const p of plan) {
      const n = nm.get(p.nalog_id), s = sm.get(p.nalog_stavka_id); if (!n || !s) continue;
      const kupac = p.klijent_id || (p.tip === 'INTERNA' ? (interniKupac(p)?.id || 'interna') : n.klijent_id);
      const ng = p.tip === 'INTERNA' ? '' : n.nalogodavac_id;
      const kg = [p.firma_id, p.tip, kupac, ng, p.valuta, stanje.grupno ? '' : n.id].join('|');
      const g = m.get(kg) || { firma: p.firma_id, tip: p.tip, kupac, ng, valuta: p.valuta, nalozi: new Map(), os: 0 };
      g.os += Math.round(Number(s.kolicina) * Number(p.cena) * 100) / 100; g.nalozi.set(n.id, n);
      m.set(kg, g);
    }
    return [...m.values()].sort((a, b) => (a.tip === 'INTERNA') - (b.tip === 'INTERNA'));
  };
  const upoz = [];
  if (bezPlana.length) upoz.push(`Bez definisanih faktura (preskaču se): ${bezPlana.map(n => n.broj).join(', ')}`);
  for (const id of new Set(grupe().map(g => g.kupac))) {
    const p = S.partneri.find(x => x.id === id); if (!p) continue;
    if (!p.adresa || !p.mesto) upoz.push(`${p.naziv}: adresa nije potpuna`);
    if (!p.pib && p.tip !== 'FIZICKO') upoz.push(`${p.naziv}: nema PIB`);
  }
  zatvoriFioku();
  const z = document.createElement('div');
  z.className = 'zavesa'; z.id = 'fioka';
  z.innerHTML = `<aside class="fioka" role="dialog" aria-modal="true" aria-labelledby="di-naslov" style="width:min(860px,100%)">
    <header><h2 id="di-naslov">Fakturiši ${ids.length > 1 ? 'izabrane naloge' : `nalog ${esc(nal[0]?.broj || '')}`}</h2>
      <div class="pod">Izdaju se fakture definisane uz stavke. Dospeće = datum fakture + rok plaćanja nalogodavca.</div></header>
    <div class="telo" id="di-telo">
      <div class="forma">
        <label class="polje"><span>Datum fakture</span><input id="di-datum" type="date" value="${stanje.datum}"></label>
        <label class="polje"><span>Datum prometa</span><input id="di-prometa" type="date"><small>Prazno = datum istovara naloga.</small></label>
        ${imaDevize ? '<label class="polje"><span>Kurs za fakture u dinarima</span><input id="di-kurs" type="number" step="0.0001" placeholder="kurs iz naloga"><small>Prazno = kurs upisan uz stavku. Iznosi u dinarima se ne menjaju.</small></label>' : ''}
      </div>
      ${ids.length > 1 ? '<label style="display:flex;gap:8px;align-items:center;margin:8px 0"><input type="checkbox" id="di-grupno"> Jedna faktura po kupcu (više naloga na istoj fakturi)</label>' : ''}
      ${upoz.length ? `<div class="napomena upozorenje">${upoz.map(esc).join('<br>')}</div>` : ''}
      <div id="di-pregled"></div>
    </div>
    <footer><div class="desno"><button class="dugme" type="button" id="di-otkazi">Otkaži</button><button class="dugme glavno" type="button" id="di-izdaj">Fakturiši</button></div></footer>
  </aside>`;
  document.body.appendChild(z);
  document.addEventListener('keydown', escFioka);
  const crtaj = () => {
    const gr = grupe();
    $('#di-pregled').innerHTML = `<p style="margin:12px 0 6px"><b>Biće izdato ${gr.length} ${mnozina(gr.length, 'faktura', 'fakture', 'faktura')}</b></p>
      <div class="tabela-okvir">${tabelaHTML([
        { l: 'Firma', f: g => esc(firmaKod(g.firma)) },
        { l: 'Vrsta', f: g => esc(sifNaziv('TIP_FAKTURE', g.tip)) },
        { l: 'Kupac', f: g => esc(g.kupac === 'interna' ? 'naša druga firma' : partnerNaziv(g.kupac)) },
        { l: 'Nalozi', f: g => esc([...g.nalozi.values()].map(n => n.broj).join(', ')) },
        { l: 'Osnovica', f: g => novac(g.os, g.valuta), broj: true }
      ], gr, false)}</div>`;
  };
  $('#di-telo').addEventListener('change', e => { if (e.target.id === 'di-grupno') { stanje.grupno = e.target.checked; crtaj(); } });
  $('#di-otkazi').onclick = () => zatvoriFioku(true);
  $('#di-izdaj').onclick = async () => {
    const b = $('#di-izdaj'); b.disabled = true; b.textContent = 'Izdavanje…';
    try {
      const rez = await Store.rpc('fakturisi_naloge', { p_nalozi: ids, p_datum: $('#di-datum').value || danas(), p_datum_prometa: $('#di-prometa').value || null,
        p_kurs: $('#di-kurs') && $('#di-kurs').value ? Number($('#di-kurs').value) : null, p_grupno: stanje.grupno });
      await ucitajPartnere();
      $('#di-telo').innerHTML = `<p><b>Fakture su izdate.</b></p><div class="tabela-okvir">${tabelaHTML([
        { l: 'Broj', f: r => `<b>${esc(r.r_broj)}</b>` }, { l: 'Firma', f: r => esc(r.r_firma) }, { l: 'Vrsta', f: r => esc(sifNaziv('TIP_FAKTURE', r.r_tip)) },
        { l: 'Kupac', f: r => esc(r.r_kupac) }, { l: 'Iznos', f: r => novac(r.r_ukupno, r.r_valuta), broj: true }], rez || [], false)}</div>`;
      $('#fioka footer').innerHTML = '<div class="desno"><button class="dugme" type="button" id="di-stampa-sve">Štampaj sve</button><button class="dugme glavno" type="button" id="di-zatvori">Zatvori</button></div>';
      $('#di-stampa-sve').onclick = () => stampajFakture((rez || []).map(r => r.r_id));
      $('#di-zatvori').onclick = async () => { zatvoriFioku(true); if (op.posle) await op.posle(); osveziListu(); };
      fiokaIzmenjena = false;
    } catch (e) { b.disabled = false; b.textContent = 'Fakturiši'; poruka(prevediGresku(e), true); }
  };
  crtaj();
}

function fakturaHTML(f, stavke) {
  const en = f.tip === 'INO';
  const L = (sr, eng) => (en ? `${sr} / <i>${eng}</i>` : sr);
  const iz = f.izdavalac || {}, ku = f.kupac || {};
  const adresa = o => [o.adresa, [o.postanski_broj, o.mesto].filter(Boolean).join(' '), o.drzava].filter(Boolean).map(esc).join('<br>');
  const ident = o => [o.pib && `PIB: ${esc(o.pib)}`, o.maticni_broj && `MB: ${esc(o.maticni_broj)}`, o.pdv_broj && `PDV/VAT ID: ${esc(o.pdv_broj)}`].filter(Boolean).join('<br>');
  const rekap = {};
  stavke.forEach(s => { const k = Number(s.pdv_stopa); (rekap[k] ||= { os: 0, pdv: 0 }); rekap[k].os += Number(s.osnovica); rekap[k].pdv += Number(s.pdv); });
  const stope = Object.keys(rekap).map(Number).sort((a, b) => a - b);
  const drzIz = drzavaKod(iz.drzava);
  const pdvTekst = f.pdv_napomene ? f.pdv_napomene.split('\n').filter(Boolean)
    : [...new Set(stavke.map(s => pdvRedZaDrzavu(s.pdv_kod ?? kodPoStopi(s.pdv_stopa, drzIz), s.pdv_stopa, drzIz)?.oznaka).filter(Boolean))];
  const got = f.tip === 'GOTOVINSKA';
  const naslov = f.tip === 'INTERNA' ? 'INTERNA FAKTURA' : got ? 'GOTOVINSKI RAČUN' : 'FAKTURA';
  return `<section class="faktura">
    <div class="zaglavlje">
      <div class="izdavalac"><b>${esc(iz.naziv)}</b><br>${adresa(iz)}${ident(iz) ? `<br>${ident(iz)}` : ''}
        ${iz.iban ? `<br>${L('Račun', 'Account')}: ${esc(iz.iban)}${iz.banka ? `, ${esc(iz.banka)}` : ''}${iz.swift ? `, SWIFT ${esc(iz.swift)}` : ''}` : ''}
        ${iz.telefon || iz.email ? `<br>${[iz.telefon, iz.email].filter(Boolean).map(esc).join(', ')}` : ''}</div>
      <div class="dokument"><h1>${L(naslov, 'INVOICE')}</h1><div class="broj">${got ? (f.originalni_broj ? `Fiskalni račun ${esc(f.originalni_broj)}` : 'Interna evidencija – bez broja') : `${L('Broj', 'No.')} ${esc(f.broj)}`}</div>
        <table class="datumi">
          <tr><td>${L('Datum izdavanja', 'Issue date')}</td><td>${fmtDatum(f.datum_izdavanja)}</td></tr>
          <tr><td>${L('Datum prometa', 'Date of supply')}</td><td>${fmtDatum(f.datum_prometa)}</td></tr>
          <tr><td>${L('Rok plaćanja', 'Due date')}</td><td>${fmtDatum(f.datum_dospeca)}</td></tr>
          ${iz.mesto ? `<tr><td>${L('Mesto izdavanja', 'Place of issue')}</td><td>${esc(iz.mesto)}</td></tr>` : ''}
        </table></div>
    </div>
    <div class="kupac"><div class="lbl">${L('Kupac', 'Customer')}</div><b>${esc(ku.naziv)}</b><br>${adresa(ku)}${ident(ku) ? `<br>${ident(ku)}` : ''}</div>
    ${f.nalogodavac_id && f.nalogodavac_id !== f.klijent_id ? `<p class="platilac">${L('Nalogodavac / platilac', 'Ordering party / payer')}: <b>${esc(f.nalogodavac_naziv)}</b></p>` : ''}
    <table class="stavke"><thead><tr><th>${L('Rb.', 'No.')}</th><th>${L('Opis', 'Description')}</th><th class="b">${L('Kol.', 'Qty')}</th><th>${L('JM', 'Unit')}</th>
      <th class="b">${L('Cena', 'Price')}</th><th class="b">${L('Osnovica', 'Net')}</th><th class="b">PDV %</th><th class="b">PDV</th><th class="b">${L('Ukupno', 'Total')}</th></tr></thead>
      <tbody>${stavke.map(s => `<tr><td>${s.rb}</td><td>${esc(s.opis)}${s.detalji ? `<div class="det">${esc(s.detalji)}</div>` : ''}</td>
        <td class="b">${fmtBroj(s.kolicina, Number(s.kolicina) % 1 ? 2 : 0)}</td><td>${esc(sifNaziv('JEDINICA', s.jedinica))}</td>
        <td class="b">${fmtBroj(s.cena)}</td><td class="b">${fmtBroj(s.osnovica)}</td><td class="b">${fmtStopa(s.pdv_stopa)}</td>
        <td class="b">${fmtBroj(s.pdv)}</td><td class="b">${fmtBroj(s.ukupno)}</td></tr>`).join('')}</tbody></table>
    <table class="zbir">
      ${stope.length > 1 ? stope.map(s => `<tr><td>${L('Osnovica', 'Net')} ${fmtStopa(s)}</td><td class="b">${fmtBroj(rekap[s].os)}</td></tr><tr><td>PDV ${fmtStopa(s)}</td><td class="b">${fmtBroj(rekap[s].pdv)}</td></tr>`).join('') : ''}
      <tr><td>${L('Ukupna osnovica', 'Total net')}</td><td class="b">${fmtBroj(f.osnovica)}</td></tr>
      <tr><td>${L('Ukupan PDV', 'Total VAT')}</td><td class="b">${fmtBroj(f.pdv)}</td></tr>
      <tr class="uk"><td>${L('Za uplatu', 'Amount due')}</td><td class="b">${fmtBroj(f.ukupno)} ${esc(f.valuta)}</td></tr>
    </table>
    ${pdvTekst.map(t => `<p class="nap">${esc(t)}</p>`).join('')}
    ${f.napomena ? `<p class="nap">${esc(f.napomena)}</p>` : ''}
    ${got ? `<p class="nap">Način plaćanja: gotovinom${f.status_placanja === 'PLACENA' ? ' – plaćeno' : `, rok ${fmtDatum(f.datum_dospeca)}`}.</p>` : `<p class="nap">${L('Molimo da iznos', 'Please pay')} ${fmtBroj(f.ukupno)} ${esc(f.valuta)} ${L('uplatite do', 'by')} ${fmtDatum(f.datum_dospeca)}${iz.iban ? ` ${L('na račun', 'to account')} ${esc(iz.iban)}` : ''}, ${L('poziv na broj', 'reference')}: ${esc(f.broj)}.</p>`}
    ${f.sef_broj ? `<p class="nap">SEF / e-račun ID: ${esc(f.sef_broj)}</p>` : ''}
    <div class="potpisi"><div>${L('Fakturisao', 'Issued by')}</div><div>${L('Odgovorno lice', 'Authorized person')}${iz.odgovorno_lice ? `<br><b>${esc(iz.odgovorno_lice)}</b>` : ''}</div></div>
    ${iz.napomena_faktura ? `<div class="podnozje">${esc(iz.napomena_faktura).replace(/\n/g, '<br>')}</div>` : ''}
    ${f.status === 'STORNO' ? '<div class="vodeni">STORNIRANO</div>' : ''}
  </section>`;
}

function stampajHtml(naslov, sekcije) {
  const w = window.open('', '_blank');
  if (!w) return poruka('Pregledač je blokirao novi prozor. Dozvolite iskačuće prozore za ovu adresu i pokušajte ponovo.', true);
  w.document.open();
  w.document.write(`<!doctype html><html lang="sr-Latn"><head><meta charset="utf-8"><title>${esc(naslov)}</title><style>${CSS_STAMPA}</style></head>
    <body><div class="traka"><button onclick="window.print()">Štampaj / sačuvaj kao PDF</button><span>Za PDF u dijalogu za štampu izaberite „Sačuvaj kao PDF“.</span></div>${sekcije.join('')}</body></html>`);
  w.document.close();
}
async function stampajFakture(ids) {
  const w = window.open('', '_blank');
  if (!w) return poruka('Pregledač je blokirao novi prozor. Dozvolite iskačuće prozore za ovu adresu i pokušajte ponovo.', true);
  w.document.write('<p style="font:16px Arial,sans-serif;padding:24px">Priprema za štampu…</p>');
  try {
    const [fak, st] = await Promise.all([
      Store.lista('v_fakture', { filteri: [['in', 'id', ids]] }),
      Store.lista('faktura_stavke', { filteri: [['in', 'faktura_id', ids]], red: 'rb' })]);
    const za = fak.filter(f => f.izvor !== 'ZADUZENJE').sort((a, b) => String(a.broj).localeCompare(String(b.broj)));
    if (!za.length) { w.close(); return poruka('Zaduženja (početna stanja) se ne štampaju kao fakture.', true); }
    w.document.open();
    w.document.write(`<!doctype html><html lang="sr-Latn"><head><meta charset="utf-8"><title>${esc(za.length === 1 ? za[0].broj : `Fakture (${za.length})`)}</title><style>${CSS_STAMPA}</style></head>
      <body><div class="traka"><button onclick="window.print()">Štampaj / sačuvaj kao PDF</button><span>Za PDF u dijalogu za štampu izaberite „Sačuvaj kao PDF“.</span></div>
      ${za.map(f => fakturaHTML(f, st.filter(s => s.faktura_id === f.id))).join('')}</body></html>`);
    w.document.close();
  } catch (e) { w.close(); poruka(prevediGresku(e), true); }
}

// Dugme za štampu u fioci fakture
const _tabFakturaPodaci = ENT.fakture.podaciTab;
ENT.fakture.podaciTab = async (f, telo, dno, kljuc) => {
  await _tabFakturaPodaci(f, telo, dno, kljuc);
  if (f.izvor === 'ZADUZENJE' || !document.body.contains(dno)) return;
  const desno = $('.desno', dno);
  const b = document.createElement('button');
  b.className = 'dugme'; b.id = 'stampaj'; b.textContent = 'Štampaj / PDF';
  b.onclick = () => stampajFakture([f.id]);
  desno.insertBefore(b, desno.firstChild);
};

function ucitajSkriptu(src, globalno) {
  return new Promise((ok, ne) => {
    if (window[globalno]) return ok();
    const s = document.createElement('script');
    s.src = src; s.onload = () => ok(); s.onerror = () => ne(new Error('Biblioteka za Excel nije učitana. Proverite internet vezu.'));
    document.head.appendChild(s);
  });
}

async function izvRezultat(el) {
  const [fak, ul, tr, ob, ture] = await Promise.all([
    Store.lista('v_fakture', { filteri: [['in', 'izvor', ['NALOG', 'RUCNA']], ['eq', 'status', 'IZDATA']] }),
    Store.lista('v_ulazni_racuni'), Store.lista('tura_troskovi'), Store.lista('obracun_vozaca'), Store.lista('ture')]);
  const turaFirma = new Map(ture.map(t => [t.id, t.firma_id]));
  const vozacFirma = new Map((S.vozaci || []).map(v => [v.id, v.firma_id]));
  const interni = new Set(S.partneri.filter(p => p.interna_firma_id).map(p => p.id));
  const godine = new Set([IZV.godina, new Date().getFullYear()]);
  [...fak.map(f => f.datum_prometa || f.datum_izdavanja), ...ul.map(u => u.datum)].forEach(d => d && godine.add(Number(String(d).slice(0, 4))));
  const m = Array.from({ length: 12 }, () => ({ p: 0, u: 0, t: 0, v: 0 }));
  const mesec = (d, firma) => (!d || Number(String(d).slice(0, 4)) !== IZV.godina || (IZV.firma && firma !== IZV.firma)) ? null : m[Number(String(d).slice(5, 7)) - 1];
  for (const f of fak) {
    const eur = Number(f.osnovica) / (f.valuta === 'EUR' ? 1 : Number(f.kurs)), d = f.datum_prometa || f.datum_izdavanja;
    if (f.tip === 'INTERNA') {
      if (!IZV.firma) continue;
      const prima = S.partneri.find(p => p.id === f.klijent_id)?.interna_firma_id, y = prima === IZV.firma ? mesec(d, prima) : null;
      if (y) y.u += eur;
    }
    const x = mesec(d, f.firma_id); if (x) x.p += eur;
  }
  for (const u of ul) { if (!IZV.firma && interni.has(u.dobavljac_id)) continue; const x = mesec(u.datum, u.firma_id); if (x) x.u += Number(u.bez_pdv_eur); }
  for (const t of tr) { if (t.ulazni_racun_id) continue; const x = mesec(t.datum, turaFirma.get(t.tura_id)); if (x) x.t += Number(t.iznos_eur); }
  for (const o of ob) { if (!o.u_trosak) continue; const x = mesec(o.datum, o.tura_id ? turaFirma.get(o.tura_id) : vozacFirma.get(o.vozac_id)); if (x) x.v += (o.znak || 1) * Number(o.iznos_eur); }
  const redovi = m.map((x, i) => ({ mesec: MESECI[i], ...x, r: x.p - x.u - x.t - x.v }));
  const uk = redovi.reduce((s, x) => ({ mesec: 'Ukupno', p: s.p + x.p, u: s.u + x.u, t: s.t + x.t, v: s.v + x.v, r: s.r + x.r }), { p: 0, u: 0, t: 0, v: 0, r: 0 });
  const iznos = v => (Math.abs(v) < 0.005 ? '<span class="tekst-2">–</span>' : fmtBroj(v));
  el.innerHTML = `<div class="filteri">
      <label>Godina<select id="r-godina">${[...godine].sort((a, b) => b - a).map(g => `<option${g === IZV.godina ? ' selected' : ''}>${g}</option>`).join('')}</select></label>
      ${S.firme.length > 1 ? `<label>Firma<select id="r-firma"><option value="">Sve (bez internih faktura)</option>${S.firme.map(f => `<option value="${f.id}"${f.id === IZV.firma ? ' selected' : ''}>${esc(f.kod)}</option>`).join('')}</select></label>` : ''}
      <button class="dugme malo" id="r-csv" type="button">Izvoz u Excel (CSV)</button></div>
    <div class="tabela-okvir"><table><thead><tr><th>Mesec</th><th class="broj">Prihod (fakturisano, bez PDV)</th><th class="broj">Ulazni računi (bez PDV)</th>
      <th class="broj">Direktni troškovi tura</th><th class="broj">Obračun vozača</th><th class="broj">Rezultat</th></tr></thead>
      <tbody>${[...redovi, uk].map(x => `<tr${x.mesec === 'Ukupno' ? ' class="ukupno"' : ''}><td>${x.mesec}</td><td class="broj">${iznos(x.p)}</td><td class="broj">${iznos(x.u)}</td>
        <td class="broj">${iznos(x.t)}</td><td class="broj">${iznos(x.v)}</td><td class="broj"><b class="${x.r < -0.005 ? 'minus' : ''}">${iznos(x.r)}</b></td></tr>`).join('')}</tbody></table></div>
    <p class="tekst-2" style="max-width:80ch;margin-top:12px">Iznosi su u EUR po kursu sa dokumenta. Prihod je osnovica faktura izdatih iz naloga po datumu prometa (bez zaduženja i storniranih). Troškovi ture koji su povezani sa ulaznim računom računaju se samo kroz ulazni račun. Akontacije i povraćaji vozačima nisu trošak. Ovo je upravljački pregled, ne zamena za knjigovodstveni bilans.</p>`;
  $('#r-godina').onchange = e => { IZV.godina = Number(e.target.value); prikaziIzvestaje(); };
  if ($('#r-firma')) $('#r-firma').onchange = e => { IZV.firma = e.target.value; prikaziIzvestaje(); };
  const gp = document.createElement('div');
  gp.className = 'grafici'; gp.style.marginBottom = '16px';
  gp.innerHTML = panel('g-rezultat', `Prihod, troškovi i rezultat ${IZV.godina}`, `Ukupan rezultat: ${fmtBroj(uk.r, 0)} EUR.`, true);
  el.insertBefore(gp, el.querySelector('.tabela-okvir'));
  grafikonMeseci($('#g-rezultat'), redovi);
  $('#r-csv').onclick = () => izvozCSV(`rezultat_${IZV.godina}.csv`, [['Mesec', 'mesec'], ['Prihod EUR', x => csvBroj(x.p)], ['Ulazni računi EUR', x => csvBroj(x.u)],
    ['Direktni troškovi tura EUR', x => csvBroj(x.t)], ['Obračun vozača EUR', x => csvBroj(x.v)], ['Rezultat EUR', x => csvBroj(x.r)]], [...redovi, uk]);
}

      ${S.firme.length > 1 ? `<label>Firma<select id="v-firma"><option value="">Sve</option>${S.firme.map(f => `<option value="${f.id}"${f.id === IZV.firma ? ' selected' : ''}>${esc(f.kod)}</option>`).join('')}</select></label>` : ''}

        { l: 'Tura', f: o => esc(turaBroj.get(o.tura_id) || '') },

const H2C_URL = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
const JSPDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
const DRZAVE = { srbija: 'RS', slovenija: 'SI', hrvatska: 'HR', austrija: 'AT', nemacka: 'DE', italija: 'IT', madjarska: 'HU',
  'bosna i hercegovina': 'BA', bih: 'BA', 'crna gora': 'ME', 'severna makedonija': 'MK', makedonija: 'MK', bugarska: 'BG',
  rumunija: 'RO', slovacka: 'SK', ceska: 'CZ', poljska: 'PL', holandija: 'NL', belgija: 'BE', francuska: 'FR', svajcarska: 'CH',
  turska: 'TR', grcka: 'GR', albanija: 'AL', kosovo: 'XK', spanija: 'ES', danska: 'DK', svedska: 'SE', luksemburg: 'LU' };
// Peppol šeme elektronske adrese (PDV broj po državi)
const EAS = { RS: '9948', SI: '9949', HR: '9934', DE: '9930', AT: '9914', IT: '9906', HU: '9910', BA: '9924', ME: '9941', MK: '9942',
  BG: '9926', CZ: '9929', SK: '9950', PL: '9945', NL: '9944', BE: '9925', FR: '9957', ES: '9920', GR: '9933', RO: '9947', LU: '9938', CH: '9927', TR: '9952', AL: '9923' };
const JM_UNECE = { KOM: 'H87', VOZILO: 'H87', TURA: 'C62', KM: 'KMT', DAN: 'DAY', SAT: 'HUR', PAUSAL: 'C62' };
const drzavaKod = naziv => {
  const n = bezKvacica(naziv).trim().replace(/^republika\s+/, '');
  if (/^[a-z]{2}$/.test(n)) return n.toUpperCase();
  return DRZAVE[n] || '';
};
const xmlEsc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c]));
const iz2 = n => Number(n || 0).toFixed(2);
const samoCifre = v => String(v || '').replace(/\D/g, '');

function pdvKat(s, drz = '') {
  const r = pdvRedZaDrzavu(s.pdv_kod ?? kodPoStopi(s.pdv_stopa, drz), s.pdv_stopa, drz);
  const stopa = Number(s.pdv_stopa || 0);
  return { kat: (r?.dodatno?.kat || (stopa > 0 ? 'S' : '')).toUpperCase(), stopa, osnov: r?.dodatno?.osnov || '', razlog: r?.oznaka || r?.naziv || '', naziv: r?.naziv || fmtStopa(stopa) };
}
const profilFakture = f => (drzavaFirme({ drzava: f.izdavalac?.drzava }) === 'RS' ? 'SEF' : 'PEPPOL');
const sefPrimenljiv = f => drzavaFirme({ drzava: f.izdavalac?.drzava }) === 'RS' && drzavaKod(f.kupac?.drzava || 'Srbija') === 'RS'
  && f.kupac?.tip !== 'FIZICKO' && samoCifre(f.kupac?.pib).length === 9;

function proveraUbl(f, stavke, profil) {
  const g = [], iz = f.izdavalac || {}, ku = f.kupac || {};
  if (f.izvor === 'ZADUZENJE') return ['Zaduženje (početno stanje) nije faktura.'];
  if (f.tip === 'GOTOVINSKA') return ['Gotovinska faktura se ne šalje.'];
  if (!stavke.length) g.push('Faktura nema stavke.');
  if (profil === 'SEF') {
    if (f.valuta !== 'RSD') g.push('U SEF se iz programa šalju fakture u dinarima (RSD). Fakturu u stranoj valuti unesite ručno u SEF portalu.');
    if (samoCifre(iz.pib).length !== 9) g.push('Naša firma: PIB mora imati 9 cifara (Naše firme).');
    if (!samoCifre(iz.maticni_broj)) g.push('Naša firma: nedostaje matični broj (Naše firme).');
    if (samoCifre(ku.pib).length !== 9) g.push(`Kupac ${ku.naziv || ''}: PIB mora imati 9 cifara.`);
  } else {
    if (f.valuta !== 'EUR') g.push('E-račun (Peppol) iz programa se pravi samo za fakture u EUR.');
    if (!(iz.pdv_broj || iz.pib)) g.push('Naša firma: nedostaje PDV / davčna številka (Naše firme).');
    if (!drzavaKod(iz.drzava)) g.push('Naša firma: država nije prepoznata (upišite npr. „Slovenija“).');
    if (!drzavaKod(ku.drzava)) g.push(`Kupac ${ku.naziv || ''}: država nije prepoznata (upišite npr. „Austrija“ ili dvoslovni kod AT).`);
  }
  if (!ku.adresa || !ku.mesto) g.push(`Kupac ${ku.naziv || ''}: adresa nije potpuna.`);
  const bez = new Set();
  for (const s of stavke) { const k = pdvKat(s, drzavaKod(iz.drzava)); if (!k.kat || (k.kat !== 'S' && !k.osnov)) bez.add(k.naziv); }
  bez.forEach(n => g.push(`PDV stopa „${n}“ nema kategoriju ili šifru osnova – upišite ih u Šifarnici → PDV stope (podatke daje knjigovođa).`));
  return g;
}

function ublFaktura(f, stavke, profil) {
  const sef = profil === 'SEF', val = f.valuta, c = `currencyID="${xmlEsc(val)}"`;
  const iz = f.izdavalac || {}, ku = f.kupac || {};
  const dIz = drzavaKod(iz.drzava) || (sef ? 'RS' : ''), dKu = drzavaKod(ku.drzava) || (sef ? 'RS' : '');
  const pdvId = (o, d) => {
    const v = String(o.pdv_broj || o.pib || '').replace(/[\s.-]/g, '').toUpperCase();
    if (!v) return '';
    return /^[A-Z]{2}/.test(v) ? v : d + v;
  };
  const strana = (o, d, prodavac) => {
    let endpoint;
    if (sef) endpoint = `<cbc:EndpointID schemeID="9948">${xmlEsc(samoCifre(o.pib))}</cbc:EndpointID>`;
    else {
      const vat = pdvId(o, d), eas = EAS[d];
      const mejl = prodavac ? o.email : (o.email_fakture || o.email);
      endpoint = vat && eas ? `<cbc:EndpointID schemeID="${eas}">${xmlEsc(vat)}</cbc:EndpointID>` : `<cbc:EndpointID schemeID="EM">${xmlEsc(mejl || '')}</cbc:EndpointID>`;
    }
    const vat = sef ? (o.pib ? 'RS' + samoCifre(o.pib) : '') : pdvId(o, d);
    const imaPdv = sef ? (prodavac || o.pdv_obveznik !== false) : (prodavac || o.tip !== 'FIZICKO');
    const mejl = prodavac ? o.email : (o.email_fakture || o.email);
    return `<cac:Party>${endpoint}
      <cac:PartyName><cbc:Name>${xmlEsc(o.naziv)}</cbc:Name></cac:PartyName>
      <cac:PostalAddress>${o.adresa ? `<cbc:StreetName>${xmlEsc(o.adresa)}</cbc:StreetName>` : ''}${o.mesto ? `<cbc:CityName>${xmlEsc(o.mesto)}</cbc:CityName>` : ''}${o.postanski_broj ? `<cbc:PostalZone>${xmlEsc(o.postanski_broj)}</cbc:PostalZone>` : ''}<cac:Country><cbc:IdentificationCode>${xmlEsc(d)}</cbc:IdentificationCode></cac:Country></cac:PostalAddress>
      ${vat && imaPdv ? `<cac:PartyTaxScheme><cbc:CompanyID>${xmlEsc(vat)}</cbc:CompanyID><cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme></cac:PartyTaxScheme>` : ''}
      <cac:PartyLegalEntity><cbc:RegistrationName>${xmlEsc(o.naziv)}</cbc:RegistrationName>${o.maticni_broj ? `<cbc:CompanyID>${xmlEsc(samoCifre(o.maticni_broj) || o.maticni_broj)}</cbc:CompanyID>` : ''}</cac:PartyLegalEntity>
      ${mejl ? `<cac:Contact><cbc:ElectronicMail>${xmlEsc(mejl)}</cbc:ElectronicMail></cac:Contact>` : ''}</cac:Party>`;
  };
  // PDV rekapitulacija po kategoriji, stopi i osnovu
  const grupe = new Map();
  for (const s of stavke) {
    const k = pdvKat(s, dIz), kl = `${k.kat}|${k.stopa}|${k.osnov}`;
    const x = grupe.get(kl) || { ...k, os: 0, pdv: 0 };
    x.os += Number(s.osnovica); x.pdv += Number(s.pdv); grupe.set(kl, x);
  }
  const kategorija = (k, sadOsnovom) => `<cac:TaxCategory><cbc:ID>${xmlEsc(k.kat)}</cbc:ID>${k.kat === 'O' ? '' : `<cbc:Percent>${Number(k.stopa)}</cbc:Percent>`}${sadOsnovom && k.kat !== 'S' && k.osnov ? `<cbc:TaxExemptionReasonCode>${xmlEsc(k.osnov)}</cbc:TaxExemptionReasonCode>` : ''}${sadOsnovom && !sef && k.kat !== 'S' && k.razlog ? `<cbc:TaxExemptionReason>${xmlEsc(k.razlog)}</cbc:TaxExemptionReason>` : ''}<cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme></cac:TaxCategory>`;
  const racun = sef ? samoCifre(iz.iban).slice(-18) : String(iz.iban || '').replace(/\s/g, '').toUpperCase();
  const os = stavke.reduce((s, x) => s + Number(x.osnovica), 0), pdv = stavke.reduce((s, x) => s + Number(x.pdv), 0);
  return `<?xml version="1.0" encoding="UTF-8"?>
<Invoice xmlns="urn:oasis:names:specification:ubl:schema:xsd:Invoice-2" xmlns:cac="urn:oasis:names:specification:ubl:schema:xsd:CommonAggregateComponents-2" xmlns:cbc="urn:oasis:names:specification:ubl:schema:xsd:CommonBasicComponents-2">
  <cbc:CustomizationID>${sef ? 'urn:cen.eu:en16931:2017#compliant#urn:mfin.gov.rs:srbdt:2022' : 'urn:cen.eu:en16931:2017#compliant#urn:fdc:peppol.eu:2017:poacc:billing:3.0'}</cbc:CustomizationID>
  ${sef ? '' : '<cbc:ProfileID>urn:fdc:peppol.eu:2017:poacc:billing:01:1.0</cbc:ProfileID>'}
  <cbc:ID>${xmlEsc(f.broj)}</cbc:ID>
  <cbc:IssueDate>${f.datum_izdavanja}</cbc:IssueDate>
  <cbc:DueDate>${f.datum_dospeca}</cbc:DueDate>
  <cbc:InvoiceTypeCode>380</cbc:InvoiceTypeCode>
  ${f.napomena ? `<cbc:Note>${xmlEsc(f.napomena)}</cbc:Note>` : ''}
  <cbc:DocumentCurrencyCode>${xmlEsc(val)}</cbc:DocumentCurrencyCode>
  ${sef ? '' : `<cbc:BuyerReference>${xmlEsc(f.broj)}</cbc:BuyerReference>`}
  ${sef ? '<cac:InvoicePeriod><cbc:DescriptionCode>35</cbc:DescriptionCode></cac:InvoicePeriod>' : ''}
  <cac:AccountingSupplierParty>${strana(iz, dIz, true)}</cac:AccountingSupplierParty>
  <cac:AccountingCustomerParty>${strana(ku, dKu, false)}</cac:AccountingCustomerParty>
  <cac:Delivery><cbc:ActualDeliveryDate>${f.datum_prometa || f.datum_izdavanja}</cbc:ActualDeliveryDate></cac:Delivery>
  ${racun ? `<cac:PaymentMeans><cbc:PaymentMeansCode>${!sef && /^[A-Z]{2}\d/.test(racun) && val === 'EUR' ? '58' : '30'}</cbc:PaymentMeansCode>${sef ? '' : `<cbc:PaymentID>${xmlEsc(f.broj)}</cbc:PaymentID>`}<cac:PayeeFinancialAccount><cbc:ID>${xmlEsc(racun)}</cbc:ID></cac:PayeeFinancialAccount></cac:PaymentMeans>` : ''}
  ${sef ? '' : `<cac:PaymentTerms><cbc:Note>Rok plačila / Due date: ${fmtDatum(f.datum_dospeca)}</cbc:Note></cac:PaymentTerms>`}
  <cac:TaxTotal><cbc:TaxAmount ${c}>${iz2(pdv)}</cbc:TaxAmount>
    ${[...grupe.values()].map(x => `<cac:TaxSubtotal><cbc:TaxableAmount ${c}>${iz2(x.os)}</cbc:TaxableAmount><cbc:TaxAmount ${c}>${iz2(x.pdv)}</cbc:TaxAmount>${kategorija(x, true)}</cac:TaxSubtotal>`).join('\n    ')}
  </cac:TaxTotal>
  <cac:LegalMonetaryTotal>
    <cbc:LineExtensionAmount ${c}>${iz2(os)}</cbc:LineExtensionAmount>
    <cbc:TaxExclusiveAmount ${c}>${iz2(os)}</cbc:TaxExclusiveAmount>
    <cbc:TaxInclusiveAmount ${c}>${iz2(os + pdv)}</cbc:TaxInclusiveAmount>
    <cbc:AllowanceTotalAmount ${c}>0.00</cbc:AllowanceTotalAmount>
    <cbc:PrepaidAmount ${c}>0.00</cbc:PrepaidAmount>
    <cbc:PayableAmount ${c}>${iz2(os + pdv)}</cbc:PayableAmount>
  </cac:LegalMonetaryTotal>
  ${stavke.map(s => {
    const k = pdvKat(s, dIz);
    return `<cac:InvoiceLine>
    <cbc:ID>${s.rb}</cbc:ID>
    <cbc:InvoicedQuantity unitCode="${JM_UNECE[s.jedinica] || 'C62'}">${Number(s.kolicina)}</cbc:InvoicedQuantity>
    <cbc:LineExtensionAmount ${c}>${iz2(s.osnovica)}</cbc:LineExtensionAmount>
    <cac:Item>${s.detalji ? `<cbc:Description>${xmlEsc(s.detalji)}</cbc:Description>` : ''}<cbc:Name>${xmlEsc(s.opis)}</cbc:Name>${kategorija(k, false).replace('TaxCategory', 'ClassifiedTaxCategory').replace('/cac:TaxCategory', '/cac:ClassifiedTaxCategory')}</cac:Item>
    <cac:Price><cbc:PriceAmount ${c}>${Number(s.cena).toFixed(2)}</cbc:PriceAmount></cac:Price>
  </cac:InvoiceLine>`;
  }).join('\n  ')}
</Invoice>`.replace(/\n\s*\n/g, '\n');
}

function preuzmiFajl(ime, sadrzaj, tip) {
  const blob = sadrzaj instanceof Blob ? sadrzaj : new Blob([sadrzaj], { type: tip });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = ime;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const imeFajla = s => String(s).replace(/[^\w.-]+/g, '_');
const base64UBlob = (b64, tip) => { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type: tip }); };
const utf8Base64 = s => { const b = new TextEncoder().encode(s); let x = ''; for (let i = 0; i < b.length; i += 0x8000) x += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(x); };

// PDF od istog HTML-a koji se štampa (jedna sekcija = jedna A4 strana)
async function pdfIzHtml(sekcije) {
  await ucitajSkriptu(H2C_URL, 'html2canvas');
  await ucitajSkriptu(JSPDF_URL, 'jspdf');
  const ifr = document.createElement('iframe');
  ifr.setAttribute('aria-hidden', 'true');
  ifr.style.cssText = 'position:fixed;left:-12000px;top:0;width:820px;height:1200px;border:0';
  document.body.appendChild(ifr);
  try {
    const d = ifr.contentDocument;
    d.open();
    d.write(`<!doctype html><html lang="sr-Latn"><head><meta charset="utf-8"><style>${CSS_STAMPA}
      body{background:#fff}.traka{display:none}.faktura{margin:0;width:794px;min-height:1123px;box-shadow:none}</style></head><body>${sekcije.join('')}</body></html>`);
    d.close();
    await new Promise(r => setTimeout(r, 200));
    const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', compress: true });
    const listovi = [...d.querySelectorAll('.faktura')];
    for (let i = 0; i < listovi.length; i++) {
      const cv = await window.html2canvas(listovi[i], { scale: 2, backgroundColor: '#ffffff', logging: false, windowWidth: 820 });
      const visinaStrane = Math.round(cv.width * 297 / 210);
      for (let y = 0, prvi = true; y < cv.height; y += visinaStrane, prvi = false) {
        if (!prvi && cv.height - y < visinaStrane * 0.03) break;   // ostatak od par piksela ne pravi praznu stranu
        const deo = document.createElement('canvas');
        deo.width = cv.width; deo.height = Math.min(visinaStrane, cv.height - y);
        deo.getContext('2d').drawImage(cv, 0, y, cv.width, deo.height, 0, 0, cv.width, deo.height);
        if (i > 0 || !prvi) pdf.addPage();
        pdf.addImage(deo.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 210, deo.height * 210 / cv.width);
      }
    }
    return pdf.output('datauristring').split(',')[1];
  } finally { ifr.remove(); }
}

async function servis(osvezi = false) {

  return S.servis;
}

    <footer><button class="dugme" id="em-pdf" type="button">Preuzmi prilog</button>
      <div class="desno"><button class="dugme" id="em-otkazi" type="button">Otkaži</button><button class="dugme glavno" id="em-posalji" type="button">Pošalji</button></div></footer></aside>`;
  document.body.appendChild(z);
  document.addEventListener('keydown', escFioka);
  const f = $('#em-forma', z);
  let prilog = null;
  const pripremi = async () => (prilog ||= await o.prilog());
  $('#em-otkazi').onclick = () => zatvoriFioku();
  $('#em-pdf').onclick = async () => {
    try { preuzmiFajl(o.imePriloga, base64UBlob(await pripremi(), 'application/pdf')); if (o.xml) preuzmiFajl(o.xml.ime, o.xml.sadrzaj, 'application/xml'); }
    catch (e) { poruka(prevediGresku(e), true); }
  };
  const sv = await servis();
  if (!document.body.contains(z)) return;
  if (!sv.email) {
    $('#em-info').innerHTML = `<div class="napomena">Slanje iz programa nije podešeno${sv.greska ? ` (${esc(sv.greska)})` : ''}. Preuzmite prilog, pa ga pošaljite iz svog programa za e-poštu – dugme „Otvori program za poštu“ priprema poruku.</div>`;
    const b = $('#em-posalji'); b.textContent = 'Otvori program za poštu';
    b.onclick = () => {
      const v = n => $(`[name="${n}"]`, f).value.trim();
      window.location.href = `mailto:${encodeURIComponent(v('za'))}?subject=${encodeURIComponent(v('naslov'))}${v('kopija') ? `&cc=${encodeURIComponent(v('kopija'))}` : ''}&body=${encodeURIComponent(v('tekst'))}`;
    };
    return;
  }
  $('#em-posalji').onclick = async () => {
    const v = n => $(`[name="${n}"]`, f).value.trim();
    if (!v('za')) return poruka('Upišite adresu primaoca.', true);
    if (!v('naslov')) return poruka('Upišite naslov.', true);
    const b = $('#em-posalji'); b.disabled = true; b.textContent = 'Priprema priloga…';
    try {
      const prilozi = [{ ime: o.imePriloga, base64: await pripremi(), tip: 'application/pdf' }];
      if (o.xml) prilozi.push({ ime: o.xml.ime, base64: utf8Base64(o.xml.sadrzaj), tip: 'application/xml' });
      b.textContent = 'Slanje…';
      const tekst = v('tekst');
      await Store.funkcija('email', { vrsta: o.vrsta, ref_id: o.ref_id, firma_id: o.firma_id, za: v('za'), kopija: v('kopija'), naslov: v('naslov'),

  };
}

async function posaljiFakturuEmailom(f, stavke) {
  const ku = f.kupac || {}, iz = f.izdavalac || {};
  const za = [...new Set([ku.email_fakture, ku.email, ...(await adreseZaNaplatu(f.klijent_id))].filter(Boolean))];

  });
}

async function podaciZaDopise() {

}
function predlogNivoa(dop, firmaId, partnerId) {
  const z = dop.find(d => d.vrsta === 'OPOMENA' && d.firma_id === firmaId && d.partner_id === partnerId);
  if (!z) return { nivo: 1, zadnja: null };
  return { nivo: razlikaDana(z.datum) >= -60 ? Math.min((z.nivo || 1) + 1, 3) : 1, zadnja: z };
}
function grupeOpomena(p) {
  const m = new Map();
  for (const f of p.fak) {
    if (f.status !== 'IZDATA' || Number(f.saldo) <= 0.005 || (f.dana_kasnjenja || 0) < DOP.minDana || (DOP.firma && f.firma_id !== DOP.firma)) continue;
    const k = `${f.firma_id}|${f.nalogodavac_id}`;
    const g = m.get(k) || { kljuc: k, firma_id: f.firma_id, partner_id: f.nalogodavac_id, naziv: f.nalogodavac_naziv, fakture: [], eur: 0, max: 0, po: {} };
    g.fakture.push(f); g.eur += Number(f.saldo_eur); g.max = Math.max(g.max, f.dana_kasnjenja); g.po[f.valuta] = (g.po[f.valuta] || 0) + Number(f.saldo);
    m.set(k, g);
  }
  return [...m.values()].map(g => ({ ...g, ...predlogNivoa(p.dop, g.firma_id, g.partner_id) })).sort((a, b) => b.eur - a.eur);
}
function grupeIos(p) {
  const D = DOP.naDan, firma = DOP.firma || S.firme[0]?.id;
  const placeno = new Map(), placenoUl = new Map();
  p.nap.filter(n => n.datum <= D).forEach(n => placeno.set(n.faktura_id, (placeno.get(n.faktura_id) || 0) + Number(n.iznos)));
  p.upl.filter(n => n.datum <= D).forEach(n => placenoUl.set(n.ulazni_racun_id, (placenoUl.get(n.ulazni_racun_id) || 0) + Number(n.iznos)));
  const m = new Map();
  const g = pid => m.get(pid) || m.set(pid, { kljuc: pid, firma_id: firma, partner_id: pid, naziv: partnerNaziv(pid), potrazivanja: [], obaveze: [], saldo: {} }).get(pid);
  for (const f of p.fak) {
    if (f.firma_id !== firma || f.datum_izdavanja > D) continue;
    if (f.status === 'STORNO' && (!f.storno_datum || f.storno_datum <= D)) continue;
    const s = Number(f.ukupno) - (placeno.get(f.id) || 0);
    if (Math.abs(s) <= 0.005) continue;
    const x = g(f.nalogodavac_id);
    x.potrazivanja.push({ broj: f.originalni_broj ? `${f.broj} (${f.originalni_broj})` : f.broj, datum: f.datum_izdavanja, dospece: f.datum_dospeca, valuta: f.valuta, saldo: s, strana: 'D' });
    x.saldo[f.valuta] = (x.saldo[f.valuta] || 0) + s;
  }
  for (const u of p.ul) {
    if (u.firma_id !== firma || u.datum > D) continue;
    const s = Number(u.iznos_ukupno) - (placenoUl.get(u.id) || 0);
    if (Math.abs(s) <= 0.005) continue;
    const x = g(u.dobavljac_id);
    x.obaveze.push({ broj: u.broj_fakture, datum: u.datum, dospece: u.datum_dospeca, valuta: u.valuta, saldo: s, strana: 'P' });
    x.saldo[u.valuta] = (x.saldo[u.valuta] || 0) - s;
  }
  const kurs = v => valutaKurs(v);
  return [...m.values()].map(x => ({ ...x, eur: Object.entries(x.saldo).reduce((s, [v, i]) => s + i / kurs(v), 0) }))
    .filter(x => Object.values(x.saldo).some(v => Math.abs(v) > 0.005)).sort((a, b) => Math.abs(b.eur) - Math.abs(a.eur));
}

const CHART_URL = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js';
const BOJE = { petrol: '#0E5E78', petrolSv: '#86B9CA', asfalt: '#1F2A36', signal: '#E3A21A', crvena: '#B3342A', zelena: '#2D7449', siva: '#A9B4BF', sivaSv: '#D8DEE5' };

let GRAFIKONI = [];
function ugasiGrafikone() { GRAFIKONI.forEach(g => { try { g.destroy(); } catch (e) { /* već uništen */ } }); GRAFIKONI = []; }
async function grafikon(platno, konfig) {
  if (!platno) return null;

  catch (e) { if (platno.parentElement) platno.parentElement.innerHTML = '<div class="prazno">Grafikon nije učitan – proverite internet vezu.</div>'; return null; }

  const vrednost = c => (typeof c.parsed === 'object' ? (c.chart.options.indexAxis === 'y' ? c.parsed.x : c.parsed.y) : c.parsed);
  konfig.options = Object.assign({
    responsive: true, maintainAspectRatio: false,
    animation: window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ? false : { duration: 350 },
    plugins: {}
  }, konfig.options || {});
  konfig.options.plugins = Object.assign({

    tooltip: { callbacks: { label: c => `${c.dataset.label ? `${c.dataset.label}: ` : (c.label ? `${c.label}: ` : '')}${fmtBroj(vrednost(c))} EUR` } }
  }, konfig.options.plugins || {});
  const g = new C(platno, konfig);
  GRAFIKONI.push(g);

}
const osaEur = { ticks: { callback: v => fmtBroj(v, 0) }, grid: { color: '#E9EDF1' } };

function grafikonMeseci(platno, m) {

function racunajMesece(P) {
  const turaFirma = new Map(P.vt.map(t => [t.id, t.firma_id])), vozacFirma = new Map((S.vozaci || []).map(v => [v.id, v.firma_id]));
  const interni = new Set(S.partneri.filter(p => p.interna_firma_id).map(p => p.id));
  const m = Array.from({ length: 12 }, () => ({ p: 0, u: 0, t: 0, v: 0 }));
  const mesec = (d, firma) => (!d || Number(String(d).slice(0, 4)) !== IZV.godina || (IZV.firma && firma !== IZV.firma)) ? null : m[Number(String(d).slice(5, 7)) - 1];
  for (const f of P.fak) {
    if (!['NALOG', 'RUCNA'].includes(f.izvor) || f.status !== 'IZDATA' || (!IZV.firma && f.tip === 'INTERNA')) continue;
    const eur = Number(f.osnovica) / (f.valuta === 'EUR' ? 1 : Number(f.kurs)), d = f.datum_prometa || f.datum_izdavanja;
    if (f.tip === 'INTERNA') { const prima = S.partneri.find(p => p.id === f.klijent_id)?.interna_firma_id, y = prima === IZV.firma ? mesec(d, prima) : null; if (y) y.u += eur; }

function citajUvoz(knjiga) {
  const L = {}, nepoznato = [];
  const listovi = Object.fromEntries(knjiga.SheetNames.map(n => [kljucTeksta(n), n]));
  for (const [kljuc, def] of Object.entries(UVOZ_LISTOVI)) {
    const ime = listovi[kljucTeksta(def.ime)];
    L[kljuc] = [];
    if (!ime) continue;
    const matrica = window.XLSX.utils.sheet_to_json(knjiga.Sheets[ime], { header: 1, raw: true, defval: null, blankrows: false });
    if (!matrica.length) continue;
    const zaglavlje = matrica[0].map(h => kljucTeksta(h));
    const mapa = {};
    for (const [k, naslov] of Object.entries(def.kolone)) {
      const i = zaglavlje.findIndex(h => h && h === kljucTeksta(naslov));
      if (i >= 0) mapa[k] = i;
    }
    zaglavlje.forEach((h, i) => { if (h && !Object.values(mapa).includes(i)) nepoznato.push(`${def.ime}: kolona „${matrica[0][i]}“ nije prepoznata i preskače se`); });
    matrica.slice(1).forEach((red, i) => {
      if (red.some(c => typeof c === 'string' && /^\s*PRIMER/i.test(c))) return;   // red sa primerom
      if (!red.some(c => c !== null && String(c).trim() !== '')) return;
      const v = {};
      for (const [k, idx] of Object.entries(mapa)) v[k] = red[idx];
      L[kljuc].push({ red: i + 2, v });
    });
  }
  return { L, nepoznato };
}

      const nv = await Store.dodaj('vozaci', { ime, prezime, firma_id: fi.id, telefon: uvozTekst(v.telefon), email: uvozTekst(v.email), datum_zaposlenja: zap, napomena: uvozTekst(v.napomena) });

  // 4. Ture (firma: iz kolone ili firma vozila)

  for (const { red, v } of L.ture) {

    const d_u = v.d_utovar ? datumOk('nalozi', red, v.d_utovar, 'Datum utovara') : null, d_i = v.d_istovar ? datumOk('nalozi', red, v.d_istovar, 'Datum istovara') : null;
    const stavke = [];

      const n = await Store.dodaj('nalozi', { tura_id: turaId, fakturisano_ranije: uvozDa(v.fakt) || !!uvozTekst(v.fakt_broj), stari_broj_fakture: uvozTekst(v.fakt_broj), nalogodavac_id: nalogodavac, klijent_id: klijent, stari_broj: oznaka, ref_klijenta: uvozTekst(v.ref),

      nalozi.push(n);
      const st = stavke.map((s, i) => {

      { l: gotovo ? 'Uvezeno' : 'Biće uvezeno', f: k => `<b>${R[k].novo}</b>`, broj: true },
      { l: 'Već postoji (preskače se)', f: k => R[k].postoji, broj: true },
      { l: 'Greške', f: k => (R[k].greske.length ? `<span class="minus">${R[k].greske.length}</span>` : '0'), broj: true }
    ], Object.keys(UVOZ_LISTOVI), false)}</div>
    ${R.partneriAuto ? `<p>${gotovo ? 'Napravljeno' : 'Biće napravljeno'} novih partnera iz naloga i ulaznih računa: <b>${R.partneriAuto}</b> (naziv i PIB; ostale podatke dopunite u Partnerima).</p>` : ''}
    ${UVOZ.nepoznato.length ? `<div class="napomena">${UVOZ.nepoznato.map(esc).join('<br>')}</div>` : ''}
    ${greske.length ? `<div class="napomena upozorenje"><b>${greske.length} ${mnozina(greske.length, 'red ima grešku', 'reda imaju grešku', 'redova ima grešku')} i ${gotovo ? 'nisu uvezeni' : 'neće biti uvezeni'}:</b><br>${greske.slice(0, 60).map(esc).join('<br>')}${greske.length > 60 ? `<br>… i još ${greske.length - 60}` : ''}</div>` : ''}
    ${gotovo ? '' : `<div class="dugmad" style="justify-content:flex-start"><button class="dugme glavno" id="uvoz-izvrsi"${ukNovo || R.partneriAuto ? '' : ' disabled'}>Uvezi${ukNovo ? ` (${ukNovo})` : ''}</button>
      <span class="tekst-2" id="uvoz-status" role="status"></span></div>`}`;
  if ($('#uvoz-izvrsi')) $('#uvoz-izvrsi').onclick = async () => {
    if (greske.length && !confirm(`${greske.length} redova sa greškom biće preskočeno. Nastaviti?`)) return;
    const b = $('#uvoz-izvrsi'); b.disabled = true;
    try {
      const Rz = await obradiUvoz(UVOZ.L, true, t => { if ($('#uvoz-status')) $('#uvoz-status').textContent = t ? `Uvoz: ${t}` : ''; });
      await Promise.all([ucitajPartnere(), ucitajVozni(), ucitajAlarme()]); crtajMeni();
      crtajPregledUvoza(Rz, true);
      poruka('Uvoz je završen.');
    } catch (e) { b.disabled = false; poruka(prevediGresku(e), true); }
  };
}

// ============ MENI I RUTIRANJE ============
const STRANE = {
  pregled:   { naslov: 'Rokovi i alarmi', uloge: SVI,       prikaz: prikaziPregled },
  ture:      { naslov: 'Ture',            uloge: SVI,       prikaz: () => prikaziListuF('ture') },
  nalozi:    { naslov: 'Nalozi',          uloge: SVI,       prikaz: () => prikaziListuF('nalozi') },
  vozila:    { naslov: 'Vozila',          uloge: SVI,       prikaz: () => prikaziListu('vozila') },
  vozaci:    { naslov: 'Vozači',          uloge: SVI,       prikaz: () => prikaziListu('vozaci') },
  partneri:  { naslov: 'Partneri',        uloge: SVI,       prikaz: () => prikaziListu('partneri') },
  potrazivanja: { naslov: 'Potraživanja', uloge: FIN_ULOGE, prikaz: () => prikaziListuF('potrazivanja') },
  ulazni:    { naslov: 'Ulazni računi',   uloge: FIN_ULOGE, prikaz: () => prikaziListuF('ulazni') },
  dopisi:    { naslov: 'Opomene i IOS',   uloge: FIN_ULOGE, prikaz: prikaziDopise },
  izvestaji: { naslov: 'Izveštaji',       uloge: FIN_ULOGE, prikaz: prikaziIzvestaje },
  firme:     { naslov: 'Naše firme',      uloge: ['ADMIN'], prikaz: () => prikaziListu('firme') },
  sifarnici: { naslov: 'Šifarnici',       uloge: ['ADMIN'], prikaz: prikaziSifarnike },
  korisnici: { naslov: 'Korisnici',       uloge: ['ADMIN'], prikaz: prikaziKorisnike },
  uvoz:      { naslov: 'Uvoz iz Excela',  uloge: ['ADMIN'], prikaz: prikaziUvoz }
};
const MENI = [
  { grupa: null,             stavke: ['pregled'] },
  { grupa: 'Operativa',      stavke: ['ture', 'nalozi', 'partneri'] },
  { grupa: 'Vozni park',     stavke: ['vozila', 'vozaci'] },
  { grupa: 'Finansije',      stavke: ['potrazivanja', 'ulazni', 'dopisi', 'izvestaji'] },
  { grupa: 'Administracija', stavke: ['firme', 'sifarnici', 'korisnici', 'uvoz'] }
];

function crtajMeni() {
  const nav = $('#meni-nav'); if (!nav) return;
  const aktivni = S.alarmi.filter(a => a.aktivan);
  const ist = aktivni.filter(a => a.status === 'ISTEKAO').length, usk = aktivni.filter(a => a.status === 'USKORO').length;
  nav.innerHTML = MENI.map(g => {
    const st = g.stavke.filter(s => ima(STRANE[s].uloge));
    if (!st.length) return '';
    return (g.grupa ? `<div class="grupa">${esc(g.grupa)}</div>` : '') + st.map(s => `<a href="#/${s}" class="${S.ruta === s ? 'aktivan' : ''}"${S.ruta === s ? ' aria-current="page"' : ''}>
      <span>${esc(STRANE[s].naslov)}</span>${s === 'pregled' && (ist || usk) ? `<span class="brojaci">${ist ? `<span class="brojac crveni" title="Istekli rokovi">${ist}</span>` : ''}${usk ? `<span class="brojac zuti" title="Ističu uskoro">${usk}</span>` : ''}</span>` : ''}</a>`).join('');
  }).join('');
}

function ruter() {
  ugasiGrafikone();
  const r = location.hash.replace(/^#\/?/, '') || 'pregled';
  const s = STRANE[r] && ima(STRANE[r].uloge) ? r : 'pregled';
  zatvoriFioku();
  S.ruta = s;
  osveziListu = () => {};
  crtajMeni();
  document.title = `${STRANE[s].naslov} – BALKAN TMS`;
  STRANE[s].prikaz();
}

function crtajOkvir() {
  $('#app').innerHTML = `<div class="okvir">
    <aside class="meni"><div class="znak"><b>BALKAN TMS</b><span>${esc(VERZIJA)}</span></div>
      <nav id="meni-nav" aria-label="Glavni meni"></nav>
      <div class="dno"><div class="ko">${esc(S.profil.ime || S.profil.email)}</div><div class="uloga">${esc(ULOGE[S.profil.uloga])}</div>
        <button id="dugme-lozinka">Promeni lozinku</button><button id="dugme-odjava">Odjava</button></div></aside>
    <main class="sadrzaj" id="sadrzaj"></main></div>`;
  $('#dugme-lozinka').onclick = promenaLozinke;
  $('#dugme-odjava').onclick = async () => { await Store.odjava(); prikaziPrijavu(); };
}

// ============ PRIJAVA I POKRETANJE ============
function prikaziPrijavu(tekst = '') {
  location.hash = '';
  $('#app').innerHTML = `<div class="ulaz"><form id="prijava" novalidate>
    <h1>BALKAN TMS</h1><div class="linija"></div>
    <p>Prijavite se e-mailom i lozinkom koje vam je dodelio administrator.</p>
    <label class="polje"><span>E-mail</span><input type="email" name="email" autocomplete="username" required></label>
    <label class="polje"><span>Lozinka</span><input type="password" name="lozinka" autocomplete="current-password" required></label>
    <button class="dugme glavno" type="submit">Prijava</button>
    <p class="tekst-2" id="prijava-poruka" role="alert">${esc(tekst)}</p></form></div>`;
  $('[name="email"]').focus();
  $('#prijava').onsubmit = async e => {
    e.preventDefault();
    const b = $('#prijava button'); b.disabled = true;
    try {
      S.sesija = await Store.prijava($('[name="email"]').value.trim(), $('[name="lozinka"]').value);
      await posle_prijave();
    } catch (er) { $('#prijava-poruka').textContent = prevediGresku(er); b.disabled = false; }
  };
}

function prikaziBezPristupa(tekst) {
  $('#app').innerHTML = `<div class="ulaz"><div class="kartica"><h1>BALKAN TMS</h1><div class="linija"></div>
    <p>${esc(tekst)}</p><button class="dugme" id="odjava2">Odjava</button></div></div>`;
  $('#odjava2').onclick = async () => { await Store.odjava(); prikaziPrijavu(); };
}

async function posle_prijave() {
  const id = S.sesija.user.id;
  S.profil = await Store.jedan('profili', id);
  if (!S.profil) return prikaziBezPristupa('Profil nije pronađen. Proverite da li je pokrenuta skripta 01_BAZA_TMS_LITE.sql.');
  if (!S.profil.aktivan) return prikaziBezPristupa('Vaš pristup je isključen. Obratite se administratoru.');
  if (!S.profil.uloga) return prikaziBezPristupa('Nalog je napravljen, ali još nema dodeljenu ulogu. Javite administratoru da vam dodeli ulogu, pa se ponovo prijavite.');
  await ucitajSifarnike();
  await Promise.all([ucitajAlarme(), ucitajPartnere(), ucitajVozni()]);
  crtajOkvir();
  ruter();
}

function citajKonfig() {
  const ugradjen = !/^UPISI_/.test(KONFIG.SUPABASE_URL) && !/^UPISI_/.test(KONFIG.SUPABASE_KLJUC);
  if (ugradjen) return { url: KONFIG.SUPABASE_URL.trim(), kljuc: KONFIG.SUPABASE_KLJUC.trim() };
  try { const x = JSON.parse(localStorage.getItem('tms_lite_konfig') || 'null'); if (x?.url && x?.kljuc) return x; } catch (e) { /* bez lokalnog podešavanja */ }
  return null;
}

function prikaziPodesavanje() {
  $('#app').innerHTML = `<div class="ulaz"><form id="konfig" novalidate>
    <h1>Povezivanje sa bazom</h1><div class="linija"></div>
    <p>Program još nije povezan sa Supabase bazom. Za probu na ovom računaru nalepite podatke ispod. Za sve korisnike ih upišite u fajl index.html (POCNI_OVDE.md, korak 4).</p>
    <label class="polje"><span>Project URL</span><input type="url" name="url" placeholder="https://xxxx.supabase.co" required></label>
    <label class="polje"><span>Publishable / anon ključ</span><input type="text" name="kljuc" required autocomplete="off"></label>
    <button class="dugme glavno" type="submit">Sačuvaj i nastavi</button></form></div>`;
  $('#konfig').onsubmit = e => {
    e.preventDefault();
    const url = $('[name="url"]').value.trim().replace(/\/+$/, ''), kljuc = $('[name="kljuc"]').value.trim();
    if (!/^https:\/\/.+/.test(url) || kljuc.length < 20) return poruka('Proverite URL (počinje sa https://) i ključ.', true);
    localStorage.setItem('tms_lite_konfig', JSON.stringify({ url, kljuc }));
    start();
  };
}

async function start() {
  if (!window.supabase?.createClient) {
    $('#app').innerHTML = '<div class="ulaz"><div class="kartica"><h1>BALKAN TMS</h1><p>Biblioteka za povezivanje nije učitana. Proverite internet vezu i osvežite stranicu.</p></div></div>';
    return;
  }
  const k = citajKonfig();
  if (!k) return prikaziPodesavanje();
  try {
    Store.init(k.url, k.kljuc);
    Store.sb.auth.onAuthStateChange(dogadjaj => { if (dogadjaj === 'SIGNED_OUT' && S.profil) { S.profil = null; prikaziPrijavu('Odjavljeni ste.'); } });
    S.sesija = await Store.sesija();
    if (!S.sesija) return prikaziPrijavu();
    await posle_prijave();
  } catch (e) {
    prikaziPrijavu(prevediGresku(e));
  }
}

window.addEventListener('hashchange', () => { if (S.profil) ruter(); });
start();
</script>
</body>
</html>
