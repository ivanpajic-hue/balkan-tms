async function ucitajVozni() {
  try { [S.vozila, S.vozaci] = await Promise.all([Store.lista('vozila', { red: 'registracija' }), Store.lista('vozaci', { red: 'prezime' })]); }
  catch (e) { S.vozila = S.vozila || []; S.vozaci = S.vozaci || []; console.warn('Vozni park nije učitan', e); }
}
const vozacIme = id => { const v = (S.vozaci || []).find(x => x.id === id); return v ? `${v.prezime} ${v.ime}` : ''; };
const voziloReg = id => (S.vozila || []).find(x => x.id === id)?.registracija ?? '';
const opcVozila = prikolica => (S.vozila || []).filter(v => v.aktivno && ((v.tip === 'PRIKOLICA') === prikolica))
  .map(v => [v.id, [v.registracija, [v.marka, v.model].filter(Boolean).join(' ')].filter(Boolean).join(' – ')]);
const opcVozaci = () => (S.vozaci || []).filter(v => v.aktivan).map(v => [v.id, `${v.prezime} ${v.ime}`]);
const drzavaPdv = x => (x?.dodatno?.drzava || '').toUpperCase();
// PDV stope koje važe za državu firme (stope bez države važe za obe)
const pdvOpcije = drz => (S.sif.PDV_STOPA || []).filter(x => x.aktivan && (!drz || !drzavaPdv(x) || drzavaPdv(x) === drz)).map(x => [x.kod, x.naziv]);
const drzavaFirmeId = id => drzavaFirme(S.firme.find(f => f.id === id));
function pdvRedZaDrzavu(kod, stopa, drz) {
  const sve = S.sif.PDV_STOPA || [];
  return sve.find(x => x.kod === kod && drzavaPdv(x) === drz) || sve.find(x => x.kod === kod && !drzavaPdv(x))
    || sve.find(x => Number(x.vrednost) === Number(stopa) && drzavaPdv(x) === drz) || (drz ? null : sve.find(x => x.kod === kod));
}
const pdvRed = kod => (S.sif.PDV_STOPA || []).find(x => x.kod === kod);
const kodPoStopi = (stopa, drz) => {
  const sve = (S.sif.PDV_STOPA || []).filter(x => x.aktivan !== false && Number(x.vrednost) === Number(stopa));
  return (sve.find(x => drz && drzavaPdv(x) === drz) || sve.find(x => !drzavaPdv(x)) || (drz ? sve.find(x => !drzavaPdv(x) || drzavaPdv(x) === drz) : sve[0]))?.kod ?? null;
};
const stopaKoda = kod => Number(pdvRed(kod)?.vrednost ?? 0);
const tipOpcije = () => (S.sif.TIP_FAKTURE || []).filter(x => x.aktivan && x.kod !== 'ZADUZENJE').map(x => [x.kod, x.naziv]);
const fmtStopa = s => `${String(Number(s)).replace('.', ',')} %`;
const mnozina = (n, jedan, dva, pet) => { const d = n % 10, s = n % 100; return d === 1 && s !== 11 ? jedan : d >= 2 && d <= 4 && (s < 12 || s > 14) ? dva : pet; };

// ---------------------------------------------------------------------
// Vrste faktura (2.5): RSD faktura, EUR faktura, INTERNA, GOTOVINSKA
// Šifarnici → Tipovi faktura (serija broja) i → Pravila faktura (firma koja uvek izdaje internu i gotovinsku)
// ---------------------------------------------------------------------
const firmaPoKodu = kod => S.firme.find(f => kod && String(f.kod).toUpperCase() === String(kod).trim().toUpperCase());
// Firma koja uvek izdaje vrstu (interna, gotovinska); null = bira se slobodno
const fiksniIzdavalac = tip => (tip === 'INTERNA' ? firmaPoKodu(podesavanje('INTERNA_IZDAVALAC')?.oznaka)
  : tip === 'GOTOVINSKA' ? firmaPoKodu(podesavanje('GOTOVINSKA_IZDAVALAC')?.oznaka) : null) || null;
// Valuta koju određuje vrsta: RSD faktura → RSD, EUR faktura → EUR, interna → EUR; null = bira se
const fiksnaValuta = tip => (tip === 'INTERNA' ? 'EUR' : (S.sif.VALUTA || []).some(x => x.kod === tip) ? tip : null);
// Podrazumevana vrsta za firmu: BT → RSD faktura, BA → EUR faktura (po valuti firme)
const tipZaFirmu = fi => {
  const t = tipOpcije().map(([k]) => k), v = valutaZaFirmu(fi);
  return t.includes(v) ? v : (t.find(k => fiksnaValuta(k) && k !== 'INTERNA') || t[0] || 'EUR');
};
// Domaći promet: kupac iz iste države kao firma (ili bez upisane države) → opšta stopa PDV-a
const jeDomaci = (fi, kl) => { const a = drzavaKod(fi?.drzava); const b = drzavaKod(kl?.drzava); return !!a && (!b || a === b); };
function predlogTipa(n) {
  const kl = S.partneri.find(p => p.id === n.klijent_id), fi = S.firme.find(f => f.id === n.firma_id);
  if (kl?.interna_firma_id) return 'INTERNA';
  return tipZaFirmu(fi);
}
// PDV: domaći kupac = opšta stopa države firme; inostranstvo, interna i RSD faktura = 0 % (knjigovođa proverava osnov)
function predlogPdv(tip, n) {
  const fi = S.firme.find(f => f.id === n.firma_id), drz = drzavaFirme(fi);
  const kl = S.partneri.find(p => p.id === n.klijent_id);
  const dom = tip === 'DOMACA' || (!['INO', 'INTERNA', 'ZADUZENJE', 'RSD'].includes(tip) && jeDomaci(fi, kl));   // RSD faktura: bez PDV
  if (!dom) return kodPoStopi(0, drz) ?? '0';
  return kodPoStopi(drz === 'SI' ? 22 : drz === 'RS' ? 20 : 0, drz) ?? kodPoStopi(0, drz) ?? '0';
}
const istekliRokoviTure = t => S.alarmi.filter(a => a.status === 'ISTEKAO' && (
  (a.entitet === 'VOZILO' && [t.vozilo_id, t.prikolica_id].includes(a.entitet_id)) ||
  (a.entitet === 'VOZAC' && [t.vozac_id, t.vozac2_id].includes(a.entitet_id))));
function upozorenjaTure(t) {
  const ist = istekliRokoviTure(t);
  return ist.length ? `<div class="napomena upozorenje"><b>Istekli rokovi:</b> ${ist.map(a => `${esc(a.naziv)} – ${esc(a.vrsta_naziv)} (${fmtDatum(a.datum_isteka)})`).join('; ')}</div>` : '';
}
function rezultatTureHTML(t) {
  const st = (l, v, jak) => `<dt>${l}</dt><dd>${jak ? `<b class="${v < 0 ? 'minus' : ''}">${fmtBroj(v)} EUR</b>` : `${fmtBroj(v)} EUR`}</dd>`;
  return `<dl class="detalji">${st('Prihod (bez PDV)', t.prihod_eur)}${st('Troškovi ture', t.troskovi_eur)}${st('Obračun vozača', t.vozac_eur)}${st('Rezultat ture', t.rezultat_eur, true)}${t.km != null ? `<dt>Pređeno</dt><dd>${fmtBroj(t.km, 0)} km${t.km ? `, ${fmtBroj(t.prihod_eur / t.km)} EUR/km prihoda` : ''}</dd>` : ''}</dl>`;
}
function oznakaFakturisanja(r) {
  return ({ DA: '<span class="oznaka zelena">fakturisano</span>', DELIMICNO: '<span class="oznaka zuta">delimično</span>',
    NE: '<span class="oznaka zuta">za fakturisanje</span>', BEZ_STAVKI: '<span class="oznaka siva">bez stavki</span>' })[r.fakturisano] || '';
}

  ];
  const ucitaj = async () => {
    try {
      [nalozi, slobodni] = await Promise.all([
        Store.lista('v_nalozi', { filteri: [['eq', 'tura_id', tura.id]], red: 'broj' }),
        Store.lista('v_nalozi', { filteri: [['is', 'tura_id', null]], red: 'created_at', opadajuce: true })]);
      crtaj();
    } catch (e) { telo.innerHTML = `<div class="prazno">${esc(prevediGresku(e))}</div>`; }
  };
  const crtaj = () => {
    telo.innerHTML = `<div class="alati">
        <button class="dugme glavno" id="novi-nalog">+ Novi nalog u ovoj turi</button>
        ${nalozi.length ? '<button class="dugme" id="stampaj-naloge-ture">Štampaj naloge ture</button>' : ''}
      </div>
      ${slobodni.length ? `<details class="pridruzi"><summary>Pridruži naloge bez ture (${slobodni.length})</summary>
        <div class="pridruzi-lista">${slobodni.map(n => `<label><input type="checkbox" value="${n.id}"> <b class="nw">${esc(n.broj)}</b> <span>${esc(n.nalogodavac_naziv)}${n.mesto_utovara || n.mesto_istovara ? ` · ${esc([n.mesto_utovara, n.mesto_istovara].filter(Boolean).join(' – '))}` : ''}${n.datum_utovara ? ` · ${fmtDatum(n.datum_utovara)}` : ''}</span></label>`).join('')}</div>
        <div class="alati" style="margin:8px 0 0"><button class="dugme glavno" id="pridruzi" type="button">Pridruži izabrane</button></div></details>` : ''}
      <div class="tabela-okvir">${nalozi.length ? tabelaHTML(kolone, nalozi) : '<div class="prazno">Tura još nema naloga.</div>'}</div>
      ${nalozi.length ? `<p class="tekst-2" style="margin-top:10px">Prihod ture: <b>${fmtBroj(nalozi.reduce((s, n) => s + Number(n.prihod_eur), 0))} EUR</b> bez PDV.</p>` : ''}`;
    $('#novi-nalog').onclick = () => otvoriFioku('nalozi', null, 'podaci', { pocetne: { tura_id: tura.id, firma_id: tura.firma_id }, ...nazadNa('ture', tura, 'nalozi') });

      try { const n = await Store.izmeniVise('nalozi', ids, { tura_id: tura.id }); poruka(`Pridruženo turi: ${n} ${mnozina(n, 'nalog', 'naloga', 'naloga')}.`); osveziListu(); await ucitaj(); }

        { l: 'Status', f: oznakaPlacanja }
      ], fak) : `<div class="prazno">${nalog.fakture_plan ? 'Fakture su definisane uz stavke, ali još nisu izdate.' : 'Nalog još nema faktura. Fakture se definišu uz stavke (kartica Podaci).'}</div>`}</div>
      ${fak.length ? `<p class="tekst-2" style="margin-top:8px">Fakturisano kupcima (bez internih i storniranih): <b>${fmtBroj(ukEur)} EUR</b> bez PDV · plan naloga ${fmtBroj(nalog.iznos_eur)} EUR.</p>` : ''}`;
    if ($('#fakturisi-nalog')) $('#fakturisi-nalog').onclick = () => dijalogIzdavanja([nalog.id], { posle: async () => otvoriFioku('nalozi', await Store.jedan('v_nalozi', nalog.id), 'fakture') });

async function faktureNaloga(id) {
  const fs = await Store.lista('faktura_stavke', { filteri: [['eq', 'nalog_id', id]] });
  const ids = [...new Set(fs.map(x => x.faktura_id))];
  return ids.length ? Store.lista('v_fakture', { filteri: [['in', 'id', ids]], red: 'created_at' }) : [];
}

const podesavanje = kod => (S.sif.PODESAVANJE || []).find(x => x.kod === kod && x.aktivan !== false);
function pravilaInterne() {
  const za = podesavanje('INTERNA_ZA')?.oznaka, iz = podesavanje('INTERNA_IZDAVALAC')?.oznaka;
  const um = Number(podesavanje('INTERNA_UMANJENJE')?.vrednost ?? 0);
  const nadji = kod => S.firme.find(f => kod && String(f.kod).toUpperCase() === String(kod).trim().toUpperCase());
  const fZa = nadji(za), fIz = nadji(iz);
  return fZa && fIz && fZa.id !== fIz.id ? { za: fZa, iz: fIz, um } : null;
}
const stavkaUEur = s => Number(s.cena) / (s.valuta === 'EUR' || !s.valuta ? 1 : Number(s.kurs || valutaKurs(s.valuta)) || 1);
const izEura = (eur, valuta, kurs) => Math.round(eur * (valuta === 'EUR' ? 1 : kurs) * 100) / 100;
const cenaInterne = (cena, kurs, um) => Math.round(cena / kurs * 100) / 100 - um;
const opcHTML = (lista, izabran) => lista.map(([v, t]) => `<option value="${esc(v)}"${String(v) === String(izabran ?? '') ? ' selected' : ''}>${esc(t)}</option>`).join('');
const firmaZaKupca = kl => { const akt = S.firme.filter(f => f.aktivna !== false); return akt.find(f => kl?.drzava && f.drzava && bezKvacica(f.drzava) === bezKvacica(kl.drzava)) || akt[0]; };
// Predlog faktura za stavku: firma po državi kupca, vrsta po firmi (BT → RSD faktura, BA → EUR faktura);
// uz RSD fakturu BT predlaže se i interna BA → BT (cena / kurs − umanjenje po jedinici)
const jeOsnovaInterne = (f, pr) => !!pr && f.firma_id === pr.za.id && ['RSD', 'DOMACA'].includes(f.tip) && f.valuta === 'RSD';
function predlogInterne(baza, uvek = true) {
  const pr = pravilaInterne();
  if (!jeOsnovaInterne(baza, pr)) return null;
  const c = cenaInterne(Number(baza.cena) || 0, Number(baza.kurs) || 1, pr.um);
  if (!uvek && c <= 0) return null;
  return { firma_id: pr.iz.id, tip: 'INTERNA', klijent_id: '', valuta: 'EUR', kurs: 1, cena: Math.max(0, c), pdv_kod: predlogPdv('INTERNA', { firma_id: pr.iz.id }), auto: true };
}
function predlogPlana(cenaEur, klijentId, uvekInterna = true) {
  const kl = S.partneri.find(p => p.id === klijentId), fi0 = firmaZaKupca(kl);
  if (!fi0) return [];
  const tip = predlogTipa({ klijent_id: klijentId, firma_id: fi0.id }), fi = fiksniIzdavalac(tip) || fi0;
  const valuta = fiksnaValuta(tip) || valutaZaFirmu(fi), kurs = valuta === 'EUR' ? 1 : Number(valutaKurs(valuta)) || 1;
  const red = [{ firma_id: fi.id, tip, klijent_id: '', valuta, kurs, cena: izEura(cenaEur || 0, valuta, kurs), pdv_kod: predlogPdv(tip, { firma_id: fi.id, klijent_id: klijentId }), auto: true }];
  const interna = predlogInterne(red[0], uvekInterna);
  if (interna) red.push(interna);
  return red;
}

// ---------------------------------------------------------------------
// Stavke naloga sa fakturama – na istom ekranu kao podaci naloga
// ---------------------------------------------------------------------
async function urednikStavki(nalog, telo, forma, dno, opc = {}) {
  const moze = ima(SVI) && !!forma.querySelector('select:not([disabled]),input:not([disabled])');
  const sek = document.createElement('section');
  sek.className = 'ns'; sek.id = 'ns';
  sek.innerHTML = '<div class="prazno">Učitavanje stavki…</div>';
  telo.appendChild(sek);
  telo.closest('.fioka')?.classList.add('siroka');
  let stavke = [], plan = [];
  const brojFakture = new Map();
  if (nalog) {
    try {
      [stavke, plan] = await Promise.all([Store.lista('nalog_stavke', { filteri: [['eq', 'nalog_id', nalog.id]], red: 'rb' }),
        Store.lista('nalog_fakture', { filteri: [['eq', 'nalog_id', nalog.id]], red: 'rb' })]);
      const fIds = [...new Set(plan.map(p => p.faktura_id).filter(Boolean))];
      if (fIds.length) (await Store.lista('fakture', { filteri: [['in', 'id', fIds]] })).forEach(f => brojFakture.set(f.id, f.broj));
    } catch (e) { sek.innerHTML = `<div class="prazno">${esc(prevediGresku(e))}</div>`; return null; }
  }
  if (!document.body.contains(sek)) return null;
  const pr = pravilaInterne();
  const M = opc.nacrt || stavke.map(s => {
    const sk = Number(s.kolicina), fak = plan.filter(p => p.nalog_stavka_id === s.id);
    const red = fak.map(p => ({ id: p.id, firma_id: p.firma_id, tip: p.tip, klijent_id: p.klijent_id && p.klijent_id !== nalog?.klijent_id ? p.klijent_id : '', valuta: p.valuta, kurs: Number(p.kurs) || 1,
      kolicina: p.kolicina == null ? sk : Number(p.kolicina), kolAuto: p.kolicina == null,
      cena: Number(p.cena), pdv_kod: p.pdv_kod || '', faktura_id: p.faktura_id || null, auto: false }));
    const baza = red.find(f => jeOsnovaInterne(f, pr));   // interna prati količinu svoje RSD fakture
    red.forEach(f => { if (f.tip === 'INTERNA' && baza && !f.faktura_id && f.kolicina === baza.kolicina) f.kolAuto = true; });
    return { id: s.id, opis: s.opis, opisAuto: false, kolicina: sk, jedinica: s.jedinica || '', cena: s.cena == null ? null : Number(s.cena), valuta: s.valuta || 'EUR', kurs: Number(s.kurs) || 1,
      teret: s.teret || '', zakljucana: !!s.faktura_id || fak.some(p => p.faktura_id), fakture: red };
  });
  const klijentNaloga = () => forma.querySelector('[name="klijent_id"]')?.value || nalog?.klijent_id || '';
  const aktivne = S.firme.filter(f => f.aktivna !== false);
  const tipovi = tipOpcije();
  const partneriOpc = S.partneri.filter(p => p.aktivan !== false).map(p => [p.id, p.naziv]);
  const eurStavke = s => (s.cena == null || Number.isNaN(Number(s.cena)) ? 0 : stavkaUEur(s));
  const iznosF = f => Math.round(Number(f.kolicina || 0) * Number(f.cena || 0) * 100) / 100;
  const kupacF = f => f.klijent_id || klijentNaloga();
  const postaviValutu = (f, v) => { f.valuta = v; f.kurs = v === 'EUR' ? 1 : Number(valutaKurs(v)) || 1; };
  const saKolicinom = (s, f) => ({ ...f, kolicina: s.kolicina, kolAuto: true });
  // opis nove stavke: „Transport vozila na relaciji utovar – istovar“ iz podataka naloga
  const poljeNaloga = n => { const el = forma.querySelector(`[name="${n}"]`); return el ? el.value.trim() : (nalog?.[n] || ''); };
  const opisPoRelaciji = () => { const r = [poljeNaloga('mesto_utovara'), poljeNaloga('mesto_istovara')].filter(Boolean).join(' – '); return r ? `Transport vozila na relaciji ${r}` : 'Transport vozila'; };
  const drugaFirma = f => S.firme.find(x => x.id !== f.firma_id && x.aktivna !== false);
  // nova faktura uz stavku: firma po državi kupca (može se promeniti), vrstu bira korisnik
  const praznaFaktura = s => {
    const fi = firmaZaKupca(S.partneri.find(p => p.id === klijentNaloga())) || aktivne[0], v = valutaZaFirmu(fi);
    const f = { firma_id: fi?.id, tip: '', klijent_id: '', valuta: v, kurs: v === 'EUR' ? 1 : Number(valutaKurs(v)) || 1, cena: null, pdv_kod: '', auto: true };
    f.cena = izEura(eurStavke(s), f.valuta, f.kurs);
    f.pdv_kod = predlogPdv('', { firma_id: f.firma_id, klijent_id: klijentNaloga() });
    return saKolicinom(s, f);
  };
  // uz RSD fakturu BT (pravilo iz Šifarnika) interna BA → BT se dodaje sama, ako je već nema
  const dodajInternu = s => {
    const baza = s.fakture.find(f => jeOsnovaInterne(f, pr) && !f.faktura_id);
    if (!baza || s.fakture.some(f => f.tip === 'INTERNA')) return;
    const r = predlogInterne(baza, true); if (r) s.fakture.push(saKolicinom(s, r));
  };
  const preracunaj = s => {
    const baza = s.fakture.find(f => jeOsnovaInterne(f, pr));
    const poredak = [...s.fakture.filter(f => f.tip !== 'INTERNA'), ...s.fakture.filter(f => f.tip === 'INTERNA')];
    poredak.forEach(f => {
      if (f.faktura_id) return;
      if (f.kolAuto) f.kolicina = f.tip === 'INTERNA' && baza ? baza.kolicina : s.kolicina;
      if (!f.auto) return;
      if (f.tip === 'INTERNA') { if (baza) f.cena = Math.max(0, cenaInterne(Number(baza.cena) || 0, Number(baza.kurs) || 1, pr.um)); }
      else f.cena = izEura(eurStavke(s), f.valuta, Number(f.kurs) || 1);
    });
  };
  // sledeća faktura za stavku: uz RSD fakturu BT prvo interna, inače nova faktura (vrstu bira korisnik)
  const sledecaFaktura = s => {
    const baza = s.fakture.find(f => jeOsnovaInterne(f, pr));
    const red = baza && !s.fakture.some(f => f.tip === 'INTERNA') && predlogInterne(baza, true);
    return red ? saKolicinom(s, red) : praznaFaktura(s);
  };
  const redF = (f, j) => {
    const dis = f.faktura_id || !moze ? ' disabled' : '', fi = S.firme.find(x => x.id === f.firma_id);
    const fiks = fiksniIzdavalac(f.tip), fv = fiksnaValuta(f.tip);
    const tipOpc = tipovi.some(x => x[0] === f.tip) ? tipovi : [...tipovi, [f.tip, sifNaziv('TIP_FAKTURE', f.tip)]];
    return `<tr data-j="${j}"${f.faktura_id ? ' class="zak"' : ''}>
      <td><select data-f="firma_id" aria-label="Firma koja izdaje"${dis || (fiks ? ` disabled title="Ovu vrstu uvek izdaje ${esc(fiks.kod)}"` : '')}>${opcHTML(aktivne.map(x => [x.id, x.kod]), f.firma_id)}</select></td>
      <td><select data-f="tip" aria-label="Vrsta fakture"${dis}${f.tip ? '' : ' class="obavezno"'}>${f.tip ? '' : '<option value="" selected disabled>Izaberite vrstu…</option>'}${opcHTML(tipOpc.filter(x => x[0]), f.tip)}</select></td>
      <td><select data-f="klijent_id" aria-label="Kupac"${dis}><option value="">${esc(f.tip === 'INTERNA' ? (drugaFirma(f)?.naziv || 'naša druga firma') : (partnerNaziv(klijentNaloga()) || 'kupac sa naloga'))}</option>${opcHTML(partneriOpc.filter(([id]) => id !== klijentNaloga() || f.klijent_id === id), f.klijent_id)}</select></td>
      <td><select data-f="valuta" aria-label="Valuta"${dis || (fv ? ' disabled title="Valutu određuje vrsta fakture"' : '')}>${opcHTML(sifOpcije('VALUTA').map(o => [o.v, o.v]), f.valuta)}</select></td>
      <td><input data-f="kurs" type="number" step="0.0001" min="0" value="${esc(f.kurs)}" aria-label="Kurs"${f.valuta === 'EUR' ? ' readonly' : ''}${dis}></td>
      <td><input data-f="kolicina" type="number" step="any" value="${esc(f.kolicina ?? '')}" aria-label="Količina na fakturi"${dis}></td>
      <td><input data-f="cena" type="number" step="0.01" value="${esc(f.cena ?? '')}" aria-label="Cena po jedinici"${dis}></td>
      <td><select data-f="pdv_kod" aria-label="PDV"${dis}>${opcHTML(pdvOpcije(drzavaFirme(fi)), f.pdv_kod)}</select></td>
      <td class="b" data-iznos>${novac(iznosF(f), f.valuta)}</td>
      <td>${f.faktura_id ? `<span class="oznaka zelena nw">${esc(brojFakture.get(f.faktura_id) || 'izdata')}</span>` : (moze ? '<button class="dugme malo" type="button" data-ukloni-f aria-label="Ukloni fakturu" title="Ukloni">×</button>' : '')}</td></tr>`;
  };
  const kartica = (s, i) => {
    const dis = s.zakljucana || !moze ? ' disabled' : '';
    return `<div class="ns-stavka" data-i="${i}">
      <div class="ns-red">
        <label class="polje"><span>Opis usluge <i>*</i></span><input type="text" data-s="opis" value="${esc(s.opis)}"${dis}></label>
        <label class="polje"><span>Količina <i>*</i></span><input data-s="kolicina" type="number" step="any" value="${esc(s.kolicina ?? '')}"${dis}></label>
        <label class="polje"><span>Jedinica</span><select data-s="jedinica"${dis}>${opcHTML([['', '—'], ...sifOpcije('JEDINICA').map(o => [o.v, o.t])], s.jedinica)}</select></label>
        <label class="polje"><span>Cena (${esc(s.valuta || 'EUR')})</span><input data-s="cena" type="number" step="0.01" value="${esc(s.cena ?? '')}"${dis}></label>
        ${moze && !s.zakljucana ? '<button class="dugme malo" type="button" data-ukloni-s aria-label="Ukloni stavku" title="Ukloni stavku">×</button>' : '<span></span>'}
      </div>
      <label class="polje"><span>Teret / VIN brojevi</span><input type="text" data-s="teret" value="${esc(s.teret)}"${dis}></label>
      <div class="ns-fak-naslov">Fakture za ovu stavku${s.zakljucana ? ' · stavka je fakturisana' : ''}</div>
      ${s.fakture.length ? `<div class="ns-okvir"><table class="ns-fakture"><thead><tr><th>Firma</th><th>Vrsta</th><th>Kupac</th><th>Valuta</th><th>Kurs</th><th>Količina</th><th>Cena / jed.</th><th>PDV</th><th class="b">Iznos</th><th></th></tr></thead>
        <tbody>${s.fakture.map((f, j) => redF(f, j)).join('')}</tbody></table></div>`
        : '<p class="tekst-2" style="margin:4px 0">Još nije definisano koje se fakture izdaju za ovu stavku.</p>'}
      ${moze ? '<div class="ns-akcije"><button class="dugme malo" type="button" data-dodaj-f>+ Dodaj fakturu</button></div>' : ''}
    </div>`;
  };
  const zbir = () => {
    let plan = 0, interne = 0, otvoreno = 0;
    M.forEach(s => s.fakture.forEach(f => {
      const e = iznosF(f) / (f.valuta === 'EUR' ? 1 : Number(f.kurs) || 1);
      if (f.tip === 'INTERNA') interne += e; else plan += e;
      if (!f.faktura_id) otvoreno++;
    }));
    const bez = M.filter(s => !s.fakture.length).length;
    return `<b>Plan prihoda ${fmtBroj(plan)} EUR</b> bez PDV (bez internih)${interne ? ` · interne ${fmtBroj(interne)} EUR` : ''} · za izdavanje ${otvoreno} ${mnozina(otvoreno, 'linija', 'linije', 'linija')}${bez ? ` · <span class="minus">${bez} ${mnozina(bez, 'stavka nema', 'stavke nemaju', 'stavki nema')} definisane fakture</span>` : ''}`;
  };
  const pravilaTekst = () => {
    const fi = fiksniIzdavalac('INTERNA'), fg = fiksniIzdavalac('GOTOVINSKA');
    if (fi && fg && fi.id === fg.id) return ` Internu i gotovinsku fakturu uvek izdaje ${esc(fi.kod)}.`;
    return `${fi ? ` Internu fakturu uvek izdaje ${esc(fi.kod)}.` : ''}${fg ? ` Gotovinsku fakturu uvek izdaje ${esc(fg.kod)}.` : ''}`;
  };
  const crtaj = () => {
    sek.innerHTML = `<div class="sekcija-forme">Stavke i fakture</div>
      <p class="tekst-2" style="margin:6px 0 10px">Uz svaku stavku navedite koje se fakture izdaju – firma, vrsta, kupac, količina i cena po jedinici. Količina se predlaže sa stavke i može se promeniti za svaku fakturu; opis i teret prelaze na fakturu.${pravilaTekst()} Fakture se izdaju komandom „Fakturiši“ (u listi naloga ili ovde, posle čuvanja).</p>
      <div id="ns-lista">${M.map(kartica).join('') || '<div class="prazno" style="padding:16px">Nalog još nema stavke.</div>'}</div>
      ${moze ? '<button class="dugme" type="button" id="ns-dodaj">+ Dodaj stavku</button>' : ''}
      <div class="napomena" id="ns-zbir" style="margin-top:12px">${zbir()}</div>`;
  };
  const zameniKarticu = i => { const el = sek.querySelector(`.ns-stavka[data-i="${i}"]`); if (el) el.outerHTML = kartica(M[i], i); $('#ns-zbir').innerHTML = zbir(); };
  const osveziBrojeve = i => {
    const s = M[i], el = sek.querySelector(`.ns-stavka[data-i="${i}"]`); if (!el) return;
    s.fakture.forEach((f, j) => {
      const tr = el.querySelector(`tr[data-j="${j}"]`); if (!tr) return;
      const c = tr.querySelector('[data-f="cena"]'), q = tr.querySelector('[data-f="kolicina"]');
      if (f.auto && document.activeElement !== c) c.value = f.cena ?? '';
      if (f.kolAuto && document.activeElement !== q) q.value = f.kolicina ?? '';
      tr.querySelector('[data-iznos]').innerHTML = novac(iznosF(f), f.valuta);
    });
    $('#ns-zbir').innerHTML = zbir();
  };
  sek.addEventListener('input', e => {
    const card = e.target.closest('.ns-stavka'); if (!card) return;
    fiokaIzmenjena = true;
    const i = +card.dataset.i, s = M[i], ks = e.target.dataset.s, kf = e.target.dataset.f;
    if (ks) {
      if (ks === 'opis') s.opisAuto = false;
      s[ks] = ['kolicina', 'cena'].includes(ks) ? (e.target.value === '' ? null : Number(e.target.value)) : e.target.value;
      if (['kolicina', 'cena'].includes(ks)) preracunaj(s);
      osveziBrojeve(i); return;
    }
    const tr = e.target.closest('tr[data-j]'); if (!tr || !kf || e.target.tagName !== 'INPUT') return;
    const f = s.fakture[+tr.dataset.j];
    if (kf === 'cena') { f.cena = e.target.value === '' ? null : Number(e.target.value); f.auto = false; }
    if (kf === 'kolicina') { f.kolicina = e.target.value === '' ? null : Number(e.target.value); f.kolAuto = false; }
    if (kf === 'kurs') f.kurs = Number(e.target.value) || 0;
    preracunaj(s); osveziBrojeve(i);
  });
  sek.addEventListener('change', e => {
    const card = e.target.closest('.ns-stavka'); if (!card || e.target.tagName !== 'SELECT') return;
    fiokaIzmenjena = true;
    const i = +card.dataset.i, s = M[i];
    if (e.target.dataset.s) { s[e.target.dataset.s] = e.target.value; return; }
    const tr = e.target.closest('tr[data-j]'), k = e.target.dataset.f; if (!tr || !k) return;
    const f = s.fakture[+tr.dataset.j];
    f[k] = e.target.value;
    if (k === 'firma_id') {                       // vrstu bira korisnik; valuta po vrsti, inače po firmi
      const fi = S.firme.find(x => x.id === f.firma_id);
      postaviValutu(f, fiksnaValuta(f.tip) || valutaZaFirmu(fi)); f.auto = true;
    }
    if (k === 'tip') {                            // interna i gotovinska: uvek ista firma; RSD/EUR faktura: valuta
      const fiks = fiksniIzdavalac(f.tip);
      if (fiks) f.firma_id = fiks.id;
      const fi = S.firme.find(x => x.id === f.firma_id);
      postaviValutu(f, fiksnaValuta(f.tip) || (fiks ? valutaZaFirmu(fi) : f.valuta));
      if (f.tip === 'INTERNA') { f.klijent_id = ''; f.kolAuto = true; }
      f.auto = true;
    }
    if (k === 'valuta') { postaviValutu(f, f.valuta); f.auto = true; }
    if (['firma_id', 'tip', 'klijent_id'].includes(k)) f.pdv_kod = predlogPdv(f.tip, { firma_id: f.firma_id, klijent_id: kupacF(f) });
    if (['firma_id', 'tip'].includes(k)) dodajInternu(s);
    preracunaj(s); zameniKarticu(i);
  });
  sek.addEventListener('click', e => {
    if (e.target.id === 'ns-dodaj') {
      const s = { opis: opisPoRelaciji(), opisAuto: true, kolicina: 1, jedinica: '', cena: null, valuta: 'EUR', kurs: 1, teret: '', fakture: [] };
      s.fakture = [praznaFaktura(s)];
      M.push(s); fiokaIzmenjena = true; crtaj();
      sek.querySelector(`.ns-stavka[data-i="${M.length - 1}"] [data-s="opis"]`)?.focus();
      return;
    }
    const card = e.target.closest('.ns-stavka'); if (!card) return;
    const i = +card.dataset.i, s = M[i];
    if (e.target.matches('[data-ukloni-s]')) { M.splice(i, 1); fiokaIzmenjena = true; crtaj(); }
    else if (e.target.matches('[data-ukloni-f]')) { s.fakture.splice(+e.target.closest('tr').dataset.j, 1); fiokaIzmenjena = true; preracunaj(s); zameniKarticu(i); }
    else if (e.target.matches('[data-dodaj-f]')) {
      s.fakture.push(sledecaFaktura(s));
      preracunaj(s); fiokaIzmenjena = true; zameniKarticu(i);
    }
  });
  crtaj();
  forma.addEventListener('input', e => {          // opis koji nije ručno menjan prati mesta utovara i istovara
    if (!['mesto_utovara', 'mesto_istovara'].includes(e.target.name)) return;
    M.forEach((s, i) => {
      if (!s.opisAuto || s.zakljucana) return;
      s.opis = opisPoRelaciji();
      const el = sek.querySelector(`.ns-stavka[data-i="${i}"] [data-s="opis"]`); if (el) el.value = s.opis;
    });
  });
  forma.addEventListener('change', e => {         // novi kupac naloga: naziv u kolonama Kupac i PDV po njegovoj državi
    if (e.target.name !== 'klijent_id' && e.target.name !== 'nalogodavac_id') return;
    M.forEach(s => s.fakture.forEach(f => { if (!f.faktura_id && !f.klijent_id && f.tip) f.pdv_kod = predlogPdv(f.tip, { firma_id: f.firma_id, klijent_id: kupacF(f) }); }));
    crtaj();
  });
  if (nalog) {                                    // štampa naloga
    const desno = dno.querySelector('.desno'), b = document.createElement('button');
    b.className = 'dugme'; b.id = 'stampaj-nalog'; b.type = 'button'; b.textContent = 'Štampaj nalog';
    desno?.insertBefore(b, desno.firstChild);
    b.onclick = () => (fiokaIzmenjena ? poruka('Prvo sačuvajte izmene naloga.', true) : stampajNaloge([nalog.id]));
  }
  if (nalog && ima(FIN_ULOGE) && (nalog.fakture_plan || 0) > (nalog.fakture_plan_izdato || 0)) {
    const desno = dno.querySelector('.desno'), b = document.createElement('button');
    b.className = 'dugme'; b.id = 'fakturisi-nalog'; b.type = 'button'; b.textContent = 'Fakturiši';
    desno?.insertBefore(b, desno.querySelector('#sacuvaj'));
    b.onclick = () => {
      if (fiokaIzmenjena) return poruka('Prvo sačuvajte izmene naloga.', true);
      dijalogIzdavanja([nalog.id], { posle: async () => otvoriFioku('nalozi', await Store.jedan('v_nalozi', nalog.id), 'podaci') });
    };
  }
  return {
    provera: () => {
      for (const [i, s] of M.entries()) {
        if (!String(s.opis || '').trim()) return `Stavka ${i + 1}: upišite opis.`;
        if (!Number(s.kolicina)) return `Stavka „${s.opis}“: količina ne može biti 0.`;
        for (const f of s.fakture) {
          if (f.faktura_id) continue;
          const fiks = fiksniIzdavalac(f.tip);
          if (!f.firma_id || !f.tip) return `Stavka „${s.opis}“: izaberite firmu i vrstu fakture.`;
          if (fiks && f.firma_id !== fiks.id) return `Stavka „${s.opis}“: vrstu „${sifNaziv('TIP_FAKTURE', f.tip)}“ uvek izdaje ${fiks.kod}.`;
          if (!Number(f.kolicina)) return `Stavka „${s.opis}“: upišite količinu na fakturi (ne može biti 0).`;
          if (f.cena == null || Number.isNaN(Number(f.cena))) return `Stavka „${s.opis}“: upišite cenu na fakturi.`;
          if (f.tip === 'INTERNA' && Number(f.cena) <= 0) return `Stavka „${s.opis}“: cena interne fakture mora biti veća od 0.`;
          if (f.valuta !== 'EUR' && !(Number(f.kurs) > 0)) return `Stavka „${s.opis}“: upišite kurs.`;
        }
      }
      return null;
    },
    sacuvaj: n => Store.rpc('sacuvaj_stavke_naloga', { p_nalog: n.id, p_stavke: M.map((s, i) => ({
      id: s.id || null, rb: i + 1, opis: String(s.opis).trim(), kolicina: Number(s.kolicina), jedinica: s.jedinica || null, cena: s.cena ?? 0,
      valuta: s.valuta || 'EUR', kurs: s.kurs || 1, teret: s.teret || null,
      fakture: s.fakture.map((f, j) => ({ id: f.id || null, rb: j + 1, firma_id: f.firma_id, tip: f.tip, klijent_id: f.klijent_id || null,
        valuta: f.valuta, kurs: f.valuta === 'EUR' ? 1 : Number(f.kurs),
        kolicina: Number(f.kolicina) === Number(s.kolicina) ? null : Number(f.kolicina),   // prazno = količina stavke
        cena: Number(f.cena), pdv_kod: f.pdv_kod || null })) })) }),
    nacrt: () => M
  };
}

async function dijalogIzdavanja(ids, op = {}) {
  let nal, plan, stv;
  try {
    [nal, plan, stv] = await Promise.all([Store.lista('v_nalozi', { filteri: [['in', 'id', ids]] }),
      Store.lista('nalog_fakture', { filteri: [['in', 'nalog_id', ids], ['is', 'faktura_id', null]] }),
      Store.lista('nalog_stavke', { filteri: [['in', 'nalog_id', ids]] })]);
  } catch (e) { return poruka(prevediGresku(e), true); }
  if (!plan.length) return poruka('Izabrani nalozi nemaju fakture za izdavanje. U nalogu uz stavke dodajte fakture (firma, vrsta, cena).', true);
  const nm = new Map(nal.map(n => [n.id, n])), sm = new Map(stv.map(s => [s.id, s]));
  const bezPlana = nal.filter(n => n.fakturisano !== 'DA' && !plan.some(p => p.nalog_id === n.id));
  const imaDevize = plan.some(p => p.valuta !== 'EUR');
  const stanje = { datum: danas(), prometa: '', kurs: '', grupno: false };
  const interniKupac = p => S.partneri.find(x => x.interna_firma_id && x.interna_firma_id !== p.firma_id);
  const grupe = () => {
    const m = new Map();
    for (const p of plan) {
      const n = nm.get(p.nalog_id), s = sm.get(p.nalog_stavka_id); if (!n || !s) continue;
      const kupac = p.klijent_id || (p.tip === 'INTERNA' ? (interniKupac(p)?.id || 'interna') : n.klijent_id);
      const ng = p.tip === 'INTERNA' ? '' : n.nalogodavac_id;
      const kg = [p.firma_id, p.tip, kupac, ng, p.valuta, stanje.grupno ? '' : n.id].join('|');
      const g = m.get(kg) || { firma: p.firma_id, tip: p.tip, kupac, ng, valuta: p.valuta, nalozi: new Map(), os: 0 };
      g.os += Math.round(Number(p.kolicina ?? s.kolicina) * Number(p.cena) * 100) / 100; g.nalozi.set(n.id, n);
      m.set(kg, g);
    }
    return [...m.values()].sort((a, b) => (a.tip === 'INTERNA') - (b.tip === 'INTERNA'));
  };
  const upoz = [];
  if (bezPlana.length) upoz.push(`Bez definisanih faktura (preskaču se): ${bezPlana.map(n => n.broj).join(', ')}`);
  for (const id of new Set(grupe().map(g => g.kupac))) {
    const p = S.partneri.find(x => x.id === id); if (!p) continue;
    if (!p.adresa || !p.mesto) upoz.push(`${p.naziv}: adresa nije potpuna`);
    if (!p.pib && p.tip !== 'FIZICKO') upoz.push(`${p.naziv}: nema PIB`);
  }
  zatvoriFioku();
  const z = document.createElement('div');
  z.className = 'zavesa'; z.id = 'fioka';
  z.innerHTML = `<aside class="fioka" role="dialog" aria-modal="true" aria-labelledby="di-naslov" style="width:min(860px,100%)">
    <header><h2 id="di-naslov">Fakturiši ${ids.length > 1 ? 'izabrane naloge' : `nalog ${esc(nal[0]?.broj || '')}`}</h2>
      <div class="pod">Izdaju se fakture definisane uz stavke. Dospeće = datum fakture + rok plaćanja nalogodavca.</div></header>
    <div class="telo" id="di-telo">
      <div class="forma">
        <label class="polje"><span>Datum fakture</span><input id="di-datum" type="date" value="${stanje.datum}"></label>
        <label class="polje"><span>Datum prometa</span><input id="di-prometa" type="date"><small>Prazno = datum istovara naloga.</small></label>
        ${imaDevize ? '<label class="polje"><span>Kurs za fakture u dinarima</span><input id="di-kurs" type="number" step="0.0001" placeholder="kurs iz naloga"><small>Prazno = kurs upisan uz stavku. Iznosi u dinarima se ne menjaju.</small></label>' : ''}
      </div>
      ${ids.length > 1 ? '<label style="display:flex;gap:8px;align-items:center;margin:8px 0"><input type="checkbox" id="di-grupno"> Jedna faktura po kupcu (više naloga na istoj fakturi)</label>' : ''}
      ${upoz.length ? `<div class="napomena upozorenje">${upoz.map(esc).join('<br>')}</div>` : ''}
      <div id="di-pregled"></div>
    </div>
    <footer><div class="desno"><button class="dugme" type="button" id="di-otkazi">Otkaži</button><button class="dugme glavno" type="button" id="di-izdaj">Fakturiši</button></div></footer>
  </aside>`;
  document.body.appendChild(z);
  document.addEventListener('keydown', escFioka);
  const crtaj = () => {
    const gr = grupe();
    $('#di-pregled').innerHTML = `<p style="margin:12px 0 6px"><b>Biće izdato ${gr.length} ${mnozina(gr.length, 'faktura', 'fakture', 'faktura')}</b></p>
      <div class="tabela-okvir">${tabelaHTML([
        { l: 'Firma', f: g => esc(firmaKod(g.firma)) },
        { l: 'Vrsta', f: g => esc(sifNaziv('TIP_FAKTURE', g.tip)) },
        { l: 'Kupac', f: g => esc(g.kupac === 'interna' ? 'naša druga firma' : partnerNaziv(g.kupac)) },
        { l: 'Nalozi', f: g => esc([...g.nalozi.values()].map(n => n.broj).join(', ')) },
        { l: 'Osnovica', f: g => novac(g.os, g.valuta), broj: true }
      ], gr, false)}</div>`;
  };
  $('#di-telo').addEventListener('change', e => { if (e.target.id === 'di-grupno') { stanje.grupno = e.target.checked; crtaj(); } });
  $('#di-otkazi').onclick = () => zatvoriFioku(true);
  $('#di-izdaj').onclick = async () => {
    const b = $('#di-izdaj'); b.disabled = true; b.textContent = 'Izdavanje…';
    try {
      const rez = await Store.rpc('fakturisi_naloge', { p_nalozi: ids, p_datum: $('#di-datum').value || danas(), p_datum_prometa: $('#di-prometa').value || null,
        p_kurs: $('#di-kurs') && $('#di-kurs').value ? Number($('#di-kurs').value) : null, p_grupno: stanje.grupno });
      await ucitajPartnere();
      $('#di-telo').innerHTML = `<p><b>Fakture su izdate.</b></p><div class="tabela-okvir">${tabelaHTML([
        { l: 'Broj', f: r => `<b>${esc(r.r_broj)}</b>` }, { l: 'Firma', f: r => esc(r.r_firma) }, { l: 'Vrsta', f: r => esc(sifNaziv('TIP_FAKTURE', r.r_tip)) },
        { l: 'Kupac', f: r => esc(r.r_kupac) }, { l: 'Iznos', f: r => novac(r.r_ukupno, r.r_valuta), broj: true }], rez || [], false)}</div>`;
      $('#fioka footer').innerHTML = '<div class="desno"><button class="dugme" type="button" id="di-stampa-sve">Štampaj sve</button><button class="dugme glavno" type="button" id="di-zatvori">Zatvori</button></div>';
      $('#di-stampa-sve').onclick = () => stampajFakture((rez || []).map(r => r.r_id));
      $('#di-zatvori').onclick = async () => { zatvoriFioku(true); if (op.posle) await op.posle(); osveziListu(); };
      fiokaIzmenjena = false;
    } catch (e) { b.disabled = false; b.textContent = 'Fakturiši'; poruka(prevediGresku(e), true); }
  };
  crtaj();
}

function fakturaHTML(f, stavke) {
  // Jezik dokumenta: EUR i interna faktura slovenačke firme – slovenački / engleski;
  // ostale – srpski, a za kupca iz druge države srpski / engleski.
  const dKu = drzavaKod(f.kupac?.drzava), dIz = drzavaKod(f.izdavalac?.drzava);
  const jezik = ['EUR', 'INTERNA'].includes(f.tip) && dIz === 'SI' ? 'sl-en'
    : (f.tip === 'INO' || (['RSD', 'EUR', 'GOTOVINSKA', 'INTERNA'].includes(f.tip) && !!dKu && !!dIz && dKu !== dIz)) ? 'sr-en' : 'sr';
  const sl = jezik === 'sl-en';
  const L = (sr, eng, slo) => (jezik === 'sr' ? sr : `${sl ? (slo ?? sr) : sr} / <i>${eng}</i>`);
  const iz = f.izdavalac || {}, ku = f.kupac || {};
  const adresa = o => [o.adresa, [o.postanski_broj, o.mesto].filter(Boolean).join(' '), o.drzava].filter(Boolean).map(esc).join('<br>');
  const ident = o => [o.pib && `${sl ? 'Davčna številka' : 'PIB'}: ${esc(o.pib)}`, o.maticni_broj && `${sl ? 'Matična številka' : 'MB'}: ${esc(o.maticni_broj)}`,
    o.pdv_broj && `${sl ? 'ID za DDV / VAT ID' : 'PDV/VAT ID'}: ${esc(o.pdv_broj)}`].filter(Boolean).join('<br>');
  const PDV = sl ? 'DDV' : 'PDV';
  const rekap = {};
  stavke.forEach(s => { const k = Number(s.pdv_stopa); (rekap[k] ||= { os: 0, pdv: 0 }); rekap[k].os += Number(s.osnovica); rekap[k].pdv += Number(s.pdv); });
  const stope = Object.keys(rekap).map(Number).sort((a, b) => a - b);
  const drzIz = drzavaKod(iz.drzava);
  const pdvTekst = f.pdv_napomene ? f.pdv_napomene.split('\n').filter(Boolean)
    : [...new Set(stavke.map(s => pdvRedZaDrzavu(s.pdv_kod ?? kodPoStopi(s.pdv_stopa, drzIz), s.pdv_stopa, drzIz)?.oznaka).filter(Boolean))];
  const got = f.tip === 'GOTOVINSKA';
  const stariGot = got && f.broj_seq == null;   // gotovinska iz verzije pre 2.5 (bez rednog broja)
  // interna faktura se štampa kao obična faktura (naslov bez reči „interna“)
  const naslov = got ? (stariGot ? 'GOTOVINSKI RAČUN' : 'GOTOVINSKA FAKTURA') : 'FAKTURA';
  return `<section class="faktura">

        <table class="datumi">
          <tr><td>${L('Datum izdavanja', 'Issue date', 'Datum izdaje')}</td><td>${fmtDatum(f.datum_izdavanja)}</td></tr>
          <tr><td>${L('Datum prometa', 'Date of supply', 'Datum opravljene storitve')}</td><td>${fmtDatum(f.datum_prometa)}</td></tr>
          <tr><td>${L('Rok plaćanja', 'Due date', 'Rok plačila')}</td><td>${fmtDatum(f.datum_dospeca)}</td></tr>
          ${iz.mesto ? `<tr><td>${L('Mesto izdavanja', 'Place of issue', 'Kraj izdaje')}</td><td>${esc(iz.mesto)}</td></tr>` : ''}
        </table></div>
    </div>
    <div class="kupac"><div class="lbl">${L('Kupac', 'Customer', 'Kupec')}</div><b>${esc(ku.naziv)}</b><br>${adresa(ku)}${ident(ku) ? `<br>${ident(ku)}` : ''}</div>
    ${f.nalogodavac_id && f.nalogodavac_id !== f.klijent_id ? `<p class="platilac">${L('Nalogodavac / platilac', 'Ordering party / payer', 'Naročnik / plačnik')}: <b>${esc(f.nalogodavac_naziv)}</b></p>` : ''}
    <table class="stavke"><thead><tr><th>${L('Rb.', 'No.', 'Zap.')}</th><th>${L('Opis', 'Description', 'Opis')}</th><th class="b">${L('Kol.', 'Qty', 'Kol.')}</th><th>${L('JM', 'Unit', 'EM')}</th>
      <th class="b">${L('Cena', 'Price', 'Cena')}</th><th class="b">${L('Osnovica', 'Net', 'Osnova')}</th><th class="b">${L(`${PDV} %`, 'VAT %', `${PDV} %`)}</th><th class="b">${L(PDV, 'VAT', PDV)}</th><th class="b">${L('Ukupno', 'Total', 'Skupaj')}</th></tr></thead>

    <table class="zbir">

      <tr><td>${L('Ukupan PDV', 'Total VAT', 'Skupaj DDV')}</td><td class="b">${fmtBroj(f.pdv)}</td></tr>

async function stampajFakture(ids) {
  const w = window.open('', '_blank');
  if (!w) return poruka('Pregledač je blokirao novi prozor. Dozvolite iskačuće prozore za ovu adresu i pokušajte ponovo.', true);
  w.document.write('<p style="font:16px Arial,sans-serif;padding:24px">Priprema za štampu…</p>');
  try {
    const [fak, st] = await Promise.all([
      Store.lista('v_fakture', { filteri: [['in', 'id', ids]] }),
      Store.lista('faktura_stavke', { filteri: [['in', 'faktura_id', ids]], red: 'rb' })]);
    const za = fak.filter(f => f.izvor !== 'ZADUZENJE').sort((a, b) => String(a.broj).localeCompare(String(b.broj)));
    if (!za.length) { w.close(); return poruka('Zaduženja (početna stanja) se ne štampaju kao fakture.', true); }
    w.document.open();
    w.document.write(`<!doctype html><html lang="sr-Latn"><head><meta charset="utf-8"><title>${esc(za.length === 1 ? za[0].broj : `Fakture (${za.length})`)}</title><style>${CSS_STAMPA}</style></head>

      ${za.map(f => fakturaHTML(f, st.filter(s => s.faktura_id === f.id))).join('')}</body></html>`);

}

    <table class="tbl-nalog"><thead><tr><th></th><th>Datum</th><th>Mesto</th></tr></thead><tbody>

      ${t ? `<tr><th>Vozilo / prikolica</th><td>${esc([t.registracija, t.prikolica_registracija].filter(Boolean).join(' / '))}</td></tr>
      <tr><th>Vozač</th><td>${esc([t.vozac, t.vozac2].filter(Boolean).join(', '))}</td></tr>` : ''}</tbody></table>
    <table class="stavke"><thead><tr><th>Rb.</th><th>Opis</th><th>Teret / VIN</th><th class="b">Kol.</th><th>JM</th><th class="b cena">Cena</th><th class="b cena">Iznos</th></tr></thead>
      <tbody>${stavke.map((s, i) => `<tr><td>${i + 1}</td><td>${esc(s.opis)}</td><td>${esc(s.teret || (i === 0 ? n.opis_tereta || '' : ''))}</td>
        <td class="b">${fmtBroj(s.kolicina, Number(s.kolicina) % 1 ? 2 : 0)}</td><td>${esc(sifNaziv('JEDINICA', s.jedinica))}</td>

// Nalozi bez ture (ili iz druge ture) → izabrana tura, jednim klikom
async function dijalogUTuru(ids, vid = []) {
  let ture;
  try { ture = await Store.lista('v_ture', { red: 'created_at', opadajuce: true }); } catch (e) { return poruka(prevediGresku(e), true); }
  const otvorene = ture.filter(t => !['ZAVRSENA', 'OBRACUNATA'].includes(t.status)), zavrsene = ture.filter(t => t.status === 'ZAVRSENA');
  if (!ture.length) return poruka('Još nema tura. Napravite turu (Ture → Nova tura), pa dodelite naloge.', true);
  const opis = t => [t.broj, t.relacija, t.registracija, t.vozac, t.datum_od && fmtDatum(t.datum_od)].filter(Boolean).join(' – ');
  const vecImaju = vid.filter(n => ids.includes(n.id) && n.tura_id).length;
  zatvoriFioku();
  const z = document.createElement('div');
  z.className = 'zavesa'; z.id = 'fioka';
  z.innerHTML = `<aside class="fioka" role="dialog" aria-modal="true" aria-labelledby="ut-naslov" style="width:min(560px,100%)">
    <header><h2 id="ut-naslov">Dodaj naloge u turu</h2><div class="pod">Izabrano naloga: ${ids.length}${vecImaju ? ` – ${vecImaju} već ima turu i biće premešten` : ''}</div></header>
    <form class="telo" id="ut-forma" novalidate><div class="forma" style="grid-template-columns:1fr">
      <label class="polje"><span>Tura <i>*</i></span><select id="ut-tura"><option value="" disabled selected>Izaberite turu…</option>
        ${otvorene.length ? `<optgroup label="Otvorene ture">${otvorene.map(t => `<option value="${t.id}">${esc(opis(t))}</option>`).join('')}</optgroup>` : ''}
        ${zavrsene.length ? `<optgroup label="Završene ture">${zavrsene.map(t => `<option value="${t.id}">${esc(opis(t))}</option>`).join('')}</optgroup>` : ''}</select></label>
      <p class="tekst-2" style="margin:0">Obračunate ture se ne nude. Relacija ture se posle dodele sama dopunjuje mestima utovara i istovara.</p></div></form>
    <footer><div class="desno"><button class="dugme" id="ut-otkazi" type="button">Otkaži</button><button class="dugme glavno" id="ut-primeni" type="button">Dodaj u turu</button></div></footer></aside>`;
  document.body.appendChild(z);
  document.addEventListener('keydown', escFioka);
  $('#ut-otkazi').onclick = () => zatvoriFioku();
  $('#ut-primeni').onclick = async () => {
    const tura = $('#ut-tura').value;
    if (!tura) return poruka('Izaberite turu.', true);
    const b = $('#ut-primeni'); b.disabled = true;
    try {
      const n = await Store.izmeniVise('nalozi', ids, { tura_id: tura });
      zatvoriFioku();
      poruka(`Dodato u turu ${ture.find(t => t.id === tura)?.broj || ''}: ${n} ${mnozina(n, 'nalog', 'naloga', 'naloga')}.`);
      LISTE_STANJE.nalozi?.izabrani.clear(); await osveziListu();
    } catch (e) { b.disabled = false; poruka(prevediGresku(e), true); }
  };
}

const MESECI = ['Januar', 'Februar', 'Mart', 'April', 'Maj', 'Jun', 'Jul', 'Avgust', 'Septembar', 'Oktobar', 'Novembar', 'Decembar'];
const IZV = { tab: 'pregled', godina: new Date().getFullYear(), firma: '', period: 'OVAJ_MESEC', od: '', do: '', vozac: '', izabrani: null };
[IZV.od, IZV.do] = opsegPerioda(IZV.period);
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const TABELE_KOPIJA = ['firme', 'sifarnici', 'profili', 'partneri', 'partner_kontakti', 'vozila', 'vozaci', 'rokovi', 'dokumenti', 'ture', 'nalozi',
  'nalog_stavke', 'nalog_fakture', 'tura_troskovi', 'obracun_vozaca', 'fakture', 'faktura_stavke', 'naplate', 'ulazni_racuni', 'ulazni_placanja', 'dopisi', 'posta_log', 'kasa', 'kartica_nalozi', 'vozila_amortizacija'];

function ucitajSkriptu(src, globalno) {
  return new Promise((ok, ne) => {
    if (window[globalno]) return ok();
    const s = document.createElement('script');
    s.src = src; s.onload = () => ok(); s.onerror = () => ne(new Error('Biblioteka za Excel nije učitana. Proverite internet vezu.'));
    document.head.appendChild(s);
  });
}

async function prikaziIzvestaje() {
  ugasiGrafikone();
  const tabovi = [['pregled', 'Pregled poslovanja'], ['rezultat', 'Rezultat po mesecima'], ['vozaci', 'Obračun vozača']].concat(ima(['ADMIN']) ? [['kopija', 'Rezervna kopija']] : []);
  if (!tabovi.some(t => t[0] === IZV.tab)) IZV.tab = 'pregled';
  postaviSadrzaj(`<div class="zaglavlje"><div><h1>Izveštaji</h1>
      <p>Upravljački pregledi u EUR. Ture po vozilu ili vozaču: Ture → grupisanje. Fakture po vrsti, klijentu i naplati: Potraživanja.</p></div>
      <button class="dugme no-print" id="izv-stampa">Štampaj</button></div>
    <div class="alati"><div class="segmenti" id="izv-tab">${tabovi.map(([v, t]) => `<button data-v="${v}" class="${IZV.tab === v ? 'aktivan' : ''}">${t}</button>`).join('')}</div></div>
    <div id="izv"><div class="prazno">Učitavanje…</div></div>`);
  $$('#izv-tab button').forEach(b => b.onclick = () => { IZV.tab = b.dataset.v; prikaziIzvestaje(); });
  $('#izv-stampa').onclick = () => window.print();
  const el = $('#izv');
  try {
    if (IZV.tab === 'pregled') await izvPregled(el);
    else if (IZV.tab === 'rezultat') await izvRezultat(el);
    else if (IZV.tab === 'vozaci') await izvVozaci(el);
    else izvKopija(el);
  } catch (e) { el.innerHTML = `<div class="prazno"><b>Izveštaj nije učitan</b>${esc(prevediGresku(e))}</div>`; }
}

async function izvRezultat(el) {
  const [fak, ul, tr, ob, ture, ost] = await Promise.all([
    Store.lista('v_fakture', { filteri: [['in', 'izvor', ['NALOG', 'RUCNA']], ['eq', 'status', 'IZDATA']] }),
    Store.lista('v_ulazni_racuni'), Store.lista('tura_troskovi'), Store.lista('obracun_vozaca'), Store.lista('ture'), ostaloRezultata()]);
  const turaFirma = new Map(ture.map(t => [t.id, t.firma_id]));
  const vozacFirma = new Map((S.vozaci || []).map(v => [v.id, v.firma_id]));
  const interni = new Set(S.partneri.filter(p => p.interna_firma_id).map(p => p.id));
  const godine = new Set([IZV.godina, new Date().getFullYear()]);
  [...fak.map(f => f.datum_prometa || f.datum_izdavanja), ...ul.map(u => u.datum)].forEach(d => d && godine.add(Number(String(d).slice(0, 4))));
  const m = Array.from({ length: 12 }, () => ({ p: 0, u: 0, t: 0, v: 0 }));
  const mesec = (d, firma) => (!d || Number(String(d).slice(0, 4)) !== IZV.godina || (IZV.firma && firma !== IZV.firma)) ? null : m[Number(String(d).slice(5, 7)) - 1];
  for (const f of fak) {
    const eur = Number(f.osnovica) / (f.valuta === 'EUR' ? 1 : Number(f.kurs)), d = f.datum_prometa || f.datum_izdavanja;
    if (f.tip === 'INTERNA') {
      if (!IZV.firma) continue;
      const prima = S.partneri.find(p => p.id === f.klijent_id)?.interna_firma_id, y = prima === IZV.firma ? mesec(d, prima) : null;
      if (y) y.u += eur;
    }
    const x = mesec(d, f.firma_id); if (x) x.p += eur;
  }
  for (const u of ul) { if (!IZV.firma && interni.has(u.dobavljac_id)) continue; const x = mesec(u.datum, u.firma_id); if (x) x.u += Number(u.bez_pdv_eur); }
  for (const t of tr) { if (t.ulazni_racun_id) continue; const x = mesec(t.datum, turaFirma.get(t.tura_id)); if (x) x.t += Number(t.iznos_eur); }
  for (const o of ob) { if (!o.u_trosak) continue; const x = mesec(o.datum, o.tura_id ? turaFirma.get(o.tura_id) : vozacFirma.get(o.vozac_id)); if (x) x.v += (o.znak || 1) * Number(o.iznos_eur); }
  for (const o of ost) { const x = mesec(o.datum, o.firma_id); if (x) { if (o.vrsta === 'PRIHOD') x.p += o.eur; else x.u += o.eur; } }
  const redovi = m.map((x, i) => ({ mesec: MESECI[i], ...x, r: x.p - x.u - x.t - x.v }));
  const uk = redovi.reduce((s, x) => ({ mesec: 'Ukupno', p: s.p + x.p, u: s.u + x.u, t: s.t + x.t, v: s.v + x.v, r: s.r + x.r }), { p: 0, u: 0, t: 0, v: 0, r: 0 });
  const iznos = v => (Math.abs(v) < 0.005 ? '<span class="tekst-2">–</span>' : fmtBroj(v));
  el.innerHTML = `<div class="filteri">
      <label>Godina<select id="r-godina">${[...godine].sort((a, b) => b - a).map(g => `<option${g === IZV.godina ? ' selected' : ''}>${g}</option>`).join('')}</select></label>
      ${S.firme.length > 1 ? `<label>Firma<select id="r-firma"><option value="">Sve (bez internih faktura)</option>${S.firme.map(f => `<option value="${f.id}"${f.id === IZV.firma ? ' selected' : ''}>${esc(f.kod)}</option>`).join('')}</select></label>` : ''}
      <button class="dugme malo" id="r-csv" type="button">Izvoz u Excel (CSV)</button></div>
    <div class="tabela-okvir"><table><thead><tr><th>Mesec</th><th class="broj">Prihod (fakturisano, bez PDV)</th><th class="broj">Ulazni računi i ostali troškovi (bez PDV)</th>
      <th class="broj">Direktni troškovi tura</th><th class="broj">Obračun vozača</th><th class="broj">Rezultat pre amortizacije</th></tr></thead>
      <tbody>${[...redovi, uk].map(x => `<tr${x.mesec === 'Ukupno' ? ' class="ukupno"' : ''}><td>${x.mesec}</td><td class="broj">${iznos(x.p)}</td><td class="broj">${iznos(x.u)}</td>
        <td class="broj">${iznos(x.t)}</td><td class="broj">${iznos(x.v)}</td><td class="broj"><b class="${x.r < -0.005 ? 'minus' : ''}">${iznos(x.r)}</b></td></tr>`).join('')}</tbody></table></div>
    <p class="tekst-2" style="max-width:80ch;margin-top:12px">Iznosi su u EUR po kursu sa dokumenta. Prihod je osnovica faktura izdatih iz naloga po datumu prometa (bez zaduženja i storniranih). Troškovi ture koji su povezani sa ulaznim računom računaju se samo kroz ulazni račun. Akontacije, povraćaji i isplate vozačima nisu trošak. Troškovi plaćeni iz kase bez ture i ručni nalozi na kartice troškova su u koloni ulaznih računa i ostalih troškova, a ostali prihodi iz kase i ručnih naloga u prihodu. Amortizacija vozila nije uključena – rezultat sa amortizacijom je u Finansije → Bilans uspeha (red „Rezultat pre amortizacije“ tamo je isti kao ovde). Ovo je upravljački pregled, ne zamena za knjigovodstveni bilans.</p>`;
  $('#r-godina').onchange = e => { IZV.godina = Number(e.target.value); prikaziIzvestaje(); };
  if ($('#r-firma')) $('#r-firma').onchange = e => { IZV.firma = e.target.value; prikaziIzvestaje(); };
  const gp = document.createElement('div');
  gp.className = 'grafici'; gp.style.marginBottom = '16px';
  gp.innerHTML = panel('g-rezultat', `Prihod, troškovi i rezultat ${IZV.godina}`, `Ukupan rezultat: ${fmtBroj(uk.r, 0)} EUR.`, true);
  el.insertBefore(gp, el.querySelector('.tabela-okvir'));
  grafikonMeseci($('#g-rezultat'), redovi);
  $('#r-csv').onclick = () => izvozCSV(`rezultat_${IZV.godina}.csv`, [['Mesec', 'mesec'], ['Prihod EUR', x => csvBroj(x.p)], ['Ulazni računi i ostali troškovi EUR', x => csvBroj(x.u)],
    ['Direktni troškovi tura EUR', x => csvBroj(x.t)], ['Obračun vozača EUR', x => csvBroj(x.v)], ['Rezultat pre amortizacije EUR', x => csvBroj(x.r)]], [...redovi, uk]);
}

  const vrste = S.sif.VRSTA_OBRACUNA || [];
  const uSvi = ob.filter(o => (!IZV.vozac || o.vozac_id === IZV.vozac) && (!IZV.firma || vozacFirma.get(o.vozac_id) === IZV.firma));
  const u = uSvi.filter(o => (!IZV.od || o.datum >= IZV.od) && (!IZV.do || o.datum <= IZV.do));
  const van = uSvi.length - u.length, poslednji = uSvi.reduce((m, o) => (o.datum > m ? o.datum : m), '');
  const perTekst = `${IZV.od ? fmtDatum(IZV.od) : 'od početka'} – ${IZV.do ? fmtDatum(IZV.do) : 'danas'}`;
  const brzi = `<div class="alati" style="justify-content:center;margin:10px 0 0"><button class="dugme malo" type="button" data-per="OVAJ_MESEC">Ovaj mesec</button><button class="dugme malo" type="button" data-per="PROSLI_MESEC">Prošli mesec</button><button class="dugme malo" type="button" data-per="">Ceo period</button></div>`;

      <button class="dugme malo" id="v-csv" type="button">Izvoz stavki (CSV)</button>

        { l: 'Vrsta', f: o => esc(sifNaziv('VRSTA_OBRACUNA', o.vrsta)) },
        { l: 'Opis', k: 'opis' },
        { l: 'Obračun', f: o => `${fmtBroj(o.kolicina, Number(o.kolicina) % 1 ? 2 : 0)} × ${fmtBroj(o.iznos_jed)}`, broj: true },
        { l: 'Iznos', f: o => `<span class="${o.znak < 0 ? 'minus' : ''}">${o.znak < 0 ? '−' : ''}${novac(o.iznos, o.valuta)}</span>`, broj: true },
        { l: 'EUR', f: o => sZnakom(eur(o)), broj: true }
      ], st, moze)}</div>
      <table class="saldo-vozaca"><tbody>
        <tr><td>Zarada, dnevnice i dodaci</td><td class="broj">${fmtBroj(plus)} EUR</td></tr>
        <tr><td>Zaduženja, odbici, akontacije i isplate</td><td class="broj minus">${minus ? `−${fmtBroj(-minus)}` : fmtBroj(0)} EUR</td></tr>
        <tr class="ukupno"><td>Za isplatu (saldo)</td><td class="broj"><b>${sZnakom(izabran.uk)} EUR</b></td></tr></tbody></table>
      <div class="potpis-red"><div>Obračunao</div><div>Vozač</div></div>`;
    if ($('#v-rucno-vozac')) $('#v-rucno-vozac').onclick = () => dijalogStavkeVozaca({ vozacId: izabran.id, posle: posleUnosa });
    if (moze) veziKlikove($('#v-detalj'), st, o => (o.kasa_id ? poruka('Isplata ili uplata kroz kasu – menja se u Kasi (Finansije → Kasa).', true) : o.tura_id
      ? poruka(`Stavka je vezana za turu ${turaBroj.get(o.tura_id) || ''} – menja se u turi, kartica „Obračun vozača“${o.auto_km ? ' (red po km se računa sam iz km ture)' : ''}.`, true)
      : dijalogStavkeVozaca({ stavka: o, posle: posleUnosa })));
  }
}

// Ručna stavka obračuna vozača bez ture (dodatak / zaduženje) – unos i izmena iz izveštaja „Obračun vozača“
function dijalogStavkeVozaca({ vozacId = '', stavka = null, posle }) {
  const vrste = (S.sif.VRSTA_OBRACUNA || []).filter(v => (v.aktivan !== false || v.kod === stavka?.vrsta) && !KASA_OBRACUN.includes(v.kod));
  const d0 = danas(), uPeriodu = (!IZV.od || d0 >= IZV.od) && (!IZV.do || d0 <= IZV.do);
  const datum = stavka?.datum || (uPeriodu ? d0 : (IZV.do || d0));       // datum u izabranom periodu – stavka se odmah vidi
  const vrsta = stavka?.vrsta || (vrste.some(v => v.kod === 'DODATAK') ? 'DODATAK' : vrste[0]?.kod);
  const iznos = stavka ? Math.round(Number(stavka.kolicina) * Number(stavka.iznos_jed) * 100) / 100 : '';
  const vozaci = (S.vozaci || []).filter(v => v.aktivan !== false || v.id === (stavka?.vozac_id || vozacId));
  const opc = (lista, izabran) => lista.map(([v, t]) => `<option value="${esc(v)}"${String(v) === String(izabran ?? '') ? ' selected' : ''}>${esc(t)}</option>`).join('');
  zatvoriFioku();
  const z = document.createElement('div');
  z.className = 'zavesa'; z.id = 'fioka';
  z.innerHTML = `<aside class="fioka" role="dialog" aria-modal="true" aria-labelledby="sv-naslov" style="width:min(560px,100%)">
    <header><h2 id="sv-naslov">${stavka ? 'Izmena stavke obračuna' : 'Dodatak ili zaduženje vozača'}</h2>
      <div class="pod">Stavka nije vezana za turu. Ulazi u obračunski list vozača i u iznos za isplatu.</div></header>
    <form class="telo" id="sv-forma" novalidate><div class="forma">
      <label class="polje puno"><span>Vozač <i>*</i></span><select name="vozac_id">${stavka || vozacId ? '' : '<option value="" disabled selected>Izaberite vozača…</option>'}${opc(vozaci.map(v => [v.id, `${v.prezime} ${v.ime}`]), stavka?.vozac_id || vozacId)}</select></label>
      <label class="polje"><span>Vrsta <i>*</i></span><select name="vrsta">${opc(vrste.map(v => [v.kod, v.naziv]), vrsta)}</select><small class="tekst-2" id="sv-znak"></small></label>
      <label class="polje"><span>Datum <i>*</i></span><input type="date" name="datum" value="${esc(datum)}"><small class="tekst-2">Određuje period obračuna.</small></label>
      <label class="polje"><span>Iznos <i>*</i></span><input type="number" name="iznos" step="0.01" min="0" value="${esc(iznos)}"><small class="tekst-2">Bez znaka – vrsta određuje da li se dodaje ili oduzima.</small></label>
      <label class="polje"><span>Valuta</span><select name="valuta">${opc(sifOpcije('VALUTA').map(o => [o.v, o.v]), stavka?.valuta || 'EUR')}</select></label>
      <label class="polje"><span>Kurs (1 EUR = …)</span><input type="number" name="kurs" step="0.0001" value="${esc(stavka?.kurs ?? 1)}"></label>
      <label class="polje puno"><span>Opis <i>*</i></span><input type="text" name="opis" value="${esc(stavka?.opis || '')}" placeholder="npr. Nagrada za oktobar, Šteta na retrovizoru, Pozajmica" autocomplete="off"></label>
    </div></form>
    <footer>${stavka ? '<button class="dugme opasno" id="sv-obrisi" type="button">Obriši</button>' : ''}<div class="desno"><button class="dugme" id="sv-otkazi" type="button">Otkaži</button><button class="dugme glavno" id="sv-sacuvaj" type="button">Sačuvaj</button></div></footer></aside>`;
  document.body.appendChild(z);
  document.addEventListener('keydown', escFioka);
  const f = $('#sv-forma', z), pol = n => f.querySelector(`[name="${n}"]`);
  const znak = () => {
    const v = vrste.find(x => x.kod === pol('vrsta').value);
    $('#sv-znak').textContent = Number(v?.vrednost ?? 1) < 0 ? 'Umanjuje iznos za isplatu (−).' : 'Uvećava iznos za isplatu (+).';
  };
  f.addEventListener('change', e => { fiokaIzmenjena = true; kursPoValuti(e, f); if (e.target.name === 'vrsta') znak(); });
  f.addEventListener('input', () => { fiokaIzmenjena = true; });
  uskladiKurs(f); znak();
  (stavka ? pol('iznos') : pol(vozacId ? 'vrsta' : 'vozac_id')).focus();
  $('#sv-otkazi').onclick = () => zatvoriFioku(true);
  $('#sv-sacuvaj').onclick = async () => {
    const r = { vozac_id: pol('vozac_id').value, vrsta: pol('vrsta').value, datum: pol('datum').value, opis: pol('opis').value.trim(),
      iznos: Number(String(pol('iznos').value).replace(',', '.')), valuta: pol('valuta').value, kurs: Number(String(pol('kurs').value).replace(',', '.')) || 1 };
    if (!r.vozac_id) return poruka('Izaberite vozača.', true);
    if (!r.vrsta || !r.datum) return poruka('Izaberite vrstu i datum.', true);
    if (!(r.iznos > 0)) return poruka('Upišite iznos veći od nule (bez znaka – vrsta određuje da li se dodaje ili oduzima).', true);
    if (!r.opis) return poruka('Upišite opis (npr. razlog zaduženja ili dodatka).', true);
    const red = { vozac_id: r.vozac_id, vrsta: r.vrsta, datum: r.datum, opis: r.opis, kolicina: 1, iznos_jed: r.iznos, valuta: r.valuta, kurs: r.valuta === 'EUR' ? 1 : r.kurs };
    const b = $('#sv-sacuvaj'); b.disabled = true;
    try {
      if (stavka) await Store.izmeni('obracun_vozaca', stavka.id, red);
      else await Store.dodaj('obracun_vozaca', { ...red, tura_id: null });
      fiokaIzmenjena = false; zatvoriFioku();
      poruka(stavka ? 'Stavka je izmenjena.' : 'Stavka je dodata u obračun vozača.');
      if (posle) await posle(r);
    } catch (e) { b.disabled = false; poruka(prevediGresku(e), true); }
  };
  if (stavka) $('#sv-obrisi').onclick = async () => {
    if (!confirm(`Obrisati stavku „${stavka.opis || sifNaziv('VRSTA_OBRACUNA', stavka.vrsta)}“?`)) return;
    try { await Store.obrisi('obracun_vozaca', stavka.id); fiokaIzmenjena = false; zatvoriFioku(); poruka('Stavka je obrisana.'); if (posle) await posle({ vozac_id: stavka.vozac_id }); }
    catch (e) { poruka(prevediGresku(e), true); }
  };
}

function izvKopija(el) {
  el.innerHTML = `<div class="napomena">Preuzima sve podatke iz baze u jedan Excel fajl – svaka tabela na posebnom listu. Skenirani dokumenti nisu u fajlu; ostaju u Supabase skladištu.
      Preporuka: jednom nedeljno, fajl čuvajte van ovog računara.</div>
    <button class="dugme glavno" id="kopija">Preuzmi rezervnu kopiju (Excel)</button>
    <p class="tekst-2" id="kopija-status" role="status" style="margin-top:10px"></p>`;
  $('#kopija').onclick = async () => {
    const b = $('#kopija'), s = $('#kopija-status'); b.disabled = true;
    try {
      s.textContent = 'Učitavanje Excel biblioteke…';
      await ucitajSkriptu(XLSX_URL, 'XLSX');
      const wb = window.XLSX.utils.book_new();
      let ukupno = 0;
      for (const t of TABELE_KOPIJA) {
        s.textContent = `Preuzimanje: ${t}…`;
        const sirovi = await Store.lista(t).catch(e => { if (t === 'vozila_amortizacija' && nemaTabele(e)) return null; throw e; });
        if (!sirovi) continue;
        const redovi = sirovi.map(r => Object.fromEntries(Object.entries(r).map(([k, v]) => [k, v !== null && typeof v === 'object' ? JSON.stringify(v) : v])));
        ukupno += redovi.length;
        window.XLSX.utils.book_append_sheet(wb, window.XLSX.utils.json_to_sheet(redovi.length ? redovi : [{ prazno: '' }]), t.slice(0, 31));
      }
      window.XLSX.writeFile(wb, `balkan_tms_kopija_${danas()}.xlsx`);
      s.textContent = `Gotovo: ${TABELE_KOPIJA.length} tabela, ${ukupno} zapisa.`;
      poruka('Rezervna kopija je preuzeta.');
    } catch (e) { s.textContent = ''; poruka(prevediGresku(e), true); }
    finally { b.disabled = false; }
  };
}

const H2C_URL = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
const JSPDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
const DRZAVE = { srbija: 'RS', slovenija: 'SI', hrvatska: 'HR', austrija: 'AT', nemacka: 'DE', italija: 'IT', madjarska: 'HU',
  'bosna i hercegovina': 'BA', bih: 'BA', 'crna gora': 'ME', 'severna makedonija': 'MK', makedonija: 'MK', bugarska: 'BG',
  rumunija: 'RO', slovacka: 'SK', ceska: 'CZ', poljska: 'PL', holandija: 'NL', belgija: 'BE', francuska: 'FR', svajcarska: 'CH',
  turska: 'TR', grcka: 'GR', albanija: 'AL', kosovo: 'XK', spanija: 'ES', danska: 'DK', svedska: 'SE', luksemburg: 'LU' };
// Peppol šeme elektronske adrese (PDV broj po državi)
const EAS = { RS: '9948', SI: '9949', HR: '9934', DE: '9930', AT: '9914', IT: '9906', HU: '9910', BA: '9924', ME: '9941', MK: '9942',
  BG: '9926', CZ: '9929', SK: '9950', PL: '9945', NL: '9944', BE: '9925', FR: '9957', ES: '9920', GR: '9933', RO: '9947', LU: '9938', CH: '9927', TR: '9952', AL: '9923' };
const JM_UNECE = { KOM: 'H87', VOZILO: 'H87', TURA: 'C62', KM: 'KMT', DAN: 'DAY', SAT: 'HUR', PAUSAL: 'C62' };
const drzavaKod = naziv => {
  const n = bezKvacica(naziv).trim().replace(/^republika\s+/, '');
  if (/^[a-z]{2}$/.test(n)) return n.toUpperCase();
  return DRZAVE[n] || '';
};
const xmlEsc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c]));
const iz2 = n => Number(n || 0).toFixed(2);
const samoCifre = v => String(v || '').replace(/\D/g, '');

function pdvKat(s, drz = '') {
  const r = pdvRedZaDrzavu(s.pdv_kod ?? kodPoStopi(s.pdv_stopa, drz), s.pdv_stopa, drz);
  const stopa = Number(s.pdv_stopa || 0);
  return { kat: (r?.dodatno?.kat || (stopa > 0 ? 'S' : '')).toUpperCase(), stopa, osnov: r?.dodatno?.osnov || '', razlog: r?.oznaka || r?.naziv || '', naziv: r?.naziv || fmtStopa(stopa) };
}
const profilFakture = f => (drzavaFirme({ drzava: f.izdavalac?.drzava }) === 'RS' ? 'SEF' : 'PEPPOL');
const sefPrimenljiv = f => drzavaFirme({ drzava: f.izdavalac?.drzava }) === 'RS' && drzavaKod(f.kupac?.drzava || 'Srbija') === 'RS'
  && f.kupac?.tip !== 'FIZICKO' && samoCifre(f.kupac?.pib).length === 9;

function proveraUbl(f, stavke, profil) {
  const g = [], iz = f.izdavalac || {}, ku = f.kupac || {};
  if (f.izvor === 'ZADUZENJE') return ['Zaduženje (početno stanje) nije faktura.'];
  if (f.tip === 'GOTOVINSKA') return ['Gotovinska faktura se ne šalje.'];
  if (!stavke.length) g.push('Faktura nema stavke.');
  if (profil === 'SEF') {
    if (f.valuta !== 'RSD') g.push('U SEF se iz programa šalju fakture u dinarima (RSD). Fakturu u stranoj valuti unesite ručno u SEF portalu.');
    if (samoCifre(iz.pib).length !== 9) g.push('Naša firma: PIB mora imati 9 cifara (Naše firme).');
    if (!samoCifre(iz.maticni_broj)) g.push('Naša firma: nedostaje matični broj (Naše firme).');
    if (samoCifre(ku.pib).length !== 9) g.push(`Kupac ${ku.naziv || ''}: PIB mora imati 9 cifara.`);
  } else {
    if (f.valuta !== 'EUR') g.push('E-račun (Peppol) iz programa se pravi samo za fakture u EUR.');
    if (!(iz.pdv_broj || iz.pib)) g.push('Naša firma: nedostaje PDV / davčna številka (Naše firme).');
    if (!drzavaKod(iz.drzava)) g.push('Naša firma: država nije prepoznata (upišite npr. „Slovenija“).');
    if (!drzavaKod(ku.drzava)) g.push(`Kupac ${ku.naziv || ''}: država nije prepoznata (upišite npr. „Austrija“ ili dvoslovni kod AT).`);
  }
  if (!ku.adresa || !ku.mesto) g.push(`Kupac ${ku.naziv || ''}: adresa nije potpuna.`);
  const bez = new Set();
  for (const s of stavke) { const k = pdvKat(s, drzavaKod(iz.drzava)); if (!k.kat || (k.kat !== 'S' && !k.osnov)) bez.add(k.naziv); }
  bez.forEach(n => g.push(`PDV stopa „${n}“ nema kategoriju ili šifru osnova – upišite ih u Šifarnici → PDV stope (podatke daje knjigovođa).`));
  return g;
}

function ublFaktura(f, stavke, profil) {
  const sef = profil === 'SEF', val = f.valuta, c = `currencyID="${xmlEsc(val)}"`;
  const iz = f.izdavalac || {}, ku = f.kupac || {};
  const dIz = drzavaKod(iz.drzava) || (sef ? 'RS' : ''), dKu = drzavaKod(ku.drzava) || (sef ? 'RS' : '');
  const pdvId = (o, d) => {
    const v = String(o.pdv_broj || o.pib || '').replace(/[\s.-]/g, '').toUpperCase();
    if (!v) return '';
    return /^[A-Z]{2}/.test(v) ? v : d + v;
  };
  const strana = (o, d, prodavac) => {
    let endpoint;
    if (sef) endpoint = `<cbc:EndpointID schemeID="9948">${xmlEsc(samoCifre(o.pib))}</cbc:EndpointID>`;
    else {
      const vat = pdvId(o, d), eas = EAS[d];
      const mejl = prodavac ? o.email : (o.email_fakture || o.email);
      endpoint = vat && eas ? `<cbc:EndpointID schemeID="${eas}">${xmlEsc(vat)}</cbc:EndpointID>` : `<cbc:EndpointID schemeID="EM">${xmlEsc(mejl || '')}</cbc:EndpointID>`;
    }
    const vat = sef ? (o.pib ? 'RS' + samoCifre(o.pib) : '') : pdvId(o, d);
    const imaPdv = sef ? (prodavac || o.pdv_obveznik !== false) : (prodavac || o.tip !== 'FIZICKO');
    const mejl = prodavac ? o.email : (o.email_fakture || o.email);
    return `<cac:Party>${endpoint}
      <cac:PartyName><cbc:Name>${xmlEsc(o.naziv)}</cbc:Name></cac:PartyName>
      <cac:PostalAddress>${o.adresa ? `<cbc:StreetName>${xmlEsc(o.adresa)}</cbc:StreetName>` : ''}${o.mesto ? `<cbc:CityName>${xmlEsc(o.mesto)}</cbc:CityName>` : ''}${o.postanski_broj ? `<cbc:PostalZone>${xmlEsc(o.postanski_broj)}</cbc:PostalZone>` : ''}<cac:Country><cbc:IdentificationCode>${xmlEsc(d)}</cbc:IdentificationCode></cac:Country></cac:PostalAddress>
      ${vat && imaPdv ? `<cac:PartyTaxScheme><cbc:CompanyID>${xmlEsc(vat)}</cbc:CompanyID><cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme></cac:PartyTaxScheme>` : ''}
      <cac:PartyLegalEntity><cbc:RegistrationName>${xmlEsc(o.naziv)}</cbc:RegistrationName>${o.maticni_broj ? `<cbc:CompanyID>${xmlEsc(samoCifre(o.maticni_broj) || o.maticni_broj)}</cbc:CompanyID>` : ''}</cac:PartyLegalEntity>
      ${mejl ? `<cac:Contact><cbc:ElectronicMail>${xmlEsc(mejl)}</cbc:ElectronicMail></cac:Contact>` : ''}</cac:Party>`;
  };
  // PDV rekapitulacija po kategoriji, stopi i osnovu
  const grupe = new Map();
  for (const s of stavke) {
    const k = pdvKat(s, dIz), kl = `${k.kat}|${k.stopa}|${k.osnov}`;
    const x = grupe.get(kl) || { ...k, os: 0, pdv: 0 };
    x.os += Number(s.osnovica); x.pdv += Number(s.pdv); grupe.set(kl, x);
  }
  const kategorija = (k, sadOsnovom) => `<cac:TaxCategory><cbc:ID>${xmlEsc(k.kat)}</cbc:ID>${k.kat === 'O' ? '' : `<cbc:Percent>${Number(k.stopa)}</cbc:Percent>`}${sadOsnovom && k.kat !== 'S' && k.osnov ? `<cbc:TaxExemptionReasonCode>${xmlEsc(k.osnov)}</cbc:TaxExemptionReasonCode>` : ''}${sadOsnovom && !sef && k.kat !== 'S' && k.razlog ? `<cbc:TaxExemptionReason>${xmlEsc(k.razlog)}</cbc:TaxExemptionReason>` : ''}<cac:TaxScheme><cbc:ID>VAT</cbc:ID></cac:TaxScheme></cac:TaxCategory>`;
  const racun = sef ? samoCifre(iz.iban).slice(-18) : String(iz.iban || '').replace(/\s/g, '').toUpperCase();
  const os = stavke.reduce((s, x) => s + Number(x.osnovica), 0), pdv = stavke.reduce((s, x) => s + Number(x.pdv), 0);
  return `<?xml version="1.0" encoding="UTF-8"?>
<Invoice xmlns="urn:oasis:names:specification:ubl:schema:xsd:Invoice-2" xmlns:cac="urn:oasis:names:specification:ubl:schema:xsd:CommonAggregateComponents-2" xmlns:cbc="urn:oasis:names:specification:ubl:schema:xsd:CommonBasicComponents-2">
  <cbc:CustomizationID>${sef ? 'urn:cen.eu:en16931:2017#compliant#urn:mfin.gov.rs:srbdt:2022' : 'urn:cen.eu:en16931:2017#compliant#urn:fdc:peppol.eu:2017:poacc:billing:3.0'}</cbc:CustomizationID>
  ${sef ? '' : '<cbc:ProfileID>urn:fdc:peppol.eu:2017:poacc:billing:01:1.0</cbc:ProfileID>'}
  <cbc:ID>${xmlEsc(f.broj)}</cbc:ID>
  <cbc:IssueDate>${f.datum_izdavanja}</cbc:IssueDate>
  <cbc:DueDate>${f.datum_dospeca}</cbc:DueDate>
  <cbc:InvoiceTypeCode>380</cbc:InvoiceTypeCode>
  ${f.napomena ? `<cbc:Note>${xmlEsc(f.napomena)}</cbc:Note>` : ''}
  <cbc:DocumentCurrencyCode>${xmlEsc(val)}</cbc:DocumentCurrencyCode>
  ${sef ? '' : `<cbc:BuyerReference>${xmlEsc(f.broj)}</cbc:BuyerReference>`}
  ${sef ? '<cac:InvoicePeriod><cbc:DescriptionCode>35</cbc:DescriptionCode></cac:InvoicePeriod>' : ''}
  <cac:AccountingSupplierParty>${strana(iz, dIz, true)}</cac:AccountingSupplierParty>
  <cac:AccountingCustomerParty>${strana(ku, dKu, false)}</cac:AccountingCustomerParty>
  <cac:Delivery><cbc:ActualDeliveryDate>${f.datum_prometa || f.datum_izdavanja}</cbc:ActualDeliveryDate></cac:Delivery>
  ${racun ? `<cac:PaymentMeans><cbc:PaymentMeansCode>${!sef && /^[A-Z]{2}\d/.test(racun) && val === 'EUR' ? '58' : '30'}</cbc:PaymentMeansCode>${sef ? '' : `<cbc:PaymentID>${xmlEsc(f.broj)}</cbc:PaymentID>`}<cac:PayeeFinancialAccount><cbc:ID>${xmlEsc(racun)}</cbc:ID></cac:PayeeFinancialAccount></cac:PaymentMeans>` : ''}
  ${sef ? '' : `<cac:PaymentTerms><cbc:Note>Rok plačila / Due date: ${fmtDatum(f.datum_dospeca)}</cbc:Note></cac:PaymentTerms>`}
  <cac:TaxTotal><cbc:TaxAmount ${c}>${iz2(pdv)}</cbc:TaxAmount>
    ${[...grupe.values()].map(x => `<cac:TaxSubtotal><cbc:TaxableAmount ${c}>${iz2(x.os)}</cbc:TaxableAmount><cbc:TaxAmount ${c}>${iz2(x.pdv)}</cbc:TaxAmount>${kategorija(x, true)}</cac:TaxSubtotal>`).join('\n    ')}
  </cac:TaxTotal>
  <cac:LegalMonetaryTotal>
    <cbc:LineExtensionAmount ${c}>${iz2(os)}</cbc:LineExtensionAmount>
    <cbc:TaxExclusiveAmount ${c}>${iz2(os)}</cbc:TaxExclusiveAmount>
    <cbc:TaxInclusiveAmount ${c}>${iz2(os + pdv)}</cbc:TaxInclusiveAmount>
    <cbc:AllowanceTotalAmount ${c}>0.00</cbc:AllowanceTotalAmount>
    <cbc:PrepaidAmount ${c}>0.00</cbc:PrepaidAmount>
    <cbc:PayableAmount ${c}>${iz2(os + pdv)}</cbc:PayableAmount>
  </cac:LegalMonetaryTotal>
  ${stavke.map(s => {
    const k = pdvKat(s, dIz);
    return `<cac:InvoiceLine>
    <cbc:ID>${s.rb}</cbc:ID>
    <cbc:InvoicedQuantity unitCode="${JM_UNECE[s.jedinica] || 'C62'}">${Number(s.kolicina)}</cbc:InvoicedQuantity>
    <cbc:LineExtensionAmount ${c}>${iz2(s.osnovica)}</cbc:LineExtensionAmount>

    <cac:Price><cbc:PriceAmount ${c}>${Number(s.cena).toFixed(2)}</cbc:PriceAmount></cac:Price>
  </cac:InvoiceLine>`;
  }).join('\n  ')}
</Invoice>`.replace(/\n\s*\n/g, '\n');
}

function preuzmiFajl(ime, sadrzaj, tip) {
  const blob = sadrzaj instanceof Blob ? sadrzaj : new Blob([sadrzaj], { type: tip });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = ime;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const imeFajla = s => String(s).replace(/[^\w.-]+/g, '_');
const base64UBlob = (b64, tip) => { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type: tip }); };
const utf8Base64 = s => { const b = new TextEncoder().encode(s); let x = ''; for (let i = 0; i < b.length; i += 0x8000) x += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(x); };

// PDF od istog HTML-a koji se štampa (jedna sekcija = jedna A4 strana)
async function pdfIzHtml(sekcije) {
  await ucitajSkriptu(H2C_URL, 'html2canvas');
  await ucitajSkriptu(JSPDF_URL, 'jspdf');
  const ifr = document.createElement('iframe');
  ifr.setAttribute('aria-hidden', 'true');
  ifr.style.cssText = 'position:fixed;left:-12000px;top:0;width:820px;height:1200px;border:0';
  document.body.appendChild(ifr);
  try {
    const d = ifr.contentDocument;
    d.open();
    d.write(`<!doctype html><html lang="sr-Latn"><head><meta charset="utf-8"><style>${CSS_STAMPA}
      body{background:#fff}.traka{display:none}.faktura{margin:0;width:794px;min-height:1123px;box-shadow:none}</style></head><body>${sekcije.join('')}</body></html>`);
    d.close();
    await new Promise(r => setTimeout(r, 200));
    const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', compress: true });
    const listovi = [...d.querySelectorAll('.faktura')];
    for (let i = 0; i < listovi.length; i++) {
      const cv = await window.html2canvas(listovi[i], { scale: 2, backgroundColor: '#ffffff', logging: false, windowWidth: 820 });
      const visinaStrane = Math.round(cv.width * 297 / 210);
      for (let y = 0, prvi = true; y < cv.height; y += visinaStrane, prvi = false) {
        if (!prvi && cv.height - y < visinaStrane * 0.03) break;   // ostatak od par piksela ne pravi praznu stranu
        const deo = document.createElement('canvas');
        deo.width = cv.width; deo.height = Math.min(visinaStrane, cv.height - y);
        deo.getContext('2d').drawImage(cv, 0, y, cv.width, deo.height, 0, 0, cv.width, deo.height);
        if (i > 0 || !prvi) pdf.addPage();
        pdf.addImage(deo.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 210, deo.height * 210 / cv.width);
      }
    }
    return pdf.output('datauristring').split(',')[1];
  } finally { ifr.remove(); }
}

async function podaciZaDopise() {
  const [fak, nap, ul, upl, dop] = await Promise.all([
    Store.lista('v_fakture'), Store.lista('naplate'), Store.lista('ulazni_racuni'), Store.lista('ulazni_placanja'), Store.lista('dopisi', { red: 'datum', opadajuce: true })]);
  return { fak, nap, ul, upl, dop };
}
function predlogNivoa(dop, firmaId, partnerId) {
  const z = dop.find(d => d.vrsta === 'OPOMENA' && d.firma_id === firmaId && d.partner_id === partnerId);
  if (!z) return { nivo: 1, zadnja: null };
  return { nivo: razlikaDana(z.datum) >= -60 ? Math.min((z.nivo || 1) + 1, 3) : 1, zadnja: z };
}
function grupeOpomena(p) {
  const m = new Map();
  for (const f of p.fak) {
    if (f.status !== 'IZDATA' || Number(f.saldo) <= 0.005 || (f.dana_kasnjenja || 0) < DOP.minDana || (DOP.firma && f.firma_id !== DOP.firma)) continue;
    const k = `${f.firma_id}|${f.nalogodavac_id}`;
    const g = m.get(k) || { kljuc: k, firma_id: f.firma_id, partner_id: f.nalogodavac_id, naziv: f.nalogodavac_naziv, fakture: [], eur: 0, max: 0, po: {} };
    g.fakture.push(f); g.eur += Number(f.saldo_eur); g.max = Math.max(g.max, f.dana_kasnjenja); g.po[f.valuta] = (g.po[f.valuta] || 0) + Number(f.saldo);
    m.set(k, g);
  }
  return [...m.values()].map(g => ({ ...g, ...predlogNivoa(p.dop, g.firma_id, g.partner_id) })).sort((a, b) => b.eur - a.eur);
}
function grupeIos(p) {
  const D = DOP.naDan, firma = DOP.firma || S.firme[0]?.id;
  const placeno = new Map(), placenoUl = new Map();
  p.nap.filter(n => n.datum <= D).forEach(n => placeno.set(n.faktura_id, (placeno.get(n.faktura_id) || 0) + Number(n.iznos)));
  p.upl.filter(n => n.datum <= D).forEach(n => placenoUl.set(n.ulazni_racun_id, (placenoUl.get(n.ulazni_racun_id) || 0) + Number(n.iznos)));
  const m = new Map();
  const g = pid => m.get(pid) || m.set(pid, { kljuc: pid, firma_id: firma, partner_id: pid, naziv: partnerNaziv(pid), potrazivanja: [], obaveze: [], saldo: {} }).get(pid);
  for (const f of p.fak) {
    if (f.firma_id !== firma || f.datum_izdavanja > D) continue;
    if (f.status === 'STORNO' && (!f.storno_datum || f.storno_datum <= D)) continue;
    const s = Number(f.ukupno) - (placeno.get(f.id) || 0);
    if (Math.abs(s) <= 0.005) continue;
    const x = g(f.nalogodavac_id);
    x.potrazivanja.push({ broj: f.originalni_broj ? `${f.broj} (${f.originalni_broj})` : f.broj, datum: f.datum_izdavanja, dospece: f.datum_dospeca, valuta: f.valuta, saldo: s, strana: 'D' });
    x.saldo[f.valuta] = (x.saldo[f.valuta] || 0) + s;
  }
  for (const u of p.ul) {
    if (u.firma_id !== firma || u.datum > D) continue;
    const s = Number(u.iznos_ukupno) - (placenoUl.get(u.id) || 0);
    if (Math.abs(s) <= 0.005) continue;
    const x = g(u.dobavljac_id);
    x.obaveze.push({ broj: u.broj_fakture, datum: u.datum, dospece: u.datum_dospeca, valuta: u.valuta, saldo: s, strana: 'P' });
    x.saldo[u.valuta] = (x.saldo[u.valuta] || 0) - s;
  }
  const kurs = v => valutaKurs(v);
  return [...m.values()].map(x => ({ ...x, eur: Object.entries(x.saldo).reduce((s, [v, i]) => s + i / kurs(v), 0) }))
    .filter(x => Object.values(x.saldo).some(v => Math.abs(v) > 0.005)).sort((a, b) => Math.abs(b.eur) - Math.abs(a.eur));
}

  const kpi = (n, v, d, klasa = '') => `<div class="kpi"><span>${n}</span><b class="${klasa}">${v}</b><small>${d}</small></div>`;
  // podaci za grafikone
  const prihodF = P.fak.filter(f => ['NALOG', 'RUCNA'].includes(f.izvor) && f.status === 'IZDATA' && okF(f.firma_id) && (IZV.firma || f.tip !== 'INTERNA') && uGod(f.datum_prometa || f.datum_izdavanja));
