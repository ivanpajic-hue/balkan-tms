<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BALKAN TMS — v3.0</title>
<style>
:root{
  --bg:#F2F4FB;--surface:#FFFFFF;--surface-2:#F7F9FC;--border:#E6EAF3;
  --text:#0F1729;--muted:#5A6478;--muted-2:#8A93A6;--brand:#3A41C6;--brand-soft:#ECEDFB;
  --avto:#2563EB;--transport:#0D9488;--all:#475569;--ok:#15A34A;--ok-soft:#E7F6ED;
  --warn:#E08600;--warn-soft:#FBF0E1;--bad:#DC2626;--bad-soft:#FBE9E9;--info-soft:#E8F0FE;
  --radius:12px;--shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.05);
  --grad:linear-gradient(135deg,#3A41C6 0%,#4F46E5 45%,#0D9488 120%);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#1E2A6E,#2F3E9E 55%,#0E9488 130%)}
.login-card{background:var(--surface);border-radius:16px;box-shadow:0 20px 50px rgba(16,24,40,.25);width:100%;max-width:440px;padding:32px}
.login-card .logo{font-weight:800;font-size:22px;letter-spacing:-.5px}
.login-card .logo span{color:var(--transport)}
.login-card .sub{color:var(--muted);margin:6px 0 22px;font-size:13px}
.user-pick{display:flex;flex-direction:column;gap:8px}
.user-btn{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface);text-align:left;transition:.12s}
.user-btn:hover{border-color:var(--brand);background:var(--brand-soft)}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:0 0 auto}
.user-btn .nm{font-weight:600}.user-btn .rl{color:var(--muted);font-size:12px}
#shell{display:none}
.layout{display:flex;min-height:100vh}
.sidebar{width:230px;background:#10193A;color:#C7CEE0;flex:0 0 auto;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar .brand{padding:18px 18px 14px;font-weight:800;font-size:18px;color:#fff}
.sidebar .brand span{color:#36D1B7}
.nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#C7CEE0;font-size:13.5px}
.nav a .ic{width:18px;text-align:center;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.active{background:#2F3E9E;color:#fff}
.nav .sec{padding:14px 14px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#6B76A0}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:10px 20px}
.company-switch{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px}
.company-switch button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-weight:600;font-size:12.5px;color:var(--muted)}
.company-switch button.active{color:#fff}
.company-switch button.active[data-c="avto"]{background:var(--avto)}
.company-switch button.active[data-c="transport"]{background:var(--transport)}
.company-switch button.active[data-c="ALL"]{background:var(--all)}
.search{flex:1;max-width:360px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2)}
.search .si{position:absolute;left:11px;top:9px;color:var(--muted-2)}
.quick{display:flex;gap:8px;margin-left:auto}
.btn{border:1px solid var(--border);background:var(--surface);padding:8px 13px;border-radius:9px;font-weight:600;font-size:13px;color:var(--text);display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:#27348a}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}
.btn.danger{color:var(--bad);border-color:#f3c9c9}
.btn.danger:hover{background:var(--bad-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.userchip{display:flex;align-items:center;gap:9px;padding-left:6px;border-left:1px solid var(--border);margin-left:4px}
.userchip .avatar{width:32px;height:32px;font-size:13px}
.userchip .nm{font-weight:600;font-size:13px}.userchip .rl{font-size:11px;color:var(--muted)}
.content{padding:22px;max-width:1280px;width:100%}
.crumb{color:var(--muted);font-size:12.5px;margin-bottom:6px}
.page-h{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.page-h h1{font-size:21px;margin:0;font-weight:700;letter-spacing:-.4px}.page-h .sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow)}
.kpi .lab{color:var(--muted);font-size:12px;font-weight:600}
.kpi .val{font-size:23px;font-weight:750;margin-top:6px;letter-spacing:-.5px}
.kpi .hint{font-size:11.5px;color:var(--muted-2);margin-top:3px}
.kpi.bad .val{color:var(--bad)}.kpi.ok .val{color:var(--ok)}.kpi.warn .val{color:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:960px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card .ch{padding:13px 16px;border-bottom:1px solid var(--border);font-weight:700;display:flex;align-items:center;gap:8px}
.card .cb{padding:14px 16px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.toolbar input,.toolbar select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.toolbar .grow{flex:1;min-width:160px}.toolbar .right{margin-left:auto;display:flex;gap:8px}
.tablewrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 13px;text-align:left;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
th{background:var(--surface-2);color:var(--muted);font-weight:650;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;cursor:pointer;white-space:nowrap;user-select:none}
th .ar{opacity:.5;font-size:10px}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td .row-act{display:flex;gap:6px;justify-content:flex-end}
.empty{padding:34px;text-align:center;color:var(--muted)}
.empty .big{font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:650;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.b-grey{background:#EEF1F4;color:#5B6573}.b-blue{background:var(--info-soft);color:#1d4ed8}
.b-green{background:var(--ok-soft);color:#15803d}.b-amber{background:var(--warn-soft);color:#b45309}.b-red{background:var(--bad-soft);color:#b91c1c}
.tag{display:inline-block;padding:2px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);font-size:11px;color:var(--muted);margin:1px 2px 1px 0}
.comp-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.modal-bg{position:fixed;inset:0;background:rgba(16,24,40,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:680px;box-shadow:0 24px 60px rgba(16,24,40,.3);display:flex;flex-direction:column;max-height:calc(100vh - 80px)}
.modal.wide{max-width:880px}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center}
.modal .mh h3{margin:0;font-size:16px}
.modal .mh .x{margin-left:auto;border:0;background:transparent;font-size:20px;color:var(--muted);width:30px;height:30px;border-radius:7px}
.modal .mh .x:hover{background:var(--surface-2)}
.modal .mb{padding:18px 20px;overflow-y:auto}
.modal .mf{padding:13px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface);border-radius:0 0 14px 14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form-grid .full{grid-column:1/-1}
@media(max-width:620px){.form-grid{grid-template-columns:1fr}}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.field textarea{resize:vertical;min-height:62px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
.subhead{font-weight:700;margin:18px 0 8px;font-size:13px;border-top:1px solid var(--border);padding-top:14px}
.mini-table{width:100%;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-top:8px}
.mini-table th,.mini-table td{padding:7px 9px;font-size:12px}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px 18px}
.detail-grid .di .k{font-size:11px;color:var(--muted);font-weight:600}
.detail-grid .di .v{font-size:13.5px;margin-top:2px}
.section-title{font-weight:700;margin:18px 0 8px}
.alert-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.alert-row:last-child{border-bottom:0}
.sev{width:8px;height:34px;border-radius:4px;flex:0 0 auto}
.sev.isteklo{background:var(--bad)}.sev.hitno{background:var(--warn)}.sev.upozorenje{background:#EAB308}.sev.info{background:#2563EB}
.bars{display:flex;align-items:flex-end;gap:14px;height:160px;padding:8px 4px 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:54px;border-radius:6px 6px 0 0;background:var(--brand)}
.bar-col .bl{font-size:11px;color:var(--muted);text-align:center}.bar-col .bv{font-size:11px;font-weight:700}
.toast{position:fixed;bottom:22px;right:22px;background:#10193A;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:100;font-size:13px;opacity:0;transform:translateY(8px);transition:.2s}
.toast.show{opacity:1;transform:none}
.pill-note{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--border);padding:8px 11px;border-radius:8px;margin-bottom:12px}
.hint-inline{font-size:11.5px;color:var(--muted-2);margin-top:4px}
.card .ch.clp{cursor:pointer;user-select:none}
.chev{margin-left:auto;font-size:11px;color:var(--muted);transition:transform .15s}
.card.collapsed .cb{display:none}.card.collapsed .chev{transform:rotate(-90deg)}
.dfilt{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);font-weight:600}
.dfilt input{padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:12px}
.recon{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;padding:5px 10px;border-radius:8px}
.recon.ok{background:var(--ok-soft);color:#15803d}.recon.bad{background:var(--bad-soft);color:#b91c1c}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:960px){.chart-grid{grid-template-columns:1fr}}
.svg-chart{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.pl-table td.pos{color:var(--ok);font-weight:700}.pl-table td.neg{color:var(--bad);font-weight:700}
.pl-table tr.total td{font-weight:800;border-top:2px solid var(--text);background:var(--surface-2)}
.fin-split{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:8px}
.fin-split .fc{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.fin-split .fc .l{font-size:10.5px;color:var(--muted);font-weight:600}.fin-split .fc .v{font-weight:700;margin-top:2px}
/* ===== v2.2 dizajn osvežavanje ===== */
.kpi{position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:var(--grad)}
.kpi.bad::before{background:var(--bad)}.kpi.ok::before{background:var(--ok)}.kpi.warn::before{background:var(--warn)}
.page-h h1{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.card .ch{background:linear-gradient(180deg,#fff,var(--surface-2))}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff}
.btn.pri:hover{background:var(--grad);filter:brightness(.94)}
.sidebar{background:linear-gradient(180deg,#0C1230 0%,#111A3C 100%)}
.sidebar .brand span,.login-card .logo span{color:#34D3B7}
.nav a.active{background:var(--grad);color:#fff}
.recon{border:1px solid transparent}
.kpi .val{letter-spacing:-.6px}
.qa-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.qa-bar .lbl{font-size:11.5px;color:var(--muted);font-weight:600}
.doc-row{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)}
.subhead.clp2{cursor:pointer;user-select:none;display:flex;align-items:center}
.chev2{margin-left:auto;font-size:11px;color:var(--muted);transition:transform .15s}
.ord-sec.collapsed .ord-sec-b{display:none}
.ord-sec.collapsed .chev2{transform:rotate(-90deg)}
.fin-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px 14px;margin-bottom:6px;align-items:end}
.fin-row.din{grid-template-columns:1fr 1fr 1fr}
.fin-recon{margin-top:8px}
.fin-recon label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
@media(max-width:620px){.fin-row{grid-template-columns:1fr}}
.km-out{padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);font-weight:700}
@media print{.sidebar,.topbar,.toolbar,.no-print{display:none!important}.content{padding:0;max-width:none}.tablewrap,.card{box-shadow:none}body{background:#fff}.page-h h1{-webkit-text-fill-color:initial;color:#0F1729}}

/* Planiranje — DnD board */
.plan-board{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
@media(max-width:860px){.plan-board{grid-template-columns:1fr}}
.plan-board-r{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px;align-items:start}
.plan-col{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:110px}
.plan-col.drop-hover{outline:2px dashed var(--brand);outline-offset:-3px;background:var(--brand-soft)}
.pc-head{padding:11px 13px;border-bottom:1px solid var(--border);font-weight:700;display:flex;align-items:center;gap:8px;font-size:13.5px}
.pc-head .sp{flex:1}
.pc-badge{margin-left:auto;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:1px 9px;font-size:12px;color:var(--muted)}
.pc-body{padding:10px;display:flex;flex-direction:column;gap:9px;min-height:58px}
.plan-unplan .pc-body{max-height:62vh;overflow:auto}
.tc-meta{padding:7px 13px 0;font-size:11.5px;color:var(--muted)}
.cap-bar{height:6px;border-radius:6px;background:var(--surface-2);margin:7px 13px 0;overflow:hidden}
.cap-bar span{display:block;height:100%;background:var(--ok)}
.cap-bar.over span{background:var(--bad)}
.cap-lbl{font-size:11px;color:var(--muted);padding:3px 13px 0}
.tc-hint{font-size:12px;color:var(--muted-2);text-align:center;padding:16px;border:1px dashed var(--border);border-radius:9px}
.ord-chip{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;cursor:grab;transition:box-shadow .12s,transform .12s}
.ord-chip:hover{box-shadow:var(--shadow)}
.ord-chip.dragging{opacity:.45;cursor:grabbing}
.ord-chip .oc-top{display:flex;align-items:center;gap:6px;font-size:13px}
.oc-cnt{margin-left:4px;font-size:11px;color:var(--muted)}
.oc-x{margin-left:auto;border:0;background:transparent;color:var(--bad);font-size:16px;line-height:1;cursor:pointer;padding:0 2px}
.oc-cli{font-size:12px;color:var(--text);margin-top:2px}
.oc-rel{font-size:11.5px;color:var(--muted);margin-top:1px}
.oc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;font-size:11px;color:var(--muted)}


/* v3.0: online */
.syncbadge{width:10px;height:10px;border-radius:50%;background:#CBD5E1;flex:none}
.syncbadge.ok{background:#10B981}.syncbadge.saving{background:#F59E0B;animation:syncpulse 1s infinite}.syncbadge.err{background:#DC2626}
@keyframes syncpulse{50%{opacity:.35}}
.login-form .lfield{margin-bottom:10px}
.login-form .lfield input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface)}
.login-form .lfield input:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
</style>
</head>
<body>
<div id="login">
  <div class="login-card">
    <div class="logo">BALKAN <span>TMS</span></div>
    <div class="sub">Transport management · auto-logistika · online</div>
    <form class="login-form" onsubmit="return false" autocomplete="on" style="text-align:left">
      <div class="lfield"><label>E-mail</label><input id="loginEmail" type="email" autocomplete="username" placeholder="ime@firma.rs"></div>
      <div class="lfield"><label>Lozinka</label><input id="loginPass" type="password" autocomplete="current-password"></div>
      <button class="btn pri" id="loginBtn" style="width:100%;justify-content:center">Prijava</button>
      <div id="loginErr" style="display:none;color:#B91C1C;font-size:12.5px;margin-top:8px"></div>
    </form>
    <div class="hint-inline" style="margin-top:16px">Online verzija — podaci su na zajedničkom serveru (Supabase). Naloge zaposlenima otvara administrator u modulu Administracija.</div>
  </div>
</div>
<div id="shell">
  <div class="layout">
    <aside class="sidebar"><div class="brand">BALKAN <span>TMS</span></div><nav class="nav" id="nav"></nav></aside>
    <div class="main">
      <header class="topbar">
        <div class="company-switch" id="companySwitch"></div>
        <div class="search"><span class="si">&#9906;</span><input id="globalSearch" placeholder="Globalna pretraga (nalozi, klijenti, vozila, ture)..."></div>
        <div class="quick" id="quickActions"></div>
        <div class="syncbadge ok" id="syncBadge" title="Sinhronizovano"></div>
        <div class="userchip" id="userChip"></div>
      </header>
      <div class="content" id="view"></div>
    </div>
  </div>
</div>
<div id="modalRoot"></div>
<div id="modalRoot2"></div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ===== BALKAN TMS — v3.0 (Faza 0: produkcija — Supabase backend + Auth, Vercel hosting).
   Store: in-memory keš za sinhrona čitanja + write-through na Supabase (tabele tms_*, kolona data jsonb). ===== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=(p='id')=>p+'_'+Math.random().toString(36).slice(2,9);
const todayISO=()=>new Date().toISOString().slice(0,10);
const nowISO=()=>new Date().toISOString();
function addDays(iso,d){const t=new Date(iso);t.setDate(t.getDate()+d);return t.toISOString().slice(0,10);}
function daysUntil(iso){if(!iso)return null;const ms=new Date(iso)-new Date(todayISO());return Math.round(ms/86400000);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const CUR_SYM={EUR:'€',RSD:'din',USD:'$'};
function fmtMoney(n,cur='EUR'){n=Number(n||0);return n.toLocaleString('sr-RS',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+(CUR_SYM[cur]||cur);}
function fmtDate(iso){if(!iso)return '—';return new Date(iso).toLocaleDateString('sr-RS');}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}

let sb=null;
function sbClient(){if(!sb)sb=window.supabase.createClient(SB_URL,SB_ANON);return sb;}
let sbQueue=Promise.resolve();
function setSync(st){const el=document.getElementById('syncBadge');if(!el)return;el.className='syncbadge '+st;el.title=st==='saving'?'Čuvanje na server...':st==='err'?'Greška sinhronizacije — proveri internet vezu':'Sinhronizovano';}
function sbEnqueue(fn){sbQueue=sbQueue.then(fn).catch(e=>{console.error('SYNC GREŠKA',e);setSync('err');toast('⚠ Greška pri čuvanju na server: '+((e&&e.message)||e));});return sbQueue;}
function sbRowOf(row){return {id:row.id,company_id:row.company_id||null,deleted_at:row.deleted_at||null,updated_at:nowISO(),data:row};}
function sbPush(t,row){if(!SB_TABLES.includes(t)||!row||!row.id)return;const payload=sbRowOf(row);
  sbEnqueue(async()=>{setSync('saving');const {error}=await sbClient().from('tms_'+t).upsert(payload);if(error)throw error;setSync('ok');});}
function sbPushMany(t,rows){rows=(rows||[]).filter(r=>r&&r.id);if(!SB_TABLES.includes(t)||!rows.length)return;const payload=rows.map(sbRowOf);
  sbEnqueue(async()=>{setSync('saving');for(let i=0;i<payload.length;i+=200){const {error}=await sbClient().from('tms_'+t).upsert(payload.slice(i,i+200));if(error)throw error;}setSync('ok');});}
function sbWipeAll(){sbEnqueue(async()=>{setSync('saving');for(const t of SB_TABLES){const {error}=await sbClient().from('tms_'+t).delete().neq('id','');if(error)throw error;}setSync('ok');});}
async function sbFetchAll(){const db={};
  await Promise.all(SB_TABLES.map(async t=>{let rows=[],from=0;const page=1000;
    for(;;){const {data,error}=await sbClient().from('tms_'+t).select('data').range(from,from+page-1);
      if(error)throw new Error('tms_'+t+': '+error.message);
      rows=rows.concat((data||[]).map(r=>r.data));if(!data||data.length<page)break;from+=page;}
    db[t]=rows;}));
  return db;}
async function sbFetchUsers(){const {data,error}=await sbClient().from('tms_app_users').select('*');if(error)throw error;return data||[];}
function mapAppUsers(db,appUsers){
  db.users=(appUsers||[]).map(u=>({id:u.id,full_name:u.full_name||u.email,email:u.email,role:u.role,active:u.active}));
  db.user_company_access=[];
  (appUsers||[]).forEach(u=>{(Array.isArray(u.companies)?u.companies:[]).forEach(c=>db.user_company_access.push({id:'uca_'+u.id+'_'+c,user_id:u.id,company_id:c}));});}

const Store={
  db:null,appUsers:[],
  async loadRemote(){const [db,users]=await Promise.all([sbFetchAll(),sbFetchUsers()]);
    this.db=db;this.appUsers=users;mapAppUsers(this.db,users);this.migrate();},
  migrate(){const fresh=seed();const touched={};
    Object.keys(fresh).forEach(t=>{if(!this.db[t])this.db[t]=[];});
    ['expense_categories','settlement_item_types','fleet_doc_types','driver_doc_types','countries','settings','order_statuses','order_doc_types'].forEach(t=>{
      if((this.db.companies||[]).length&&(!this.db[t]||!this.db[t].length)){this.db[t]=fresh[t];sbPushMany(t,this.db[t]);}});
    (this.db.transport_orders||[]).forEach(o=>{if(o.fakt_eur==null){o.fakt_eur=o.agreed_price||0;o.fakt_din=0;o.interna_iznos=0;o.interna_firma_id=null;o.gotovina=0;o.interna_zarada=0;touched.transport_orders=1;}
      if(o.eur_klijent_id===undefined){o.eur_klijent_id=null;o.din_klijent_id=null;o.gotovina_klijent_id=null;touched.transport_orders=1;}
      if(o.eur_izdaje_id===undefined){o.eur_izdaje_id=o.company_id||'avto';o.interna_izdaje_id='avto';o.gotovina_izdaje_id=o.company_id||'avto';o.din_izdaje_id='transport';if(o.interna_firma_id==null||!(this.db.companies||[]).some(c=>c.id===o.interna_firma_id))o.interna_firma_id='transport';touched.transport_orders=1;}
      if(o.pickup_country==null){o.pickup_country=(String(o.pickup_location||'').split(',').pop()||'').trim();o.delivery_country=(String(o.delivery_location||'').split(',').pop()||'').trim();touched.transport_orders=1;}});
    (this.db.trips||[]).forEach(t=>{if(t.km_start===undefined){t.km_start=0;t.km_stop=t.actual_km||0;touched.trips=1;}});
    (this.db.order_vehicles||[]).forEach(v=>{if(v.condition==null){v.condition='polovna';touched.order_vehicles=1;}});
    (this.db.purchase_invoices||[]).forEach(p=>{if(p.neto==null){p.neto=p.amount||0;p.pdv_rate=0;p.bruto=p.amount||0;touched.purchase_invoices=1;}});
    Object.keys(touched).forEach(t=>sbPushMany(t,this.db[t]));},
  save(){/* v3.0: nema localStorage; upis ide preko sbPush write-through sloja */},
  isEmpty(){return !(this.db&&(this.db.companies||[]).length);},
  seedDemo(){const fresh=seed();const keepU=this.db.users,keepA=this.db.user_company_access;
    this.db=Object.assign(fresh,{users:keepU,user_company_access:keepA});this.pushAll();},
  seedBasic(){const fresh=seed();TRANSACTIONAL.forEach(t=>fresh[t]=[]);
    const keepU=this.db.users,keepA=this.db.user_company_access;
    this.db=Object.assign(fresh,{users:keepU,user_company_access:keepA});this.pushAll();},
  pushAll(){SB_TABLES.forEach(t=>sbPushMany(t,this.db[t]||[]));},
  reset(){this.seedDemo();},
  all(t){return (this.db[t]||[]).filter(r=>!r.deleted_at);},
  get(t,id){return this.all(t).find(r=>r.id===id);},
  find(t,fn){return this.all(t).filter(fn);},
  insert(t,row){row.id=row.id||uid(t.slice(0,3));row.created_at=nowISO();row.updated_at=nowISO();
    row.created_by=state.user?state.user.id:null;row.updated_by=row.created_by;
    (this.db[t]=this.db[t]||[]).push(row);sbPush(t,row);return row;},
  update(t,id,patch){const r=this.get(t,id);if(!r)return null;Object.assign(r,patch);r.updated_at=nowISO();
    r.updated_by=state.user?state.user.id:null;sbPush(t,r);return r;},
  remove(t,id){const r=this.get(t,id);if(r){r.deleted_at=nowISO();sbPush(t,r);}return r;},
  scoped(t){const rows=this.all(t);if(state.companyId==='ALL')return rows;return rows.filter(r=>r.company_id===state.companyId);}
};

function computeAlerts(){
  const out=[];const sev=d=>d==null?'info':(d<0?'isteklo':(d<=7?'hitno':(d<=30?'upozorenje':'info')));
  const push=(c,s,cat,et,ei,msg,due)=>out.push({company_id:c,severity:s,category_code:cat,entity_type:et,entity_id:ei,message:msg,due_at:due});
  Store.all('fleet_documents').forEach(fd=>{const d=daysUntil(fd.expires_at);if(d!=null&&d<=60){const v=Store.get('fleet_vehicles',fd.fleet_vehicle_id);push(fd.company_id,sev(d),'dokument_vozila','fleet_vehicle',fd.fleet_vehicle_id,(v?v.internal_no:'')+' — '+fd.doc_type+' '+(d<0?'istekla pre '+(-d)+' dana':'ističe za '+d+' dana'),fd.expires_at);}});
  Store.all('driver_documents').forEach(dd=>{const d=daysUntil(dd.expires_at);if(d!=null&&d<=60){const v=Store.get('drivers',dd.driver_id);push(dd.company_id,sev(d),'dokument_vozaca','driver',dd.driver_id,(v?v.full_name:'')+' — '+dd.doc_type+' '+(d<0?'istekla pre '+(-d)+' dana':'ističe za '+d+' dana'),dd.expires_at);}});
  Store.all('invoices').forEach(inv=>{if(inv.status==='kasni'){const c=Store.get('clients',inv.client_id);push(inv.company_id,'hitno','placanje','invoice',inv.id,'Faktura '+inv.invoice_no+' ('+(c?c.name:'')+') kasni sa naplatom',inv.issue_date);}});
  Store.all('transport_orders').forEach(o=>{if(o.status==='isporucen')push(o.company_id,'upozorenje','nefakturisano','order',o.id,'Nalog '+o.order_no+' isporučen a nije fakturisan',o.planned_delivery);});
  Store.all('service_orders').forEach(so=>{if(so.status!=='zavrseno'){const v=Store.get('fleet_vehicles',so.fleet_vehicle_id);push(so.company_id,'upozorenje','servis','fleet_vehicle',so.fleet_vehicle_id,(v?v.internal_no:'')+' na servisu: '+so.problem,so.out_of_service_to);}});
  const rank={isteklo:0,hitno:1,upozorenje:2,info:3};
  return out.filter(a=>state.companyId==='ALL'||a.company_id===state.companyId).sort((a,b)=>rank[a.severity]-rank[b.severity]);
}

/* ===== Generička tabela: search + sort + filter + export ===== */
renderTableState={};
function renderTable(opts){
  const st=renderTableState[opts.id]||(renderTableState[opts.id]={q:'',sort:null,dir:1,filters:{}});
  let rows=opts.rows.slice();
  (opts.filters||[]).forEach(f=>{const v=st.filters[f.key];if(v)rows=rows.filter(r=>String(f.get?f.get(r):r[f.key])===v);});
  (opts.dateFilters||[]).forEach(f=>{const fr=st['df_'+f.key],to=st['dt_'+f.key];if(fr)rows=rows.filter(r=>{const v=f.get?f.get(r):r[f.key];return v&&v>=fr;});if(to)rows=rows.filter(r=>{const v=f.get?f.get(r):r[f.key];return v&&v<=to;});});
  if(st.q){const q=st.q.toLowerCase();rows=rows.filter(r=>opts.columns.some(c=>{const val=c.sortVal?c.sortVal(r):r[c.key];return String(val==null?'':val).toLowerCase().includes(q);}));}
  if(st.sort){const c=opts.columns.find(x=>x.key===st.sort);if(c)rows.sort((a,b)=>{let av=c.sortVal?c.sortVal(a):a[c.key],bv=c.sortVal?c.sortVal(b):b[c.key];if(typeof av==='number'&&typeof bv==='number')return (av-bv)*st.dir;return String(av==null?'':av).localeCompare(String(bv==null?'':bv))*st.dir;});}
  const filtHtml=(opts.filters||[]).map(f=>'<select data-filter="'+f.key+'"><option value="">'+esc(f.label)+': sve</option>'+f.options.map(o=>'<option value="'+esc(o.v)+'" '+(st.filters[f.key]===o.v?'selected':'')+'>'+esc(o.l)+'</option>').join('')+'</select>').join('')
    +(opts.dateFilters||[]).map(f=>'<span class="dfilt">'+esc(f.label)+': <input type="date" data-dfrom="'+f.key+'" value="'+esc(st['df_'+f.key]||'')+'"><input type="date" data-dto="'+f.key+'" value="'+esc(st['dt_'+f.key]||'')+'"></span>').join('');
  const head=opts.columns.map(c=>'<th class="'+(c.num?'num':'')+'" data-sort="'+c.key+'">'+esc(c.label)+(st.sort===c.key?' <span class="ar">'+(st.dir>0?'▲':'▼')+'</span>':'')+'</th>').join('')+(opts.actions?'<th class="num">Akcije</th>':'');
  const body=rows.length?rows.map(r=>'<tr data-id="'+r.id+'">'+opts.columns.map(c=>'<td class="'+(c.num?'num':'')+'">'+(c.render?c.render(r):esc(r[c.key]==null?'—':r[c.key]))+'</td>').join('')+(opts.actions?'<td class="num"><div class="row-act">'+opts.actions(r)+'</div></td>':'')+'</tr>').join(''):'<tr><td colspan="'+(opts.columns.length+(opts.actions?1:0))+'"><div class="empty"><div class="big">Nema zapisa</div><div>Promenite filtere ili dodajte novi unos.</div></div></td></tr>';
  const html='<div class="toolbar no-print"><input class="grow" placeholder="Pretraga..." data-tblsearch value="'+esc(st.q)+'">'+filtHtml+'<div class="right"><button class="btn sm" data-export="csv">Export CSV</button><button class="btn sm" data-export="xlsx">XLSX</button><button class="btn sm" data-export="print">Štampa</button></div></div><div class="tablewrap"><table><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>';
  setTimeout(()=>{const root=document.getElementById('tbl_'+opts.id);if(!root)return;
    const si=root.querySelector('[data-tblsearch]');if(si)si.oninput=e=>{st.q=e.target.value;rerenderTable(opts);};
    root.querySelectorAll('[data-filter]').forEach(s=>s.onchange=e=>{st.filters[e.target.dataset.filter]=e.target.value;rerenderTable(opts);});
    root.querySelectorAll('[data-dfrom]').forEach(s=>s.onchange=e=>{st['df_'+e.target.dataset.dfrom]=e.target.value;rerenderTable(opts);});
    root.querySelectorAll('[data-dto]').forEach(s=>s.onchange=e=>{st['dt_'+e.target.dataset.dto]=e.target.value;rerenderTable(opts);});
    root.querySelectorAll('th[data-sort]').forEach(th=>th.onclick=()=>{const k=th.dataset.sort;if(st.sort===k)st.dir*=-1;else{st.sort=k;st.dir=1;}rerenderTable(opts);});
    root.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>doExport(b.dataset.export,opts,rows));
  });
  return '<div id="tbl_'+opts.id+'">'+html+'</div>';
}
function rerenderTable(opts){const root=document.getElementById('tbl_'+opts.id);if(root){if(opts.getRows)opts.rows=opts.getRows();root.outerHTML=renderTable(opts);}}
function doExport(kind,opts,rows){
  const headers=opts.columns.map(c=>c.label);
  const data=rows.map(r=>opts.columns.map(c=>{const v=c.exportVal?c.exportVal(r):(c.sortVal?c.sortVal(r):r[c.key]);return v==null?'':String(v).replace(/<[^>]+>/g,'');}));
  if(kind==='print'){window.print();return;}
  if(kind==='xlsx'){if(typeof XLSX==='undefined'){toast('XLSX nije učitan (nema mreže) — koristite CSV');return;}const ws=XLSX.utils.aoa_to_sheet([headers].concat(data));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Podaci');XLSX.writeFile(wb,(opts.exportName||'export')+'.xlsx');return;}
  const csv=[headers].concat(data).map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(opts.exportName||'export')+'.csv';a.click();
}

const CHART_COLORS=['#2563EB','#0E9488','#7C3AED','#D97706','#DC2626','#16A34A','#0891B2','#DB2777','#65A30D','#9333EA'];
function svgBars(data,opts){opts=opts||{};const w=opts.w||440,h=opts.h||200,pad=34,bw=(w-pad-8)/Math.max(1,data.length);const max=Math.max(1,...data.map(d=>d.value));
  const bars=data.map((d,i)=>{const bh=Math.round((d.value/max)*(h-pad-22));const x=pad+i*bw+bw*0.15,y=h-pad-bh;const col=d.color||CHART_COLORS[i%CHART_COLORS.length];
    return '<rect x="'+x+'" y="'+y+'" width="'+(bw*0.7)+'" height="'+bh+'" rx="3" fill="'+col+'"></rect>'+
      '<text x="'+(x+bw*0.35)+'" y="'+(y-4)+'" text-anchor="middle" font-size="9.5" fill="#5B6573">'+esc(opts.fmt?opts.fmt(d.value):d.value)+'</text>'+
      '<text x="'+(x+bw*0.35)+'" y="'+(h-pad+13)+'" text-anchor="middle" font-size="9.5" fill="#8A93A0">'+esc(d.label)+'</text>';}).join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" class="svg-chart"><line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+w+'" y2="'+(h-pad)+'" stroke="#E4E8EE"></line>'+bars+'</svg>';}
function svgGroupedBars(labels,series,opts){opts=opts||{};const w=opts.w||440,h=opts.h||210,pad=34;const groups=labels.length;const gw=(w-pad-8)/Math.max(1,groups);const max=Math.max(1,...series.flatMap(s=>s.values));const n=series.length;
  let out='';labels.forEach((lab,gi)=>{series.forEach((s,si)=>{const bw=(gw*0.7)/n;const bh=Math.round((s.values[gi]/max)*(h-pad-22));const x=pad+gi*gw+gw*0.15+si*bw;const y=h-pad-bh;out+='<rect x="'+x+'" y="'+y+'" width="'+(bw*0.86)+'" height="'+bh+'" rx="2" fill="'+(s.color||CHART_COLORS[si])+'"></rect>';});
    out+='<text x="'+(pad+gi*gw+gw*0.5)+'" y="'+(h-pad+13)+'" text-anchor="middle" font-size="9" fill="#8A93A0">'+esc(lab)+'</text>';});
  const leg='<div class="legend">'+series.map((s,i)=>'<span><i style="background:'+(s.color||CHART_COLORS[i])+'"></i>'+esc(s.name)+'</span>').join('')+'</div>';
  return '<svg viewBox="0 0 '+w+' '+h+'" class="svg-chart"><line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+w+'" y2="'+(h-pad)+'" stroke="#E4E8EE"></line>'+out+'</svg>'+leg;}
function svgLine(labels,values,opts){opts=opts||{};const w=opts.w||440,h=opts.h||200,pad=34;const max=Math.max(1,...values),min=Math.min(0,...values);const span=max-min||1;const n=values.length;
  const X=i=>pad+(n<=1?0:i*(w-pad-8)/(n-1));const Y=v=>h-pad-((v-min)/span)*(h-pad-22);
  const pts=values.map((v,i)=>X(i)+','+Y(v)).join(' ');const dots=values.map((v,i)=>'<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="3" fill="#2563EB"></circle>').join('');
  const labs=labels.map((l,i)=>'<text x="'+X(i)+'" y="'+(h-pad+13)+'" text-anchor="middle" font-size="9" fill="#8A93A0">'+esc(l)+'</text>').join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" class="svg-chart"><line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+w+'" y2="'+(h-pad)+'" stroke="#E4E8EE"></line><polyline fill="none" stroke="#2563EB" stroke-width="2" points="'+pts+'"></polyline>'+dots+labs+'</svg>';}
function svgDonut(data,opts){opts=opts||{};const sz=opts.sz||180,r=70,cx=sz/2,cy=sz/2;const tot=data.reduce((s,d)=>s+d.value,0)||1;let ang=-Math.PI/2;
  const arcs=data.map((d,i)=>{const frac=d.value/tot;const a2=ang+frac*2*Math.PI;const x1=cx+r*Math.cos(ang),y1=cy+r*Math.sin(ang),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);const large=frac>0.5?1:0;const col=d.color||CHART_COLORS[i%CHART_COLORS.length];ang=a2;return '<path d="M '+cx+' '+cy+' L '+x1+' '+y1+' A '+r+' '+r+' 0 '+large+' 1 '+x2+' '+y2+' Z" fill="'+col+'"></path>';}).join('');
  const hole='<circle cx="'+cx+'" cy="'+cy+'" r="42" fill="#fff"></circle>';
  const leg='<div class="legend">'+data.map((d,i)=>'<span><i style="background:'+(d.color||CHART_COLORS[i%CHART_COLORS.length])+'"></i>'+esc(d.label)+' ('+Math.round(d.value/tot*100)+'%)</span>').join('')+'</div>';
  return '<svg viewBox="0 0 '+sz+' '+sz+'" class="svg-chart" style="max-width:200px;margin:0 auto">'+arcs+hole+'</svg>'+leg;}

function paidSum(invId){return Store.all('payments').filter(p=>p.invoice_id===invId).reduce((s,p)=>s+p.amount,0);}
Views.invoices=()=>{const rows=Store.scoped('invoices');return pageHeader('Fakture','invoices','Nova faktura',true)+renderTable({id:'invoices',exportName:'fakture',columns:[
  {key:'invoice_no',label:'Broj',render:r=>compDot(r.company_id)+'<b>'+esc(r.invoice_no)+'</b>'},
  {key:'client',label:'Klijent',sortVal:r=>(Store.get('clients',r.client_id)||{}).name,render:r=>esc((Store.get('clients',r.client_id)||{}).name||'—')},
  {key:'issue_date',label:'Izdata',render:r=>fmtDate(r.issue_date)},
  {key:'total_gross',label:'Iznos',num:true,sortVal:r=>r.total_gross,render:r=>fmtMoney(r.total_gross,r.currency)},
  {key:'paid',label:'Plaćeno',num:true,sortVal:r=>paidSum(r.id),render:r=>fmtMoney(paidSum(r.id),r.currency)},
  {key:'status',label:'Status',render:r=>badge(r.status)},
  {key:'sef_status',label:'SEF',render:r=>'<span class="tag">'+esc(r.sef_status)+'</span>'}],
  filters:[{key:'status',label:'Status',options:['nacrt','poslato','delimicno','placeno','kasni','stornirano'].map(s=>({v:s,l:s}))}],
  dateFilters:[{key:'issue_date',label:'Izdata'}],
  rows,getRows:()=>Store.scoped('invoices'),actions:r=>'<button class="btn sm" onclick="viewInvoice(\''+r.id+'\')">Pregled</button>'+(can('invoices','E')?'<button class="btn sm" onclick="addPayment(\''+r.id+'\')">+ Uplata</button>':'')+actionBtns('invoices',r,null,'delInvoice')});};
window.__new_invoices=()=>openInvoiceForm();
function nextInvoiceNo(c){const y=new Date().getFullYear();const pre=(c==='avto'?'AV-':'TR-')+y+'-';const nums=Store.all('invoices').filter(i=>i.company_id===c&&String(i.invoice_no).indexOf(String(y))>-1).map(i=>parseInt(String(i.invoice_no).split('-').pop())).filter(n=>!isNaN(n));return pre+String((nums.length?Math.max(...nums):0)+1).padStart(4,'0');}
window.delInvoice=id=>confirmDelete('invoices',id,'fakturu');
function openInvoiceForm(){const comp=state.companyId==='ALL'?(userCompanies()[0]||{}).id:state.companyId;const clients=Store.all('clients').filter(c=>c.company_id===comp);
  const body='<div class="pill-note">Faktura obuhvata naloge <b>istog klijenta</b> i <b>iste kompanije</b>. Dozvoljeno je <b>više faktura po nalogu</b> — nudi se preostali iznos za fakturisanje, koji možete izmeniti.</div><div class="form-grid">'+companyField({company_id:comp})+field({name:'client_id',label:'Klijent',type:'select',value:'',options:[{v:'',l:'— izaberi —'}].concat(clients.map(c=>({v:c.id,l:c.name}))),attr:'id="invClient"'})+'</div><div id="invOrders" class="muted small" style="margin-top:10px">Izaberite klijenta da vidite naloge.</div>';
  openModal('Nova faktura',body,'<button class="btn" data-close>Otkaži</button><button class="btn pri" id="invCreate" disabled>Kreiraj fakturu</button>');$$('#modalRoot [data-close]').forEach(b=>b.onclick=closeModal);
  const compSel=()=>{const el=$('[name=company_id]',$('#modalRoot'));return el?el.value:comp;};
  function refresh(){const cid=$('#invClient').value;const company=compSel();const box=$('#invOrders');if(!cid){box.innerHTML='Izaberite klijenta.';$('#invCreate').disabled=true;return;}
    const ords=Store.all('transport_orders').filter(o=>o.company_id===company&&o.client_id===cid&&['isporucen','fakturisan'].includes(o.status)).map(o=>({o,rem:+(o.agreed_price-invoicedSum(o.id)).toFixed(2)})).filter(x=>x.rem>0.005);
    if(!ords.length){box.innerHTML='<div class="pill-note">Nema naloga sa preostalim iznosom za fakturisanje za ovog klijenta.</div>';$('#invCreate').disabled=true;return;}
    box.innerHTML='<div class="subhead" style="border:0;padding-top:0">Nalozi sa preostalim iznosom</div>'+ords.map(x=>'<label style="display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)"><input type="checkbox" class="ordck" value="'+x.o.id+'" style="width:auto"><span style="flex:1"><b>'+esc(x.o.order_no)+'</b> · '+esc(x.o.pickup_location)+' → '+esc(x.o.delivery_location)+'<div class="small muted">ukupno '+fmtMoney(x.o.agreed_price)+' · preostalo '+fmtMoney(x.rem)+'</div></span><input type="number" class="ordamt" data-id="'+x.o.id+'" value="'+x.rem+'" step="0.01" style="width:110px;padding:6px 8px;border:1px solid var(--border);border-radius:8px"></span></label>').join('');
    $$('.ordck',box).forEach(ck=>ck.onchange=()=>{$('#invCreate').disabled=!$$('.ordck:checked',box).length;});}
  $('#invClient').onchange=refresh;const ce=$('[name=company_id]',$('#modalRoot'));if(ce&&ce.tagName==='SELECT')ce.onchange=()=>{$('#invClient').innerHTML='<option value="">— izaberi —</option>'+Store.all('clients').filter(c=>c.company_id===compSel()).map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');refresh();};
  $('#invCreate').onclick=()=>{const company=compSel();const cid=$('#invClient').value;const picked=$$('#invOrders .ordck:checked').map(ck=>{const amt=Number(($('.ordamt[data-id="'+ck.value+'"]')||{}).value)||0;return{id:ck.value,price:amt};}).filter(p=>p.price>0);if(!picked.length){toast('Unesite iznos za bar jedan nalog');return;}
    const inv=Store.insert('invoices',{company_id:company,invoice_no:nextInvoiceNo(company),client_id:cid,supply_date:todayISO(),issue_date:todayISO(),currency:'EUR',total_net:0,total_vat:0,total_gross:0,status:'nacrt',sef_status:'nije_poslato',note:''});
    let net=0;picked.forEach(p=>{const o=Store.get('transport_orders',p.id);Store.insert('invoice_items',{invoice_id:inv.id,company_id:company,order_id:p.id,trip_id:null,description:'Transport vozila (nalog '+o.order_no+')',qty:1,unit_price:p.price,vat_rate:0,line_net:p.price,line_vat:0,line_gross:p.price});const fully=invoicedSum(p.id)+0.005>=o.agreed_price;Store.update('transport_orders',p.id,{status:fully?'fakturisan':o.status});net+=p.price;});
    Store.update('invoices',inv.id,{total_net:net,total_vat:0,total_gross:net});audit('create','invoice',inv.id,'Kreirana faktura '+inv.invoice_no+' ('+picked.length+' naloga)');toast('Faktura kreirana');closeModal();render();viewInvoice(inv.id);};}
window.viewInvoice=id=>{const inv=Store.get('invoices',id);const c=Store.get('clients',inv.client_id);const comp=Store.get('companies',inv.company_id);const items=Store.all('invoice_items').filter(i=>i.invoice_id===id);const pays=Store.all('payments').filter(p=>p.invoice_id===id);const paid=pays.reduce((s,p)=>s+p.amount,0);
  const body='<div style="display:flex;justify-content:space-between;align-items:flex-start"><div><div class="b800" style="font-size:16px">'+esc(comp.name)+'</div><div class="small muted">'+esc(comp.address)+'<br>PIB/VAT: '+esc(comp.vat_id)+'</div></div><div style="text-align:right"><div class="b800" style="font-size:18px">Faktura '+esc(inv.invoice_no)+'</div><div class="small muted">Izdata: '+fmtDate(inv.issue_date)+'<br>Promet: '+fmtDate(inv.supply_date)+'</div></div></div>'+
    '<div class="section-title">Kupac</div><div>'+esc(c?c.name:'')+' · '+esc(c?c.country:'')+' · VAT '+esc(c?c.vat_id:'')+'</div>'+
    '<table class="mini-table" style="margin-top:14px"><thead><tr><th>Opis</th><th class="num">Kol.</th><th class="num">Cena</th><th class="num">PDV%</th><th class="num">Iznos</th></tr></thead><tbody>'+items.map(it=>'<tr><td>'+esc(it.description)+'</td><td class="num">'+it.qty+'</td><td class="num">'+fmtMoney(it.unit_price)+'</td><td class="num">'+it.vat_rate+'%</td><td class="num">'+fmtMoney(it.line_gross)+'</td></tr>').join('')+'</tbody></table>'+
    '<div style="text-align:right;margin-top:12px"><div>Osnovica: <b>'+fmtMoney(inv.total_net)+'</b></div><div>PDV: <b>'+fmtMoney(inv.total_vat)+'</b></div><div style="font-size:17px;margin-top:4px">Ukupno: <b>'+fmtMoney(inv.total_gross,inv.currency)+'</b></div><div class="small muted">Plaćeno: '+fmtMoney(paid)+' · Preostalo: '+fmtMoney(inv.total_gross-paid)+'</div></div>'+
    '<div class="section-title">Status</div><div class="flex">'+badge(inv.status)+' <span class="tag">SEF: '+esc(inv.sef_status)+'</span></div>'+(pays.length?'<div class="section-title">Uplate</div><table class="mini-table"><tbody>'+pays.map(p=>'<tr><td>'+fmtDate(p.date)+'</td><td>'+esc(p.method)+'</td><td class="num">'+fmtMoney(p.amount)+'</td></tr>').join('')+'</tbody></table>':'');
  let footer='<button class="btn no-print" onclick="window.print()">Štampa / PDF</button>';
  if(can('invoices','E')){footer+='<button class="btn no-print" onclick="addPayment(\''+id+'\')">+ Uplata</button><select id="invStatus" class="no-print" style="padding:8px;border:1px solid var(--border);border-radius:8px">'+['nacrt','poslato','delimicno','placeno','kasni','stornirano'].map(s=>'<option '+(inv.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select><button class="btn pri no-print" id="invSaveStatus">Sačuvaj status</button>';}
  footer+='<button class="btn" data-close>Zatvori</button>';openModal('Pregled fakture',body,footer,true);$$('#modalRoot [data-close]').forEach(b=>b.onclick=closeModal);
  const ss=$('#invSaveStatus');if(ss)ss.onclick=()=>{const st=$('#invStatus').value;Store.update('invoices',id,{status:st});if(st==='placeno')Store.all('invoice_items').filter(i=>i.invoice_id===id&&i.order_id).forEach(i=>Store.update('transport_orders',i.order_id,{status:'placen'}));audit('update','invoice',id,'Status fakture → '+st);toast('Status ažuriran');closeModal();render();};};
window.addPayment=id=>{const inv=Store.get('invoices',id);const remaining=inv.total_gross-paidSum(id);
  const body='<div class="form-grid">'+field({name:'date',label:'Datum',type:'date',value:todayISO()})+field({name:'amount',label:'Iznos',type:'number',value:remaining})+field({name:'method',label:'Način',type:'select',value:'transfer',options:['transfer','kartica','gotovina'].map(m=>({v:m,l:m}))})+'</div>';
  openModal('Nova uplata — '+inv.invoice_no,body,saveBtn());bindSave(f=>{f.amount=Number(f.amount)||0;f.invoice_id=id;f.company_id=inv.company_id;f.currency=inv.currency;Store.insert('payments',f);const paid=paidSum(id);const st=paid>=inv.total_gross?'placeno':(paid>0?'delimicno':inv.status);Store.update('invoices',id,{status:st});if(st==='placeno')Store.all('invoice_items').filter(i=>i.invoice_id===id&&i.order_id).forEach(i=>Store.update('transport_orders',i.order_id,{status:'placen'}));audit('update','invoice',id,'Uplata '+fmtMoney(f.amount));toast('Uplata zabeležena');closeModal();render();});};

/* ===== Ulazni računi (dobavljači) ===== */
function purStatusBadge(s){return s==='placeno'?'<span class="badge b-green">plaćeno</span>':'<span class="badge b-amber">neplaćeno</span>';}
function purLink(r){if(r.link_type==='trip')return 'Tura: '+esc((Store.get('trips',r.trip_id)||{}).trip_no||'—');if(r.link_type==='vozilo')return 'Vozilo: '+esc((Store.get('fleet_vehicles',r.fleet_vehicle_id)||{}).internal_no||'—');if(r.link_type==='vozac')return 'Vozač: '+esc((Store.get('drivers',r.driver_id)||{}).full_name||'—');return 'Opšti trošak';}
Views.purchases=()=>{const rows=Store.scoped('purchase_invoices');
  const neplaceno=rows.filter(r=>r.status!=='placeno').reduce((s,r)=>s+r.amount,0);const placeno=rows.filter(r=>r.status==='placeno').reduce((s,r)=>s+r.amount,0);
  const kpi=(l,v,cls)=>'<div class="kpi '+(cls||'')+'"><div class="lab">'+l+'</div><div class="val">'+v+'</div></div>';
  return pageHeader('Ulazni računi','purchases','Nov ulazni račun',true)+
    '<div class="kpis">'+kpi('Neplaćeno',fmtMoney(neplaceno),neplaceno?'bad':'')+kpi('Plaćeno',fmtMoney(placeno),'ok')+kpi('Ukupno računa',rows.length,'')+'</div>'+
    renderTable({id:'purchases',exportName:'ulazni_racuni',columns:[
    {key:'date',label:'Datum',sortVal:r=>r.date,render:r=>compDot(r.company_id)+fmtDate(r.date)},
    {key:'supplier',label:'Dobavljač',sortVal:r=>r.supplier_name||'',render:r=>esc(r.supplier_name||(Store.get('clients',r.supplier_id)||{}).name||'—')},
    {key:'doc_ref',label:'Br. računa',render:r=>esc(r.doc_ref||'—')},
    {key:'category_code',label:'Vrsta troška',render:r=>'<span class="tag">'+esc(lkName('expense_categories',r.category_code))+'</span>'},
    {key:'link',label:'Veza',sortVal:r=>r.link_type,render:r=>'<span class="small">'+purLink(r)+'</span>'},
    {key:'neto',label:'Neto',num:true,sortVal:r=>r.neto||0,render:r=>fmtMoney(r.neto==null?r.amount:r.neto,r.currency)},
    {key:'pdv_rate',label:'PDV%',num:true,render:r=>(r.pdv_rate==null?'—':r.pdv_rate+'%')},
    {key:'amount',label:'Bruto',num:true,sortVal:r=>r.amount,render:r=>fmtMoney(r.amount,r.currency)},
    {key:'due_date',label:'Dospeće',render:r=>fmtDate(r.due_date)},
    {key:'status',label:'Status',render:r=>purStatusBadge(r.status)}],
    filters:[{key:'status',label:'Status',options:[{v:'placeno',l:'plaćeno'},{v:'neplaceno',l:'neplaćeno'}]},{key:'category_code',label:'Vrsta',options:lk('expense_categories').map(c=>({v:c.code,l:c.name}))},{key:'link_type',label:'Veza',options:[{v:'trip',l:'tura'},{v:'vozilo',l:'vozilo'},{v:'vozac',l:'vozač'},{v:'opsti',l:'opšti'}]}],
    dateFilters:[{key:'date',label:'Datum'},{key:'due_date',label:'Dospeće'}],
    rows,getRows:()=>Store.scoped('purchase_invoices'),actions:r=>(can('purchases','E')?'<button class="btn sm" onclick="togglePurPaid(\''+r.id+'\')">'+(r.status==='placeno'?'Označi neplaćeno':'Plaćeno')+'</button>':'')+actionBtns('purchases',r,'editPurchase','delPurchase')});};
window.__new_purchases=()=>openPurchaseForm();
function openPurchaseForm(id){const r=id?Store.get('purchase_invoices',id):{};const comp=r.company_id||(state.companyId==='ALL'?(userCompanies()[0]||{}).id:state.companyId);
  const trips=Store.all('trips').filter(t=>t.company_id===comp);const vehicles=Store.all('fleet_vehicles').filter(v=>v.company_id===comp);const drivers=Store.all('drivers').filter(d=>d.company_id===comp);const suppliers=Store.all('clients').filter(c=>c.company_id===comp);const cats=lk('expense_categories');
  const body='<div class="form-grid">'+companyField(r)+field({name:'date',label:'Datum računa',type:'date',value:r.date||todayISO()})+
    field({name:'supplier_name',label:'Dobavljač (naziv)',value:r.supplier_name})+field({name:'supplier_id',label:'Dobavljač iz klijenata (opc.)',type:'select',value:r.supplier_id||'',options:[{v:'',l:'—'}].concat(suppliers.map(c=>({v:c.id,l:c.name})))})+
    field({name:'doc_ref',label:'Broj računa',value:r.doc_ref})+field({name:'category_code',label:'Vrsta troška',type:'select',value:r.category_code||(cats[0]||{}).code,options:cats.map(c=>({v:c.code,l:c.name}))})+
    field({name:'neto',label:'Neto iznos',type:'number',value:r.neto==null?(r.amount||0):r.neto,attr:'step="0.01" data-pdv'})+field({name:'pdv_rate',label:'Stopa PDV (%)',type:'number',value:r.pdv_rate==null?22:r.pdv_rate,attr:'step="0.01" data-pdv'})+
    field({name:'bruto',label:'Bruto iznos',type:'number',value:r.bruto==null?(r.amount||0):r.bruto,attr:'step="0.01" data-pdv-bruto'})+field({name:'currency',label:'Valuta',type:'select',value:r.currency||'EUR',options:[{v:'EUR',l:'EUR'},{v:'RSD',l:'RSD'},{v:'USD',l:'USD'}]})+
    field({name:'link_type',label:'Vezivanje za',type:'select',value:r.link_type||'opsti',options:[{v:'opsti',l:'opšti trošak'},{v:'trip',l:'turu'},{v:'vozilo',l:'vozilo'},{v:'vozac',l:'vozača'}]})+
    field({name:'trip_id',label:'Tura (ako je vezano za turu)',type:'select',value:r.trip_id,options:[{v:'',l:'—'}].concat(trips.map(t=>({v:t.id,l:t.trip_no})))})+
    field({name:'fleet_vehicle_id',label:'Vozilo',type:'select',value:r.fleet_vehicle_id,options:[{v:'',l:'—'}].concat(vehicles.map(v=>({v:v.id,l:v.internal_no})))})+
    field({name:'driver_id',label:'Vozač',type:'select',value:r.driver_id,options:[{v:'',l:'—'}].concat(drivers.map(d=>({v:d.id,l:d.full_name})))})+
    field({name:'due_date',label:'Datum dospeća',type:'date',value:r.due_date||addDays(todayISO(),15)})+field({name:'status',label:'Status',type:'select',value:r.status||'neplaceno',options:[{v:'neplaceno',l:'neplaćeno'},{v:'placeno',l:'plaćeno'}]})+
    field({name:'note',label:'Napomena',type:'textarea',value:r.note,full:true})+'</div>';
  openModal(id?'Izmena ulaznog računa':'Nov ulazni račun',body,saveBtn());
  const root=$('#modalRoot');const gv=n=>Number(($('[name='+n+']',root)||{}).value)||0;
  root.querySelectorAll('[data-pdv]').forEach(el=>el.oninput=()=>{const b=+(gv('neto')*(1+gv('pdv_rate')/100)).toFixed(2);const bf=$('[name=bruto]',root);if(bf)bf.value=b;});
  bindSave(f=>{f.neto=Number(f.neto)||0;f.pdv_rate=Number(f.pdv_rate)||0;f.bruto=Number(f.bruto)|| +(f.neto*(1+f.pdv_rate/100)).toFixed(2);f.amount=f.bruto;if(id){Store.update('purchase_invoices',id,f);audit('update','purchase',id,'Izmena ulaznog računa');}else{const n=Store.insert('purchase_invoices',f);audit('create','purchase',n.id,'Nov ulazni račun '+(f.supplier_name||''));}toast('Ulazni račun sačuvan');closeModal();render();});}
window.editPurchase=id=>openPurchaseForm(id);
window.delPurchase=id=>confirmDelete('purchase_invoices',id,'ulazni račun');
window.togglePurPaid=id=>{const r=Store.get('purchase_invoices',id);Store.update('purchase_invoices',id,{status:r.status==='placeno'?'neplaceno':'placeno'});audit('update','purchase',id,'Status ulaznog računa');render();};

/* ===== Obračun vozača ===== */
Views.settlements=()=>{const rows=Store.scoped('driver_settlements');return pageHeader('Obračun vozača','settlements','Novi obračun',true)+renderTable({id:'settlements',exportName:'obracuni',columns:[
  {key:'driver',label:'Vozač',sortVal:r=>(Store.get('drivers',r.driver_id)||{}).full_name,render:r=>compDot(r.company_id)+esc((Store.get('drivers',r.driver_id)||{}).full_name||'—')},
  {key:'period',label:'Period',render:r=>fmtDate(r.period_from)+' – '+fmtDate(r.period_to)},
  {key:'total_km',label:'km',num:true,render:r=>(r.total_km||0).toLocaleString('sr-RS')},
  {key:'base_amount',label:'Osnovica',num:true,render:r=>fmtMoney(r.base_amount)},
  {key:'bonus_total',label:'Bonus',num:true,render:r=>fmtMoney(r.bonus_total)},
  {key:'malus_total',label:'Malus',num:true,render:r=>fmtMoney(r.malus_total)},
  {key:'total_amount',label:'Za isplatu',num:true,sortVal:r=>r.total_amount,render:r=>'<b>'+fmtMoney(r.total_amount)+'</b>'},
  {key:'status',label:'Status',render:r=>badge(r.status)}],

window.__new_settlements=()=>openSettlementForm();
function openSettlementForm(prefill){prefill=prefill||{};const comp=prefill.company_id||(state.companyId==='ALL'?(userCompanies()[0]||{}).id:state.companyId);const drivers=Store.all('drivers').filter(d=>d.company_id===comp);
  const body='<div class="pill-note">Kreira se <b>prazan obračun</b> (bez podrazumevanih stavki). Stavke i bonus/malus dodajete dugmetom <b>+</b> u pregledu — biraju se iz administracije.</div><div class="form-grid">'+companyField({company_id:comp})+field({name:'driver_id',label:'Vozač',type:'select',value:prefill.driver_id||'',options:[{v:'',l:'—'}].concat(drivers.map(d=>({v:d.id,l:d.full_name}))),attr:'id="setDriver"'})+field({name:'period_from',label:'Period od',type:'date',value:prefill.period_from||addDays(todayISO(),-30)})+field({name:'period_to',label:'Period do',type:'date',value:prefill.period_to||todayISO()})+field({name:'advance_total',label:'Akontacije (€)',type:'number',value:0})+field({name:'refund_total',label:'Refundacija (€)',type:'number',value:0})+'</div><div id="setPreview" class="muted small" style="margin-top:8px">Izaberite vozača i period.</div>';

Views.reports=()=>{
  const inP=d=>d&&d>=repFilter.from&&d<=repFilter.to;
  const orders=Store.scoped('transport_orders'),trips=Store.scoped('trips'),invoices=Store.scoped('invoices'),expenses=Store.scoped('expenses'),purch=Store.scoped('purchase_invoices');
  // === BILANS USPEHA (realizovano u periodu) ===
  const payIn=Store.scoped('payments').filter(p=>inP(p.date));const prihodNaplata=payIn.reduce((s,p)=>s+p.amount,0);
  const expIn=expenses.filter(e=>inP(e.date));const rashodTrip=expIn.reduce((s,e)=>s+e.amount_base,0);
  const purIn=purch.filter(p=>p.status==='placeno'&&inP(p.date));const rashodPur=purIn.reduce((s,p)=>s+p.amount,0);
  const setIn=Store.scoped('driver_settlements').filter(s=>s.status==='isplaceno'&&inP(s.period_to));const rashodSet=setIn.reduce((s,x)=>s+(x.total_amount||0),0);
  const rashodi=rashodTrip+rashodPur+rashodSet;const rezultat=prihodNaplata-rashodi;
  const plRow=(l,v,cls)=>'<tr'+(cls==='total'?' class="total"':'')+'><td>'+l+'</td><td class="num '+(cls==='neg'?'neg':(cls==='pos'?'pos':''))+'">'+fmtMoney(v)+'</td></tr>';
  const bilans='<div class="card" style="margin-bottom:16px"><div class="ch">Bilans uspeha (realizovano) · '+fmtDate(repFilter.from)+' – '+fmtDate(repFilter.to)+'</div><div class="cb" style="padding:0"><table class="pl-table"><tbody>'+
    plRow('PRIHODI — naplaćene fakture',prihodNaplata,'pos')+
    plRow('Rashodi — troškovi tura',-rashodTrip,'neg')+
    plRow('Rashodi — ulazni računi (plaćeni)',-rashodPur,'neg')+
    plRow('Rashodi — isplaćeni obračuni vozača',-rashodSet,'neg')+
    plRow('REZULTAT PERIODA',rezultat,'total')+
    '</tbody></table></div></div>';
  // === Grafikoni ===
  const months=monthsBetween(repFilter.from,repFilter.to);
  const mLabels=months.map(m=>m.slice(5)+'/'+m.slice(2,4));
  const revByMonth=months.map(m=>Store.scoped('payments').filter(p=>p.date&&p.date.slice(0,7)===m).reduce((s,p)=>s+p.amount,0));
  const expByMonth=months.map(m=>expenses.filter(e=>e.date&&e.date.slice(0,7)===m).reduce((s,e)=>s+e.amount_base,0).valueOf());
  const byCat={};expIn.forEach(e=>{byCat[e.category_code]=(byCat[e.category_code]||0)+e.amount_base;});purIn.forEach(p=>{byCat[p.category_code]=(byCat[p.category_code]||0)+p.amount;});
  const catData=Object.keys(byCat).map(k=>({label:lkName('expense_categories',k),value:Math.round(byCat[k])}));
  const revComp=Store.all('companies').filter(c=>state.companyId==='ALL'||c.id===state.companyId).map(c=>({label:c.short_name,color:c.accent_color,value:Store.all('invoices').filter(i=>i.company_id===c.id).reduce((s,i)=>s+i.total_gross,0)}));
  // profit po klijentu (svi podaci)
  const byClient={};orders.forEach(o=>{const c=Store.get('clients',o.client_id);if(!c)return;byClient[c.id]=byClient[c.id]||{name:c.name,rev:0,cost:0};byClient[c.id].rev+=o.agreed_price;});
  trips.forEach(t=>{const ords=Store.all('trip_orders').filter(x=>x.trip_id===t.id).map(x=>Store.get('transport_orders',x.order_id)).filter(Boolean);const cost=Store.all('expenses').filter(e=>e.trip_id===t.id).reduce((s,e)=>s+e.amount_base,0);const rev=ords.reduce((s,o)=>s+o.agreed_price,0)||1;ords.forEach(o=>{const c=byClient[o.client_id];if(c)c.cost+=cost*(o.agreed_price/rev);});});
  const cliData=Object.values(byClient).sort((a,b)=>(b.rev-b.cost)-(a.rev-a.cost)).slice(0,8).map(c=>({label:c.name.slice(0,10),value:Math.round(c.rev-c.cost)}));
  const unpaid=invoices.filter(i=>['poslato','delimicno','kasni'].includes(i.status));
  const kmTot=trips.reduce((a,t)=>{a.l+=(t.loaded_km||0);a.e+=(t.empty_km||0);return a;},{l:0,e:0});
  const chartCard=(t,inner)=>'<div class="card"><div class="ch">'+t+'</div><div class="cb">'+inner+'</div></div>';
  const profitByMonth=months.map((m,i)=>Math.round(revByMonth[i]-expByMonth[i]));
  const stByStatus={};orders.forEach(o=>{stByStatus[o.status]=(stByStatus[o.status]||0)+1;});
  const stData=Object.keys(stByStatus).map(k=>({label:lkName('order_statuses',k),value:stByStatus[k]}));
  const charts='<div class="chart-grid" style="margin-bottom:16px">'+
    chartCard('Naplata vs troškovi po mesecima',svgGroupedBars(mLabels,[{name:'Naplata',color:'#15A34A',values:revByMonth},{name:'Troškovi',color:'#DC2626',values:expByMonth}],{fmt:v=>Math.round(v)}))+
    chartCard('Profit po mesecima (naplata − troškovi)',svgLine(mLabels,profitByMonth,{fmt:v=>Math.round(v/1000)+'k'}))+
    chartCard('Rashodi po vrsti (period)',catData.length?svgDonut(catData):'<div class="muted small">Nema rashoda u periodu.</div>')+
    chartCard('Nalozi po statusu',stData.length?svgDonut(stData):'<div class="muted small">—</div>')+
    chartCard('Prihod po kompaniji (fakturisano)',svgBars(revComp,{fmt:v=>Math.round(v/1000)+'k'}))+
    chartCard('Profit po klijentu (top 8)',cliData.length?svgBars(cliData,{fmt:v=>Math.round(v/1000)+'k'}):'<div class="muted small">—</div>')+'</div>';
  const sec=(title,id,cols,rows,name)=>'<div class="card" style="margin-bottom:16px"><div class="ch">'+title+'</div><div class="cb" style="padding:0">'+renderTable({id:id,exportName:name,columns:cols,rows:rows})+'</div></div>';
  return '<div class="crumb">Analitika · '+esc(companyName(state.companyId))+'</div><div class="page-h"><h1>Izveštaji</h1><div class="sp"></div><button class="btn sm no-print" onclick="window.print()">Štampa svega</button></div>'+
    '<div class="toolbar no-print"><span class="dfilt">Period bilansa/grafikona: <input type="date" value="'+esc(repFilter.from)+'" onchange="setRepFilter(\'from\',this.value)"><input type="date" value="'+esc(repFilter.to)+'" onchange="setRepFilter(\'to\',this.value)"></span></div>'+
    bilans+charts+
    '<div class="grid2"><div class="kpi"><div class="lab">Pun km (ukupno)</div><div class="val">'+kmTot.l.toLocaleString('sr-RS')+'</div></div><div class="kpi"><div class="lab">Prazan km (ukupno)</div><div class="val">'+kmTot.e.toLocaleString('sr-RS')+'</div><div class="hint">udeo praznih: '+(kmTot.l+kmTot.e?Math.round(kmTot.e/(kmTot.l+kmTot.e)*100):0)+'%</div></div></div><div style="height:16px"></div>'+
    sec('Profitabilnost po klijentu','rep_cli',[{key:'name',label:'Klijent'},{key:'rev',label:'Prihod',num:true,sortVal:r=>r.rev,render:r=>fmtMoney(r.rev),exportVal:r=>Math.round(r.rev)},{key:'cost',label:'Trošak',num:true,sortVal:r=>r.cost,render:r=>fmtMoney(Math.round(r.cost)),exportVal:r=>Math.round(r.cost)},{key:'profit',label:'Profit',num:true,sortVal:r=>r.rev-r.cost,render:r=>'<b style="color:'+(r.rev-r.cost>=0?'var(--ok)':'var(--bad)')+'">'+fmtMoney(Math.round(r.rev-r.cost))+'</b>',exportVal:r=>Math.round(r.rev-r.cost)}],Object.values(byClient),'profit_po_klijentu')+
    sec('Troškovi/rashodi po vrsti (period)','rep_cat',[{key:'cat',label:'Vrsta'},{key:'amount',label:'Iznos',num:true,sortVal:r=>r.amount,render:r=>fmtMoney(r.amount),exportVal:r=>Math.round(r.amount)}],Object.keys(byCat).map(k=>({cat:lkName('expense_categories',k),amount:byCat[k]})),'rashodi_po_vrsti')+
    sec('Neplaćene / kasne fakture','rep_unp',[{key:'invoice_no',label:'Faktura'},{key:'client',label:'Klijent',sortVal:r=>(Store.get('clients',r.client_id)||{}).name,render:r=>esc((Store.get('clients',r.client_id)||{}).name||'')},{key:'issue_date',label:'Izdata',render:r=>fmtDate(r.issue_date)},{key:'total_gross',label:'Iznos',num:true,sortVal:r=>r.total_gross,render:r=>fmtMoney(r.total_gross),exportVal:r=>r.total_gross},{key:'status',label:'Status',render:r=>badge(r.status)}],unpaid,'neplacene_fakture')+
    (()=>{const byRoute={};trips.forEach(t=>{const rt=tripRoute(t.id)||t.route||'—';byRoute[rt]=byRoute[rt]||{route:rt,count:0,km:0};byRoute[rt].count++;byRoute[rt].km+=(t.actual_km||0);});return sec('Najčešće rute','rep_routes',[{key:'route',label:'Ruta'},{key:'count',label:'Broj tura',num:true,sortVal:r=>r.count,render:r=>r.count},{key:'km',label:'Ukupno km',num:true,sortVal:r=>r.km,render:r=>r.km.toLocaleString('sr-RS'),exportVal:r=>r.km}],Object.values(byRoute).sort((a,b)=>b.count-a.count),'rute');})();
};

/* ===== Alarmi ===== */
Views.alerts=()=>{const alerts=computeAlerts();
  const counts={isteklo:0,hitno:0,upozorenje:0,info:0};alerts.forEach(a=>counts[a.severity]++);
  const kpi=(l,v,cls)=>'<div class="kpi '+cls+'"><div class="lab">'+l+'</div><div class="val">'+v+'</div></div>';
  return '<div class="crumb">Analitika · '+esc(companyName(state.companyId))+'</div><div class="page-h"><h1>Alarm centar</h1><div class="sp"></div></div>'+
    '<div class="kpis">'+kpi('Isteklo',counts.isteklo,counts.isteklo?'bad':'')+kpi('Hitno',counts.hitno,counts.hitno?'warn':'')+kpi('Upozorenje',counts.upozorenje,'')+kpi('Info',counts.info,'')+'</div>'+
    '<div class="card"><div class="ch">Svi alarmi ('+alerts.length+')</div><div class="cb">'+(alerts.length?alerts.map(a=>'<div class="alert-row"><div class="sev '+a.severity+'"></div><div style="flex:1"><div>'+compDot(a.company_id)+esc(a.message)+'</div><div class="small muted">'+esc(a.category_code)+' · rok: '+fmtDate(a.due_at)+'</div></div>'+badge(a.severity)+'</div>').join(''):'<div class="muted">Nema aktivnih alarma.</div>')+'</div></div>'+
    '<div class="hint-inline" style="margin-top:10px">Alarmi se generišu automatski iz rokova dokumenata, statusa faktura, isporučenih nefakturisanih naloga i servisa. (Phase 2: ručno zatvaranje uz komentar + email/WhatsApp.)</div>';
};
